<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Terse · App demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet"/>
<style>
/* =================================================================
   TERSE — faithful re-skin of the Koco Widgets iPhone-app promo.
   Same structure & motion as the video (3D device reveal -> icon
   splash -> gallery scroll / carousel swipe / detail+editor pages /
   color drag / font swap / icon-pack swap / dynamic island / live
   home / flip -> logo), re-themed to promote the Terse Mac app.
   No iOS status bar.  All icons are custom inline SVG (no emoji).
   ================================================================= */
:root{
  --lime:#a3e635; --lime2:#c8f25a; --lime-d:#7cb518;
  --blue:#0a84ff; --mint:#5eead4; --amber:#ffd60a; --red:#ff6b6b; --purple:#a78bfa; --cyan:#22d3ee; --pink:#f472b6; --magenta:#e879f9;
  --bg:#0a0a0c; --bg2:#0e0e10; --card:#1a1a1e; --card2:#1e1e24; --chip:#3a3a40;
  --txt:#f3f4f6; --sub:#8b8d98; --line:rgba(255,255,255,.08);
  --sans:'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --serif:'Noto Serif SC',serif;
  --mono:'JetBrains Mono','SF Mono',Menlo,monospace;
  --ratio:.5375;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{height:100%;background:#000;color:var(--txt);font-family:var(--sans);overflow:hidden}
body{display:grid;place-items:center}
#stage{position:relative;height:min(100vh,calc(100vw / var(--ratio)));
  width:calc(min(100vh,calc(100vw / var(--ratio))) * var(--ratio));
  background:var(--bg);overflow:hidden;
  --u:calc(min(100vh,calc(100vw / var(--ratio))) / 1280);
  box-shadow:0 0 90px rgba(0,0,0,.6)}
svg{display:block}
.ic{width:1em;height:1em;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}

/* ---------- scene system ---------- */
#scenes{position:absolute;inset:0}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;overflow:hidden;background:var(--bg)}
.scene.on{opacity:1;visibility:visible}
.scene.fade{transition:opacity .26s ease}
.scene.zoomin.on{animation:zin .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes zin{from{transform:scale(1.06);opacity:0}to{transform:scale(1);opacity:1}}
.scene.zoomout.on{animation:zout .55s cubic-bezier(.3,.7,.2,1) both}
@keyframes zout{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- app chrome (Terse iPhone app being recorded) ---------- */
.appbar{position:absolute;top:0;left:0;right:0;height:calc(92*var(--u));z-index:30;
  display:flex;align-items:flex-end;justify-content:space-between;padding:0 calc(34*var(--u)) calc(14*var(--u))}
.appbar .l,.appbar .r{display:flex;align-items:center;gap:calc(18*var(--u))}
.appbar .ico{font-size:calc(34*var(--u));color:#c4c4ca}
.chev{font-size:calc(42*var(--u));color:#d0d0d4;font-weight:300;line-height:.7}
.stack{width:calc(34*var(--u));height:calc(34*var(--u));border:calc(2.5*var(--u)) solid #c0c0c6;border-radius:calc(9*var(--u));position:relative}
.stack::after{content:"";position:absolute;left:calc(8*var(--u));top:calc(7*var(--u));bottom:calc(7*var(--u));width:calc(3*var(--u));background:#c0c0c6;border-radius:2px}
.pill{display:flex;align-items:center;gap:calc(9*var(--u));background:var(--card2);padding:calc(9*var(--u)) calc(20*var(--u));
  border-radius:calc(24*var(--u));font-size:calc(24*var(--u));font-weight:600;color:#e6e6ea}
.pill .pdot{width:calc(20*var(--u));height:calc(20*var(--u));border-radius:50%;background:var(--lime)}

/* ---------- category chips ---------- */
.chips{position:absolute;top:calc(98*var(--u));left:0;right:0;z-index:20;display:flex;gap:calc(30*var(--u));
  padding:0 calc(34*var(--u));font-size:calc(28*var(--u));font-weight:700;color:var(--sub)}
.chips b{color:#fff;position:relative}
.chips b::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:calc(-12*var(--u));
  width:calc(40*var(--u));height:calc(5*var(--u));border-radius:3px;background:var(--lime)}

/* ---------- scroll region + widget gallery ---------- */
.scroll{position:absolute;left:0;right:0;top:calc(156*var(--u));bottom:0;overflow:hidden}
.scrollpad{padding:calc(20*var(--u)) calc(34*var(--u)) calc(60*var(--u));will-change:transform}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:calc(26*var(--u))}
.wcell{display:flex;flex-direction:column;gap:calc(10*var(--u))}
.wcell .cap{font-size:calc(19*var(--u));color:var(--sub);font-weight:500;padding-left:calc(6*var(--u))}

/* widget card base + gradients */
.w{border-radius:calc(34*var(--u));position:relative;overflow:hidden;aspect-ratio:1;padding:calc(26*var(--u));
  box-shadow:0 calc(12*var(--u)) calc(30*var(--u)) rgba(0,0,0,.4);display:flex;flex-direction:column;justify-content:space-between}
.w.wide{aspect-ratio:2.05;grid-column:span 2}
.g-lime{background:linear-gradient(150deg,#c6f24a,#7cb518);color:#0c1500}
.g-pink{background:linear-gradient(150deg,#ff8fc4,#c026d3);color:#fff}
.g-blue{background:linear-gradient(150deg,#7cc0ff,#1e6fff);color:#fff}
.g-teal{background:linear-gradient(150deg,#7af0d8,#0d9488);color:#04221d}
.g-orange{background:linear-gradient(150deg,#ffd27a,#f97316);color:#2a1400}
.g-purple{background:linear-gradient(150deg,#c4b5fd,#7c3aed);color:#fff}
.g-sun{background:linear-gradient(135deg,#ffb38a,#f6a0c0 55%,#a78bfa);color:#3a1a2a}
.g-aurora{background:linear-gradient(110deg,#ff8a5c,#f472b6 40%,#a78bfa 70%,#60a5fa);color:#fff}
.g-dark{background:#000;color:#fff;border:calc(1.5*var(--u)) solid var(--line)}
.g-card{background:var(--card);color:#fff;border:calc(1.5*var(--u)) solid var(--line)}
.g-white{background:#f4f4f0;color:#0a0a0a}
.w .big{font-family:var(--mono);font-weight:800;font-size:calc(70*var(--u));line-height:.9;letter-spacing:-.03em}
.w .lbl{font-size:calc(20*var(--u));font-weight:700;opacity:.85;display:flex;align-items:center;gap:calc(8*var(--u))}
.w .sm{font-size:calc(18*var(--u));opacity:.85;font-weight:600}

/* ---------- detail / editor page ---------- */
.detail{position:absolute;left:0;right:0;top:calc(104*var(--u));bottom:0;overflow:hidden;padding:calc(16*var(--u)) calc(40*var(--u))}
.hero{border-radius:calc(40*var(--u));overflow:hidden;position:relative;box-shadow:0 calc(20*var(--u)) calc(50*var(--u)) rgba(0,0,0,.45)}
.brk{text-align:center;font-family:var(--serif);font-size:calc(28*var(--u));color:#f0f0f4;margin:calc(28*var(--u)) 0 calc(24*var(--u));text-shadow:0 calc(2*var(--u)) calc(12*var(--u)) rgba(0,0,0,.7)}
.brk .b{color:var(--sub);margin:0 calc(10*var(--u))}
.sec{margin-bottom:calc(24*var(--u))}
.sec .t{font-size:calc(24*var(--u));font-weight:700;margin-bottom:calc(15*var(--u))}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:calc(24*var(--u));
  padding:calc(20*var(--u)) calc(26*var(--u));font-size:calc(24*var(--u))}
.row .v{color:var(--sub);display:flex;align-items:center;gap:calc(8*var(--u))}
.row .ic{font-size:calc(28*var(--u));color:#c4c4ca}
.segs{display:flex;gap:calc(16*var(--u))}
.seg{flex:1;display:flex;align-items:center;justify-content:center;gap:calc(8*var(--u));background:var(--card);border-radius:calc(22*var(--u));
  padding:calc(18*var(--u));font-size:calc(22*var(--u));font-weight:600;color:#cfcfd4}
.seg .ic{font-size:calc(26*var(--u))}
.seg.sel{background:var(--chip);color:#fff;box-shadow:inset 0 0 0 calc(1.5*var(--u)) rgba(255,255,255,.12)}
.abc{display:flex;gap:calc(14*var(--u))}
.abc .c{flex:1;text-align:center;background:var(--card);border-radius:calc(20*var(--u));padding:calc(20*var(--u));font-size:calc(28*var(--u));color:#888}
.abc .c.sel{background:var(--chip);color:#fff}
.cta{position:absolute;left:calc(40*var(--u));right:calc(40*var(--u));bottom:calc(46*var(--u));background:var(--lime);color:#0a0a0a;
  font-weight:800;font-size:calc(28*var(--u));display:flex;align-items:center;justify-content:center;gap:calc(12*var(--u));
  padding:calc(24*var(--u));border-radius:calc(34*var(--u));box-shadow:0 calc(14*var(--u)) calc(34*var(--u)) rgba(167,230,53,.4)}

/* ---------- 3D intro device (cinematic reveal — close, oversized) ---------- */
#intro{perspective:calc(1300*var(--u));perspective-origin:40% 50%;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(70% 55% at 50% 46%,#1b1b24,#0a0a10 70%,#050507 92%)}
#intro::before{content:"";position:absolute;width:80%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(167,230,53,.28),rgba(91,157,255,.16) 45%,transparent 70%);
  filter:blur(calc(30*var(--u)));animation:halo 6s ease-in-out infinite;will-change:transform,opacity}
@keyframes halo{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1}}
.device{width:calc(560*var(--u));height:calc(1190*var(--u));border-radius:calc(112*var(--u));position:relative;transform-style:preserve-3d;will-change:transform;backface-visibility:hidden;
  background:linear-gradient(108deg,#5e5e66 0%,#2a2a32 34%,#0b0b0f 100%);border:calc(12*var(--u)) solid #0b0b0f;
  box-shadow:0 calc(70*var(--u)) calc(150*var(--u)) rgba(0,0,0,.85),inset calc(4*var(--u)) 0 calc(5*var(--u)) rgba(255,255,255,.55),inset calc(-3.5*var(--u)) 0 calc(6*var(--u)) rgba(0,0,0,.75)}
/* camera = zoom into top-left (Terse icon) while it loads, then pull back */
.cam{position:absolute;inset:0;display:grid;place-items:center;transform-origin:50% 50%;will-change:transform}
.cam.play{animation:cam 2.6s cubic-bezier(.5,.02,.2,1) both}
@keyframes cam{
  0%  {transform:scale(1) translate(0,0)}
  14% {transform:scale(1.5) translate(18%,20%)}   /* push in on top-left / Terse icon */
  50% {transform:scale(1.5) translate(18%,20%)}   /* hold while icon loads */
  82% {transform:scale(1) translate(0,0)}         /* zoom back */
  100%{transform:scale(1) translate(0,0)} }
/* device = hold moderate 3/4 tilt (left rail lit), then flatten to face viewer */
.device.play{animation:intro 2.6s cubic-bezier(.5,.02,.2,1) both}
@keyframes intro{
  0%  {transform:rotateX(10deg) rotateY(29deg) rotateZ(-4deg) scale(1.05) translateX(4%)}
  50% {transform:rotateX(9deg)  rotateY(27deg) rotateZ(-3.5deg) scale(1.05) translateX(4%)}
  80% {transform:rotateX(2deg)  rotateY(6deg)  rotateZ(-1deg) scale(1.03) translateX(1%)}
  100%{transform:rotateX(0)     rotateY(0)     rotateZ(0)     scale(1.0)} }
.device::after{content:"";position:absolute;inset:0;border-radius:calc(106*var(--u));pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.24),transparent 26%,transparent 74%,rgba(255,255,255,.05))}
.screen{position:absolute;inset:calc(14*var(--u));border-radius:calc(102*var(--u));overflow:hidden;
  background:linear-gradient(180deg,rgba(10,10,16,.22),rgba(8,8,12,.38) 55%,rgba(6,6,10,.58)),url('assets/wall.jpg') center/cover}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.14),transparent 22%);mix-blend-mode:screen}
.island{position:absolute;top:calc(26*var(--u));left:50%;transform:translateX(-50%);width:calc(130*var(--u));height:calc(40*var(--u));background:#000;border-radius:calc(24*var(--u));z-index:6}
.introla{position:absolute;top:calc(86*var(--u));left:50%;z-index:7;background:#000;border-radius:calc(26*var(--u));
  padding:calc(11*var(--u)) calc(24*var(--u));display:flex;align-items:center;gap:calc(12*var(--u));font-size:calc(22*var(--u));
  white-space:nowrap;box-shadow:0 0 calc(34*var(--u)) rgba(167,230,53,.45);transform:translateX(-50%)}
.device.play .introla{animation:introla 2.6s cubic-bezier(.2,.9,.3,1) both}
@keyframes introla{0%,30%{opacity:0;transform:translateX(-50%) scale(.5)}48%{opacity:1;transform:translateX(-50%) scale(1.06)}60%,100%{opacity:1;transform:translateX(-50%) scale(1)}}
.scrbar{position:absolute;top:calc(58*var(--u));left:calc(64*var(--u));right:calc(64*var(--u));display:flex;justify-content:space-between;align-items:center;
  color:#fff;font-weight:700;font-size:calc(32*var(--u));z-index:5}
.scrbar .r{display:flex;align-items:center;gap:calc(10*var(--u));font-size:calc(26*var(--u))}
.scrbar .moon{font-size:calc(30*var(--u))}
.hgrid{position:absolute;left:calc(54*var(--u));right:calc(54*var(--u));top:calc(150*var(--u));display:grid;grid-template-columns:repeat(4,1fr);gap:calc(40*var(--u)) calc(38*var(--u))}
.ai{aspect-ratio:1;border-radius:23%;box-shadow:0 calc(8*var(--u)) calc(18*var(--u)) rgba(0,0,0,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:visible;position:relative}
.ai>*{position:relative;z-index:1}
.ai .ic{font-size:calc(58*var(--u))}
.ai-terse{background:var(--lime)}
.ai-terse b{color:#0a0a0a;font-weight:900;font-size:calc(110*var(--u));line-height:1}
.ai-cal b{color:#ff3b30;font-weight:800;font-size:calc(28*var(--u));letter-spacing:.04em}
.ai-cal span{color:#111;font-weight:800;font-size:calc(70*var(--u));line-height:.9}
/* Terse icon "loading" spinner — clearly visible sweeping arc */
.loadring{position:absolute;inset:calc(-16*var(--u));border-radius:30%;border:calc(6*var(--u)) solid transparent;z-index:3;
  border-top-color:#fff;border-right-color:rgba(255,255,255,.65);
  animation:lr .85s linear infinite;will-change:transform}
@keyframes lr{to{transform:rotate(360deg)}}
.device.play .ai-terse{animation:tglow 2.6s ease-in-out both}
@keyframes tglow{0%,55%{box-shadow:0 calc(8*var(--u)) calc(24*var(--u)) rgba(167,230,53,.5)}100%{box-shadow:0 0 calc(60*var(--u)) calc(6*var(--u)) rgba(167,230,53,.95)}}

/* ---------- splash ---------- */
#splash{display:grid;place-items:center;background:radial-gradient(55% 38% at 50% 44%,#101507,#040405 78%)}
.sp{display:flex;flex-direction:column;align-items:center;gap:calc(40*var(--u))}
.spicon{width:calc(280*var(--u));height:calc(280*var(--u));border-radius:calc(66*var(--u));background:radial-gradient(120% 120% at 32% 26%,#d9ff66,#a3e635 56%,#7cb518);
  display:grid;place-items:center;box-shadow:0 0 calc(130*var(--u)) calc(18*var(--u)) rgba(167,230,53,.5)}
.scene.on .spicon{animation:spop .9s cubic-bezier(.2,.9,.3,1) both}
@keyframes spop{0%{transform:scale(1.5);opacity:0}55%{opacity:1}100%{transform:scale(1);opacity:1}}
.spicon b{font-weight:900;color:#0a0a0a;font-size:calc(180*var(--u))}
.spname{font-size:calc(76*var(--u));font-weight:900}
.scene.on .spname{animation:supc .6s ease .32s both}
@keyframes supc{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.sptag{color:var(--sub);font-size:calc(26*var(--u));font-weight:500}
.scene.on .sptag{animation:supc .6s ease .46s both}

/* ---------- icon-pack mockup ---------- */
.packtitle{position:absolute;top:calc(40*var(--u));left:0;right:0;text-align:center;font-size:calc(30*var(--u));font-weight:700;z-index:25}
.miniphone{position:absolute;left:50%;top:calc(130*var(--u));transform:translateX(-50%);width:calc(470*var(--u));height:calc(770*var(--u));border-radius:calc(60*var(--u));
  background:linear-gradient(160deg,#2a2a32,#0d0d12);border:calc(6*var(--u)) solid #16161c;box-shadow:0 calc(30*var(--u)) calc(70*var(--u)) rgba(0,0,0,.6)}
.miniscreen{position:absolute;inset:calc(8*var(--u));border-radius:calc(52*var(--u));overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#1a2240,#0a0c18 70%);padding:calc(60*var(--u)) calc(34*var(--u))}
.pager{position:absolute;top:calc(24*var(--u));right:calc(28*var(--u));background:rgba(0,0,0,.4);color:#d8d8dc;font-size:calc(18*var(--u));padding:calc(6*var(--u)) calc(16*var(--u));border-radius:calc(16*var(--u));z-index:3}
.icongrid{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(26*var(--u)) calc(22*var(--u))}
.pi{display:flex;flex-direction:column;align-items:center;gap:calc(8*var(--u))}
.pi .ic2{width:calc(86*var(--u));height:calc(86*var(--u));border-radius:calc(22*var(--u));display:grid;place-items:center;font-size:calc(44*var(--u));box-shadow:0 calc(6*var(--u)) calc(14*var(--u)) rgba(0,0,0,.4);overflow:hidden}
.pi .nm{font-size:calc(15*var(--u));color:#fff}
.packpanel{position:absolute;left:calc(40*var(--u));right:calc(40*var(--u));bottom:calc(40*var(--u));text-align:center;background:rgba(18,18,20,.7);
  backdrop-filter:blur(calc(8*var(--u)));border:calc(1.5*var(--u)) solid var(--line);border-radius:calc(36*var(--u));padding:calc(26*var(--u));z-index:25}
.packpanel .pn{font-size:calc(38*var(--u));font-weight:800;font-family:var(--serif)}
.packpanel .ps{font-size:calc(19*var(--u));color:var(--sub);margin:calc(8*var(--u)) 0 calc(18*var(--u))}
.packpanel .pb{display:inline-block;background:rgba(255,255,255,.12);border-radius:calc(26*var(--u));padding:calc(14*var(--u)) calc(34*var(--u));font-size:calc(22*var(--u));font-weight:600}
.dropdown{position:absolute;left:50%;bottom:calc(150*var(--u));transform:translateX(-50%);z-index:40;background:rgba(40,40,44,.92);backdrop-filter:blur(calc(8*var(--u)));
  border-radius:calc(26*var(--u));width:calc(300*var(--u));overflow:hidden;box-shadow:0 calc(20*var(--u)) calc(50*var(--u)) rgba(0,0,0,.6)}
.scene.on .dropdown{animation:ddrop .3s cubic-bezier(.2,1.1,.3,1) both}
@keyframes ddrop{from{opacity:0;transform:translateX(-50%) scale(.85)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.dropdown .dr{display:flex;justify-content:space-between;align-items:center;padding:calc(20*var(--u)) calc(28*var(--u));font-size:calc(24*var(--u));border-bottom:calc(1.5*var(--u)) solid rgba(255,255,255,.08)}
.dropdown .dr:last-child{border:0}.dropdown .dr.sel{color:var(--lime)}

/* ---------- dynamic island demo ---------- */
.islandhero{margin:calc(10*var(--u)) 0 calc(24*var(--u));border-radius:calc(40*var(--u));overflow:hidden;height:calc(320*var(--u));
  background:linear-gradient(150deg,#4a90d9,#6fd0c0);position:relative;display:grid;place-items:start center;padding-top:calc(34*var(--u))}
.dipill{min-width:calc(220*var(--u));height:calc(58*var(--u));background:#000;border-radius:calc(30*var(--u));display:flex;align-items:center;justify-content:space-between;
  padding:0 calc(24*var(--u));color:#fff;font-size:calc(22*var(--u));gap:calc(16*var(--u))}
.dipill.exp{animation:diexp .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes diexp{from{min-width:calc(140*var(--u));opacity:.7}to{min-width:calc(440*var(--u));opacity:1}}
.compactgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(18*var(--u))}
.cgi{aspect-ratio:1;background:#000;border-radius:calc(22*var(--u));border:calc(1.5*var(--u)) solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(8*var(--u));font-size:calc(22*var(--u))}
.cgi .t{font-size:calc(15*var(--u));color:var(--sub)}

/* ---------- live home screen ---------- */
.homewall{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.18) 40%,rgba(0,0,0,.5)),url('assets/wall.jpg') center/cover no-repeat}
.homewall::after{content:"";position:absolute;inset:0;opacity:.5;background:radial-gradient(60% 40% at 70% 18%,rgba(255,255,255,.25),transparent 60%)}

/* assign premium photo backgrounds to any scene that lacks one */
(function(){const BGS=['valley','fog','ocean','field','city','lake','mountains2','forest2','desert','snow','canyon','forest','desk'];let k=0;
 scenes.forEach(s=>{const sec=s.node; if(sec.id==='intro'||sec.id==='splash')return;

   if(/url\(/.test(st)|| /homewall/.test(sec.innerHTML))return;
   sec.style.background=`linear-gradient(180deg,rgba(8,8,12,.44),rgba(7,7,11,.62)),url('assets/${BGS[k++%BGS.length]}.jpg') center/cover`;});})();

/* ===================== timeline engine ===================== */
const prog=document.getElementById('prog'), hint=document.getElementById('hint');
const TOTAL=scenes.reduce((a,s)=>a+s.dur,0);
let cur=-1, t0=performance.now(), running=true;
const dstyle=document.createElement('style');
dstyle.textContent=`.scene.on #dragbar>div{animation:dh 1.2s cubic-bezier(.4,0,.3,1) .2s both}@keyframes dh{from{left:78%}to{left:42%}}
.scene.on .monoset .pi .ic2{animation:popin .5s ease both}
${[2,3,4,5,6,7,8].map(n=>`.monoset .pi:nth-child(${n}) .ic2{animation-delay:${(n-1)*.04}s}`).join('')}
@keyframes popin{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}`;
document.head.appendChild(dstyle);

function countUp(elm,to,dur,pre='',suf=''){const st=performance.now();
  (function step(now){const k=Math.min(1,(now-st)/dur),e=1-Math.pow(1-k,3);
   elm.textContent=pre+Math.floor(to*e).toLocaleString('en-US')+suf;
   if(k<1&&scenes[cur]&&scenes[cur].node.contains(elm))requestAnimationFrame(step);})(st);}
function onActivate(node){
  const f=node.querySelector('#flipw'); if(f){f.textContent='NO';setTimeout(()=>{if(scenes[cur]&&scenes[cur].node.contains(f))f.textContent='YES';},420);}
  node.querySelectorAll('[data-count]').forEach(elm=>countUp(elm,+elm.getAttribute('data-count'),
    +(elm.getAttribute('data-dur')||1100),elm.getAttribute('data-pre')||'',elm.getAttribute('data-suf')||''));
}
function show(i){ if(i===cur) return;
  if(scenes[cur]) scenes[cur].node.classList.remove('on','scrollup','scrolldn','swipel');
  const s=scenes[i]; void s.node.offsetWidth;
  if(s.motion) s.node.classList.add(s.motion);
  s.node.style.setProperty('--d',s.dur+'s'); s.node.classList.add('on');
  cur=i; onActivate(s.node);
}
function frameAt(t){let acc=0,idx=scenes.length-1;for(let i=0;i<scenes.length;i++){if(t<acc+scenes[i].dur){idx=i;break;}acc+=scenes[i].dur;}return idx;}
function tick(now){ if(!running)return; let t=(now-t0)/1000;
  if(t>=TOTAL){running=false;prog.style.width='100%';if(scenes[cur])scenes[cur].node.classList.remove('on');hint.style.display='grid';return;}
  prog.style.width=(t/TOTAL*100)+'%'; show(frameAt(t)); requestAnimationFrame(tick);}
requestAnimationFrame(tick);
hint.addEventListener('click',()=>{hint.style.display='none';cur=-1;t0=performance.now();running=true;requestAnimationFrame(tick);});
window.__still=t=>{running=false;hint.style.display='none';prog.style.width=(t/TOTAL*100)+'%';if(scenes[cur]){scenes[cur].node.classList.remove('on','scrollup','scrolldn','swipel');}cur=-1;show(frameAt(t));};
window.__play=t=>{cur=-1;hint.style.display='none';running=true;t0=performance.now()-(t||0)*1000;requestAnimationFrame(tick);};
window.__total=TOTAL;
/* floating ambient particles */
(function(){const pf=document.getElementById('pf');if(!pf)return;
 for(let i=0;i<12;i++){const i_=document.createElement('i');
   i_.style.left=((i*8.3+4)%100)+'%';
   i_.style.animationDuration=(7+(i%4)*2.5)+'s';
   i_.style.animationDelay=(-(i*1.3))+'s';
   i_.style.opacity=(.3+(i%3)*.2);
   pf.appendChild(i_);}})();
/* deterministic per-scene access for verification */
const __starts=[]; (function(){let a=0;scenes.forEach(s=>{__starts.push(a);a+=s.dur;});})();
window.__starts=__starts;
window.__go=i=>{ running=false;hint.style.display='none';
  if(scenes[cur]) scenes[cur].node.classList.remove('on','scrollup','scrolldn','swipel');
  cur=-1; const s=scenes[i]; void s.node.offsetWidth;
  if(s.motion) s.node.classList.add(s.motion); s.node.style.setProperty('--d',s.dur+'s');
  s.node.querySelectorAll('.cam,.device').forEach(d=>{d.classList.remove('play');void d.offsetWidth;d.classList.add('play');});
  s.node.classList.add('on'); cur=i; onActivate(s.node);
  prog.style.width=((__starts[i]+s.dur*0.5)/TOTAL*100)+'%';};
</script>
