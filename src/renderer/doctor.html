<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var s=localStorage.getItem('terse-theme') || 'horizon';document.documentElement.setAttribute('data-theme',s)})();</script>
  <meta charset="UTF-8">
  <title>Terse Doctor 体检</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:var(--bg);color:var(--t1);
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
      font-size:12px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
    body{border-radius:18px;display:flex;flex-direction:column;height:100vh}
    /* In the widened 360-style main window, keep the report a readable column */
    .hero,#findingsRegion{width:100%;max-width:680px;margin-left:auto;margin-right:auto}

    /* ── Header ───────────────────────────────────────────── */
    .header{display:flex;align-items:center;gap:9px;padding:14px 16px 10px;
      -webkit-app-region:drag;flex-shrink:0}
    .header .shield{width:24px;height:24px;flex-shrink:0;color:var(--ac)}
    .header h1{font-size:14px;font-weight:800;flex:1;letter-spacing:.01em}
    .header h1 .cn{font-weight:600;color:var(--t3);font-size:12px;margin-left:3px}
    .close-btn{-webkit-app-region:no-drag;width:26px;height:26px;border-radius:50%;
      border:none;flex-shrink:0;background:var(--sf);color:var(--t2);cursor:pointer;
      display:flex;align-items:center;justify-content:center}
    .close-btn:hover{background:var(--sfh);color:var(--t1)}

    /* ── Scroll body ──────────────────────────────────────── */
    .scroll{flex:1;overflow-y:auto;padding:0 16px 14px}

    /* ── Hero / gauge ─────────────────────────────────────── */
    .hero{background:var(--sf);border-radius:16px;padding:18px 16px 16px;
      display:flex;flex-direction:column;align-items:center;gap:2px;
      position:relative;overflow:hidden}
    .gauge-wrap{position:relative;width:148px;height:148px;display:flex;
      align-items:center;justify-content:center}
    #scoreGauge svg{transform:rotate(-90deg);display:block}
    .gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;text-align:center;pointer-events:none}
    #scoreNum{font-size:42px;font-weight:850;line-height:1;font-variant-numeric:tabular-nums;
      letter-spacing:-.02em}
    .score-of{font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.4px;
      text-transform:uppercase;margin-top:2px}
    #scoreGrade{font-size:12px;font-weight:800;margin-top:8px;letter-spacing:.02em}
    #scanStatus{font-size:10.5px;color:var(--t3);min-height:15px;margin-top:6px;
      text-align:center;font-variant-numeric:tabular-nums}
    #summaryLine{font-size:11px;color:var(--t2);font-weight:600;margin-top:2px;
      text-align:center;min-height:15px}

    /* category sweep chips */
    .cats{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;justify-content:center}
    .cat-chip{display:flex;align-items:center;gap:5px;background:var(--bg);
      border:1px solid var(--bd);border-radius:9999px;padding:4px 10px;
      font-size:9.5px;font-weight:700;color:var(--t3);text-transform:uppercase;
      letter-spacing:.4px;transition:all .2s}
    .cat-chip .cdot{width:7px;height:7px;border-radius:50%;background:var(--t3);transition:background .2s}
    .cat-chip.scanning{color:var(--ac);border-color:var(--ac);
      box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 16%,transparent)}
    .cat-chip.scanning .cdot{background:var(--ac)}
    .cat-chip.done .cdot{background:var(--ac)}

    /* scan button */
    #scanBtn{-webkit-app-region:no-drag;width:100%;margin-top:14px;padding:13px;
      border:none;border-radius:12px;background:var(--btn);color:var(--btn-t);
      font-size:13px;font-weight:800;cursor:pointer;letter-spacing:.02em;
      display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s}
    #scanBtn:hover{opacity:.9}
    #scanBtn:disabled{opacity:.55;cursor:default}
    #scanBtn .spin{width:14px;height:14px;border-radius:50%;
      border:2px solid color-mix(in srgb,var(--btn-t) 40%,transparent);
      border-top-color:var(--btn-t);animation:spin .7s linear infinite;display:none}
    #scanBtn.busy .spin{display:block}
    #scanBtn.busy .scan-ico{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* radar sweep overlay while scanning */
    .hero.scanning::after{content:'';position:absolute;left:50%;top:42px;
      width:148px;height:148px;margin-left:-74px;border-radius:50%;
      background:conic-gradient(from 0deg,transparent 0deg,
        color-mix(in srgb,var(--ac) 28%,transparent) 40deg,transparent 80deg);
      animation:sweep 1.1s linear infinite;pointer-events:none}
    @keyframes sweep{to{transform:rotate(360deg)}}

    /* ── Sections ─────────────────────────────────────────── */
    .section-title{font-size:11px;font-weight:800;color:var(--t2);
      margin:18px 2px 9px;text-transform:uppercase;letter-spacing:.5px;
      display:flex;align-items:center;justify-content:space-between}
    .section-title .n{color:var(--t3);font-weight:700}

    #findingsList{display:flex;flex-direction:column;gap:8px}

    /* finding card */
    .finding{background:var(--sf);border-radius:13px;padding:12px 13px;
      position:relative;border-left:3px solid var(--bd)}
    .finding.sev-high{border-left-color:#F44336}
    .finding.sev-medium{border-left-color:#FF9800}
    .finding.sev-low{border-left-color:var(--ac)}
    .finding.dismissing{opacity:0;transform:translateX(20px);
      transition:opacity .25s,transform .25s}
    .f-top{display:flex;align-items:flex-start;gap:9px}
    .f-check{-webkit-app-region:no-drag;width:16px;height:16px;flex-shrink:0;
      margin-top:1px;accent-color:var(--ac);cursor:pointer}
    .f-check.hidden{visibility:hidden}
    .f-body{flex:1;min-width:0}
    .f-headline{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .f-title{font-size:12px;font-weight:800;color:var(--t1)}
    .sev-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .sev-dot.high{background:#F44336}
    .sev-dot.medium{background:#FF9800}
    .sev-dot.low{background:var(--ac)}
    .cat-badge{font-size:8.5px;font-weight:800;text-transform:uppercase;
      letter-spacing:.4px;padding:2px 7px;border-radius:9999px;
      background:var(--bg);color:var(--t3);white-space:nowrap}
    .cat-badge.cache{color:#4A9EFF;background:rgba(74,158,255,.13)}
    .cat-badge.mcp{color:#9C27B0;background:rgba(156,39,176,.13)}
    .cat-badge.loop{color:#E91E63;background:rgba(233,30,99,.13)}
    .cat-badge.context{color:#00BCD4;background:rgba(0,188,212,.13)}
    .cat-badge.prompt{color:#FF9800;background:rgba(255,152,0,.13)}
    .cat-badge.cost{color:#4CAF50;background:rgba(76,175,80,.13)}
    .cat-badge.config{color:#607D8B;background:rgba(96,125,139,.15)}
    .cat-badge.junk{color:var(--t2);background:var(--bd)}
    .cat-badge.disk{color:#8D6E63;background:rgba(141,110,99,.15)}
    .cat-badge.guard{color:#F44336;background:rgba(244,67,54,.13)}
    .cat-badge.runtime{color:#FFC107;background:rgba(255,193,7,.13)}
    .f-detail{font-size:10.5px;color:var(--t3);line-height:1.45;margin-top:5px}
    .f-metrics{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .metric{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;
      font-weight:700;color:var(--t2);background:var(--bg);border-radius:7px;
      padding:3px 8px;font-variant-numeric:tabular-nums}
    .metric.cost{color:var(--ac)}
    .metric .ml{color:var(--t3);font-weight:600}
    .f-latency{font-size:9.5px;color:var(--t3);margin-top:6px;font-style:italic}
    .f-actions{display:flex;align-items:center;gap:8px;margin-top:10px}
    /* Per-finding fix progress — which step the fix is on, not a spinner. */
    .fix-progress{margin-top:9px}
    .fix-progress-track{height:4px;border-radius:9999px;background:var(--bd);overflow:hidden}
    .fix-progress-fill{height:100%;width:0;border-radius:9999px;background:var(--ac);
      transition:width .38s cubic-bezier(.2,.8,.2,1)}
    .fix-progress.done .fix-progress-fill{background:var(--btn)}
    .fix-progress.failed .fix-progress-fill{background:var(--red)}
    .fix-progress-step{margin-top:5px;font-size:10px;font-weight:600;color:var(--t3);
      font-variant-numeric:tabular-nums}
    .fix-progress.done .fix-progress-step{color:var(--t2)}
    .fix-progress.failed .fix-progress-step{color:var(--red)}
    .fix-btn{-webkit-app-region:no-drag;border:none;border-radius:9px;
      font-size:10.5px;font-weight:800;padding:7px 14px;cursor:pointer;
      letter-spacing:.01em;transition:opacity .15s}
    .fix-btn:hover{opacity:.88}
    .fix-btn.optimize{background:var(--btn);color:var(--btn-t)}
    .fix-btn.delete{background:#F44336;color:#fff}
    .fix-btn.advise{background:var(--bg);color:var(--t1);border:1px solid var(--bd)}
    .fix-btn:disabled{opacity:.5;cursor:default}
    .dismiss-link{-webkit-app-region:no-drag;background:none;border:none;
      color:var(--t3);font-size:10px;font-weight:600;cursor:pointer;
      text-decoration:underline;padding:4px 2px}
    .dismiss-link:hover{color:var(--t1)}
    .advise-body{display:none;margin-top:9px;padding:10px 11px;background:var(--bg);
      border-radius:9px;font-size:10.5px;color:var(--t2);line-height:1.5}
    .advise-body.open{display:block}
    .advise-body ul{margin:4px 0 0 16px}
    .advise-body li{margin:2px 0}

    /* ── Vivid finding upgrades ───────────────────────────── */
    /* staggered reveal: each card slides up with an index-based delay */
    .finding{opacity:0;transform:translateY(10px) scale(.985);
      animation:cardIn .5s cubic-bezier(.22,.85,.3,1) calc(var(--i,0) * 70ms) both}
    @keyframes cardIn{to{opacity:1;transform:none}}
    /* high-severity cards keep a slow alarm pulse so the worst issues read first */
    .finding.sev-high{animation:cardIn .5s cubic-bezier(.22,.85,.3,1) calc(var(--i,0) * 70ms) both,
      highPulse 2.6s ease-in-out 1.1s infinite}
    @keyframes highPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,67,54,0)}
      50%{box-shadow:0 0 0 4px rgba(244,67,54,.11)}}
    .finding.dismissing{animation:none}

    /* impact heat bar — animated proof of how much each issue is costing */
    .f-impact{display:flex;align-items:center;gap:8px;margin-top:9px}
    .f-impact .track{flex:1;height:6px;border-radius:9999px;background:var(--bd);overflow:hidden}
    .f-impact .fill{height:100%;width:0;border-radius:9999px;
      background:linear-gradient(90deg,#FF9800,#F44336);
      transition:width 1.1s cubic-bezier(.22,.85,.3,1)}
    .finding.sev-low .f-impact .fill{background:linear-gradient(90deg,var(--ac),#7bc47f)}

    /* count-up metrics pop very slightly as they settle */
    .metric .mv{font-variant-numeric:tabular-nums}

    /* vivid "How to fix" CTA — gradient + light sweep + nudging arrow */
    .fix-btn.advise{position:relative;overflow:hidden;font-weight:800;
      color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 42%,transparent);
      background:linear-gradient(120deg,color-mix(in srgb,var(--ac) 15%,var(--bg)),var(--bg))}
    .fix-btn.advise::after{content:'';position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(110deg,transparent 28%,
        color-mix(in srgb,var(--ac) 26%,transparent) 50%,transparent 72%);
      transform:translateX(-130%)}
    .fix-btn.advise:hover::after{animation:shineSweep .85s ease}
    @keyframes shineSweep{to{transform:translateX(130%)}}
    .fx-arrow{display:inline-block;margin-left:4px;transition:transform .2s}
    .fix-btn.advise:hover .fx-arrow{transform:translateX(3px)}

    /* fix preview (inside advise body): animated before → after demonstration */
    .fx-demo{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
    .fx-row{display:flex;align-items:center;gap:8px}
    .fx-tag{font-size:8.5px;font-weight:800;text-transform:uppercase;
      letter-spacing:.4px;width:58px;flex-shrink:0}
    .fx-tag.bad{color:#F44336}
    .fx-tag.good{color:var(--ac)}
    .fx-bar{flex:1;height:7px;border-radius:9999px;background:var(--bd);overflow:hidden}
    .fx-bar-fill{height:100%;border-radius:9999px;
      transition:width 900ms cubic-bezier(.22,.85,.3,1)}
    .fx-bar-fill.bad{width:100%;background:linear-gradient(90deg,#FF9800,#F44336)}
    .fx-bar-fill.good{width:0;background:linear-gradient(90deg,var(--ac),#7bc47f)}
    .fx-save{font-size:9.5px;font-weight:800;color:var(--ac);white-space:nowrap}
    .fx-detail{font-size:10.5px;color:var(--t2);line-height:1.5}

    /* preview entry button in the Findings header */
    .preview-btn{-webkit-app-region:no-drag;display:inline-flex;align-items:center;gap:5px;
      border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);border-radius:9999px;
      background:linear-gradient(120deg,color-mix(in srgb,var(--ac) 16%,var(--bg)),var(--bg));
      color:var(--ac);font-size:9.5px;font-weight:800;text-transform:uppercase;
      letter-spacing:.4px;padding:4px 11px;cursor:pointer;transition:opacity .15s}
    .preview-btn:hover{opacity:.85}
    .preview-btn svg{width:11px;height:11px}
    .preview-btn.active{background:var(--ac);color:#fff;border-color:var(--ac)}

    /* ── Inline per-card preview (the scene lives in the page, not an overlay) ── */
    .preview-card-btn{-webkit-app-region:no-drag;display:inline-flex;align-items:center;gap:5px;
      border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--t2);
      font-size:10.5px;font-weight:700;padding:7px 12px;cursor:pointer;
      transition:background .15s,color .15s,border-color .15s}
    .preview-card-btn:hover{background:var(--sfh);color:var(--t1)}
    .preview-card-btn svg{width:12px;height:12px;transition:transform .2s}
    .preview-card-btn.active{color:var(--ac);border-color:color-mix(in srgb,var(--ac) 45%,transparent);
      background:color-mix(in srgb,var(--ac) 10%,var(--bg))}
    .preview-card-btn.active svg{transform:scale(1.05)}
    .f-preview{max-height:0;overflow:hidden;opacity:0;
      transition:max-height .4s ease,opacity .3s ease,margin .3s ease}
    .f-preview.open{max-height:380px;opacity:1;margin-top:11px}
    .fp-stage{position:relative;height:160px;border-radius:14px;overflow:hidden;
      background:radial-gradient(120% 120% at 50% 0%,color-mix(in srgb,var(--ac) 7%,var(--sf)),var(--sf));
      border:1px solid var(--bd);display:flex;align-items:center;justify-content:center}
    .fp-stage::before{content:'';position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(transparent 60%,color-mix(in srgb,var(--bg) 55%,transparent))}
    .fp-seg{margin:11px auto 2px}

    /* ── Preview theater ──────────────────────────────────── */
    #theater{position:fixed;inset:0;z-index:120;display:none;flex-direction:column;
      background:color-mix(in srgb,var(--bg) 88%,#000);-webkit-app-region:no-drag;
      border-radius:18px;overflow:hidden}
    #theater.show{display:flex;animation:thFade .22s ease}
    @keyframes thFade{from{opacity:0}to{opacity:1}}
    .th-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex-shrink:0}
    .th-counter{font-size:10px;font-weight:800;color:var(--t3);letter-spacing:.5px;
      font-variant-numeric:tabular-nums;background:var(--sf);border-radius:9999px;padding:4px 10px}
    .th-cat{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;
      padding:3px 9px;border-radius:9999px;background:var(--sf);color:var(--t2)}
    .th-sev{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;color:var(--t3)}
    .th-sev .d{width:8px;height:8px;border-radius:50%}
    .th-sev .d.high{background:#F44336}.th-sev .d.medium{background:#FF9800}.th-sev .d.low{background:var(--ac)}
    .th-close{margin-left:auto;width:28px;height:28px;border-radius:50%;border:none;
      background:var(--sf);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center}
    .th-close:hover{background:var(--sfh);color:var(--t1)}

    .th-body{flex:1;overflow-y:auto;padding:2px 18px 8px;display:flex;flex-direction:column}
    .th-title{font-size:17px;font-weight:850;line-height:1.25;letter-spacing:-.01em;margin:4px 0 3px}
    .th-detail{font-size:11.5px;color:var(--t2);line-height:1.5;margin-bottom:12px}

    /* the animated stage */
    .theater-stage{position:relative;height:208px;border-radius:16px;overflow:hidden;
      background:radial-gradient(120% 120% at 50% 0%,color-mix(in srgb,var(--ac) 7%,var(--sf)),var(--sf));
      border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .theater-stage::before{content:'';position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(transparent 60%,color-mix(in srgb,var(--bg) 55%,transparent))}

    /* segmented Problem ⇄ After-fix control */
    .th-seg{display:flex;gap:0;margin:13px auto 0;background:var(--sf);border:1px solid var(--bd);
      border-radius:9999px;padding:3px;width:fit-content;position:relative}
    .th-seg button{-webkit-app-region:no-drag;border:none;background:none;cursor:pointer;
      font-size:11px;font-weight:800;padding:7px 18px;border-radius:9999px;color:var(--t3);
      letter-spacing:.02em;transition:color .2s;position:relative;z-index:1}
    .th-seg button.active{color:#fff}
    .th-seg .pill{position:absolute;top:3px;bottom:3px;width:calc(50% - 3px);border-radius:9999px;
      background:var(--ac);transition:transform .28s cubic-bezier(.22,.85,.3,1);z-index:0}
    .th-seg.after .pill{transform:translateX(100%)}
    .th-seg.before .pill{background:#F44336}
    .th-replay{display:flex;justify-content:center;margin-top:9px}
    .th-replay button{-webkit-app-region:no-drag;background:none;border:none;color:var(--t3);
      font-size:10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
    .th-replay button:hover{color:var(--t1)}
    .th-replay svg{width:12px;height:12px}

    .th-metrics{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:13px}
    .th-metrics .metric{font-size:10.5px;padding:5px 11px}
    .th-save-banner{margin-top:13px;text-align:center;font-size:12px;font-weight:800;color:var(--ac);
      background:color-mix(in srgb,var(--ac) 12%,transparent);border-radius:10px;padding:9px;
      opacity:0;max-height:0;overflow:hidden;transition:opacity .3s,max-height .3s,padding .3s}
    .th-save-banner.show{opacity:1;max-height:60px}

    /* theater footer */
    .th-foot{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:11px 16px;
      border-top:1px solid var(--bd);background:var(--sf)}
    .th-nav{-webkit-app-region:no-drag;width:38px;height:38px;border-radius:11px;border:1px solid var(--bd);
      background:var(--bg);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .th-nav:hover:not(:disabled){background:var(--sfh);color:var(--t1)}
    .th-nav:disabled{opacity:.35;cursor:default}
    .th-apply{-webkit-app-region:no-drag;flex:1;border:none;border-radius:11px;
      background:var(--btn);color:var(--btn-t);font-size:13px;font-weight:800;padding:11px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:7px;transition:opacity .15s}
    .th-apply:hover{opacity:.9}.th-apply:disabled{opacity:.55;cursor:default}
    .th-apply.delete{background:#F44336;color:#fff}
    .th-apply .lock{width:13px;height:13px;opacity:.85}
    .th-dismiss{-webkit-app-region:no-drag;background:none;border:none;color:var(--t3);font-size:10.5px;
      font-weight:700;cursor:pointer;text-decoration:underline;padding:6px 4px;flex-shrink:0}
    .th-dismiss:hover{color:var(--t1)}

        /* ════════ scene animations (redesigned, per-category namespaced) ════════ */
    /* Base stage: each scene fills the 160px fp-stage and centers its content. */
    .sc{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:10px;overflow:hidden}

    /* ── cache ─────────────────────────────────────────── */
    .sc-cache{position:relative;width:100%;height:160px;overflow:hidden;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-family:inherit;isolation:isolate}
    .sc-cache.is-before{background:linear-gradient(160deg,color-mix(in srgb,#4a6a86 16%,var(--bg)),var(--bg))}
    .sc-cache.is-after{background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 12%,var(--bg)),var(--bg))}

    /* frost / warm wash over the whole stage */
    .sc-cache .frost{position:absolute;inset:0;z-index:0;pointer-events:none}
    .sc-cache.is-before .frost{background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,#7fd4ff 22%,transparent),transparent 60%);
    animation:cacheShiver 2.4s ease-in-out infinite}
    .sc-cache.is-after .frost{background:radial-gradient(110% 80% at 50% 60%,color-mix(in srgb,var(--ac) 18%,transparent),transparent 60%);
    animation:cacheBreathe 3s ease-in-out infinite}

    /* incoming prefix feed (top) */
    .sc-cache .feed{position:absolute;top:8px;left:0;width:100%;height:48px;z-index:1;pointer-events:none}

    /* ── generic ─────────────────────────────────────────── */
    @property --generic-n {
    syntax: '<integer>';
    initial-value: 0;
    inherits: true;
    }

    .sc-generic {
    position: relative;
    height: 160px;
    width: 100%;
    box-sizing: border-box;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 11px;
    background:
    radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, #F44336 9%, transparent), transparent 55%),
    radial-gradient(120% 90% at 100% 100%, color-mix(in srgb, var(--ac) 8%, transparent), transparent 55%);
    overflow: hidden;
    --generic-n: 0;
    }

    .sc-generic .hdr {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 18px;
    }
    .sc-generic .hdr .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #F44336;
    box-shadow: 0 0 0 0 color-mix(in srgb, #F44336 60%, transparent);
    animation: genericPulse 1.4s ease-out infinite;
    }
    .sc-generic.is-after .hdr .dot {
    background: var(--ac);
    animation: none;
    box-shadow: 0 0 8px color-mix(in srgb, var(--ac) 70%, transparent);
    }
    .sc-generic .hdr .ttl {
    font-size: 12px;
    font-weight: 650;
    letter-spacing: .2px;
    color: var(--t1);
    }
    .sc-generic .hdr .pct {
    margin-left: auto;
    font-size: 13px;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
    color: #F44336;
    transition: color .4s ease;
    }
    .sc-generic.is-after .hdr .pct { color: var(--ac); }
    .sc-generic .hdr .pct .num::before {
    counter-reset: generic-c var(--generic-n);
    content: counter(generic-c) '%';
    }
    .sc-generic .hdr .pct .num::after {
    content: ' used';
    font-size: 10px;
    font-weight: 600;
    color: var(--t3);
    }
    .sc-generic.is-after .hdr .pct .num::after { content: ' saved'; }

    /* count-up driver: before lands near 92, after near 42 */
    .sc-generic.is-before { animation: genericCountBad 2.2s cubic-bezier(.22,1,.36,1) forwards; }
    .sc-generic.is-after  { animation: genericCountGood 2.2s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes genericCountBad  { from { --generic-n: 0; } to { --generic-n: 92; } }
    @keyframes genericCountGood { from { --generic-n: 0; } to { --generic-n: 42; } }

    .sc-generic .row {
    display: flex;
    align-items: center;
    gap: 9px;
    }
    .sc-generic .lbl {
    flex: 0 0 38px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--t3);
    text-align: right;
    }

    .sc-generic .track {
    position: relative;
    flex: 1;
    height: 22px;
    border-radius: 7px;
    background: color-mix(in srgb, var(--t3) 14%, transparent);
    border: 1px solid var(--bd);
    overflow: hidden;
    }

    .sc-generic .fill {
    position: absolute;
    inset: 0;
    transform-origin: left center;
    border-radius: 6px;
    will-change: transform;
    }

    /* BEFORE bar — near full, red, agitated */
    .sc-generic .fill--bad {
    background: linear-gradient(90deg, #F44336, #FF7043);
    box-shadow: inset 0 0 10px color-mix(in srgb, #F44336 50%, transparent);
    transform: scaleX(.06);
    animation: genericGrowBad .7s cubic-bezier(.22,1,.36,1) .1s forwards,
             genericJitter 1.6s ease-in-out 1s infinite;
    }
    .sc-generic.is-after .fill--bad {
    transform: scaleX(1);
    animation: genericShrinkBad .8s cubic-bezier(.4,0,1,1) .15s forwards;
    background: linear-gradient(90deg, color-mix(in srgb, #F44336 35%, var(--t3)), color-mix(in srgb, #F44336 20%, var(--t3)));
    box-shadow: none;
    }

    /* AFTER bar — small, green, calm & settled */
    .sc-generic .fill--good {
    background: linear-gradient(90deg, var(--ac), color-mix(in srgb, var(--ac) 70%, #34D399));
    box-shadow: 0 0 10px color-mix(in srgb, var(--ac) 45%, transparent);
    transform: scaleX(0);
    border-radius: 6px;
    }
    .sc-generic.is-before .fill--good {
    transform: scaleX(.04);
    background: color-mix(in srgb, var(--t3) 22%, transparent);
    box-shadow: none;
    opacity: .5;
    }
    .sc-generic.is-after .fill--good {
    animation: genericGrowGood .8s cubic-bezier(.34,1.56,.64,1) .35s forwards,
             genericBreathe 2.4s ease-in-out 1.3s infinite;
    }

    /* shimmer sweep on the wasteful bar = repeated work */
    .sc-generic .shimmer {
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%);
    background-size: 220% 100%;
    animation: genericSweep 1.5s linear infinite;
    }
    .sc-generic.is-after .shimmer { display: none; }

    /* leaking sparks rising off the red bar */
    .sc-generic .sparks { position: absolute; inset: 0; }
    .sc-generic .spark {
    position: absolute;
    top: var(--top);
    left: var(--sx);
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #FFD2CC;
    box-shadow: 0 0 4px #FF7043;
    opacity: 0;
    animation: genericLeak 1.5s ease-in var(--d) infinite;
    }
    .sc-generic.is-after .spark { display: none; }

    /* satisfied ticks lighting across the green bar */
    .sc-generic .ticks {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    padding-left: 7px;
    }
    .sc-generic .tick {
    width: 2px;
    height: 9px;
    border-radius: 2px;
    background: rgba(255,255,255,.55);
    opacity: 0;
    }
    .sc-generic.is-after .tick {
    animation: genericTick .4s cubic-bezier(.22,1,.36,1) calc(.55s + var(--d)) forwards;
    }

    /* confirm check that pops in on the good bar */
    .sc-generic .check {
    position: absolute;
    right: 5px;
    top: 50%;
    width: 15px;
    height: 15px;
    margin-top: -7.5px;
    border-radius: 50%;
    background: rgba(255,255,255,.92);
    display: grid;
    place-items: center;
    transform: scale(0);
    opacity: 0;
    }
    .sc-generic .check svg {
    width: 10px;
    height: 10px;
    fill: none;
    stroke: var(--ac);
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    }
    .sc-generic.is-after .check {
    animation: genericPop .42s cubic-bezier(.34,1.56,.64,1) .95s forwards;
    }

    /* end-cap captions */
    .sc-generic .cap {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: .2px;
    pointer-events: none;
    white-space: nowrap;
    }
    .sc-generic .cap--bad {
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    opacity: 0;
    animation: genericFadeIn .4s ease .55s forwards;
    }
    .sc-generic.is-after .cap--bad { opacity: 0; animation: none; }
    .sc-generic .cap--good {
    color: var(--ac);
    opacity: 0;
    }
    .sc-generic.is-after .cap--good {
    animation: genericFadeIn .4s ease 1.05s forwards;
    }
    .sc-generic.is-before .cap--good { display: none; }

    /* ---- keyframes ---- */
    @keyframes genericGrowBad {
    from { transform: scaleX(.06); }
    to   { transform: scaleX(.92); }
    }
    @keyframes genericShrinkBad {
    from { transform: scaleX(1); }
    to   { transform: scaleX(.42); }
    }
    @keyframes genericGrowGood {
    from { transform: scaleX(0); }
    to   { transform: scaleX(.42); }
    }
    @keyframes genericJitter {
    0%, 100% { transform: scaleX(.92); }
    25%      { transform: scaleX(.935); }
    60%      { transform: scaleX(.905); }
    }
    @keyframes genericBreathe {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.12); }
    }
    @keyframes genericSweep {
    from { background-position: 140% 0; }
    to   { background-position: -140% 0; }
    }
    @keyframes genericLeak {
    0%   { opacity: 0; transform: translateY(0) scale(.6); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-16px) scale(1.1); }
    }
    @keyframes genericTick {
    from { opacity: 0; transform: scaleY(.4); }
    to   { opacity: 1; transform: scaleY(1); }
    }
    @keyframes genericPop {
    0%   { transform: scale(0); opacity: 0; }
    70%  { transform: scale(1.18); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
    }
    @keyframes genericPulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, #F44336 55%, transparent); }
    70%  { box-shadow: 0 0 0 7px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
    }
    @keyframes genericFadeIn {
    from { opacity: 0; transform: translateY(-50%) translateX(4px); }
    to   { opacity: 1; transform: translateY(-50%) translateX(0); }
    }

        @media (prefers-reduced-motion: reduce){

    #authMsg{font-size:11px;color:var(--t2);line-height:1.5;margin-bottom:16px}
    .auth-btns{display:flex;flex-direction:column;gap:8px}
    .auth-btns button{border:none;border-radius:10px;font-size:12px;font-weight:800;
      padding:11px;cursor:pointer;width:100%}
    #authLoginBtn{background:var(--btn);color:var(--btn-t)}
    #authUpgradeBtn{background:var(--ac);color:#fff}
    #authLoginBtn:hover,#authUpgradeBtn:hover{opacity:.9}
    #authCloseBtn{background:none;color:var(--t3);font-weight:600;font-size:11px;
      padding:6px;text-decoration:underline}
    #authCloseBtn:hover{color:var(--t1)}

    /* ── Toast ────────────────────────────────────────────── */
    #toast{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);
      background:#111;color:#fff;padding:9px 18px;border-radius:20px;font-size:11px;
      font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;
      white-space:nowrap;z-index:99;max-width:88%;text-align:center}
    #toast.show{opacity:1}
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <svg class="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <path d="m9 12 2 2 4-4"/>
    </svg>
    <h1>Terse Doctor<span class="cn">体检</span></h1>
    <button class="close-btn" id="btnLang" title="Language / 语言" aria-label="Language" style="margin-left:auto">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10A15.3 15.3 0 0 1 12 2z"/></svg>
    </button>
    <button class="close-btn" id="closeBtn" title="Close" aria-label="Close">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <div class="scroll">
    <!-- Hero / gauge -->
    <div class="hero" id="hero">
      <div class="gauge-wrap">
        <div id="scoreGauge">
          <svg width="148" height="148" viewBox="0 0 148 148">
            <circle cx="74" cy="74" r="62" fill="none" stroke="var(--bd)" stroke-width="11"/>
            <circle id="scoreArc" cx="74" cy="74" r="62" fill="none"
              stroke="var(--ac)" stroke-width="11" stroke-linecap="round"
              stroke-dasharray="389.6" stroke-dashoffset="389.6"
              style="transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1),stroke .4s"/>
          </svg>
        </div>
        <div class="gauge-center">
          <div id="scoreNum">--</div>
          <div class="score-of">Health</div>
        </div>
      </div>
      <div id="scoreGrade">&nbsp;</div>
      <div id="scanStatus">Ready to scan</div>
      <div id="summaryLine"></div>

      <div class="cats" id="catChips">
        <div class="cat-chip" data-cat="cache"><span class="cdot"></span><span>Cache</span></div>
        <div class="cat-chip" data-cat="mcp"><span class="cdot"></span><span>MCP</span></div>
        <div class="cat-chip" data-cat="loop"><span class="cdot"></span><span>Loop</span></div>
        <div class="cat-chip" data-cat="context"><span class="cdot"></span><span>Context</span></div>
        <div class="cat-chip" data-cat="prompt"><span class="cdot"></span><span>Prompt</span></div>
        <div class="cat-chip" data-cat="cost"><span class="cdot"></span><span>Cost</span></div>
        <div class="cat-chip" data-cat="config"><span class="cdot"></span><span>Config</span></div>
        <div class="cat-chip" data-cat="junk"><span class="cdot"></span><span>Junk</span></div>
        <div class="cat-chip" data-cat="disk"><span class="cdot"></span><span>Disk</span></div>
        <div class="cat-chip" data-cat="guard"><span class="cdot"></span><span>Guard</span></div>
        <div class="cat-chip" data-cat="runtime"><span class="cdot"></span><span>Runtime</span></div>
      </div>

      <button id="scanBtn">
        <span class="spin"></span>
        <svg class="scan-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-3.5-3.5"/></svg>
        <span id="scanBtnLabel">Run Scan</span>
      </button>
    </div>

    <!-- Findings -->
    <div id="findingsRegion">
      <div class="section-title">
        <span>Findings</span>
        <span style="display:flex;align-items:center;gap:9px">
          <button class="preview-btn" id="previewBtn" type="button" style="display:none">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <span data-i18n="doctor_preview_issues">Preview issues</span>
          </button>
          <span class="n" id="findingsCountLbl"></span>
        </span>
      </div>
      <div id="findingsList"></div>

      <div id="emptyState">
        <svg class="em-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        <h3>All clear</h3>
        <p>No token-waste or speed problems found. Your setup is lean.</p>
      </div>
    </div>
  </div>

  <!-- Bulk footer -->
  <div id="bulkBar">
    <span id="bulkCount">0 selected</span>
    <button id="bulkBtn">Clean selected</button>
  </div>

  <!-- Auth gate modal -->
  <div id="authModal" aria-hidden="true">
    <div class="auth-card">
      <svg class="auth-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="11" width="16" height="10" rx="2"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
      <div id="authTitle">Sign in to clean</div>
      <div id="authMsg">The scan and full report are free. Applying fixes needs a Terse account.</div>
      <div class="auth-btns">
        <button id="authLoginBtn">Sign in</button>
        <button id="authUpgradeBtn">Upgrade to Pro</button>
        <button id="authCloseBtn">Not now</button>
      </div>
    </div>
  </div>

  <!-- Preview theater -->
  <div id="theater" aria-hidden="true">
    <div class="th-head">
      <span class="th-counter" id="thCounter">1 / 1</span>
      <span class="th-cat" id="thCat"></span>
      <span class="th-sev" id="thSev"><span class="d"></span><span class="t"></span></span>
      <button class="th-close" id="thClose" aria-label="Close">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="th-body">
      <div class="th-title" id="thTitle"></div>
      <div class="th-detail" id="thDetail"></div>
      <div class="theater-stage" id="thStage"></div>
      <div class="th-seg before" id="thSeg">
        <span class="pill"></span>
        <button data-state="before" class="active" data-i18n="doctor_problem">Problem</button>
        <button data-state="after" data-i18n="doctor_after_fix">After fix</button>
      </div>
      <div class="th-replay">
        <button id="thReplay" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          <span data-i18n="doctor_replay">Replay</span>
        </button>
      </div>
      <div class="th-metrics" id="thMetrics"></div>
      <div class="th-save-banner" id="thSaveBanner"></div>
    </div>
    <div class="th-foot">
      <button class="th-nav" id="thPrev" aria-label="Previous">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="th-apply" id="thApply">
        <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span class="lbl" data-i18n="doctor_apply_fix">Apply fix</span>
      </button>
      <button class="th-dismiss" id="thDismiss" data-i18n="doctor_not_now">Not now</button>
      <button class="th-nav" id="thNext" aria-label="Next">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="i18n.js"></script>
  <script src="doctor-i18n.js"></script>
  <script src="doctor-theater.js"></script>
  <script src="tauri-bridge.js"></script>
  <script src="doctor.js"></script>
  <script>
    // Wire the header language picker (same mechanism as the main window).
    document.getElementById('btnLang')?.addEventListener('click', function (e) {
      e.stopPropagation();
      try { if (window.i18n) window.i18n.createLangPicker(document.getElementById('btnLang')); } catch (err) { /* ignore */ }
    });
  </script>
</body>
</html>
