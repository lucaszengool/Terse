name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-app/src-tauri

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build terse-uia.exe
        run: |
          dotnet publish windows-app\helpers\terse-uia\terse-uia.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            -o windows-app\helpers\ `
            -v normal 2>&1

      - name: Verify terse-uia.exe
        run: |
          $size = (Get-Item "windows-app/helpers/terse-uia.exe").Length
          Write-Host "terse-uia.exe size: $size bytes"
          if ($size -lt 100000) { throw "terse-uia.exe too small — build may have failed" }

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install Node.js (for frontend assets)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Convert icon to .ico
        run: |
          $dst = "windows-app/src-tauri/icons/icon.ico"
          if (-not (Test-Path $dst)) {
            magick "windows-app/src-tauri/icons/icon.png" `
              -define icon:auto-resize=256,128,64,48,32,16 `
              $dst
            Write-Host "icon.ico created via ImageMagick"
          } else {
            Write-Host "icon.ico already exists"
          }

      - name: Build Tauri Windows installer
        run: |
          cd windows-app\src-tauri
          cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Find and list installer
        run: |
          $bundles = Get-ChildItem -Recurse "windows-app\src-tauri\target" -Include "*.exe","*.msi" |
            Where-Object { $_.FullName -match "bundle" }
          if ($bundles) {
            $bundles | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          } else {
            Write-Host "No bundle files found — listing target dir:"
            Get-ChildItem -Recurse "windows-app\src-tauri\target\x86_64-pc-windows-msvc\release" -Depth 3 | Select-Object FullName
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terse-Windows-Installer
          path: |
            windows-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            windows-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.3
          name: Terse v1.3.3
          draft: false
          prerelease: false
          files: |
            windows-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            windows-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Smoke test on a real Windows desktop ────────────────────────────────
      # windows-latest is an actual Windows machine with an interactive session,
      # so the app can be installed, launched and photographed here. Everything
      # in this build was written on a Mac and verified only by cross-compiling;
      # these steps are the first thing in the pipeline that proves it RUNS.
      #
      # continue-on-error throughout: the release is already published above, and
      # a flaky screenshot must never fail a build that shipped fine.
      # The single most useful number for reading the screenshots below.
      # WebView2 144.0.3719.67 through .82 shipped a regression that paints a
      # ghost title bar under the web content on transparent windows
      # (MicrosoftEdge/WebView2Feedback#5492, tauri#14764). It is fixed in
      # 144.0.3719.93+. Without this line, every ghost bar in a screenshot is
      # ambiguous between "our bug" and "the runner's runtime".
      - name: Log the WebView2 Runtime version
        continue-on-error: true
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $v = $null
          foreach ($k in $keys) {
            $p = Get-ItemProperty -Path $k -ErrorAction SilentlyContinue
            if ($p.pv) { $v = $p.pv; break }
          }
          if (-not $v) { $v = "(not found in registry)" }
          Write-Host "WebView2 Runtime: $v"
          $bad = $false
          if ($v -match '^(\d+)\.(\d+)\.(\d+)\.(\d+)$') {
            $maj = [int]$Matches[1]; $bld = [int]$Matches[3]; $rev = [int]$Matches[4]
            # Regressed range: 144.0.3719.<93 and all of 145.x.
            if ($maj -eq 145) { $bad = $true }
            if ($maj -eq 144 -and $bld -eq 3719 -and $rev -lt 93) { $bad = $true }
          }
          if ($bad) {
            Write-Warning "This runtime is inside the WebView2 ghost-titlebar regression window - any ghost bar in the screenshots below is upstream, not ours."
          } else {
            Write-Host "Outside the known regression window - a ghost bar here would be ours."
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          "WebView2 Runtime: $v`nregressed range: $bad" | Set-Content artifacts/webview2-version.txt

      - name: Install the built app silently
        continue-on-error: true
        run: |
          $exe = Get-ChildItem -Recurse "windows-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter *.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "no installer produced" }
          Write-Host "installing $($exe.FullName)"
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          $installed = Get-ChildItem -Recurse "C:\Program Files\Terse" -Filter "Terse.exe" -ErrorAction SilentlyContinue |
                       Select-Object -First 1
          if (-not $installed) { throw "Terse.exe not found after install" }
          Write-Host "INSTALLED_AT=$($installed.FullName)"
          "TERSE_EXE=$($installed.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The runner boots with no desktop picture and the wallpaper feature off,
      # so a plain launch never touches any of the wallpaper code. Setting both
      # up BEFORE launch means `setup()`'s restore path runs for real:
      # show_wallpaper_window -> pin_wallpaper_window (the WorkerW re-parent) and
      # get_desktop_picture (the PowerShell downscale). Those are the two pieces
      # that have never been observed running anywhere.
      # Real agent traffic, without a real agent.
      #
      # "CI cannot produce agent traffic" was wrong - agent_monitor does not talk
      # to Claude Code, it reads the JSONL transcripts Claude Code leaves in
      # ~/.claude/projects/<encoded-cwd>/<session>.jsonl. So a transcript in that
      # shape IS the traffic, and discovery -> parse -> display becomes testable
      # here instead of only on someone's desktop.
      #
      # The schema below is taken from a real transcript, not invented: `type`,
      # `cwd`, `message.role`, `message.usage.{input,output,cache_creation,
      # cache_read}_tokens`, tool_use / tool_result content blocks and
      # `toolUseResult` - exactly the fields parse_claude_code_line reads.
      - name: Plant a Claude Code transcript so the agent parser has real input
        continue-on-error: true
        run: |
          $enc  = "C--Users-runneradmin-Desktop-terse-ci"
          $dir  = Join-Path $env:USERPROFILE ".claude\projects\$enc"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $sid  = [guid]::NewGuid().ToString()
          $cwd  = "C:\Users\runneradmin\Desktop\terse-ci"
          $file = Join-Path $dir "$sid.jsonl"
          $lines = New-Object System.Collections.ArrayList
          function Add-Line($o) { [void]$lines.Add((ConvertTo-Json $o -Depth 12 -Compress)) }
          $t0 = [DateTime]::UtcNow.AddMinutes(-6)
          for ($i = 0; $i -lt 8; $i++) {
            $ts = $t0.AddSeconds($i * 40).ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            Add-Line @{ type='user'; cwd=$cwd; sessionId=$sid; timestamp=$ts; uuid=[guid]::NewGuid().ToString();
                        message=@{ role='user'; content="Refactor the token counter, pass $i" } }
            # assistant turn: a tool call, then text, with real usage numbers
            $ts2 = $t0.AddSeconds($i * 40 + 8).ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            Add-Line @{ type='assistant'; cwd=$cwd; sessionId=$sid; timestamp=$ts2; uuid=[guid]::NewGuid().ToString();
                        message=@{ role='assistant'; model='claude-opus-5'; type='message';
                          content=@( @{ type='tool_use'; id="toolu_$i"; name='Read'; input=@{ file_path="$cwd\src\counter.ts" } } );
                          usage=@{ input_tokens=(120 + $i * 30); output_tokens=(340 + $i * 55);
                                   cache_creation_input_tokens=(2200 + $i * 400);
                                   cache_read_input_tokens=(15000 + $i * 2600) } } }
            $ts3 = $t0.AddSeconds($i * 40 + 14).ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            Add-Line @{ type='user'; cwd=$cwd; sessionId=$sid; timestamp=$ts3; uuid=[guid]::NewGuid().ToString();
                        toolUseResult=@{ type='text'; file=@{ filePath="$cwd\src\counter.ts" } };
                        message=@{ role='user'; content=@( @{ type='tool_result'; tool_use_id="toolu_$i";
                          content=("export function count(s: string) { return s.length } " * 40) } ) } }
            $ts4 = $t0.AddSeconds($i * 40 + 22).ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            Add-Line @{ type='assistant'; cwd=$cwd; sessionId=$sid; timestamp=$ts4; uuid=[guid]::NewGuid().ToString();
                        message=@{ role='assistant'; model='claude-opus-5'; type='message';
                          content=@( @{ type='text'; text="Done - pass $i trimmed the counter." } );
                          usage=@{ input_tokens=(95 + $i * 12); output_tokens=(210 + $i * 40);
                                   cache_creation_input_tokens=0;
                                   cache_read_input_tokens=(18000 + $i * 3100) } } }
          }
          Set-Content -Path $file -Value $lines -Encoding utf8
          # mtime must be fresh: find_all_active_jsonl_globally ignores anything
          # older than 30 minutes, so a stale fixture would look like no traffic.
          (Get-Item $file).LastWriteTime = Get-Date
          $expIn  = 0; $expOut = 0
          for ($i = 0; $i -lt 8; $i++) { $expIn += (120 + $i*30) + (95 + $i*12); $expOut += (340 + $i*55) + (210 + $i*40) }
          Write-Host "planted $file  ($($lines.Count) lines)"
          Write-Host "EXPECT input_tokens=$expIn output_tokens=$expOut turns=8"
          "EXPECT_IN=$expIn`nEXPECT_OUT=$expOut" | Set-Content artifacts-expect.txt

      # Codex too. Different agent, different store, different parser:
      # ~/.codex/sessions/YYYY/MM/DD/rollout-*.jsonl, read by parse_codex_line
      # rather than parse_claude_code_line. Testing only Claude Code would leave
      # exactly half the reported bug uncovered - the desktop showed BOTH agents
      # online with zeroes, and they share no parsing code at all.
      #
      # Shape taken from parse_codex_line's own dispatch (Desktop rollout
      # format): session_meta carries the model; event_msg dispatches on
      # payload.type for task_started / user_message / task_complete;
      # response_item carries role'd content plus function_call and
      # function_call_output. Note Codex rollouts have NO usage fields at all -
      # the parser estimates tokens from content length and flushes per turn on
      # task_complete, so the fixture needs real prose volume, not token counts.
      - name: Plant a Codex rollout so the other parser has real input
        continue-on-error: true
        run: |
          $now  = Get-Date
          $dir  = Join-Path $env:USERPROFILE (".codex\sessions\{0:yyyy}\{0:MM}\{0:dd}" -f $now)
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $sid  = [guid]::NewGuid().ToString()
          $file = Join-Path $dir ("rollout-{0:yyyy-MM-ddTHH-mm-ss}-$sid.jsonl" -f $now)
          $lines = New-Object System.Collections.ArrayList
          function Add-L($o) { [void]$lines.Add((ConvertTo-Json $o -Depth 12 -Compress)) }
          $t0 = $now.AddMinutes(-5).ToUniversalTime()
          $ts = { param($s) $t0.AddSeconds($s).ToString("yyyy-MM-ddTHH:mm:ss.fffZ") }
          Add-L @{ type='session_meta'; timestamp=(& $ts 0);
                   payload=@{ model='gpt-5-codex'; model_provider='openai'; id=$sid } }
          $prose = "Scanning the workspace for the token accounting path and the places it double counts cached reads. "
          for ($i = 0; $i -lt 6; $i++) {
            $b = $i * 45
            Add-L @{ type='event_msg'; timestamp=(& $ts $b);
                     payload=@{ type='task_started'; model_context_window=272000 } }
            Add-L @{ type='event_msg'; timestamp=(& $ts ($b+1));
                     payload=@{ type='user_message'; message="Audit the cache accounting, round $i" } }
            Add-L @{ type='response_item'; timestamp=(& $ts ($b+2));
                     payload=@{ type='message'; role='user';
                       content=@( @{ type='input_text'; text=("Audit the cache accounting, round $i. " + ($prose * 3)) } ) } }
            Add-L @{ type='response_item'; timestamp=(& $ts ($b+8));
                     payload=@{ type='function_call'; name='shell'; call_id="call_$i";
                       arguments=(ConvertTo-Json @{ command=@('bash','-lc','rg -n "cache_read" src/') } -Compress) } }
            Add-L @{ type='response_item'; timestamp=(& $ts ($b+12));
                     payload=@{ type='function_call_output'; call_id="call_$i";
                       output=("src/stats.rs:41: cache_read_input_tokens`n" * 30) } }
            Add-L @{ type='response_item'; timestamp=(& $ts ($b+20));
                     payload=@{ type='message'; role='assistant';
                       content=@( @{ type='output_text'; text=("Round $i - the cached reads are counted twice. " + ($prose * 6)) } ) } }
            Add-L @{ type='event_msg'; timestamp=(& $ts ($b+24)); payload=@{ type='task_complete' } }
          }
          Set-Content -Path $file -Value $lines -Encoding utf8
          # Deliberately STALE - 45 minutes old, past find_codex_session's 30
          # minute freshness window. That reproduces the actual reported bug:
          # Terse starts while Codex is open but idle, accept_agent finds nothing
          # fresh, and session_file stays None. A later step touches this file to
          # simulate the user starting work, which is what the late-attach retry
          # has to notice. Planting it fresh only ever tested the happy path,
          # which already worked.
          (Get-Item $file).LastWriteTime = (Get-Date).AddMinutes(-45)
          Write-Host "planted $file  ($($lines.Count) lines, 6 turns) - mtime backdated 45 min"
          "CODEX_ROLLOUT=$file" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Detection is by PROCESS NAME, not by transcript.
      # agent_defs() lists process_names: ["claude"] and ["codex"], so a planted
      # transcript alone is invisible - accept_agent never fires, nothing is
      # parsed, and no log line is written. That is exactly what the first
      # fixture run showed: "planted ... 32 lines" and then silence.
      #
      # cmd.exe copied under each name gives the scanner a real process with a
      # real PID to find. It sleeps and does nothing else. The CWD lookup will
      # fail on it, which is fine and worth exercising: find_claude_project_dir
      # is meant to fall back to scanning all project dirs for the most recent
      # session, and that fallback is what the planted transcript tests.
      - name: Give the agent scanner processes to find
        continue-on-error: true
        run: |
          foreach ($n in @('claude','codex')) {
            $exe = Join-Path $env:TEMP "$n.exe"
            Copy-Item "$env:WINDIR\System32\cmd.exe" $exe -Force
            Start-Process -FilePath $exe -ArgumentList '/c','timeout /t 900 /nobreak' -WindowStyle Hidden
          }
          Start-Sleep -Seconds 2
          Get-Process -Name claude,codex -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "running: $($_.ProcessName) pid=$($_.Id)" }

      # Run the smoke test as a PRO user.
      #
      # The Pro field (four glyph slots, the PRO_TINT six-colour palette, the
      # 1.2s agent-log cadence) is gated two ways: wallpaper.json must say
      # engine=cinematic, AND get_license must report an entitled subscription -
      # the renderer now re-checks, so setting the engine alone is no longer
      # enough. A default runner is neither, so every burst so far has been
      # photographing the FREE field and the Pro palette has never been observed.
      #
      # license.json is the local cache the License struct loads from, so writing
      # an active tier here simulates a subscribed user on this machine. It grants
      # nothing server-side; it is the same file a real subscriber would have.
      - name: Sign the runner in as Pro
        continue-on-error: true
        run: |
          $dir = Join-Path $env:USERPROFILE ".terse"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $lic = @{
            tier = 'pro'; status = 'active'
            limits = @{ optimizations_per_week = -1; max_sessions = -1; max_devices = -1 }
            clerkUserId = 'ci_smoke_user'
            expiresAt = (Get-Date).AddDays(30).ToString('yyyy-MM-ddTHH:mm:sszzz')
            trialEnd = $null
            weekly_usage = 0.0
            usage_week = [int](Get-Date -UFormat %V)
          }
          ConvertTo-Json $lic -Depth 6 | Set-Content (Join-Path $dir "license.json") -Encoding ascii
          Write-Host "license.json written: tier=pro status=active"

      - name: Give the runner a desktop picture and turn the wallpaper on
        continue-on-error: true
        run: |
          # Also a direct check of the stock paths the Rust fallback relies on.
          foreach ($c in @("$env:WINDIR\Web\Wallpaper\Windows\img0.jpg",
                           "$env:WINDIR\Web\Wallpaper\Theme1\img1.jpg",
                           "$env:WINDIR\Web\Screen\img100.jpg")) {
            Write-Host "stock candidate $c exists=$(Test-Path $c)"
          }
          $img = Get-ChildItem -Recurse "$env:WINDIR\Web\Wallpaper" -Include *.jpg -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($img) {
            # One line on purpose: a PowerShell here-string must close at column
            # 0, which is illegal inside an indented YAML block scalar.
            Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public class Wp { [DllImport("user32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern bool SystemParametersInfo(uint a, uint b, string c, uint d); }'
            # SPI_SETDESKWALLPAPER, SPIF_UPDATEINIFILE|SPIF_SENDCHANGE
            $null = [Wp]::SystemParametersInfo(20, 0, $img.FullName, 3)
            Write-Host "desktop picture set to $($img.FullName)"
          } else {
            Write-Host "no stock wallpaper on this runner - fallback will be exercised"
          }
          $transcoded = Join-Path $env:APPDATA "Microsoft\Windows\Themes\TranscodedWallpaper"
          Write-Host "TranscodedWallpaper exists=$(Test-Path $transcoded)"
          $dir = Join-Path $env:USERPROFILE ".terse"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          # engine=cinematic, not mineradio: that is the Pro field, and with the
          # Pro licence written above the renderer's entitlement check now
          # passes, so the burst below finally photographs four coloured glyph
          # slots instead of the free one-slot field.
          '{"enabled":true,"engine":"cinematic","theme":"neon","quality":56,"angle":55,"intensity":1.0}' |
            Set-Content -Path (Join-Path $dir "wallpaper.json") -Encoding ascii
          Write-Host "wallpaper.json written with enabled=true"

      - name: Launch and prove it stays alive
        continue-on-error: true
        run: |
          Start-Process -FilePath "$env:TERSE_EXE"
          # WebView2 first-run + the setup() window builds need a moment.
          Start-Sleep -Seconds 40
          $p = Get-Process -Name "Terse" -ErrorAction SilentlyContinue
          if (-not $p) { throw "Terse exited within 40s of launch — it crashed on startup" }
          Write-Host "alive: $($p.Count) process(es), pid $($p[0].Id)"
          # A window title is the cheapest proof the webview actually rendered
          # rather than the process merely existing.
          $titles = $p | ForEach-Object { $_.MainWindowTitle } | Where-Object { $_ }
          Write-Host "window titles: $($titles -join ' | ')"

      # The user starts working in Codex, 40 seconds after Terse launched.
      #
      # By now accept_agent has already run and found nothing fresh, so
      # session_file is None - the exact state that used to be permanent.
      # Touching the rollout is what a live Codex session looks like to the
      # watcher. The poll loop runs every 5s, so 20s is four chances to notice.
      #
      # Pass = "codex late-attach:" in agent-monitor.log. Its absence means the
      # retry never fired and the fix does not work, however green the build is.
      - name: Simulate Codex starting work after launch
        continue-on-error: true
        run: |
          if (-not $env:CODEX_ROLLOUT) { Write-Host "no rollout path recorded"; exit 0 }
          if (-not (Test-Path $env:CODEX_ROLLOUT)) { Write-Host "rollout missing"; exit 0 }
          (Get-Item $env:CODEX_ROLLOUT).LastWriteTime = Get-Date
          Write-Host "touched $env:CODEX_ROLLOUT - it is now fresh"
          Start-Sleep -Seconds 20
          $log = Join-Path $env:USERPROFILE ".terse\agent-monitor.log"
          if (Test-Path $log) {
            $hit = Select-String -Path $log -Pattern 'codex late-attach' -SimpleMatch
            if ($hit) { Write-Host "LATE-ATTACH OK: $($hit.Line)" }
            else { Write-Warning "LATE-ATTACH DID NOT FIRE - the retry is not working" }
          } else { Write-Host "no agent-monitor.log yet" }

      - name: Screenshot the desktop
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bmp.Save("artifacts/terse-windows.png")
          Write-Host "screenshot $($b.Width)x$($b.Height) saved"

      # One screenshot of the desktop only ever shows the window on top. Tauri
      # builds several windows at startup (main, island, popup, pet, wallpaper),
      # so enumerate every visible window owned by the Terse process, front each
      # in turn and photograph it. These are REAL app windows with live backend
      # data behind them.
      # Report the runtime truth instead of inferring it from screenshots: is DWM
      # composition even on (this runner is Windows Server with classic theming,
      # where a grey caption gradient can be a CI artefact rather than a real
      # bug), and does each Terse window still carry WS_CAPTION after setup
      # stripped it? WS_CAPTION = 0x00C00000.
      - name: Report DWM state and window styles
        continue-on-error: true
        run: |
          Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;using System.Text;public class D{public delegate bool Cb(IntPtr h,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumWindows(Cb c,IntPtr l);[DllImport("user32.dll")]public static extern bool IsWindowVisible(IntPtr h);[DllImport("user32.dll")]public static extern int GetWindowThreadProcessId(IntPtr h,out int p);[DllImport("user32.dll",CharSet=CharSet.Unicode)]public static extern int GetWindowTextW(IntPtr h,StringBuilder s,int n);[DllImport("user32.dll",EntryPoint="GetWindowLongPtrW")]public static extern IntPtr GetWindowLongPtr(IntPtr h,int i);[DllImport("dwmapi.dll")]public static extern int DwmIsCompositionEnabled(out bool e);}'
          $comp = $false
          try { [void][D]::DwmIsCompositionEnabled([ref]$comp) } catch {}
          Write-Host "DWM composition enabled: $comp"
          $dpids = (Get-Process -Name "Terse" -ErrorAction SilentlyContinue | ForEach-Object { $_.Id })
          $dcb = [D+Cb]{ param($h,$l)
            if ([D]::IsWindowVisible($h)) {
              $wpid = 0; [void][D]::GetWindowThreadProcessId($h, [ref]$wpid)
              if ($dpids -contains $wpid) {
                $sb = New-Object System.Text.StringBuilder 512
                [void][D]::GetWindowTextW($h, $sb, 512)
                $st = [int64][D]::GetWindowLongPtr($h, -16)   # GWL_STYLE
                $ex = [int64][D]::GetWindowLongPtr($h, -20)   # GWL_EXSTYLE
                $cap = ($st -band 0x00C00000) -ne 0
                Write-Host ("  '{0}' style=0x{1:X8} ex=0x{2:X8} WS_CAPTION={3}" -f $sb.ToString(), $st, $ex, $cap)
              }
            }
            return $true }
          [void][D]::EnumWindows($dcb, [IntPtr]::Zero)

      - name: Screenshot every window the app actually opened
        continue-on-error: true
        run: |
          Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;using System.Text;public class W{public delegate bool Cb(IntPtr h,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumWindows(Cb c,IntPtr l);[DllImport("user32.dll")]public static extern bool IsWindowVisible(IntPtr h);[DllImport("user32.dll")]public static extern int GetWindowThreadProcessId(IntPtr h,out int p);[DllImport("user32.dll",CharSet=CharSet.Unicode)]public static extern int GetWindowTextW(IntPtr h,StringBuilder s,int n);[DllImport("user32.dll")]public static extern bool SetForegroundWindow(IntPtr h);[DllImport("user32.dll")]public static extern bool ShowWindow(IntPtr h,int c);}'
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $pids = (Get-Process -Name "Terse" -ErrorAction SilentlyContinue | ForEach-Object { $_.Id })
          if (-not $pids) { Write-Host "no Terse process"; exit 0 }
          $found = New-Object System.Collections.ArrayList
          $cb = [W+Cb]{ param($h,$l)
            if ([W]::IsWindowVisible($h)) {
              $wpid = 0; [void][W]::GetWindowThreadProcessId($h, [ref]$wpid)
              if ($pids -contains $wpid) {
                $sb = New-Object System.Text.StringBuilder 512
                [void][W]::GetWindowTextW($h, $sb, 512)
                [void]$found.Add(@{ h = $h; t = $sb.ToString() })
              }
            }
            return $true }
          [void][W]::EnumWindows($cb, [IntPtr]::Zero)
          Write-Host "found $($found.Count) visible Terse window(s)"
          $i = 0
          foreach ($w in $found) {
            $i++
            [void][W]::ShowWindow($w.h, 9)   # SW_RESTORE
            [void][W]::SetForegroundWindow($w.h)
            Start-Sleep -Milliseconds 1500
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
            $safe = ($w.t -replace '[^\w\-]', '_'); if (-not $safe) { $safe = "untitled" }
            $bmp.Save("artifacts/window-$i-$safe.png")
            Write-Host "  [$i] '$($w.t)' -> window-$i-$safe.png"
            $g.Dispose(); $bmp.Dispose()
          }

      # Tauri EMBEDS the frontend in the binary, so there are no .html files on
      # disk to open. The checkout has the same sources that were embedded, so
      # render each one in Edge — the very engine WebView2 uses. This proves
      # layout, fonts, scrollbars and the new color-scheme on every page,
      # including pages the app never opens on its own. It does NOT prove
      # backend wiring: window.__TAURI__ is absent, so data-driven regions stay
      # empty. Those are covered by the real-window shots above.
      - name: Render every page in the WebView2 engine
        continue-on-error: true
        run: |
          $edge = (Get-Command msedge -ErrorAction SilentlyContinue).Source
          if (-not $edge) {
            $edge = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          }
          if (-not (Test-Path $edge)) { Write-Host "no Edge on runner"; exit 0 }
          New-Item -ItemType Directory -Force -Path artifacts/pages | Out-Null
          # --screenshot needs an ABSOLUTE path (a relative one silently writes
          # nowhere useful and the step reported FAILED for all 18 pages), plus
          # --no-sandbox to run as the CI user and a virtual-time budget so the
          # page's own scripts get to paint before the shot is taken.
          $root = (Get-Location).Path
          $dest = Join-Path $root "artifacts/pages"
          foreach ($p in Get-ChildItem "src/renderer" -Filter *.html) {
            $out = Join-Path $dest "$($p.BaseName).png"
            & $edge --headless=new --disable-gpu --no-sandbox --hide-scrollbars=false `
                    --virtual-time-budget=4000 --window-size=1280,900 `
                    --screenshot="$out" ("file:///" + $p.FullName.Replace('\','/')) 2>$null
            if (Test-Path $out) { Write-Host "  rendered $($p.Name)" }
            else { Write-Host "  FAILED   $($p.Name)" }
          }

      # wallpaper-bg.jpg only exists if desktop_picture_source() found an image
      # AND the PowerShell/System.Drawing downscale succeeded, so its presence is
      # end-to-end proof of the piece that differs most from the Mac's `sips`
      # path. Its absence localises the failure precisely.
      # Where did the wallpaper window actually LAND?
      #
      # Screenshots cannot distinguish "parented to the wrong host" from
      # "parented correctly but not compositing" - both look like a bare
      # desktop, and two rounds were spent guessing between them. This walks the
      # shell's window tree and prints every Terse-owned window under Progman
      # and each WorkerW, with its class, styles and rect. WS_CHILD windows do
      # not appear in EnumWindows at all, so if the pin worked the window shows
      # up here and NOWHERE in the top-level list.
      - name: Where did the wallpaper window land
        continue-on-error: true
        run: |
          # CharSet.Unicode is NOT optional. C# DllImport defaults to CharSet.Ansi,
          # so "Progman" was marshalled as ANSI into the WIDE entry point and never
          # matched - FindWindowExW returned 0 and the dump concluded the runner had
          # no Progman and no WorkerW at all. The giveaway was in its own output:
          # class='T' title='T' is "Terse" in UTF-16 read as ANSI and cut at the
          # first null byte. The Rust side uses w!() literals and was never affected.
          Add-Type -TypeDefinition @'
          using System;using System.Runtime.InteropServices;using System.Text;
          public class W {
            public delegate bool Cb(IntPtr h, IntPtr l);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindowExW(IntPtr p,IntPtr c,string cls,string t);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr h,Cb cb,IntPtr l);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassNameW(IntPtr h,StringBuilder s,int m);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowTextW(IntPtr h,StringBuilder s,int m);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h,out R r);
            [DllImport("user32.dll")] public static extern IntPtr GetWindowLongPtrW(IntPtr h,int i);
            [DllImport("user32.dll")] public static extern int GetWindowThreadProcessId(IntPtr h,out uint p);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [StructLayout(LayoutKind.Sequential)] public struct R { public int L,T,Rt,B; }
          }
          '@
          $tpids = @(Get-Process -Name "Terse" -ErrorAction SilentlyContinue | ForEach-Object { $_.Id })
          Write-Host "Terse pids: $($tpids -join ',')"
          function Dump([IntPtr]$host_, [string]$hostName) {
            $cb = [W+Cb]{
              param($h,$l)
              $p = 0; [void][W]::GetWindowThreadProcessId($h, [ref]$p)
              $cls = New-Object System.Text.StringBuilder 256
              [void][W]::GetClassNameW($h, $cls, 256)
              $mine = $tpids -contains $p
              if ($mine -or $cls.ToString() -eq 'SHELLDLL_DefView') {
                $t = New-Object System.Text.StringBuilder 256
                [void][W]::GetWindowTextW($h, $t, 256)
                $r = New-Object W+R
                [void][W]::GetWindowRect($h, [ref]$r)
                $st = [int64][W]::GetWindowLongPtrW($h, -16)
                $ex = [int64][W]::GetWindowLongPtrW($h, -20)
                $child = ($st -band 0x40000000) -ne 0
                $popup = ($st -band 0x80000000) -ne 0
                $tag = if ($mine) { 'TERSE' } else { 'shell' }
                Write-Host ("  [$tag] under ${hostName}: class='$($cls.ToString())' title='$($t.ToString())' " +
                            ("style=0x{0:X8} ex=0x{1:X8} WS_CHILD={2} WS_POPUP={3} visible={4} rect={5},{6} {7}x{8}" -f
                             $st,$ex,$child,$popup,[W]::IsWindowVisible($h),$r.L,$r.T,($r.Rt-$r.L),($r.B-$r.T)))
              }
              return $true
            }
            [void][W]::EnumChildWindows($host_, $cb, [IntPtr]::Zero)
          }
          $progman = [W]::FindWindowExW([IntPtr]::Zero,[IntPtr]::Zero,"Progman",$null)
          Write-Host "Progman = $progman"
          Dump $progman "Progman"
          $ww = [W]::FindWindowExW([IntPtr]::Zero,[IntPtr]::Zero,"WorkerW",$null)
          $n = 0
          while ($ww -ne [IntPtr]::Zero) {
            $n++
            $hasDef = [W]::FindWindowExW($ww,[IntPtr]::Zero,"SHELLDLL_DefView",$null) -ne [IntPtr]::Zero
            Write-Host "WorkerW #$n = $ww  hasDefView=$hasDef"
            Dump $ww "WorkerW#$n"
            $ww = [W]::FindWindowExW([IntPtr]::Zero,$ww,"WorkerW",$null)
          }
          Write-Host "total top-level WorkerW: $n"

      - name: Prove the wallpaper engine got its base image
        continue-on-error: true
        run: |
          $bg = Join-Path $env:USERPROFILE ".terse\wallpaper-bg.jpg"
          if (Test-Path $bg) {
            $f = Get-Item $bg
            Add-Type -AssemblyName System.Drawing
            $i = [System.Drawing.Image]::FromFile($f.FullName)
            Write-Host "WALLPAPER_BG OK: $($f.Length) bytes, $($i.Width)x$($i.Height)"
            $i.Dispose()
          } else {
            Write-Host "WALLPAPER_BG MISSING - source lookup or downscale failed"
          }
          # The wallpaper window is a WorkerW child with WS_EX_TOOLWINDOW, so it
          # never appears in the process window list. Minimising everything is
          # the only way to photograph it: what is left on screen IS the
          # wallpaper, which is also how we can tell the WorkerW re-parent and
          # the reposition after it actually worked.
          # MinimizeAll only touches windows that appear on the taskbar, and
          # every Terse window sets skip_taskbar(true) — so it left the Doctor
          # window sitting over the desktop and the "wallpaper" screenshot was
          # really a screenshot of the app. Hide each top-level Terse window
          # explicitly instead. The wallpaper window itself is a Progman/WorkerW
          # child, so EnumWindows never returns it and it stays visible.
          Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;public class H{public delegate bool Cb(IntPtr h,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumWindows(Cb c,IntPtr l);[DllImport("user32.dll")]public static extern bool IsWindowVisible(IntPtr h);[DllImport("user32.dll")]public static extern int GetWindowThreadProcessId(IntPtr h,out int p);[DllImport("user32.dll")]public static extern bool ShowWindow(IntPtr h,int c);[DllImport("user32.dll",CharSet=CharSet.Unicode)]public static extern int GetClassNameW(IntPtr h,System.Text.StringBuilder s,int n);}'
          # Do NOT hide the Terse windows — they are the point of the shot. Only
          # the runner's own console is in the way, so minimise everything that
          # is not Terse and not the shell. The result shows the live wallpaper
          # AND the app sitting on it, which is what the desktop actually looks
          # like.
          $tpids = (Get-Process -Name "Terse" -ErrorAction SilentlyContinue | ForEach-Object { $_.Id })
          $keep = @('Progman','WorkerW','Shell_TrayWnd','Windows.UI.Core.CoreWindow')
          $mini = 0
          $mcb = [H+Cb]{ param($h,$l)
            if ([H]::IsWindowVisible($h)) {
              $cls = New-Object System.Text.StringBuilder 256
              [void][H]::GetClassNameW($h, $cls, 256)
              $wpid = 0; [void][H]::GetWindowThreadProcessId($h, [ref]$wpid)
              if (($keep -notcontains $cls.ToString()) -and ($tpids -notcontains $wpid)) {
                [void][H]::ShowWindow($h, 6); $script:mini++   # SW_MINIMIZE
              }
            }
            return $true }
          [void][H]::EnumWindows($mcb, [IntPtr]::Zero)
          Write-Host "minimised $mini other window(s)"
          Start-Sleep -Seconds 6
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b2 = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp2 = New-Object System.Drawing.Bitmap $b2.Width, $b2.Height
          $g2 = [System.Drawing.Graphics]::FromImage($bmp2)
          $g2.CopyFromScreen($b2.X, $b2.Y, 0, 0, $bmp2.Size)
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bmp2.Save("artifacts/terse-windows-desktop.png")
          Write-Host "desktop screenshot saved"

      # Capture the wallpaper window ITSELF, not the desktop it sits on. It is a
      # Progman/WorkerW child, so it is always underneath every app window and a
      # desktop screenshot can only ever show whatever slice is not covered.
      # PrintWindow with PW_RENDERFULLCONTENT renders a window's own content even
      # when it is fully obscured, which is the only way to photograph the
      # particle field on a machine that also has the app open.
      - name: Photograph the live wallpaper itself
        continue-on-error: true
        run: |
          Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;using System.Text;public class P{public delegate bool Cb(IntPtr h,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumWindows(Cb c,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumChildWindows(IntPtr p,Cb c,IntPtr l);[DllImport("user32.dll",CharSet=CharSet.Unicode)]public static extern int GetWindowTextW(IntPtr h,StringBuilder s,int n);[DllImport("user32.dll")]public static extern bool GetWindowRect(IntPtr h,out R r);[DllImport("user32.dll")]public static extern bool PrintWindow(IntPtr h,IntPtr dc,uint f);public struct R{public int L,T,Rr,B;}}'
          Add-Type -AssemblyName System.Drawing
          $target = [IntPtr]::Zero
          $scan = [P+Cb]{ param($h,$l)
            $sb = New-Object System.Text.StringBuilder 256
            [void][P]::GetWindowTextW($h, $sb, 256)
            if ($sb.ToString() -eq 'Terse Wallpaper') { $script:target = $h; return $false }
            [void][P]::EnumChildWindows($h, $scan, [IntPtr]::Zero)
            return $true }
          [void][P]::EnumWindows($scan, [IntPtr]::Zero)
          if ($target -eq [IntPtr]::Zero) { Write-Host 'WALLPAPER WINDOW NOT FOUND'; exit 0 }
          $r = New-Object P+R
          [void][P]::GetWindowRect($target, [ref]$r)
          $w = $r.Rr - $r.L; $h2 = $r.B - $r.T
          Write-Host "wallpaper window found: ${w}x${h2} at $($r.L),$($r.T)"
          if ($w -le 0 -or $h2 -le 0) { Write-Host 'zero-sized - not drawing'; exit 0 }
          $bmp = New-Object System.Drawing.Bitmap $w, $h2
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $hdc = $g.GetHdc()
          $ok = [P]::PrintWindow($target, $hdc, 2)   # PW_RENDERFULLCONTENT
          $g.ReleaseHdc($hdc)
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bmp.Save("artifacts/wallpaper-window.png")
          Write-Host "PrintWindow ok=$ok -> artifacts/wallpaper-window.png"
          $g.Dispose(); $bmp.Dispose()

          # ── Burst, to catch the particle glyphs ────────────────────────────
          # The stat text (the numbers and agent lines that particles gather
          # into) is on a 12s rotation with a 2.22s envelope - G_IN 420 +
          # G_HOLD 1100 + G_OUT 700 in mineradio-wallpaper.js. So ONE frame has
          # roughly an 18% chance of landing on a glyph, and a frame without one
          # proves nothing at all. 20 frames at 1.2s spacing covers two full
          # rotations, so at least one glyph must appear if the pipeline works.
          Write-Host "burst: 20 frames over 24s to catch the glyph rotation"
          for ($i = 1; $i -le 20; $i++) {
            Start-Sleep -Milliseconds 1200
            try {
              $b = New-Object System.Drawing.Bitmap $w, $h2
              $gg = [System.Drawing.Graphics]::FromImage($b)
              $dc = $gg.GetHdc()
              [void][P]::PrintWindow($target, $dc, 2)
              $gg.ReleaseHdc($dc)
              $b.Save(("artifacts/wallpaper-frame-{0:D2}.png" -f $i))
              $gg.Dispose(); $b.Dispose()
            } catch { Write-Host "frame $i failed: $_" }
          }
          Write-Host "burst done"

      # The ghost titlebar is intermittent - two runs of IDENTICAL app code
      # disagreed about whether the island had one. So a single frame is a coin
      # flip here too, exactly as it was for the wallpaper glyphs. Burst the
      # island and Doctor, and crop the top-left corner where the ghost paints,
      # so the sequence shows whether the flush erases it and WHEN.
      - name: Burst the island and Doctor corners
        continue-on-error: true
        run: |
          Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;using System.Text;public class Q{public delegate bool Cb(IntPtr h,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumWindows(Cb c,IntPtr l);[DllImport("user32.dll",CharSet=CharSet.Unicode)]public static extern int GetWindowTextW(IntPtr h,StringBuilder s,int n);[DllImport("user32.dll")]public static extern bool GetWindowRect(IntPtr h,out R r);[DllImport("user32.dll")]public static extern bool PrintWindow(IntPtr h,IntPtr dc,uint f);[DllImport("user32.dll")]public static extern bool IsWindowVisible(IntPtr h);public struct R{public int L,T,Rr,B;}}'
          Add-Type -AssemblyName System.Drawing
          $wins = @{}
          $scan = [Q+Cb]{ param($h,$l)
            if ([Q]::IsWindowVisible($h)) {
              $sb = New-Object System.Text.StringBuilder 256
              [void][Q]::GetWindowTextW($h, $sb, 256)
              $t = $sb.ToString()
              if ($t -eq 'Terse Island' -or $t -eq 'Terse Doctor' -or $t -eq 'Terse') {
                if (-not $wins.ContainsKey($t)) { $wins[$t] = $h }
              }
            }
            return $true }
          [void][Q]::EnumWindows($scan, [IntPtr]::Zero)
          Write-Host "windows to burst: $($wins.Keys -join ', ')"
          if ($wins.Count -eq 0) { Write-Host 'NONE FOUND'; exit 0 }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          foreach ($name in $wins.Keys) {
            $hw = $wins[$name]
            $safe = $name -replace '[^A-Za-z0-9]','_'
            for ($i = 1; $i -le 8; $i++) {
              try {
                $r = New-Object Q+R
                [void][Q]::GetWindowRect($hw, [ref]$r)
                $w = $r.Rr - $r.L; $h2 = $r.B - $r.T
                if ($w -le 0 -or $h2 -le 0) { break }
                $b = New-Object System.Drawing.Bitmap $w, $h2
                $gg = [System.Drawing.Graphics]::FromImage($b)
                $dc = $gg.GetHdc()
                [void][Q]::PrintWindow($hw, $dc, 2)
                $gg.ReleaseHdc($dc)
                # Crop the top-left corner, blown up 4x - that is the only place
                # the ghost caption paints, and full-window shots make it easy to
                # miss against dark content (it was called "cleared" on the
                # Doctor window once on exactly that basis).
                $cw = [Math]::Min(420, $w); $ch = [Math]::Min(46, $h2)
                $crop = New-Object System.Drawing.Bitmap ($cw*4), ($ch*4)
                $cg = [System.Drawing.Graphics]::FromImage($crop)
                $cg.InterpolationMode = 'NearestNeighbor'
                $cg.DrawImage($b, (New-Object System.Drawing.Rectangle 0,0,($cw*4),($ch*4)), (New-Object System.Drawing.Rectangle 0,0,$cw,$ch), 'Pixel')
                $crop.Save(("artifacts/ghost-{0}-{1:D2}.png" -f $safe, $i))
                $cg.Dispose(); $crop.Dispose(); $gg.Dispose(); $b.Dispose()
              } catch { Write-Host "$name frame $i failed: $_" }
              Start-Sleep -Milliseconds 900
            }
          }
          Write-Host "ghost burst done"

      - name: Collect the app's own logs
        continue-on-error: true
        run: |
          $log = Join-Path $env:USERPROFILE ".terse"
          if (Test-Path $log) {
            New-Item -ItemType Directory -Force -Path artifacts | Out-Null
            Copy-Item -Recurse -Force $log artifacts/dot-terse
            Get-ChildItem -Recurse artifacts/dot-terse | Select-Object FullName, Length
          } else { Write-Host "no ~/.terse yet" }

      - name: Upload the evidence
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-test
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 14
