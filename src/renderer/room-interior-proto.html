<div id="hud">

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { LANG_COLOR, LANG_FALLBACK } from './lang-colors.js';

/* ── sample data: one capsule dir, shaped exactly as `leaves` now ships it ── */
const DIR = {
  name: 'src', files: 214, bytes: 268000, lang: 'ts',
  langs: [['ts', 0.68], ['js', 0.22], ['css', 0.10]],
  kind: 'source', depth: 4, age_days: 1, churn: 63,
  kids: [['components', 61, 96000], ['hooks', 18, 21000], ['utils', 24, 30000], ['styles', 9, 12000]],
  leaves: [
    ['App.tsx', 9400, 'components'], ['Button.tsx', 3100, 'components'], ['Modal.tsx', 4200, 'components'],
    ['Sidebar.tsx', 5600, 'components'], ['Card.tsx', 2100, 'components'], ['Table.tsx', 3800, 'components'],
    ['useAuth.ts', 1800, 'hooks'], ['useRoom.ts', 2200, 'hooks'], ['useSync.ts', 1400, 'hooks'],
    ['format.ts', 900, 'utils'], ['debounce.ts', 400, 'utils'], ['api.ts', 3300, 'utils'], ['colors.ts', 700, 'utils'],
    ['theme.css', 2600, 'styles'], ['reset.css', 800, 'styles'],
    ['index.ts', 1200, ''], ['router.ts', 2800, ''], ['constants.ts', 600, ''],
  ],
};

const hex2rgb = (h) => { const n = parseInt(String(h).slice(1), 16); return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]; };
/* 语言色在这里是**光的颜色**,不是漆的颜色。GitHub 那套色是给白底的网页调的,
   直接拿来加色混合会灰掉 —— 拉饱和、提亮度之后才是同一个颜色在暗处的样子。 */
function asLight(rgb) {
  const mx = Math.max(rgb[0], rgb[1], rgb[2]) || 1;
  const k = 1 / mx;                                   // 先推到满亮度
  return rgb.map((v, i) => Math.min(1, v * k * 0.92 + (v / mx > 0.85 ? 0.08 : 0)));
}
const TINT  = asLight(hex2rgb(LANG_COLOR[DIR.lang] || LANG_FALLBACK));
const GOLD  = hex2rgb('#f6d98a');       // 富丽的那一半:暖金
const MINT  = hex2rgb('#6ee7b7');       // 产品色
const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

/* 确定性随机 —— 同一个项目每次必须长成同一座厅堂,和 city-styles 同一条规矩。 */
let _s = 1;
const srand = () => { _s = (Math.imul(_s, 1664525) + 1013904223) >>> 0; return _s / 4294967296; };
const seed = (n) => { _s = (n >>> 0) || 1; };

/* ── layout: 同 mesh 版,矩形既是几何也是碰撞 ── */
const HALL_W = 18, HALL_D = 14, HALL_H = 6.2, ROOM_H = 3.6, DOOR_W = 2.4;
const hall = { x0: -HALL_W / 2, z0: -HALL_D / 2, x1: HALL_W / 2, z1: HALL_D / 2, name: DIR.name, files: DIR.files, h: HALL_H };
const rooms = [hall];
const doors = [];
const avg = DIR.bytes / Math.max(1, DIR.kids.length);

DIR.kids.forEach((k, i) => {
  const [name, files, bytes] = k;
  const share = Math.max(0.55, Math.min(1.5, bytes / avg));
  const w = 5.0 + share * 2.6, d = 4.4 + share * 2.2;
  const side = ['N', 'E', 'S', 'W'][i % 4];
  let rect;
  if (side === 'N')      rect = { x0: -w / 2, z0: hall.z0 - d, x1: w / 2, z1: hall.z0 };
  else if (side === 'S') rect = { x0: -w / 2, z0: hall.z1, x1: w / 2, z1: hall.z1 + d };
  else if (side === 'E') rect = { x0: hall.x1, z0: -d / 2, x1: hall.x1 + w, z1: d / 2 };
  else                   rect = { x0: hall.x0 - w, z0: -d / 2, x1: hall.x0, z1: d / 2 };
  rect.name = name; rect.files = files; rect.side = side; rect.h = ROOM_H; rect.bytes = bytes;
  rooms.push(rect);
  if (side === 'N' || side === 'S') {
    const z = side === 'N' ? hall.z0 : hall.z1;
    doors.push({ x0: -DOOR_W / 2, z0: z - 0.8, x1: DOOR_W / 2, z1: z + 0.8, side, room: name, cx: 0, cz: z });
  } else {
    const x = side === 'E' ? hall.x1 : hall.x0;
    doors.push({ x0: x - 0.8, z0: -DOOR_W / 2, x1: x + 0.8, z1: DOOR_W / 2, side, room: name, cx: x, cz: 0 });
  }
});

const PAD = 0.4;
function walkable(x, z) {
  for (const r of rooms) if (x > r.x0 + PAD && x < r.x1 - PAD && z > r.z0 + PAD && z < r.z1 - PAD) return true;
  for (const d of doors) if (x > d.x0 && x < d.x1 && z > d.z0 && z < d.z1) return true;
  return false;
}
const roomNamed = (n) => rooms.find((r) => r.name === n) || hall;

/* ── 粒子缓冲 ───────────────────────────────────────────────────────────────
   一切都是点。墙、地、穹顶、柱子、吊灯、文件 —— 同一个缓冲、同一支着色器,
   加色混合 + bloom。外面那座城市就是这么画的,走进来不该换一种材质语言。 */
const MAX = 260000;
const pos = new Float32Array(MAX * 3), col = new Float32Array(MAX * 3);
const siz = new Float32Array(MAX), pha = new Float32Array(MAX), twk = new Float32Array(MAX);
let N = 0;
function emit(x, y, z, c, size, twinkle) {
  if (N >= MAX) return;
  const i = N++;
  pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
  col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2];
  siz[i] = size; pha[i] = srand(); twk[i] = twinkle === undefined ? 0.5 : twinkle;
}

/** 地面:玫瑰窗式的辐射纹样,中心亮、外圈暗。厅堂的地一定要有花纹,不然就是块板。 */
function floorRosette(r, tint, n, petals) {
  const cx = (r.x0 + r.x1) / 2, cz = (r.z0 + r.z1) / 2;
  const R = Math.min(r.x1 - r.x0, r.z1 - r.z0) / 2;
  for (let i = 0; i < n; i++) {
    const a = srand() * Math.PI * 2;
    const t = Math.sqrt(srand());
    const rad = t * R * 1.18;
    const x = cx + Math.cos(a) * rad, z = cz + Math.sin(a) * rad;
    if (x < r.x0 + 0.1 || x > r.x1 - 0.1 || z < r.z0 + 0.1 || z > r.z1 - 0.1) continue;
    // 花瓣:沿角度的驻波,配上同心环 —— 两者相乘就是石材拼花的样子
    const rose = Math.abs(Math.cos(a * petals)) * 0.5 + 0.5;
    const ring = Math.abs(Math.sin(rad * 2.6)) * 0.45 + 0.55;
    const k = rose * ring;
    if (srand() > k * 0.85 + 0.12) continue;
    const c = lerp3(lerp3(tint, GOLD, k * 0.55), [0.03, 0.04, 0.07], 1 - k * 0.8);
    emit(x, 0.01 + srand() * 0.015, z, c, 0.5 + k * 0.85, 0.25);
  }
}

/** 墙:竖向的光帘 + 顶上一条檐口。密度往上衰减,墙就有了"高"的感觉。 */
function wallCurtain(x0, z0, x1, z1, h, tint, n, gap) {
  const horiz = Math.abs(x1 - x0) > Math.abs(z1 - z0);
  const len = horiz ? Math.abs(x1 - x0) : Math.abs(z1 - z0);
  for (let i = 0; i < n; i++) {
    const t = srand();
    const u = t * len;
    const px = horiz ? Math.min(x0, x1) + u : x0;
    const pz = horiz ? z0 : Math.min(z0, z1) + u;
    if (gap && px > gap.x0 && px < gap.x1 && pz > gap.z0 && pz < gap.z1) continue;
    const yt = Math.pow(srand(), 1.5);
    const y = yt * h;
    // 壁柱:每隔一段一根竖棱,亮一些 —— 柱列是"富丽"最省的一笔
    const flute = Math.pow(Math.abs(Math.cos(u * 1.15)), 8);
    const near = 1 - yt;
    if (srand() > 0.20 + flute * 0.75 + near * 0.28) continue;
    const c = lerp3(lerp3([0.10, 0.13, 0.20], tint, 0.5 + near * 0.35), GOLD, flute * 0.5);
    emit(px + (horiz ? 0 : (srand() - 0.5) * 0.12), y, pz + (horiz ? (srand() - 0.5) * 0.12 : 0),
         c, 0.8 + flute * 1.6, 0.4);
    // 檐口
    if (srand() < 0.05) emit(px, h - 0.06 + srand() * 0.12, pz, GOLD, 1.5, 0.7);
  }
}

/** 穹顶:大厅头顶的半球,肋骨 + 顶心的一点光。 */
function dome(cx, cz, R, y0, hgt, tint, n, ribs) {
  for (let i = 0; i < n; i++) {
    const a = srand() * Math.PI * 2;
    const p = Math.pow(srand(), 0.72);
    const phi = p * Math.PI / 2;
    const rad = Math.cos(phi) * R, y = y0 + Math.sin(phi) * hgt;
    const rib = Math.pow(Math.abs(Math.cos(a * ribs / 2)), 10);
    if (srand() > 0.16 + rib * 0.8 + Math.sin(phi) * 0.3) continue;
    const c = lerp3(lerp3(tint, [0.16, 0.20, 0.32], 0.42), GOLD, rib * 0.7 + Math.sin(phi) * 0.28);
    emit(cx + Math.cos(a) * rad, y, cz + Math.sin(a) * rad, c, 0.9 + rib * 1.9, 0.55);
  }
  for (let i = 0; i < 260; i++) {   // 顶心的采光
    const a = srand() * Math.PI * 2, rad = srand() * 0.5;
    emit(cx + Math.cos(a) * rad, y0 + hgt - 0.05, cz + Math.sin(a) * rad, GOLD, 2.2, 0.9);
  }
}

/** 柱子:柱础 + 凹槽柱身 + 柱头。厅里的列柱。 */
function column(x, z, h, tint, n) {
  const R = 0.30;
  for (let i = 0; i < n; i++) {
    const yt = srand(), y = yt * h;
    const a = srand() * Math.PI * 2;
    const flute = 0.5 + 0.5 * Math.cos(a * 12);
    let rad = R * (0.92 + flute * 0.10);
    let c = lerp3([0.14, 0.17, 0.24], tint, 0.35 + flute * 0.3);
    if (yt > 0.93) { rad = R * (1.5 + (yt - 0.93) * 4); c = GOLD; }         // 柱头
    else if (yt < 0.05) { rad = R * (1.45 - yt * 4); c = lerp3(GOLD, tint, 0.5); }  // 柱础
    emit(x + Math.cos(a) * rad, y, z + Math.sin(a) * rad, c, 1.0 + (yt > 0.93 ? 1.4 : flute * 0.9), 0.35);
  }
}

/** 吊灯:一圈圈悬垂的光珠,慢慢转。厅堂的中心。 */
function chandelier(cx, cy, cz, n, tint) {
  const tiers = 4;
  for (let i = 0; i < n; i++) {
    const tier = Math.floor(srand() * tiers);
    const tt = tier / (tiers - 1);
    const R = 0.5 + (1 - tt) * 1.55;
    const y = cy - tt * 1.5 - srand() * 0.12;
    const a = srand() * Math.PI * 2;
    const beadRing = Math.pow(Math.abs(Math.sin(a * 14)), 6);
    if (srand() > 0.22 + beadRing * 0.8) continue;
    const c = lerp3(GOLD, lerp3(tint, [1, 1, 1], 0.4), srand() * 0.5);
    emit(cx + Math.cos(a) * R, y, cz + Math.sin(a) * R, c, 1.3 + beadRing * 2.2, 1.0);
  }
  for (let i = 0; i < 220; i++) {                 // 垂下的链
    const y = cy + srand() * 1.4;
    emit(cx + (srand() - 0.5) * 0.06, y, cz + (srand() - 0.5) * 0.06, GOLD, 1.2, 0.8);
  }
}

/** 拱门:门洞上的半圆券 + 券脚。 */
function arch(d, h, tint, n) {
  const horiz = d.side === 'N' || d.side === 'S';
  const half = DOOR_W / 2, top = h * 0.62;
  for (let i = 0; i < n; i++) {
    const t = srand() * Math.PI;
    const jitter = (srand() - 0.5) * 0.09;
    const u = Math.cos(t) * half, y = Math.sin(t) * (top - 1.5) + 1.5 + jitter;
    const c = lerp3(GOLD, tint, srand() * 0.45);
    emit(d.cx + (horiz ? u : jitter), y, d.cz + (horiz ? jitter : u), c, 1.1 + srand() * 1.2, 0.6);
  }
  for (let i = 0; i < n / 3; i++) {                // 券脚两侧的竖线
    const s = srand() < 0.5 ? -1 : 1, y = srand() * 1.5;
    const c = lerp3(GOLD, tint, 0.5);
    emit(d.cx + (horiz ? s * half : 0), y, d.cz + (horiz ? 0 : s * half), c, 1.0, 0.5);
  }
}

/** 一个文件:一根发光的光柱 + 绕着它的粒子环。高度就是字节数。 */
function filePillar(x, z, h, tint, n) {
  const R = 0.17;
  for (let i = 0; i < n; i++) {
    const u = srand();
    if (u < 0.62) {                                 // 柱身
      const y = srand() * h, a = srand() * Math.PI * 2;
      const c = lerp3(tint, [1, 1, 1], Math.pow(y / h, 2) * 0.55);
      emit(x + Math.cos(a) * R * (0.7 + srand() * 0.4), y, z + Math.sin(a) * R * (0.7 + srand() * 0.4), c, 1.0 + (y / h) * 1.1, 0.5);
    } else if (u < 0.86) {                          // 环
      const ring = Math.floor(srand() * 3);
      const y = h * (0.35 + ring * 0.26);
      const a = srand() * Math.PI * 2, rr = 0.34 + ring * 0.05;
      emit(x + Math.cos(a) * rr, y + (srand() - 0.5) * 0.03, z + Math.sin(a) * rr, lerp3(tint, GOLD, 0.45), 1.2, 0.9);
    } else {                                        // 顶冠
      const a = srand() * Math.PI * 2, rr = srand() * 0.2;
      emit(x + Math.cos(a) * rr, h + srand() * 0.3, z + Math.sin(a) * rr, lerp3(tint, [1, 1, 1], 0.6), 1.6, 1.0);
    }
  }
  for (let i = 0; i < n / 5; i++) {                 // 基座
    const a = srand() * Math.PI * 2, rr = 0.25 + srand() * 0.22;
    emit(x + Math.cos(a) * rr, 0.01 + srand() * 0.04, z + Math.sin(a) * rr, lerp3(GOLD, tint, 0.4), 1.1, 0.35);
  }
}

/* ── 盖起来 ── */
seed(0x7e45e);
const props = [];   // { x, z, h, name, bytes, dir } —— 点选和标签用

// 大厅
floorRosette(hall, TINT, 34000, 8);
dome(0, 0, HALL_W * 0.46, HALL_H * 0.52, HALL_H * 0.62, TINT, 30000, 16);
chandelier(0, HALL_H * 0.60, 0, 9000, TINT);
{
  const gapsOf = (sd) => doors.find((d) => d.side === sd);
  wallCurtain(hall.x0, hall.z0, hall.x1, hall.z0, HALL_H, TINT, 9000, gapsOf('N'));
  wallCurtain(hall.x0, hall.z1, hall.x1, hall.z1, HALL_H, TINT, 9000, gapsOf('S'));
  wallCurtain(hall.x0, hall.z0, hall.x0, hall.z1, HALL_H, TINT, 8000, gapsOf('W'));
  wallCurtain(hall.x1, hall.z0, hall.x1, hall.z1, HALL_H, TINT, 8000, gapsOf('E'));
}
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  column(sx * (HALL_W / 2 - 2.0), sz * (HALL_D / 2 - 1.9), HALL_H * 0.66, TINT, 3200);
  column(sx * (HALL_W / 2 - 5.6), sz * (HALL_D / 2 - 1.9), HALL_H * 0.66, TINT, 3200);
}
for (const d of doors) arch(d, HALL_H, TINT, 2600);

// 子房间
for (const k of DIR.kids) {
  const r = roomNamed(k[0]);
  const t = lerp3(TINT, GOLD, 0.18);
  floorRosette(r, t, 9000, 6);
  wallCurtain(r.x0, r.z0, r.x1, r.z0, ROOM_H, t, 3400, doors.find((d) => d.room === r.name && d.side === 'S'));
  wallCurtain(r.x0, r.z1, r.x1, r.z1, ROOM_H, t, 3400, doors.find((d) => d.room === r.name && d.side === 'N'));
  wallCurtain(r.x0, r.z0, r.x0, r.z1, ROOM_H, t, 3200, doors.find((d) => d.room === r.name && d.side === 'E'));
  wallCurtain(r.x1, r.z0, r.x1, r.z1, ROOM_H, t, 3200, doors.find((d) => d.room === r.name && d.side === 'W'));
  dome((r.x0 + r.x1) / 2, (r.z0 + r.z1) / 2, Math.min(r.x1 - r.x0, r.z1 - r.z0) * 0.44, ROOM_H * 0.72, ROOM_H * 0.34, t, 5200, 10);
  chandelier((r.x0 + r.x1) / 2, ROOM_H * 0.78, (r.z0 + r.z1) / 2, 2200, t);
}

// 文件
{
  const byRoom = new Map();
  for (const leaf of DIR.leaves) {
    const k = leaf[2] || '';
    if (!byRoom.has(k)) byRoom.set(k, []);
    byRoom.get(k).push(leaf);
  }
  for (const [k, files] of byRoom) {
    const r = k ? roomNamed(k) : hall;
    const cols = Math.ceil(Math.sqrt(files.length)), rowsN = Math.ceil(files.length / cols);
    const m = k ? 1.6 : 3.0;
    files.forEach((f, i) => {
      const [name, bytes] = f;
      const h = Math.min(2.6, 0.55 + Math.log2(1 + bytes / 350) * 0.24);
      const c0 = i % cols, r0 = Math.floor(i / cols);
      const x = cols === 1 ? (r.x0 + r.x1) / 2 : r.x0 + m + c0 * (r.x1 - r.x0 - m * 2) / (cols - 1);
      const z = rowsN === 1 ? (r.z0 + r.z1) / 2 : r.z0 + m + r0 * (r.z1 - r.z0 - m * 2) / (rowsN - 1);
      filePillar(x, z, h, TINT, 2400);
      props.push({ x, z, h, name, bytes, dir: k || DIR.name });
    });
  }
}

/* ── 渲染 ── */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030407);
scene.fog = new THREE.FogExp2(0x030407, 0.021);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 220);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(1.75, devicePixelRatio));
document.body.appendChild(renderer.domElement);

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos.subarray(0, N * 3), 3));
geo.setAttribute('aColor',   new THREE.BufferAttribute(col.subarray(0, N * 3), 3));
geo.setAttribute('aSize',    new THREE.BufferAttribute(siz.subarray(0, N), 1));
geo.setAttribute('aPhase',   new THREE.BufferAttribute(pha.subarray(0, N), 1));
geo.setAttribute('aTwk',     new THREE.BufferAttribute(twk.subarray(0, N), 1));

const mat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uPixel: { value: 1 }, uFog: { value: scene.fog.density } },
  vertexShader: `
    precision highp float;
    attribute vec3 aColor; attribute float aSize; attribute float aPhase; attribute float aTwk;
    uniform float uTime, uPixel;
    varying vec3 vColor; varying float vA; varying float vFog;
    void main(){
      vec3 p = position;
      // 呼吸。厅堂不能是死的 —— 一点极慢的起伏就让整片粒子活过来。
      p.y += sin(uTime * 0.55 + aPhase * 6.2831) * 0.022 * (0.4 + aTwk);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float d = -mv.z;
      // 透视衰减:远处的点自然变小变淡,这是"深"的来源
      // ⚠ 分母的下限不能太小,否则脚边的点被放得巨大,地面看起来像一地泡沫
      gl_PointSize = aSize * uPixel * 12.0 / max(1.7, d);
      // 闪烁只给该闪的东西(吊灯、顶冠),石头不闪
      float tw = 0.72 + 0.28 * sin(uTime * 1.7 + aPhase * 19.0);
      vA = mix(1.0, tw, aTwk);
      vFog = exp(-d * d * ${(0.021 * 0.021).toFixed(8)});
      vColor = aColor;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    precision highp float;
    varying vec3 vColor; varying float vA; varying float vFog;
    void main(){
      vec2 d = gl_PointCoord - vec2(0.5);
      float r2 = dot(d, d);
      if (r2 > 0.25) discard;
      /* 软光晕:中心实、外缘指数衰减 —— 加色叠起来就是那层"贵气"的辉光。
         ⚠ 系数要小。加色混合下几万颗点一叠就冲到 1.0,颜色全烧成白的 ——
         第一版的厅堂正是这么没的:金是白的,语言色也是白的。 */
      float a = exp(-r2 * 11.0) * 0.46;
      gl_FragColor = vec4(vColor * a * vA * vFog, 1.0);
    }`,
  transparent: true, depthWrite: false, depthTest: true, blending: THREE.AdditiveBlending,
});
const points = new THREE.Points(geo, mat);
points.frustumCulled = false;
scene.add(points);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// strength / radius / threshold。阈值低了每一颗点都参与开花,厅堂就糊成一团白。
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.70, 0.42);
composer.addPass(bloom);

/* ── controls ── */
let yaw = 0, pitch = -0.02, px = 0, pz = HALL_D / 2 - 2.4;
let dragging = false, lastX = 0, lastY = 0, downX = 0, downY = 0;
const keys = new Set(); const move = { x: 0, z: 0 };

renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true; lastX = downX = e.clientX; lastY = downY = e.clientY;
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch (err) {}
});
const endDrag = () => { dragging = false; };
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
window.addEventListener('blur', endDrag);
window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  yaw -= (e.clientX - lastX) * 0.0035;
  pitch = Math.max(-1.1, Math.min(1.1, pitch - (e.clientY - lastY) * 0.0035));
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('keydown', (e) => keys.add(e.key.toLowerCase()));
window.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));

if ('ontouchstart' in window) {
  document.body.classList.add('touch');
  const joy = document.getElementById('joy'), stick = document.getElementById('joyStick');
  let id = null;
  joy.addEventListener('touchstart', (e) => { id = e.changedTouches[0].identifier; e.preventDefault(); }, { passive: false });
  joy.addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier !== id) continue;
      const b = joy.getBoundingClientRect();
      const jx = Math.max(-1, Math.min(1, (t.clientX - (b.left + b.width / 2)) / (b.width / 2)));
      const jy = Math.max(-1, Math.min(1, (t.clientY - (b.top + b.height / 2)) / (b.height / 2)));
      stick.style.left = 35 + jx * 25 + 'px'; stick.style.top = 35 + jy * 25 + 'px';
      move.x = jx; move.z = jy; e.preventDefault();
    }
  }, { passive: false });
  const off = (e) => { for (const t of e.changedTouches) if (t.identifier === id) { id = null; move.x = move.z = 0; stick.style.left = stick.style.top = '35px'; } };
  joy.addEventListener('touchend', off); joy.addEventListener('touchcancel', off);
}

renderer.domElement.addEventListener('click', (e) => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 5) return;
  // 光柱没有网格可以打射线,就按屏幕距离挑最近的那一根
  let best = null, bd = 60;
  for (const p of props) {
    const v = new THREE.Vector3(p.x, p.h * 0.6, p.z).project(camera);
    if (v.z > 1) continue;
    const sx = (v.x * 0.5 + 0.5) * innerWidth, sy = (-v.y * 0.5 + 0.5) * innerHeight;
    const d = Math.hypot(sx - e.clientX, sy - e.clientY);
    if (d < bd) { bd = d; best = p; }
  }
  if (best) document.getElementById('hint').textContent = best.dir + '/' + best.name + ' — ' + best.bytes.toLocaleString() + ' bytes';
});

const labels = [];
const labelAt = (i) => {
  while (labels.length <= i) { const el = document.createElement('div'); el.className = 'label'; el.style.display = 'none'; document.body.appendChild(el); labels.push(el); }
  return labels[i];
};

const nameEl = document.getElementById('roomName'), statEl = document.getElementById('roomStats');
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();

function frame() { frame1(); requestAnimationFrame(frame); }
function frame1() {
  const dt = Math.min(0.05, clock.getDelta());
  mat.uniforms.uTime.value += dt;
  mat.uniforms.uPixel.value = renderer.getPixelRatio() * (innerHeight / 800);

  const kf = (keys.has('w') || keys.has('arrowup') ? 1 : 0) - (keys.has('s') || keys.has('arrowdown') ? 1 : 0);
  const kr = (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0);
  const fwd = kf - move.z, strafe = kr + move.x;
  if (fwd || strafe) {
    const s = 3.6 * dt, sin = Math.sin(yaw), cos = Math.cos(yaw);
    const dx = (-sin * fwd + cos * strafe) * s, dz = (-cos * fwd - sin * strafe) * s;
    if (walkable(px + dx, pz)) px += dx;
    if (walkable(px, pz + dz)) pz += dz;
  }
  camera.position.set(px, 1.62, pz);
  camera.rotation.set(0, 0, 0, 'YXZ');
  camera.rotation.y = yaw; camera.rotation.x = pitch;

  const here = rooms.find((r) => px > r.x0 && px < r.x1 && pz > r.z0 && pz < r.z1) || hall;
  nameEl.textContent = here === hall ? DIR.name + '/' : DIR.name + '/' + here.name + '/';
  statEl.textContent = here.files + ' files';

  let n = 0;
  for (const p of props) {
    tmp.set(p.x, p.h + 0.55, p.z);
    const dist = camera.position.distanceTo(new THREE.Vector3(p.x, 1.6, p.z));
    tmp.project(camera);
    const el = labelAt(n++);
    const sx = (tmp.x * 0.5 + 0.5) * innerWidth, sy = (-tmp.y * 0.5 + 0.5) * innerHeight;
    if (tmp.z > 1 || dist > 16 || sx < -60 || sx > innerWidth + 60 || sy < 0 || sy > innerHeight) { el.style.display = 'none'; continue; }
    el.style.display = 'block';
    el.style.left = sx + 'px'; el.style.top = sy + 'px';
    el.style.opacity = String(Math.max(0.2, 1 - dist / 16));
    el.textContent = p.name;
  }

  composer.render();
}
requestAnimationFrame(frame);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

window.__room = {
  at: (x, z, y, p) => { px = x; pz = z; if (y != null) yaw = y; if (p != null) pitch = p; },
  where: () => ({ x: +px.toFixed(2), z: +pz.toFixed(2), yaw: +yaw.toFixed(2), room: (rooms.find((r) => px > r.x0 && px < r.x1 && pz > r.z0 && pz < r.z1) || hall).name }),
  step: (dt, fwd, strafe) => {
    const s = 3.6 * dt, sin = Math.sin(yaw), cos = Math.cos(yaw);
    const dx = (-sin * fwd + cos * strafe) * s, dz = (-cos * fwd - sin * strafe) * s;
    if (walkable(px + dx, pz)) px += dx;
    if (walkable(px, pz + dz)) pz += dz;
  },
  renderNow: () => { frame1(); },
  particles: () => N, bloom, walkable, rooms, doors, props, camera,
};
</script>
</body>
</html>
