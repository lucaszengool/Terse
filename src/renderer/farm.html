<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Terse Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Chewy',cursive,sans-serif;background:#000}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══ LAYOUT ═══════════════════════════════════════════════════════════════ */
#app{
  position:relative;width:100%;height:100%;overflow:hidden;
  background:url(farm-bg.jpg) no-repeat center center / contain;
  background-color:#87CEEB;
}

/* ═══ LEFT PANEL — seed selection, transparent, blends with background ══════ */
#seed-tray{
  position:absolute;left:0;top:0;bottom:0;width:116px;
  z-index:20;
  background:rgba(0,0,0,0);
  border:none;box-shadow:none;
  display:flex;flex-direction:column;align-items:center;
  padding:8px 6px 8px;gap:5px;
  overflow:hidden;
  pointer-events:none; /* pass clicks through transparent areas to tiles */
}
#seed-tray > * { pointer-events:auto; }

/* Sun/coin counter — minimal glass pill */
#coin-hud{
  flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:5px;
  background:rgba(255,220,40,0.10);
  border:1px solid rgba(255,210,60,0.30);border-radius:14px;
  padding:4px 10px 4px 6px;width:100%;
  box-shadow:0 1px 8px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,240,120,.12);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
#sun-icon{
  width:24px;height:24px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 38% 32%,#FFFAC0,#FFE020 55%,#E89808);
  box-shadow:0 0 8px rgba(255,200,20,.7);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;color:#5A2800;
}
#coin-val{
  font-size:15px;color:#FFE840;letter-spacing:.3px;min-width:18px;
  text-shadow:0 1px 4px rgba(0,0,0,.8);font-weight:700;
}

/* Seed packet vertical scroll column */
#packet-rail{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  overflow-y:auto;overflow-x:hidden;
  padding:2px 0;scrollbar-width:none;width:100%;
}
#packet-rail::-webkit-scrollbar{display:none}

/* ── Farm Seed Packet — icon-only, no card ── */
.seed-pkt{
  flex-shrink:0;width:68px;cursor:pointer;
  border-radius:10px;position:relative;
  border:none;background:transparent;padding:0 0 20px;
  transition:transform .14s,filter .14s;
}
.seed-pkt:hover{transform:translateY(-5px) scale(1.12);filter:drop-shadow(0 4px 10px rgba(0,0,0,.8));}
.seed-pkt.pkt-selected{
  transform:translateY(-8px) scale(1.16);
  filter:drop-shadow(0 0 10px #FFE020) drop-shadow(0 4px 14px rgba(255,200,0,.9));
  animation:pktPulse .7s ease-in-out infinite alternate;
}
@keyframes pktPulse{to{filter:drop-shadow(0 0 14px #FFE040) drop-shadow(0 6px 18px rgba(255,220,0,.95));}}
.seed-pkt.pkt-poor{filter:grayscale(.7) brightness(.45) opacity(.7);}

/* Farm plant icon — transparent, fills icon area */
.pkt-card-img{
  display:block;width:100%;height:60px;object-fit:contain;padding:2px;
  background:transparent;
}
/* Cost floating label — no card strip */
.pkt-cost{
  position:absolute;bottom:0;left:0;right:0;height:20px;
  background:transparent;
  display:flex;align-items:center;justify-content:center;gap:3px;
  font-size:10px;color:#FFE870;font-weight:700;
  text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.7);
}
.cost-sun{
  width:12px;height:12px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 35% 35%,#FFF8C0,#FFE020 50%,#F0A000);
  box-shadow:0 0 4px #FFD010;
}
/* Fallback art if no card image */
.pkt-art-fallback{
  width:100%;height:60px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#C89050,#A07030);
}

/* ── Harvest coins HUD — minimal glass pill ── */
#harvest-hud{
  flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:5px;
  background:rgba(60,200,60,0.10);
  border:1px solid rgba(80,220,80,0.28);border-radius:14px;
  padding:4px 10px 4px 6px;width:100%;
  box-shadow:0 1px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(120,255,80,.1);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  margin-top:-2px;
}
#harvest-icon{
  width:20px;height:20px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 35% 35%,#E8FFC0,#70D020 55%,#408010);
  box-shadow:0 0 6px rgba(80,200,20,.6);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;
}
#harvest-val{
  font-size:14px;color:#90FF50;letter-spacing:.3px;min-width:16px;
  text-shadow:0 1px 4px rgba(0,0,0,.8);font-weight:700;
}


/* ── Level / XP bar ── */
#level-hud{
  flex-shrink:0;width:100%;
  background:rgba(0,0,0,0.50);
  border:2px solid rgba(120,80,200,0.55);border-radius:10px;
  padding:4px 7px;
  box-shadow:0 2px 8px rgba(0,0,0,.5);
}
#level-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;}
#level-lbl{font-size:13px;color:#C8A0FF;text-shadow:0 1px 3px rgba(0,0,0,.9);}
#level-xp-lbl{font-size:9px;color:#9080C0;text-shadow:0 1px 3px rgba(0,0,0,.9);}
#level-bar-wrap{
  width:100%;height:6px;background:rgba(0,0,0,.35);border-radius:3px;overflow:hidden;
}
#level-bar{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,#8040FF,#C080FF);
  transition:width .6s ease;
  box-shadow:0 0 6px rgba(180,80,255,.6);
}

/* locked seed packet — full art, no dimming, lock badge only */
.seed-pkt.pkt-locked { cursor:default; }
.seed-pkt.pkt-locked:hover { transform:none !important; filter:none !important; }
.pkt-lock-badge {
  display:none;
  position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  background:rgba(30,10,0,.82);border-radius:8px;padding:1px 7px 1px 5px;
  font-size:9px;color:#FFD080;pointer-events:none;white-space:nowrap;
  border:1px solid rgba(200,120,0,.55);
  box-shadow:0 1px 4px rgba(0,0,0,.6);
}
.seed-pkt.pkt-locked .pkt-lock-badge { display:block; }
.seed-pkt.pkt-locked .pkt-cost { display:none; }

/* Sky scene hidden — background image covers everything */
#sky-scene{display:none}
#sky-scene svg.bg-deco{position:absolute;}

/* ═══ WEATHER LAYER ══════════════════════════════════════════════════════════ */
#weather-layer{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.rain-drop{
  position:absolute;width:1.5px;border-radius:2px;
  background:linear-gradient(180deg,rgba(180,220,255,0),rgba(180,220,255,.75));
  animation:rainFall linear infinite;
}
@keyframes rainFall{0%{transform:translateY(-30px) rotate(12deg)}100%{transform:translateY(120vh) rotate(12deg)}}
.wind-leaf{
  position:absolute;width:10px;height:14px;border-radius:60% 40% 40% 60%;
  background:radial-gradient(ellipse,#5BC020,#2A7818);opacity:.8;
  animation:windDrift linear forwards;
}
@keyframes windDrift{
  0%{transform:translate(0,0) rotate(0deg);opacity:.8}
  100%{transform:translate(var(--wx,200px),var(--wy,60px)) rotate(540deg);opacity:0}
}
.lightning-flash{position:absolute;inset:0;background:rgba(255,255,240,.32);animation:ltFlash .18s ease-out forwards}
@keyframes ltFlash{0%{opacity:1}100%{opacity:0}}
/* ── Weather tints ─────────────────────────────────────────────────────────── */
#app.weather-cloudy   #lawn-wrap{filter:brightness(.9) saturate(.78);transition:filter 2s}
#app.weather-cloudy   #sky-scene{filter:brightness(.84);transition:filter 2s}
#app.weather-rain     #lawn-wrap{filter:brightness(.82) saturate(.70);transition:filter 2s}
#app.weather-thunder  #lawn-wrap{filter:brightness(.65) saturate(.55);transition:filter 1s}
#app.weather-thunder  #sky-scene{filter:brightness(.55) hue-rotate(200deg);transition:filter 1s}
#app.weather-fog      #lawn-wrap{filter:brightness(.85) saturate(.45);transition:filter 3s}
#app.weather-fog      #sky-scene{filter:brightness(.78) saturate(.3);transition:filter 3s}
#app.weather-snow     #lawn-wrap{filter:brightness(1.10) saturate(.55);transition:filter 2.5s}
#app.weather-snow     #sky-scene{filter:brightness(1.05) saturate(.4);transition:filter 2.5s}
#app.weather-drizzle  #lawn-wrap{filter:brightness(.88) saturate(.78);transition:filter 2s}
#app.weather-heatwave #lawn-wrap{filter:brightness(1.12) saturate(1.25) sepia(.18);transition:filter 2s}
#app.weather-heatwave #sky-scene{filter:brightness(1.15) sepia(.25);transition:filter 2s}
#app.weather-sunset   #sky-scene{filter:brightness(1.0) sepia(.55) hue-rotate(-20deg);transition:filter 3s}
#app.weather-sunset   #lawn-wrap{filter:brightness(.98) sepia(.28) hue-rotate(-14deg);transition:filter 3s}
/* ── Weather effects on plants ─────────────────────────────────────────────── */
#app.weather-windy   .tile-plant{animation-duration:1.1s!important;animation-name:plantWindSway!important}
#app.weather-thunder .tile-plant{animation-duration:.9s!important;animation-name:plantWindSway!important;filter:brightness(.78) saturate(.7)!important}
@keyframes plantWindSway{
  0%  {transform:rotate(-6deg) translateY(1px)}
  40% {transform:rotate(5deg)  translateY(-4px)}
  70% {transform:rotate(-4deg) translateY(-1px)}
  100%{transform:rotate(-6deg) translateY(1px)}
}
#app.weather-rain    .tile-plant,#app.weather-drizzle .tile-plant{filter:brightness(.85) saturate(.8)!important}
#app.weather-snow    .tile-plant{filter:brightness(1.06) saturate(.65)!important}
#app.weather-heatwave .tile-plant{animation-duration:3s!important;filter:brightness(1.05) saturate(1.1)!important}
/* ── Weather particle classes ───────────────────────────────────────────────── */
.rain-splash{
  position:absolute;border-radius:50%;pointer-events:none;
  border:1.5px solid rgba(180,220,255,.55);
  animation:splashRipple .5s ease-out forwards;
}
@keyframes splashRipple{
  0%  {transform:scale(0);opacity:.8}
  100%{transform:scale(1);opacity:0}
}
.snow-flake{
  position:absolute;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.98),rgba(210,235,255,.7));
  border-radius:50%;
  animation:snowFall linear forwards;
}
@keyframes snowFall{
  0%  {transform:translateY(-20px) translateX(0) rotate(0deg);opacity:.9}
  50% {opacity:1}
  100%{transform:translateY(110vh) translateX(var(--sw,0px)) rotate(540deg);opacity:.3}
}
.fog-wisp{
  position:absolute;pointer-events:none;border-radius:50%;
  background:radial-gradient(ellipse,rgba(220,230,255,.28),transparent 70%);
  animation:fogDrift linear forwards;
}
@keyframes fogDrift{
  0%  {transform:translateX(-120px);opacity:0}
  15% {opacity:1}
  85% {opacity:.7}
  100%{transform:translateX(calc(100vw + 120px));opacity:0}
}
.heat-ripple{
  position:absolute;border-radius:50%;pointer-events:none;
  border:1px solid rgba(255,180,60,.22);
  animation:heatRise linear forwards;
}
@keyframes heatRise{
  0%  {transform:scaleX(1);opacity:.55}
  100%{transform:scaleX(3.5) translateY(-70px);opacity:0}
}
.sunset-glow{
  position:absolute;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle,rgba(255,140,40,.35),transparent 70%);
  animation:glowFloat linear forwards;
}
@keyframes glowFloat{
  0%  {transform:translateY(0) scale(.8);opacity:0}
  20% {opacity:.8}
  80% {opacity:.5}
  100%{transform:translateY(-80px) scale(1.6);opacity:0}
}
.cloud-puff{
  position:absolute;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle,rgba(220,225,240,.35),transparent 65%);
  animation:cloudDrift linear forwards;
}
@keyframes cloudDrift{
  0%  {transform:translateX(-80px);opacity:0}
  12% {opacity:.9}
  88% {opacity:.6}
  100%{transform:translateX(calc(100vw + 80px));opacity:0}
}
.lightning-flash{position:absolute;inset:0;background:rgba(220,240,255,.35);animation:ltFlash .18s ease-out forwards;pointer-events:none}
@keyframes ltFlash{0%{opacity:1}100%{opacity:0}}
.lightning-bolt{
  position:absolute;pointer-events:none;
  animation:boltFade .22s ease-out forwards;
}
@keyframes boltFade{0%{opacity:1}80%{opacity:.8}100%{opacity:0}}

/* ═══ TOOL CURSORS (CSS custom property updated by JS) ══════════════════════ */
.farm-tile{cursor:var(--tile-cursor,pointer)}

/* ═══ TOOL SUBLABEL (shows saved-token balance under fertilize) ══════════════ */
.tool-sublbl{
  font-size:8.5px;color:rgba(180,140,255,.85);letter-spacing:.2px;
  text-shadow:0 1px 2px rgba(0,0,0,.7);line-height:1;margin-top:-1px;
  transition:color .2s;
}
.fert-broke .tool-sublbl{color:rgba(255,100,100,.85)!important}

/* ═══ PEST BADGE — floating pill on right when pests/weeds exist ══════════════ */
#pest-badge{
  display:none;position:absolute;right:106px;top:50%;transform:translateY(-50%);
  z-index:30;cursor:pointer;
  background:linear-gradient(135deg,rgba(180,20,20,.92),rgba(120,8,8,.92));
  border:1.5px solid rgba(255,80,80,.6);border-radius:24px;
  padding:6px 12px 6px 8px;
  box-shadow:0 0 16px rgba(255,40,40,.5),0 3px 10px rgba(0,0,0,.5);
  color:#FFD0D0;font-size:12px;font-weight:800;font-family:inherit;
  animation:pestBadgePulse 1.2s ease-in-out infinite alternate;
  white-space:nowrap;
}
#pest-badge.visible{display:flex;align-items:center;gap:5px}
@keyframes pestBadgePulse{
  from{box-shadow:0 0 10px rgba(255,40,40,.4),0 2px 8px rgba(0,0,0,.4)}
  to  {box-shadow:0 0 22px rgba(255,60,60,.85),0 3px 14px rgba(0,0,0,.5)}
}

/* ═══ POOL TILE — aquatic plant styles ══════════════════════════════════════ */
.farm-tile.pool-tile{cursor:var(--tile-cursor,pointer)}
.farm-tile.pool-tile .tile-plant{
  animation:waterIdle 3s ease-in-out infinite alternate;
}
@keyframes waterIdle{
  0%  {transform:rotate(-2deg) translateY(1px)}
  100%{transform:rotate(2deg)  translateY(-2px)}
}
.farm-tile.pool-tile.pool-has-plant::after{
  content:'';position:absolute;bottom:0;left:10%;right:10%;height:6px;
  background:radial-gradient(ellipse,rgba(40,160,220,.35),transparent 70%);
  border-radius:50%;pointer-events:none;
}
/* Aquatic crop drag-over highlight */
.farm-tile.pool-tile.drag-over{outline:2px dashed rgba(80,200,255,.9);outline-offset:-2px;filter:brightness(1.2)}

/* ═══ LAWN AREA — full window, transparent, pointer-events delegated ═════════ */
#lawn-wrap{
  position:absolute;inset:0;overflow:visible;pointer-events:none;
}
#grass{display:none}
#fence{display:none}

/* Farm grid — positioned by JS alignGrid() to match background checkerboard.
   Three zones: upper grass (above pool), pool (middle, non-plantable), lower grass. */
.tile-zone{
  position:absolute;z-index:4;pointer-events:auto;
  display:grid;gap:0;background:transparent;
}
/* Tile dimensions controlled by JS via grid-template-columns / grid-auto-rows */
.farm-tile{
  width:100%;height:100%;cursor:pointer;
  position:relative;
  transition:filter .12s,background .15s;
  transform-style:preserve-3d;
}
.farm-tile:hover{
  filter:brightness(1.18) drop-shadow(0 0 10px rgba(255,240,100,.75));
  z-index:5;
  background:radial-gradient(circle,rgba(255,235,80,.28) 0%,transparent 68%);
}
.farm-tile:active{transform:scale(.96) translateZ(2px)}
.farm-tile.empty:hover{
  background:radial-gradient(circle,rgba(255,230,60,.32) 0%,transparent 62%);
}
/* Pool tiles — show a subtle wave shimmer on hover, fishing toast on click */
/* ═══ POOL FISH LAYER — fish swim across the whole pool row ════════════════ */
#pool-fish-layer{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3;
}
/* ── Pool fish (JS-animated) ─────────────────────────────────────────────── */
.swim-fish{ position:absolute;pointer-events:none;will-change:transform,opacity; }
.swim-fish svg{ display:block;overflow:visible; }
/* Tail wiggle — applied to the tail path inside each fish SVG */
.fish-tail{ transform-box:fill-box;transform-origin:0% 50%;animation:tailWag .55s ease-in-out infinite alternate; }
@keyframes tailWag{ from{transform:rotate(-11deg)} to{transform:rotate(11deg)} }
/* Dorsal fin flap */
.fish-dfin{ transform-box:fill-box;transform-origin:50% 100%;animation:dfinFlap .8s ease-in-out infinite alternate; }
@keyframes dfinFlap{ from{transform:skewX(-8deg)} to{transform:skewX(8deg)} }

/* ── Fishing prompt ─────────────────────────────────────────────────────── */
#fish-prompt-overlay{
  position:fixed;inset:0;z-index:4500;pointer-events:none;
  display:none;align-items:center;justify-content:center;
}
#fish-prompt-overlay.open{display:flex;pointer-events:auto}
#fish-prompt-card{
  background:linear-gradient(160deg,rgba(8,35,70,.97),rgba(4,20,50,.97));
  border:2.5px solid rgba(80,180,255,.55);border-radius:20px;
  padding:20px 26px 18px;text-align:center;
  box-shadow:0 8px 40px rgba(0,0,0,.9),0 0 0 1px rgba(80,180,255,.18);
  animation:hpopIn .22s ease;
}
#fish-prompt-go{
  padding:7px 20px;border-radius:16px;border:2px solid rgba(80,220,255,.6);
  background:linear-gradient(135deg,rgba(0,80,160,.9),rgba(0,50,110,.9));
  color:#80E8FF;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;
  transition:filter .12s;
}
#fish-prompt-go:hover{filter:brightness(1.2)}
#fish-prompt-no{
  padding:7px 16px;border-radius:16px;border:2px solid rgba(180,180,180,.28);
  background:rgba(40,40,60,.7);color:#AAA;font-size:12px;cursor:pointer;font-family:inherit;
  transition:filter .12s;
}

/* ═══ FISHING MINIGAME ══════════════════════════════════════════════════════ */
#fishing-overlay{
  position:fixed;inset:0;z-index:5000;pointer-events:auto;
  display:none;align-items:center;justify-content:center;
}
#fishing-overlay.open{display:flex}
#fishing-panel{
  background:linear-gradient(160deg,rgba(10,40,80,.97),rgba(5,25,55,.97));
  border:2.5px solid rgba(80,180,255,.5);border-radius:20px;
  padding:18px 20px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;
  box-shadow:0 8px 40px rgba(0,0,0,.9),0 0 0 1px rgba(80,180,255,.2);
  min-width:200px;
}
#fishing-title{font-size:13px;color:#80D0FF;font-weight:700;letter-spacing:.5px}
#fishing-bar-wrap{
  position:relative;width:34px;height:180px;
  background:linear-gradient(180deg,rgba(0,80,160,.6),rgba(0,40,100,.8));
  border:2px solid rgba(80,180,255,.4);border-radius:8px;overflow:hidden;
}
#fishing-fish-zone{
  position:absolute;left:3px;right:3px;height:18px;
  background:rgba(255,200,40,.9);border-radius:4px;
  transition:none;display:flex;align-items:center;justify-content:center;
  font-size:11px;filter:drop-shadow(0 0 4px rgba(255,200,0,.8));
}
#fishing-catch-zone{
  position:absolute;left:2px;right:2px;height:48px;
  background:linear-gradient(180deg,rgba(60,220,60,.8),rgba(20,160,20,.8));
  border-radius:5px;border:1px solid rgba(80,255,80,.6);
}
#fishing-progress-wrap{width:100%;height:8px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden}
#fishing-progress-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,#40C840,#80FF80);width:0%;transition:width .08s linear}
#fishing-timer{font-size:11px;color:rgba(160,210,255,.7)}
#fishing-hint{font-size:10px;color:rgba(160,210,255,.6);text-align:center}
#fishing-hold-btn{
  width:80px;height:34px;border-radius:18px;border:2px solid rgba(80,220,80,.6);
  background:linear-gradient(135deg,#208020,#104010);color:#80FF80;
  font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;
  user-select:none;-webkit-user-select:none;
}
#fishing-cancel-btn{
  font-size:11px;color:rgba(160,210,255,.5);background:none;border:none;
  cursor:pointer;font-family:inherit;padding:2px 8px;
}
#fishing-result{display:none;flex-direction:column;align-items:center;gap:8px;text-align:center}
#fishing-result-fish{font-size:13px;color:#FFD040;font-weight:800}
#fishing-result-coins{font-size:12px;color:#FFE840}
#fish-rarity-0{color:#90FF90}
#fish-rarity-1{color:#60C0FF}
#fish-rarity-2{color:#C080FF}
#fish-rarity-3{color:#FFD040}

.farm-tile.locked{ cursor:pointer; }
.farm-tile.locked:hover{
  background:radial-gradient(circle,rgba(120,90,40,.28) 0%,transparent 65%);
}

/* Plant container — the SVG characters grow from the bottom of the tile */
.tile-plant{
  position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;
  z-index:2;overflow:visible;
  transform-origin:50% 100%;
  animation:plantIdle 2.8s ease-in-out infinite alternate;
}
/* Inline SVG plants — no white card background.
   Filters give Hay-Day style polish: saturation + contrast + soft ground shadow. */
.tile-plant svg {
  width:68%;height:68%;overflow:visible;
  transform-origin:bottom center;
  filter:
    saturate(1.18) contrast(1.06)
    drop-shadow(0 5px 3px rgba(40,20,4,.32))
    drop-shadow(0 2px 1px rgba(40,20,4,.25));
}
.tile-plant.is-ripe svg {
  width:76%;height:76%;
  filter:
    saturate(1.28) contrast(1.10) brightness(1.05)
    drop-shadow(0 6px 4px rgba(40,20,4,.4))
    drop-shadow(0 0 10px rgba(255,220,0,.55))
    drop-shadow(0 0 4px rgba(255,180,0,.6));
}
.tile-plant.is-ripe{
  animation:plantRipeBob 1.15s ease-in-out infinite alternate;
}
.tile-plant.just-planted{
  animation:plantPop .55s cubic-bezier(.4,1.8,.55,.95);
}
.tile-plant.is-dry svg{
  filter:grayscale(.55) brightness(.75);
}
/* Withered dead plant */
.tile-plant.is-withered{
  animation:witherSway 3s ease-in-out infinite alternate;
}
.tile-plant.is-withered svg{
  width:65%;height:65%;
  filter:grayscale(.85) sepia(.5) brightness(.7) drop-shadow(0 4px 3px rgba(0,0,0,.3));
}
@keyframes witherSway{
  0%   { transform:rotate(-3deg); }
  100% { transform:rotate(3deg); }
}
/* Pest badge overlay */
.pest-badge,.weed-badge{
  position:absolute;top:3px;right:3px;
  font-size:14px;z-index:10;
  animation:badgePulse .9s ease-in-out infinite alternate;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));
  pointer-events:none;
}
.weed-badge{ right:auto;left:3px; }
@keyframes badgePulse{
  from{ transform:scale(.85); }
  to  { transform:scale(1.15); }
}
/* XP float */
.xp-float{
  position:fixed;z-index:9999;
  font-size:13px;font-weight:700;
  color:#FFE830;text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 8px rgba(255,200,0,.7);
  pointer-events:none;
  animation:xpFloatUp 1.1s ease-out forwards;
  white-space:nowrap;
}
@keyframes xpFloatUp{
  0%  { opacity:1; transform:translateY(0) scale(1); }
  70% { opacity:1; transform:translateY(-36px) scale(1.15); }
  100%{ opacity:0; transform:translateY(-56px) scale(.9); }
}
/* Golden harvest flash */
.golden-flash{
  position:fixed;z-index:9998;
  font-size:15px;font-weight:800;
  color:#FFD700;text-shadow:0 0 12px #FF8C00,0 1px 3px rgba(0,0,0,.9);
  pointer-events:none;
  animation:goldenPop 1.4s ease-out forwards;
}
@keyframes goldenPop{
  0%  { opacity:0; transform:translateY(0) scale(.5); }
  30% { opacity:1; transform:translateY(-20px) scale(1.3); }
  70% { opacity:1; transform:translateY(-40px) scale(1.1); }
  100%{ opacity:0; transform:translateY(-65px) scale(.8); }
}
/* ── Confetti (level-up) ── */
.confetti-bit{
  position:fixed;width:8px;height:10px;border-radius:2px;
  z-index:99999;pointer-events:none;
  animation:confettiFall var(--dur,1.4s) ease-in forwards;
}
@keyframes confettiFall{
  0%  { transform:translateY(0) translateX(0) rotate(0deg); opacity:1; }
  80% { opacity:1; }
  100%{ transform:translateY(var(--fy,80vh)) translateX(var(--fx,0px)) rotate(720deg); opacity:0; }
}
/* Level-up banner */
.levelup-banner{
  position:fixed;top:30%;left:50%;transform:translateX(-50%) scale(.3);
  z-index:99998;pointer-events:none;
  background:linear-gradient(135deg,#FFD020,#FF8800);
  color:#3A1800;font-size:20px;font-weight:900;
  padding:10px 28px;border-radius:30px;
  border:3px solid #FFF;
  box-shadow:0 0 30px rgba(255,200,0,.9),0 4px 20px rgba(0,0,0,.5);
  animation:levelupPop 2s ease-out forwards;
  white-space:nowrap;
}
@keyframes levelupPop{
  0%  { opacity:0; transform:translateX(-50%) scale(.3); }
  20% { opacity:1; transform:translateX(-50%) scale(1.15); }
  35% { transform:translateX(-50%) scale(1); }
  70% { opacity:1; transform:translateX(-50%) scale(1); }
  100%{ opacity:0; transform:translateX(-50%) scale(.8) translateY(-30px); }
}
/* Quick batch action buttons */
#quick-actions{
  position:absolute;bottom:56px;left:50%;transform:translateX(-50%);
  display:none;flex-direction:row;gap:8px;z-index:25;
}
.quick-btn{
  padding:7px 16px;border-radius:22px;border:2px solid rgba(255,255,255,.4);
  font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap;
  box-shadow:0 3px 14px rgba(0,0,0,.45);
  transition:transform .12s,box-shadow .12s;
}
.quick-btn:hover{ transform:scale(1.06); }
.quick-btn:active{ transform:scale(.94); }
#btn-harvest-all{
  background:linear-gradient(135deg,#FFD020,#FF7800);
  color:#3A1000;
  animation:harvestBtnGlow 1.2s ease-in-out infinite alternate;
}
#btn-water-all{
  background:linear-gradient(135deg,#40C8FF,#0060D0);
  color:#fff;
  animation:waterBtnGlow 1.4s ease-in-out infinite alternate;
}
#btn-pest-all{
  background:linear-gradient(135deg,#90E060,#208820);
  color:#fff;
  animation:waterBtnGlow 1.6s ease-in-out infinite alternate;
}
@keyframes harvestBtnGlow{
  from{ box-shadow:0 3px 10px rgba(255,180,0,.5); }
  to  { box-shadow:0 4px 22px rgba(255,180,0,.95),0 0 8px rgba(255,220,0,.7); }
}
@keyframes waterBtnGlow{
  from{ box-shadow:0 3px 10px rgba(0,80,200,.4); }
  to  { box-shadow:0 4px 22px rgba(0,150,255,.8); }
}
/* Shortcut hint strip */
#shortcut-hints{
  position:absolute;bottom:58px;right:6px;
  display:flex;flex-direction:column;gap:2px;
  z-index:20;pointer-events:none;
}
.sc-hint{
  font-size:9px;color:rgba(255,255,255,.7);
  background:rgba(0,0,0,.35);border-radius:4px;
  padding:1px 5px;font-weight:600;letter-spacing:.3px;
}
/* Ripe tile extra glow */
.farm-tile:has(.is-ripe)::after{
  content:'';position:absolute;inset:-3px;
  border-radius:8px;
  box-shadow:inset 0 0 16px rgba(255,230,0,.45),0 0 12px rgba(255,200,0,.3);
  pointer-events:none;z-index:1;
  animation:ripeAura 1.4s ease-in-out infinite alternate;
}
@keyframes ripeAura{
  from{ box-shadow:inset 0 0 10px rgba(255,230,0,.3),0 0 6px rgba(255,200,0,.2); }
  to  { box-shadow:inset 0 0 22px rgba(255,230,0,.6),0 0 16px rgba(255,200,0,.5); }
}
/* Pest tile shake */
.farm-tile.has-pest-anim{
  animation:pestShake 2.4s ease-in-out infinite;
}
@keyframes pestShake{
  0%,90%,100%{ transform:translateX(0); }
  92%{ transform:translateX(-2px); }
  94%{ transform:translateX(2px); }
  96%{ transform:translateX(-2px); }
  98%{ transform:translateX(1px); }
}
/* Fertilized sparkle overlay */
.fert-sparkle{
  position:absolute;z-index:8;pointer-events:none;
  font-size:11px;
  animation:fertSparkleUp .9s ease-out forwards;
}
@keyframes fertSparkleUp{
  0%  { opacity:1; transform:translateY(0) scale(1); }
  100%{ opacity:0; transform:translateY(-28px) scale(.5); }
}
/* Water droplet hit */
.water-drop-hit{
  position:fixed;z-index:9997;pointer-events:none;
  width:6px;height:6px;border-radius:50%;
  background:rgba(80,180,255,.85);
  animation:dropHit .5s ease-out forwards;
}
@keyframes dropHit{
  0%  { transform:scale(1);opacity:1; }
  100%{ transform:scale(3);opacity:0; }
}
/* Ripe pop notification toast */
.ripe-notify{
  position:fixed;top:12px;left:50%;transform:translateX(-50%);
  z-index:9990;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,220,0,.95),rgba(255,140,0,.9));
  color:#3A1000;font-weight:800;font-size:13px;
  padding:8px 22px;border-radius:24px;
  box-shadow:0 4px 20px rgba(255,160,0,.7),0 2px 8px rgba(0,0,0,.4);
  animation:ripeNotify 3s ease-out forwards;
}
@keyframes ripeNotify{
  0%  { opacity:0; transform:translateX(-50%) translateY(-20px); }
  12% { opacity:1; transform:translateX(-50%) translateY(0); }
  75% { opacity:1; }
  100%{ opacity:0; transform:translateX(-50%) translateY(-10px); }
}
/* Harvest all bounce anim on ripe tiles when btn pressed */
.tile-plant.harvest-flash{
  animation:harvestFlash .35s ease-out !important;
}
@keyframes harvestFlash{
  0%  { transform:scale(1.3) translateY(-5px); filter:brightness(1.8); }
  100%{ transform:scale(1) translateY(0); filter:brightness(1); }
}
/* ═══ HARVEST POPUP ═══════════════════════════════════════════════════════ */
#harvest-popup{position:fixed;inset:0;background:rgba(0,0,0,.52);display:none;align-items:center;justify-content:center;z-index:3000;backdrop-filter:blur(3px);pointer-events:auto;}
#harvest-popup.open{display:flex}
#harvest-card{
  background:linear-gradient(160deg,#4A2C10,#241408);
  border:3px solid #D08020;border-radius:22px;
  padding:24px 30px;text-align:center;min-width:190px;
  box-shadow:0 8px 44px rgba(0,0,0,.85),0 0 0 1px rgba(255,200,60,.3);
  animation:hpopIn .32s cubic-bezier(.34,1.56,.64,1);
}
@keyframes hpopIn{from{transform:scale(.3) translateY(40px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
#hpop-art{height:72px;display:flex;align-items:center;justify-content:center;margin-bottom:4px;overflow:visible}
#hpop-crop-name{color:#FFE080;font-size:13px;font-weight:700;margin-bottom:6px}
#hpop-units{font-size:36px;font-weight:900;color:#FFF;text-shadow:0 0 18px rgba(255,200,0,.8),0 2px 5px rgba(0,0,0,.9);margin-bottom:2px}
#hpop-xp{font-size:14px;color:#FFE830;font-weight:700;text-shadow:0 0 8px rgba(255,220,0,.7);margin-bottom:2px}
#hpop-golden{font-size:15px;color:#FFD700;font-weight:800;margin-bottom:4px;animation:goldenGlow 1s ease-in-out infinite alternate}
@keyframes goldenGlow{from{text-shadow:0 0 6px #FF8800}to{text-shadow:0 0 20px #FFD000,0 0 36px #FF6600}}
#hpop-ok{margin-top:12px;padding:7px 30px;border-radius:22px;border:2px solid rgba(255,180,60,.6);background:linear-gradient(135deg,#C07A10,#7A4A08);color:#FFF8D0;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;transition:transform .12s}
#hpop-ok:hover{transform:scale(1.07)}#hpop-ok:active{transform:scale(.93)}
/* ═══ SHOVEL CONFIRM ══════════════════════════════════════════════════════ */
#clear-confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:3000;backdrop-filter:blur(3px);pointer-events:auto;}
#clear-confirm-overlay.open{display:flex}
#clear-confirm-card{background:linear-gradient(160deg,#381206,#1C0A04);border:3px solid #CC3010;border-radius:20px;padding:22px 28px;text-align:center;min-width:210px;box-shadow:0 8px 40px rgba(0,0,0,.88);animation:hpopIn .22s ease}
#ccnf-art{height:60px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;overflow:visible}
#ccnf-msg{color:#FFB060;font-size:15px;font-weight:800;margin-bottom:4px}
#ccnf-warn{color:#E07848;font-size:11px;margin-bottom:18px;opacity:.85}
.ccnf-btn-row{display:flex;gap:12px;justify-content:center}
#ccnf-cancel{padding:7px 22px;border-radius:18px;border:2px solid rgba(200,200,200,.3);background:rgba(80,60,50,.7);color:#DDD;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:filter .12s}
#ccnf-ok{padding:7px 22px;border-radius:18px;border:2px solid rgba(240,60,20,.7);background:linear-gradient(135deg,#C02808,#780808);color:#FFE0D0;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;transition:filter .12s}
#ccnf-ok:hover,#ccnf-cancel:hover{filter:brightness(1.18)}
/* ═══ LEVEL-UP MODAL ═════════════════════════════════════════════════════ */
#levelup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;z-index:3001;backdrop-filter:blur(4px);pointer-events:auto;}
#levelup-overlay.open{display:flex}
#levelup-card{background:linear-gradient(160deg,#5A3800,#281800);border:3px solid #FFD020;border-radius:24px;padding:26px 34px;text-align:center;min-width:230px;max-width:310px;box-shadow:0 0 44px rgba(255,200,0,.55),0 8px 44px rgba(0,0,0,.85);animation:hpopIn .38s cubic-bezier(.34,1.56,.64,1)}
#lu-title{font-size:20px;font-weight:900;color:#FFE030;text-shadow:0 0 14px rgba(255,180,0,.8);margin-bottom:2px}
#lu-level{font-size:44px;font-weight:900;color:#FFF;text-shadow:0 0 22px rgba(255,180,0,.9);margin-bottom:10px;line-height:1}
#lu-unlocks{font-size:13px;color:#FFD080;margin-bottom:18px;line-height:1.75;max-height:100px;overflow-y:auto}
#lu-ok{padding:10px 36px;border-radius:26px;border:2px solid rgba(255,220,60,.7);background:linear-gradient(135deg,#D09010,#886010);color:#FFF8D0;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 4px 18px rgba(255,160,0,.5);transition:transform .12s}
#lu-ok:hover{transform:scale(1.07)}
/* ═══ HOVER TOOLTIP ══════════════════════════════════════════════════════ */
#crop-tooltip{position:fixed;z-index:2500;pointer-events:none;background:linear-gradient(160deg,rgba(38,18,4,.97),rgba(18,8,0,.97));border:2px solid rgba(200,140,40,.65);border-radius:12px;padding:9px 13px;font-size:12px;color:#FFE090;box-shadow:0 4px 22px rgba(0,0,0,.85);max-width:155px;line-height:1.55;opacity:0;transition:opacity .14s;white-space:nowrap}
#crop-tooltip.visible{opacity:1}
#crop-tooltip .tt-name{font-size:13px;font-weight:800;color:#FFD040;margin-bottom:5px}
#crop-tooltip .tt-row{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#C09848}
#crop-tooltip .tt-val{color:#FFE090}
#crop-tooltip .tt-bar-wrap{height:5px;background:rgba(255,255,255,.12);border-radius:3px;margin:4px 0 2px}
#crop-tooltip .tt-bar-inner{height:100%;border-radius:3px}
#crop-tooltip .tt-warn{color:#FF8844;font-weight:700;font-size:11px;margin-top:4px}
/* ═══ ALERT BANNER ═══════════════════════════════════════════════════════ */
#alert-banner{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:2800;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:5px}
.alert-item{border-radius:22px;padding:7px 18px;font-size:13px;font-weight:800;box-shadow:0 4px 18px rgba(0,0,0,.7);animation:alertIn .42s cubic-bezier(.34,1.56,.64,1) forwards;opacity:0}
.alert-item.is-withered{background:linear-gradient(135deg,rgba(100,60,10,.96),rgba(60,30,0,.96));border:2px solid rgba(200,140,40,.7);color:#FFD090}
.alert-item.is-pest{background:linear-gradient(135deg,rgba(20,90,20,.96),rgba(10,50,10,.96));border:2px solid rgba(80,200,80,.6);color:#B0FFB0}
.alert-item.is-water{background:linear-gradient(135deg,rgba(10,60,160,.96),rgba(5,28,100,.96));border:2px solid rgba(80,160,255,.6);color:#B0D8FF}
@keyframes alertIn{0%{opacity:0;transform:translateY(-40px) scale(.85)}70%{opacity:1;transform:translateY(54px) scale(1.04)}100%{opacity:1;transform:translateY(48px) scale(1)}}

@keyframes plantIdle{
  0%   { transform:rotate(-1.8deg) translateY(0); }
  100% { transform:rotate(1.8deg)  translateY(-2px); }
}
@keyframes plantRipeBob{
  0%   { transform:translateY(-1px) scale(1.02) rotate(-1.5deg); }
  100% { transform:translateY(-4px) scale(1.04) rotate(1.5deg); }
}
@keyframes plantPop{
  0%   { transform:scale(.1) translateY(30px); opacity:0; }
  60%  { transform:scale(1.22) translateY(-6px); opacity:1; }
  100% { transform:scale(1) translateY(0); }
}

/* No soil tile — plants grow directly on green PvZ lawn */
.tile-soil{ display:none; }

/* Progress bar */
.t-bar-wrap{
  position:absolute;bottom:4px;left:5px;right:5px;height:5px;
  background:rgba(0,0,0,.45);border-radius:3px;z-index:5;
}
.t-bar{height:100%;border-radius:3px;transition:width .5s}
.bar-g{background:linear-gradient(90deg,#30B010,#78E030)}
.bar-r{background:linear-gradient(90deg,#FFD020,#FFA000);animation:barBlink .9s ease-in-out infinite alternate}
.bar-d{background:linear-gradient(90deg,#D04810,#A02808)}
@keyframes barBlink{to{opacity:.45}}

/* Ripe badge */
.ripe-b{
  position:absolute;top:3px;right:3px;z-index:6;
  background:linear-gradient(135deg,#FFDA10,#FF9000);
  color:#3A1A00;font-size:9px;font-weight:bold;
  padding:1px 5px;border-radius:7px;
  box-shadow:0 1px 5px rgba(0,0,0,.5);
  animation:badgePop .55s ease-in-out infinite alternate;
}
@keyframes badgePop{to{transform:scale(1.12)}}

/* Dry warning */
.dry-b{
  position:absolute;top:3px;left:3px;z-index:6;
  background:linear-gradient(135deg,#E04010,#A02000);
  color:#FFF;font-size:8px;padding:1px 4px;border-radius:7px;
  box-shadow:0 1px 5px rgba(0,0,0,.5);
}

/* Countdown label */
.tile-cd{
  position:absolute;top:3px;left:50%;transform:translateX(-50%);z-index:6;
  font-size:9px;color:rgba(255,255,200,.92);white-space:nowrap;
  text-shadow:0 1px 4px rgba(0,0,0,.95);
}

/* ═══ DECO LAYER ══════════════════════════════════════════════════════════════ */
#deco-layer{position:absolute;top:30px;left:0;right:0;bottom:0;z-index:5;pointer-events:none}
.deco-el{position:absolute}
.deco-el.float{animation:floatBob 3.5s ease-in-out infinite alternate}
@keyframes floatBob{to{transform:translateY(-5px)}}

/* ═══ RIGHT PANEL — tools, fully transparent, blends with background ══════════ */
#toolbar{
  position:absolute;right:0;top:0;bottom:0;width:100px;
  z-index:20;
  background:rgba(0,0,0,0);
  border:none;box-shadow:none;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:7px;padding:10px 6px;
  pointer-events:none; /* pass clicks through to tiles */
}
#toolbar > * { pointer-events:auto; }
.tool-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;
  gap:2px;width:82px;height:56px;border-radius:12px;cursor:pointer;
  border:2px solid rgba(80,45,10,0.75);
  background:rgba(40,18,4,0.78);
  box-shadow:0 3px 10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,170,60,.1);
  color:#E4C080;font-size:10.5px;text-shadow:0 1px 3px rgba(0,0,0,.9);
  transition:transform .12s,box-shadow .12s,background .12s;font-family:inherit;
}
.tool-btn:hover{
  background:rgba(80,38,12,0.88);
  transform:translateX(-2px);border-color:rgba(180,100,30,0.9);
}
.tool-btn.active{
  background:rgba(160,80,8,0.88);
  border-color:rgba(240,168,32,0.9);color:#FFF8D0;
  box-shadow:0 0 14px rgba(240,160,20,.5),0 3px 9px rgba(0,0,0,.5);
}
.tool-btn.active::after{
  content:'';position:absolute;left:-5px;top:50%;transform:translateY(-50%);
  width:4px;height:26px;border-radius:2px;
  background:#FFD020;box-shadow:0 0 8px #FFD020,0 0 3px #FFA000;
}
.tool-icon{width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.tool-lbl{font-size:10px;line-height:1}

#hud-sell-btn{
  background:rgba(120,15,15,0.82);
  border-color:rgba(200,50,50,0.8);color:#FFD0D0;
}
#hud-sell-btn:hover{background:rgba(160,25,25,0.88)}
#farm-lv{
  background:rgba(40,30,80,0.75);
  border:2px solid rgba(120,88,184,0.7);border-radius:10px;
  padding:4px 8px;color:#DCC8FF;font-size:11px;
  box-shadow:0 2px 8px rgba(60,20,110,.35);
  text-shadow:0 1px 3px rgba(0,0,0,.8);
}

/* ═══ OVERLAYS ═══════════════════════════════════════════════════════════════ */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.58);
  display:none;align-items:flex-end;justify-content:center;
  z-index:100;backdrop-filter:blur(2px);pointer-events:auto;
}
.overlay.open{display:flex}

/* Seed panel (slides up from bottom) */
#seed-panel{
  width:100%;
  background:
    repeating-linear-gradient(90deg,transparent,transparent 24px,rgba(0,0,0,.06) 24px,rgba(0,0,0,.06) 26px),
    linear-gradient(180deg,#5A2C14,#3A1808);
  border-top:4px solid #8B4A18;border-radius:18px 18px 0 0;
  padding:12px 14px;
  box-shadow:0 -10px 36px rgba(0,0,0,.75);
  animation:slideUp .24s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}}
#seed-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid rgba(255,170,60,.2)}
#seed-ttl{font-size:19px;color:#FFE078;text-shadow:0 2px 5px rgba(0,0,0,.8)}

/* Shop panel (modal) */
#shop-overlay{

#shop-panel{
  width:570px;max-height:470px;display:flex;flex-direction:column;

#shop-x{
  background:none;border:2px solid #8B4818;border-radius:8px;

}

#shop-body{flex:1;overflow-y:auto;padding:14px;scrollbar-width:thin;scrollbar-color:#8B4818 transparent}
.shop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.shop-card{
  background:linear-gradient(135deg,#3A2010,#261408);

}

.shop-card.owned{border-color:#40A020;background:linear-gradient(135deg,#1A3010,#0A1A08);cursor:default}
.shop-card-icon{width:58px;height:58px;margin:0 auto 5px;display:flex;align-items:center;justify-content:center}
.shop-card-name{font-size:11px;color:#E4C080;margin-bottom:3px}
.shop-card-cost{font-size:10px;color:#B08838;line-height:1.4}

/* Sell panel (modal) */

/* ── Tool-state visual hints: highlight interactable tiles ── */
body.tool-harvest .tile-plant.is-ripe {
  filter: drop-shadow(0 0 10px rgba(255,220,0,.8)) drop-shadow(0 0 4px rgba(255,180,0,.9));
  animation:plantRipeBob .8s ease-in-out infinite alternate;
}
body.tool-water .tile-plant.is-dry {
  filter: drop-shadow(0 0 10px rgba(80,200,255,.8));
}

/* Toast */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);
  background:rgba(10,6,0,.86);color:#FFE870;border-radius:22px;
  padding:8px 20px;font-size:13px;pointer-events:none;
  opacity:0;transition:opacity .24s,transform .24s;z-index:400;
  text-shadow:0 1px 4px rgba(0,0,0,.9);
  box-shadow:0 4px 18px rgba(0,0,0,.55);border:1.5px solid rgba(255,200,50,.28);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Pop floaters */
.pop-float{
  position:fixed;pointer-events:none;z-index:400;
  font-size:16px;animation:floatUp .9s ease forwards;
}
@keyframes floatUp{
  0%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}
  100%{opacity:0;transform:translate(-50%,-100px) scale(.7)}
}
.water-drop{
  position:fixed;pointer-events:none;z-index:400;
  width:9px;height:13px;
  border-radius:50% 50% 50% 50%/58% 58% 42% 42%;
  background:linear-gradient(180deg,#A8E8FF,#0088E8);
  border:1.4px solid #1E4878;
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.6);
  animation:dropDown .55s ease forwards;
}
@keyframes dropDown{
  0%{opacity:1;transform:translate(-50%,-50%)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + 48px)) scale(.3)}
}

/* PvZ-style sun coin drop — bounces from plant + curves to coin-hud */
.sun-coin{
  position:fixed;pointer-events:none;z-index:400;
  width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#FFFAC0 0%,#FFE020 30%,#F0A008 70%,#A85008 100%);
  border:2.2px solid #5A2800;
  box-shadow:0 0 18px rgba(255,200,30,.85),0 0 6px #FFA000,inset 0 2px 0 rgba(255,255,200,.6);
  display:flex;align-items:center;justify-content:center;
  color:#5A2800;font-weight:900;font-size:13px;
  text-shadow:0 1px 0 rgba(255,255,200,.7);
  animation:sunBounce 1.6s cubic-bezier(.35,.95,.55,1.1) forwards;
}
.sun-coin::before{
  content:'';position:absolute;inset:-6px;border-radius:50%;z-index:-1;
  background:conic-gradient(transparent 0,rgba(255,220,30,.5) 15deg,transparent 30deg,transparent 60deg,rgba(255,220,30,.5) 75deg,transparent 90deg,transparent 120deg,rgba(255,220,30,.5) 135deg,transparent 150deg,transparent 180deg,rgba(255,220,30,.5) 195deg,transparent 210deg,transparent 240deg,rgba(255,220,30,.5) 255deg,transparent 270deg,transparent 300deg,rgba(255,220,30,.5) 315deg,transparent 330deg);
  animation:sunCoinRays 3s linear infinite;
}
@keyframes sunCoinRays{to{transform:rotate(360deg)}}
@keyframes sunBounce{
  0%   {transform:translate(-50%,-50%) scale(.2);opacity:0}
  18%  {transform:translate(calc(-50% + var(--bx,0px)),calc(-50% - 38px)) scale(1.2);opacity:1}
  60%  {transform:translate(calc(-50% + var(--bx,0px)),calc(-50% + 8px)) scale(1)}
  100% {transform:translate(calc(-50% + var(--cx,40px) - var(--ox,0px)),calc(-50% + var(--cy,-40px) - var(--oy,0px))) scale(.4);opacity:0}
}

/* Leaf burst on harvest */
.leaf-bit{
  position:fixed;pointer-events:none;z-index:399;
  width:12px;height:16px;
  background:radial-gradient(ellipse 60% 90% at 50% 100%,#5BC020,#2A7818);
  border:1.4px solid #1A5414;
  border-radius:50% 50% 40% 60%/70% 70% 30% 40%;
  animation:leafFly .9s ease-out forwards;
}
@keyframes leafFly{
  0%{opacity:1;transform:translate(-50%,-50%) rotate(0) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot,540deg)) scale(.4)}
}

/* Plant fertilize sparkle */
.fert-spark{
  position:fixed;pointer-events:none;z-index:400;
  width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle,#80FF80,#30B010);
  box-shadow:0 0 8px #80FF80;
  animation:sparkRise .8s ease-out forwards;
}
@keyframes sparkRise{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - 40px)) scale(.2)}
}

/* Drag-over highlight */
.farm-tile.drag-over{outline:3px dashed #FFE040;outline-offset:-3px;filter:brightness(1.25);}
/* Locked tile slots — transparent, just show a cute wooden sign */
/* Drag region — transparent bar for moving the window */
#drag-bar{
  position:absolute;top:0;left:0;right:0;height:24px;
  z-index:200;cursor:grab;
  -webkit-app-region:drag;
}
#drag-bar:active{cursor:grabbing;}
/* Sky / empty areas also draggable */
#sky-scene{-webkit-app-region:drag;}
#grass{-webkit-app-region:drag;}
/* Interactive elements must opt out */
#seed-tray,#toolbar,.tile,.seed-pkt,.farm-tile,button,#shop-overlay,#sell-overlay,#seed-overlay,.overlay{-webkit-app-region:no-drag;}

/* ═══ FEATURE ADDITIONS ════════════════════════════════════════════════════ */

/* #1 — Daily Tasks Panel */
#daily-tasks-panel{
  position:fixed;right:108px;top:50%;transform:translateY(-50%) translateX(0);
  z-index:30;width:190px;
  background:linear-gradient(160deg,rgba(20,10,40,.96),rgba(10,5,25,.96));
  border:2px solid rgba(180,100,255,.5);border-radius:14px;
  box-shadow:0 4px 24px rgba(0,0,0,.8),0 0 0 1px rgba(180,100,255,.15);
  overflow:hidden;
  display:none;
}
#daily-tasks-panel.open{display:block;animation:hpopIn .22s ease}
#dtp-hdr{
  display:flex;align-items:center;gap:6px;
  padding:8px 10px 7px;
  background:linear-gradient(135deg,rgba(120,50,200,.8),rgba(80,30,140,.8));
  border-bottom:1px solid rgba(180,100,255,.35);
  font-size:12px;color:#E0C0FF;font-weight:800;
}
#dtp-date{font-size:9px;color:rgba(180,120,255,.65);margin-left:auto}
#dtp-list{padding:8px 8px 4px}
.dtp-task{
  display:flex;align-items:center;gap:6px;
  padding:5px 4px;border-bottom:1px solid rgba(180,100,255,.12);
  font-size:10px;color:#C0A0E8;
}
.dtp-task:last-child{border-bottom:none}
.dtp-task.done{opacity:.55}
.dtp-task-check{
  width:16px;height:16px;border-radius:50%;flex-shrink:0;
  border:2px solid rgba(180,100,255,.6);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;
}
.dtp-task.done .dtp-task-check{background:rgba(120,200,60,.8);border-color:#80E040;color:#fff}
.dtp-task-info{flex:1}
.dtp-task-name{color:#D8B8FF;margin-bottom:1px}
.dtp-prog{font-size:9px;color:rgba(180,120,255,.7)}
.dtp-task-reward{font-size:9px;color:#FFD040;white-space:nowrap}
.dtp-claim{
  display:none;margin-top:2px;padding:2px 7px;border-radius:8px;
  border:1.5px solid rgba(255,200,60,.7);
  background:linear-gradient(135deg,rgba(200,140,20,.9),rgba(140,90,10,.9));
  color:#FFF8D0;font-size:9px;font-weight:800;cursor:pointer;font-family:inherit;
  animation:badgePop .6s ease-in-out infinite alternate;
}
.dtp-task.claimable .dtp-claim{display:block}
.dtp-task.claimed .dtp-claim{display:none}
#dtp-toggle{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;
  gap:2px;width:82px;height:42px;border-radius:12px;cursor:pointer;
  border:2px solid rgba(120,60,180,0.75);
  background:rgba(40,18,80,0.78);
  box-shadow:0 3px 10px rgba(0,0,0,.6),inset 0 1px 0 rgba(180,100,255,.1);
  color:#D0A0FF;font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.9);
  transition:transform .12s,box-shadow .12s,background .12s;font-family:inherit;
}
#dtp-toggle:hover{
  background:rgba(80,38,140,.88);
  transform:translateX(-2px);border-color:rgba(200,120,255,0.9);
}

/* #2 — Enhanced Floating Reward Text */
.harvest-float{
  position:fixed;z-index:9999;
  font-weight:800;pointer-events:none;white-space:nowrap;
  animation:harvestFloatUp 1.2s cubic-bezier(.17,.67,.38,1) forwards;
}
.harvest-float.units{font-size:16px;color:#FFE860;text-shadow:0 1px 4px rgba(0,0,0,.85),0 0 10px rgba(255,220,0,.6);}
.harvest-float.xp{font-size:14px;color:#C080FF;text-shadow:0 1px 4px rgba(0,0,0,.85),0 0 8px rgba(180,60,255,.5);}
.harvest-float.coins{font-size:15px;color:#FFD040;text-shadow:0 1px 4px rgba(0,0,0,.85),0 0 10px rgba(255,180,0,.55);}
@keyframes harvestFloatUp{
  0%  {opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  15% {opacity:1;transform:translate(var(--hfx,-50%),-70%) scale(1.2)}
  80% {opacity:.9;transform:translate(var(--hfx,-50%),-160%) scale(.95)}
  100%{opacity:0;transform:translate(var(--hfx,-50%),-200%) scale(.8)}
}

/* #3 — Crop Growth Progress Ring */
.tile-ring{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:52px;height:52px;
  pointer-events:none;z-index:7;
  overflow:visible;
}

/* #4 — Tool Button Active State & Press Animation */
.tool-btn.active{
  background:rgba(160,80,8,0.88)!important;
  border-color:rgba(240,168,32,0.9)!important;color:#FFF8D0!important;
  box-shadow:0 0 0 3px #FFD040, 0 0 12px rgba(255,208,0,.5),0 3px 9px rgba(0,0,0,.5)!important;
}
@keyframes toolPress{
  0%  {transform:translateX(-2px) scale(1)}
  40% {transform:translateX(-2px) scale(.85)}
  100%{transform:translateX(-2px) scale(1)}
}
.tool-btn.pressing{animation:toolPress .15s ease-out forwards}

/* #5 — Combo Harvest Counter */
#combo-display{
  position:fixed;top:38%;left:50%;transform:translateX(-50%);
  z-index:9998;pointer-events:none;
  font-size:32px;font-weight:900;color:#FFF;
  text-shadow:0 0 20px rgba(255,100,0,.9),0 2px 8px rgba(0,0,0,.85),0 0 40px rgba(255,50,0,.6);
  white-space:nowrap;
  opacity:0;transition:opacity .3s;
}
#combo-display.visible{opacity:1}
@keyframes comboIn{
  0%  {transform:translateX(-50%) scale(.6)}
  70% {transform:translateX(-50%) scale(1.18)}
  100%{transform:translateX(-50%) scale(1)}
}
#combo-display.pop{animation:comboIn .2s cubic-bezier(.17,.67,.38,1.3) forwards}

/* #6 — Pool Water Ripple */
.pool-ripple{
  position:absolute;border-radius:50%;pointer-events:none;
  border:1.5px solid rgba(100,200,255,0.4);
  animation:poolRippleOut .8s ease-out forwards;
  transform:translate(-50%,-50%);
}
@keyframes poolRippleOut{
  0%  {opacity:.7;transform:translate(-50%,-50%) scale(0)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1)}
}

/* #7 — Seed Packet Hover Preview Tooltip */
#seed-hover-tip{
  position:fixed;z-index:9500;pointer-events:none;
  width:160px;
  background:linear-gradient(160deg,rgba(20,8,40,.97),rgba(8,4,20,.97));
  border:2px solid rgba(200,140,60,.55);border-radius:11px;
  padding:8px 10px;
  box-shadow:0 4px 20px rgba(0,0,0,.85);
  opacity:0;transition:opacity .15s;
  font-size:11px;color:#C8A860;line-height:1.6;
}
#seed-hover-tip.visible{opacity:1}
#seed-hover-tip .sht-name{font-size:14px;color:#FFD060;font-weight:800;margin-bottom:4px}
#seed-hover-tip .sht-row{display:flex;justify-content:space-between;gap:4px;font-size:10px}
#seed-hover-tip .sht-val{color:#FFE090}

/* #8 — Shop Close Animation */
@keyframes shopClose{
  0%  {transform:scale(1);opacity:1}
  100%{transform:scale(.85);opacity:0}
}
#shop-panel.closing{animation:shopClose .18s ease-in forwards}

/* #9 — Harvest Fireworks / Confetti Burst */
.harvest-confetti{
  position:fixed;pointer-events:none;z-index:9997;
  border-radius:50%;
  animation:harvestConf .7s ease-out forwards;
}
@keyframes harvestConf{
  0%  {opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% + var(--hcdx)),calc(-50% + var(--hcdy))) rotate(var(--hcrot)) scale(.2)}
}

/* #10 — Sell Coin Shower */
.sell-coin-anim{
  position:fixed;pointer-events:none;z-index:9998;
  font-size:18px;line-height:1;
  animation:sellCoinFly .6s ease-in-out forwards;
}
@keyframes sellCoinFly{
  0%  {opacity:1;transform:translate(-50%,-50%) scale(1.2)}
  50% {opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--scdx)),calc(-50% + var(--scdy))) scale(.4)}
}

<script>
'use strict';
var T = null, state = null;
var activeTool = 'harvest';
var selCrop = null;       // crop id pending plant
var shopTab = 'deco';

var _lastRefresh = 0;
var _pendingClear = null; // pending shovel-confirm: {idx, cx, cy}
var _tileAlertState = {}; // tracks per-tile {hasPest, hasWeed, isWithered} for alert detection

/* ═══════════════ SVG LIBRARY ════════════════════════════════════════════════
   PvZ-authentic art: thick #000 outlines, big cartoon eyes with white sclera +
   pupil + sparkle highlight, smile, drop shadow, vivid layered fills.
   All plant SVGs use viewBox 0 0 60 60 with the figure baselined around y=54.
   ═══════════════════════════════════════════════════════════════════════════ */
/* Reusable face fragment (PvZ-style eyes + smile, centered around the given cx,cy) */
function face(cx, cy, opts) {
  opts = opts || {};
  var ew = opts.eyeR || 3.6;
  var sp = opts.eyeSpacing || 7;
  var mouth = opts.mouth || 'smile';   // smile | grin | tooth | open
  var col = opts.pupilColor || '#1A0E04';
  var mc = opts.mouthColor || '#2A0E04';
  var lx = cx - sp, rx = cx + sp;
  var eyes =
    '<ellipse cx="'+lx+'" cy="'+cy+'" rx="'+ew+'" ry="'+(ew*1.05)+'" fill="white" stroke="#000" stroke-width="1.3"/>'+
    '<ellipse cx="'+rx+'" cy="'+cy+'" rx="'+ew+'" ry="'+(ew*1.05)+'" fill="white" stroke="#000" stroke-width="1.3"/>'+
    '<ellipse cx="'+(lx+.4)+'" cy="'+(cy+.5)+'" rx="'+(ew*.5)+'" ry="'+(ew*.6)+'" fill="'+col+'"/>'+
    '<ellipse cx="'+(rx+.4)+'" cy="'+(cy+.5)+'" rx="'+(ew*.5)+'" ry="'+(ew*.6)+'" fill="'+col+'"/>'+
    '<circle cx="'+(lx+1.1)+'" cy="'+(cy-.8)+'" r=".75" fill="#FFF"/>'+
    '<circle cx="'+(rx+1.1)+'" cy="'+(cy-.8)+'" r=".75" fill="#FFF"/>';
  var my = cy + ew + 3;
  var mw = opts.mouthW || 5;
  var m;
  if (mouth === 'open') {
    m = '<ellipse cx="'+cx+'" cy="'+my+'" rx="'+mw+'" ry="'+(mw*.65)+'" fill="#5A1010" stroke="#000" stroke-width="1.2"/>' +
        '<path d="M'+(cx-mw*.6)+' '+(my+.5)+' Q'+cx+' '+(my+mw*.55)+' '+(cx+mw*.6)+' '+(my+.5)+'" fill="#FF6080"/>';
  } else if (mouth === 'tooth') {
    m = '<path d="M'+(cx-mw)+' '+my+' Q'+cx+' '+(my+mw*.85)+' '+(cx+mw)+' '+my+'" stroke="'+mc+'" stroke-width="1.8" fill="#5A1010" stroke-linecap="round"/>' +
        '<rect x="'+(cx-1.2)+'" y="'+my+'" width="2.4" height="2.6" fill="white" stroke="#000" stroke-width=".6"/>';
  } else if (mouth === 'grin') {
    m = '<path d="M'+(cx-mw)+' '+my+' Q'+cx+' '+(my+mw*1.1)+' '+(cx+mw)+' '+my+' L'+(cx+mw*.6)+' '+(my+mw*.2)+' L'+(cx-mw*.6)+' '+(my+mw*.2)+' Z" fill="#5A1010" stroke="'+mc+'" stroke-width="1.4" stroke-linejoin="round"/>';
  } else {
    m = '<path d="M'+(cx-mw)+' '+my+' Q'+cx+' '+(my+mw*.85)+' '+(cx+mw)+' '+my+'" stroke="'+mc+'" stroke-width="1.8" fill="none" stroke-linecap="round"/>';
  }
  // cheek blush dots
  var blush = '<ellipse cx="'+(lx-2.4)+'" cy="'+(cy+ew+.6)+'" rx="1.8" ry="1.1" fill="#FF7AA0" opacity=".55"/>' +
              '<ellipse cx="'+(rx+2.4)+'" cy="'+(cy+ew+.6)+'" rx="1.8" ry="1.1" fill="#FF7AA0" opacity=".55"/>';
  return eyes + m + blush;
}

/* Drop shadow oval (place behind plant body) */
function dropShadow(cx, cy, rx, ry) {
  return '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="#000" opacity=".28"/>';
}

var SVGS = {
  face: face, dropShadow: dropShadow,

  /* ── Tool icons (PvZ-style chunky cartoon icons) ── */
  harvest:'<svg width="32" height="32" viewBox="0 0 32 32"><path d="M7 26 C9 19 16 11 24 9" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M7 26 C9 19 16 11 24 9" stroke="#C8E040" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="25" cy="9" r="3.5" fill="#C8E040" stroke="#000" stroke-width="1.6"/><circle cx="9" cy="24" r="5" fill="#FFD028" stroke="#000" stroke-width="1.8"/><circle cx="9" cy="24" r="2.6" fill="#FFE860"/><line x1="4" y1="28" x2="9" y2="24" stroke="#000" stroke-width="4.5" stroke-linecap="round"/><line x1="4.5" y1="27.5" x2="8.5" y2="24" stroke="#B07028" stroke-width="2.8" stroke-linecap="round"/></svg>',
  water:  '<svg width="32" height="32" viewBox="0 0 32 32"><ellipse cx="12" cy="17" rx="9" ry="9" fill="#1E6CB8" stroke="#000" stroke-width="2"/><ellipse cx="9" cy="14" rx="3.5" ry="2.5" fill="#5BA8E8" opacity=".7"/><path d="M21 13 L29 13 L26.5 22 L22 22 Z" fill="#3888C8" stroke="#000" stroke-width="2" stroke-linejoin="round"/><circle cx="9" cy="11" r="2" fill="#FFF" opacity=".25"/><circle cx="22" cy="26" r="1.8" fill="#7ECAFF" stroke="#1E6CB8" stroke-width=".8"/><circle cx="27" cy="24" r="1.4" fill="#7ECAFF" stroke="#1E6CB8" stroke-width=".8"/><circle cx="18" cy="28" r="1.2" fill="#7ECAFF" stroke="#1E6CB8" stroke-width=".8"/></svg>',
  fert:   '<svg width="32" height="32" viewBox="0 0 32 32"><rect x="9" y="13" width="14" height="15" rx="3" fill="#6B3A18" stroke="#000" stroke-width="2"/><rect x="9" y="13" width="14" height="3" fill="#8B4A20"/><path d="M11 13 Q14 6 18 11 Q22 5 24 13Z" fill="#5BAA28" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 11 Q16 7 19 10" fill="#7BCC40" stroke="none"/><line x1="11" y1="20" x2="21" y2="20" stroke="#000" stroke-width="1.2" opacity=".5"/><line x1="11" y1="24" x2="21" y2="24" stroke="#000" stroke-width="1.2" opacity=".5"/></svg>',
  shovel: '<svg width="32" height="32" viewBox="0 0 32 32"><line x1="22" y1="6" x2="11" y2="26" stroke="#000" stroke-width="4.5" stroke-linecap="round"/><line x1="22" y1="6" x2="11" y2="26" stroke="#B07028" stroke-width="2.8" stroke-linecap="round"/><path d="M9 24 L17 18 L21 22 L13 28 Q9 30 9 24Z" fill="#C8C8D0" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/><path d="M11 23 L17 19" stroke="#FFF" stroke-width="1" opacity=".55"/><circle cx="22" cy="6" r="2.2" fill="#FFD028" stroke="#000" stroke-width="1.4"/></svg>',
  /* Dead/withered plant SVG (no card bg — transparent) */
  withered: '<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg"><ellipse cx="48" cy="84" rx="18" ry="4" fill="rgba(0,0,0,0.12)"/><path d="M48 82 Q47 66 44 52 Q41 38 38 28" stroke="#9A7A55" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M43 58 Q34 63 26 72" stroke="#8A6A45" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M45 66 Q55 68 65 74" stroke="#8A6A45" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M26 72 C19 68 17 60 23 57 C27 59 28 67 26 72Z" fill="#B09060" stroke="#7A5530" stroke-width="1.5" opacity="0.9"/><path d="M65 74 C72 70 74 62 68 59 C64 61 63 69 65 74Z" fill="#B09060" stroke="#7A5530" stroke-width="1.5" opacity="0.9"/><path d="M38 28 Q36 20 34 15" stroke="#9A7A55" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M34 15 C28 11 24 14 26 19 C30 21 33 17 34 15Z" fill="#C0A070" stroke="#7A5530" stroke-width="1.5" opacity="0.85"/><path d="M41 44 Q36 42 34 46 Q37 50 41 44Z" fill="#B09060" opacity="0.7"/><path d="M46 50 Q52 48 53 52 Q50 56 46 50Z" fill="#B09060" opacity="0.7"/></svg>',
  shop:   '<svg width="32" height="32" viewBox="0 0 32 32"><rect x="4" y="14" width="24" height="15" rx="1.5" fill="#E89028" stroke="#000" stroke-width="1.8"/><path d="M4 14 L8 6 L24 6 L28 14 Z" fill="#E84030" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/><path d="M6 9 L25 9" stroke="#FFF" stroke-width=".8" opacity=".45"/><rect x="11" y="18" width="10" height="11" rx="1" fill="#7A3A10" stroke="#000" stroke-width="1.4"/><circle cx="16" cy="24" r=".8" fill="#FFE060"/><text x="16" y="13" text-anchor="middle" font-size="6" font-weight="900" fill="#FFF" stroke="#7A1010" stroke-width=".4">SHOP</text></svg>',

  /* ── Soil patch (clumpy texture) ── */
  soil: function(dark, light) {
    return '<svg width="82" height="72" viewBox="0 0 82 72" xmlns="http://www.w3.org/2000/svg">'
      + '<rect x="0" y="0" width="82" height="72" rx="9" fill="'+dark+'"/>'

      + '<ellipse cx="10" cy="56" rx="8" ry="6" fill="'+light+'" opacity=".3"/>'

  stage: function(color, s) {

  /* Pick the right stage SVG for a given crop */
  growStage: function(cropId, color, stage) {
    if (stage <= 0) return this.stage(color, 0);
    if (stage >= 4) return this.stage(color, 4);
    var t = this.cropType(cropId);
    if (t === 'tree')    return this.stageTree(color, stage);
    if (t === 'vine')    return this.stageVine(color, stage);
    if (t === 'root')    return this.stageRoot(color, stage);
    if (t === 'flower')  return this.stageFlower(color, stage);
    if (t === 'tall')    return this.stageTall(color, stage);
    return this.stage(color, stage);
  },

function fmt(secs) {
  secs = Math.max(0, Math.round(secs));
  var h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
  if (h > 0) return h + 'h' + (m ? m + 'm' : '');
  if (m > 0) return m + 'm' + (s ? s + 's' : '');
  return s + 's';
}

function updateTileTooltip(tile, x, y) {
  var tt = document.getElementById('crop-tooltip');
  if (!tile || !tile.cropId) { tt.classList.remove('visible'); return; }
  var health = tile.health || 0;
  var hColor = health > 60 ? '#44DD44' : health > 30 ? '#FFBB22' : '#FF4444';
  var secs = tile.secsRemaining || 0;
  var timeStr = secs > 3600 ? Math.floor(secs/3600) + 'h' + Math.floor((secs%3600)/60) + 'm'
              : secs > 60   ? Math.floor(secs/60) + 'm'
              : secs + 's';
  var warns = [];
  if (tile.isDry) warns.push('💧 缺水');
  if (tile.hasPest) warns.push('🐛 有害虫');
  if (tile.hasWeed) warns.push('🌿 有杂草');
  if (tile.isWithered) warns.push('💀 已枯萎');
  var statusStr = tile.isRipe ? '<span style="color:#FFD020;font-weight:800">✅ 已成熟！</span>' : '';
  tt.innerHTML =
    '<div class="tt-name">' + (tile.cropNameCn || tile.cropId) + '</div>'
    + '<div class="tt-bar-wrap"><div class="tt-bar-inner" style="width:'+health+'%;background:'+hColor+'"></div></div>'
    + '<div class="tt-row"><span>生命</span><span class="tt-val">'+health+'%</span></div>'
    + (!tile.isRipe && !tile.isWithered ? '<div class="tt-row"><span>剩余</span><span class="tt-val">'+timeStr+'</span></div>' : '')
    + (statusStr ? '<div style="margin-top:3px">'+statusStr+'</div>' : '')
    + (warns.length ? '<div class="tt-warn">'+warns.join(' ')+'</div>' : '');
  var ttW = 155, ttH = 110;
  var bx = Math.min(x + 12, window.innerWidth - ttW - 6);
  var by = Math.max(y - ttH - 8, 4);
  tt.style.left = bx + 'px';
  tt.style.top  = by + 'px';
  tt.classList.add('visible');
}

function hideTooltip() {
  document.getElementById('crop-tooltip').classList.remove('visible');
}

function checkAlerts(s) {
  var newPest = 0, newWeed = 0, newWithered = 0;
  (s.tiles || []).forEach(function(t) {
    if (!t) return;
    var prev = _tileAlertState[t.index] || {};
    if (t.hasPest && !prev.hasPest) newPest++;
    if (t.hasWeed && !prev.hasWeed) newWeed++;
    if (t.isWithered && !prev.isWithered) newWithered++;
    _tileAlertState[t.index] = { hasPest: t.hasPest, hasWeed: t.hasWeed, isWithered: t.isWithered };
  });
  (s.poolTiles || []).forEach(function(t, i) {
    if (!t) return;
    var key = 'pool_' + i;
    var prev = _tileAlertState[key] || {};
    if (t.hasPest && !prev.hasPest) newPest++;
    _tileAlertState[key] = { hasPest: t.hasPest };
  });
  if (newPest > 0) showAlertBanner('🐛 ' + newPest + ' 块地出现害虫！快用铲子处理', 'pest');
  if (newWeed > 0) showAlertBanner('🌿 ' + newWeed + ' 块地长了杂草！快去除草', 'pest');
  if (newWithered > 0) showAlertBanner('💀 ' + newWithered + ' 株作物已枯萎！用铲子清理再种', 'withered');
}

function harvestEffect(x, y, coins) {
  // 1. Leaf burst (green confetti)
  for (var i = 0; i < 10; i++) {
    var leaf = document.createElement('div');
    leaf.className = 'leaf-bit';
    var ang = (i / 10) * Math.PI * 2 + Math.random()*.4;
    var dist = 50 + Math.random() * 40;
    leaf.style.left = x + 'px';
    leaf.style.top  = y + 'px';
    leaf.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
    leaf.style.setProperty('--dy', Math.sin(ang)*dist - 20 + 'px');
    leaf.style.setProperty('--rot', (Math.random()*720 - 360) + 'deg');
    leaf.style.background = Math.random() > .5
      ? 'radial-gradient(ellipse 60% 90% at 50% 100%,#5BC020,#2A7818)'
      : 'radial-gradient(ellipse 60% 90% at 50% 100%,#A0D848,#487018)';
    document.body.appendChild(leaf);
    setTimeout(function(e){ e.remove(); }, 950, leaf);
  }

  // 2. Sun-coins fly to coin balance HUD (classic PvZ collect)
  var hud = document.getElementById('coin-hud');
  var hr = hud ? hud.getBoundingClientRect() : {left:x, top:y, width:0, height:0};
  var target = { x: hr.left + hr.width/2, y: hr.top + hr.height/2 };
  var nCoins = Math.min(7, Math.max(3, Math.ceil(coins / 8)));
  for (var k = 0; k < nCoins; k++) {
    (function(idx){
      setTimeout(function(){
        var coin = document.createElement('div');
        coin.className = 'sun-coin';
        coin.textContent = '$';
        var bx = (Math.random() - .5) * 50;
        coin.style.left = x + 'px';
        coin.style.top  = y + 'px';
        coin.style.setProperty('--bx', bx + 'px');
        coin.style.setProperty('--cx', (target.x - x) + 'px');
        coin.style.setProperty('--cy', (target.y - y) + 'px');
        coin.style.setProperty('--ox', '0px');
        coin.style.setProperty('--oy', '0px');
        document.body.appendChild(coin);
        setTimeout(function(){ coin.remove(); }, 1700);
      }, idx * 90);
    })(k);
  }
}

function renderPackets(s) {
  var rail = document.getElementById('packet-rail');
  rail.innerHTML = '';
  var playerLv = s.playerLevel || 1;
  s.crops.forEach(function(c) {
    var locked = (c.levelReq || 1) > playerLv;
    var div = document.createElement('div');
    div.className = 'seed-pkt' + (selCrop === c.id ? ' pkt-selected' : '');
    if (locked) div.classList.add('pkt-locked');
    else if (s.coinBalance < c.seedCost) div.classList.add('pkt-poor');
    // Seed packet thumbnail: use inline SVG art when available, else fallback img
    var thumbSvg = SVGS.ripe[c.id];
    // Strip the card background rect so the plant renders transparent in the bar
    var thumbSvgBare = thumbSvg ? thumbSvg.replace(/<rect[^>]*rx="\d+"[^>]*\/?>/,'') : null;
    var thumbFallback = '<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="30" r="26" fill="' + (c.color||'#5A9A20') + '" opacity=".85"/><text x="30" y="36" text-anchor="middle" font-size="22" fill="#FFF" opacity=".9">' + (c.nameCn||'?').charAt(0) + '</text></svg>';
    var thumb = thumbSvgBare
      ? '<div class="pkt-card-img" style="display:flex;align-items:center;justify-content:center;height:60px;overflow:visible">' + thumbSvgBare + '</div>'
      : '<div class="pkt-card-img" style="display:flex;align-items:center;justify-content:center;height:60px;overflow:visible">' + thumbFallback + '</div>';
    var lockBadge = locked ? '<div class="pkt-lock-badge">🔒 Lv.' + (c.levelReq||1) + '</div>' : '';
    var aquaBadge = c.isAquatic ? '<div class="pkt-lock-badge" style="background:rgba(30,140,220,.85);border-color:#40A8FF">💧</div>' : '';
    div.innerHTML = thumb + '<div class="pkt-cost"><div class="cost-sun"></div>' + c.seedCost + '</div>' + lockBadge + aquaBadge;
    div.title = c.nameCn + ' · 种费 ' + c.seedCost + (c.isAquatic ? ' · 水生（种在水池）' : '') + (locked ? '  (需要 Lv.' + c.levelReq + ')' : '');
    makePktDraggable(div, c.id, locked);
    div.addEventListener('click', function() {
      if (locked) { toast('需要 Lv.' + (c.levelReq||1) + ' 才能种植 ' + c.nameCn, 2400); return; }
      selCrop = selCrop === c.id ? null : c.id;
      renderPackets(state);
      if (selCrop) toast('已选：' + c.nameCn + ' — 点击空地种植', 2600);
    });
    rail.appendChild(div);
  });
}

/* Build one grass tile element for plantable slot `i` (0..unlocked) or locked slot */
function buildGrassTile(s, i, isUnlocked) {
  var el = document.createElement('div');
  if (!isUnlocked) {
    el.className = 'farm-tile empty locked';
    el.addEventListener('click', function(){
      toast('还未开垦！点击商店→土地解锁更多格子 🌱', 2400);
    });
    return el;
  }
  var tile = s.tiles[i] || {};
  var isEmpty = !tile.cropId && !tile.isWithered;
  el.className = 'farm-tile' + (isEmpty ? ' empty' : '');
  el.dataset.idx = i;
  if (tile.skinId === 'red')      el.style.background = 'radial-gradient(circle,rgba(200,60,30,.22),transparent 75%)';
  if (tile.skinId === 'black')    el.style.background = 'radial-gradient(circle,rgba(20,10,4,.32),transparent 75%)';
  if (tile.skinId === 'gold')     el.style.background = 'radial-gradient(circle,rgba(255,200,30,.22),transparent 75%)';
  if (tile.skinId === 'purple')   el.style.background = 'radial-gradient(circle,rgba(140,30,200,.28),transparent 75%)';
  if (tile.skinId === 'jade')     el.style.background = 'radial-gradient(circle,rgba(20,160,70,.26),transparent 75%)';
  if (tile.skinId === 'crystal')  el.style.background = 'radial-gradient(circle,rgba(40,120,220,.28),transparent 75%)';
  if (tile.skinId === 'celestial') el.style.background = 'radial-gradient(circle,rgba(200,40,255,.32),transparent 75%)';

  // Withered dead plant state
  if (tile.isWithered) {
    var plant = document.createElement('div');
    plant.className = 'tile-plant is-withered';
    plant.style.animationDelay = ((i * 137) % 1800) + 'ms';
    plant.innerHTML = SVGS.withered;
    el.appendChild(plant);
    var wb = document.createElement('div');
    wb.className = 'dry-b';
    wb.textContent = '枯萎';
    wb.style.background = 'rgba(100,70,30,0.85)';
    el.appendChild(wb);
  } else if (tile.cropId) {
    var stage = tile.isRipe ? 4 : (tile.stage || 0);
    var plant = document.createElement('div');
    var pCls = 'tile-plant';
    if (tile.isRipe) pCls += ' is-ripe';
    if (tile.isDry && !tile.isRipe) pCls += ' is-dry';
    plant.className = pCls;
    plant.style.animationDelay = ((i * 137) % 1800) + 'ms';
    if (stage >= 4) {
      var ripeSvg = (SVGS.ripe && SVGS.ripe[tile.cropId]) ? SVGS.ripe[tile.cropId] : null;
      if (ripeSvg) ripeSvg = ripeSvg.replace(/<rect[^>]*rx="\d+"[^>]*\/?>/,'');
      plant.innerHTML = ripeSvg || SVGS.stage(tile.cropColor, 4);
    } else {
      plant.innerHTML = SVGS.growStage(tile.cropId, tile.cropColor, stage);
    }
    el.appendChild(plant);

    // Fertilized badge (current stage already fertilized = !canFertilize and growing)
    if (tile.cropId && !tile.canFertilize && !tile.isRipe) {
      var fb = document.createElement('div');
      fb.style.cssText = 'position:absolute;bottom:3px;left:3px;font-size:11px;z-index:9;'
        + 'color:#88FF44;text-shadow:0 0 5px #44AA00;pointer-events:none;animation:badgePulse 1.6s ease-in-out infinite alternate;';
      fb.textContent = '✦';
      el.appendChild(fb);
    }
    // Pest / weed badges + shake animation
    if (tile.hasPest) {
      var pb = document.createElement('div'); pb.className = 'pest-badge'; pb.textContent = '🐛';
      el.appendChild(pb);
      el.classList.add('has-pest-anim');
    }
    if (tile.hasWeed) {
      var wbd = document.createElement('div'); wbd.className = 'weed-badge'; wbd.textContent = '🌿';
      el.appendChild(wbd);
    }

    var bw = document.createElement('div'); bw.className = 't-bar-wrap';
    var b = document.createElement('div');
    b.className = 't-bar ' + (tile.isRipe ? 'bar-r' : tile.isDry ? 'bar-d' : 'bar-g');
    b.style.width = Math.round((tile.progress || 0) * 100) + '%';
    bw.appendChild(b); el.appendChild(bw);

    if (tile.isRipe) {
      var rb = document.createElement('div'); rb.className = 'ripe-b'; rb.textContent = '✓熟';
      el.appendChild(rb);
    } else if (tile.isDry) {
      var db = document.createElement('div'); db.className = 'dry-b'; db.textContent = '缺水';
      el.appendChild(db);
    } else if (tile.secsRemaining > 0) {
      var cd = document.createElement('div'); cd.className = 'tile-cd';
      cd.dataset.idx = i; cd.dataset.rem = tile.secsRemaining;
      cd.textContent = fmt(tile.secsRemaining);
      el.appendChild(cd);
    }
  }
  el.addEventListener('mouseenter', function(ev) {
    if (!state) return;
    var t = state.tiles[i];
    if (t && t.cropId) updateTileTooltip(t, ev.clientX, ev.clientY);
  });
  el.addEventListener('mousemove', function(ev) {
    if (!state) return;
    var t = state.tiles[i];
    if (t && t.cropId) updateTileTooltip(t, ev.clientX, ev.clientY);
  });
  el.addEventListener('mouseleave', hideTooltip);
  el.addEventListener('click', onTile);
  makeTileDropTarget(el, i, isEmpty);
  return el;
}

function buildPoolTile(idx, s) {
  var el = document.createElement('div');
  el.className = 'farm-tile pool-tile';
  el.dataset.poolIdx = idx;

  var pt = s && s.poolTiles && s.poolTiles[idx];
  var playerLv = s ? (s.playerLevel || 1) : 1;
  var POOL_UNLOCK_LV = 1;

  if (playerLv < POOL_UNLOCK_LV) {
    el.classList.add('locked');
    el.innerHTML = '<div style="position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:9px;color:rgba(255,230,140,.7);white-space:nowrap">Lv.'+POOL_UNLOCK_LV+'解锁</div>';
    el.addEventListener('click', function(){
      toast('🎣 升到 Lv.'+POOL_UNLOCK_LV+' 即可在水中种植水生作物！', 2600);
    });
    return el;
  }

  if (!pt || !pt.cropId) {
    el.addEventListener('click', function(){
      if (selCrop) { doPoolPlant(idx); return; }
      // Click empty pool tile → open fishing directly (no intermediate prompt)
      openFishing();
    });
    makePoolDropTarget(el, idx, true);
    return el;
  }

  // Has a crop
  el.classList.add('pool-has-plant');
  var stage = pt.stage || 0;
  var progress = Math.round((pt.progress || 0) * 100);
  var ripeSvg = (SVGS.ripe && SVGS.ripe[pt.cropId]) ? SVGS.ripe[pt.cropId] : null;
  var plantHtml = ripeSvg
    ? '<div class="tile-plant" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:0">'
        + ripeSvg.replace(/<rect[^>]*rx="\d+"[^>]*\/?>/,'') + '</div>'
    : '<div class="tile-plant" style="display:flex;align-items:center;justify-content:center;font-size:22px;width:100%;height:100%">'
        + (pt.isRipe ? '🌿' : (stage > 1 ? '🌱' : '🌿')) + '</div>';

  var badgeHtml = '';
  if (pt.isWithered) badgeHtml = '<div class="wither-badge">💀</div>';
  else if (pt.hasPest) badgeHtml = '<div class="pest-badge">🐛</div>';

  var cdHtml = '';
  if (!pt.isRipe && !pt.isWithered && pt.secsRemaining > 0) {
    cdHtml = '<div class="tile-cd" data-pool-idx="'+idx+'">'+fmt(pt.secsRemaining)+'</div>';
  } else if (pt.isRipe) {
    cdHtml = '<div class="tile-cd ripe-cd">成熟✓</div>';
  }

  var healthBar = pt.health < 80
    ? '<div class="tile-health" style="width:'+pt.health+'%"></div>'
    : '';

  var fertDot = (pt.canFertilize && !pt.isRipe) ? '<div class="fert-dot" title="可施肥">✦</div>' : '';

  el.innerHTML = plantHtml + badgeHtml + cdHtml + healthBar + fertDot;

  el.addEventListener('click', onPoolTile);
  makePoolDropTarget(el, idx, false);
  return el;
}

function renderGrid(s) {
  var up   = document.getElementById('tile-grid-upper');
  var pool = document.getElementById('tile-grid-pool');
  var lo   = document.getElementById('tile-grid-lower');
  up.innerHTML = ''; lo.innerHTML = '';
  // Clear pool tiles but preserve the fish layer div
  Array.from(pool.children).forEach(function(c){ if (c.id !== 'pool-fish-layer') c.remove(); });
  var fishLayer = document.getElementById('pool-fish-layer');
  if (!fishLayer) { fishLayer = document.createElement('div'); fishLayer.id = 'pool-fish-layer'; pool.appendChild(fishLayer); }

  var n = s.tileCount;
  /* Upper zone: plantable tiles 0 .. UPPER_TILES-1 */
  for (var i = 0; i < UPPER_TILES; i++) {
    up.appendChild(buildGrassTile(s, i, i < n));
  }
  /* Pool zone: 8 aquatic planting tiles */
  for (var p = 0; p < GRID_COLS; p++) {
    pool.appendChild(buildPoolTile(p, s));
  }
  /* Lower zone: plantable tiles UPPER_TILES .. GRASS_TILES-1 */
  for (var k = 0; k < LOWER_TILES; k++) {
    var idx = UPPER_TILES + k;
    lo.appendChild(buildGrassTile(s, idx, idx < n));
  }
  alignGrid();
}

/* ═══════════════ ACTIONS ════════════════════════════════════════════════════ */
function doPlant(idx) {
  if (!state || !T || !selCrop) return;
  // Aquatic crops can only be planted in pool tiles
  var cropDef = state.crops && state.crops.find(function(c){ return c.id === selCrop; });
  if (cropDef && cropDef.isAquatic) { toast('水生作物只能种在水池里 💧 — 拖到水中格子'); return; }
  var tileEl = document.querySelector('.farm-tile[data-idx="' + idx + '"]');
  var rect = tileEl ? tileEl.getBoundingClientRect() : null;
  var cx = rect ? rect.left + rect.width/2 : 0;
  var cy = rect ? rect.top  + rect.height/2 : 0;
  T.invoke('farm_plant', {tileIdx: idx, cropId: selCrop})
    .then(function(r) {
      var xp = (r && r.xpGained) || 0;
      toast('种植成功！+' + xp + ' XP 🌱');
      if (xp) showXpFloat(cx, cy, xp);
      selCrop = null;
      refresh();
      setTimeout(function() {
        var pl = tileEl && tileEl.querySelector('.tile-plant');
        if (pl) { pl.classList.add('just-planted'); setTimeout(function() { pl.classList.remove('just-planted'); }, 600); }
      }, 60);
    })
    .catch(function(er) { toast('' + er); });
}

function onTile(e) {
  if (!state || !T) return;
  var idx = parseInt(this.dataset.idx);
  var tile = state.tiles[idx];
  if (!tile) return;

  var rect = this.getBoundingClientRect();
  var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;

  // Planting — blocked by withered
  if (selCrop) {
    if (tile.isWithered) { toast('先用铲子清除枯萎 🪴'); return; }
    doPlant(idx);
    return;
  }

  // Shovel tool — smart multi-action
  if (activeTool === 'clear') {
    if (tile.isRipe) { toast('先收割！再清除 🌾'); return; }
    if (tile.isWithered) {
      // Clear withered → +3 XP
      T.invoke('farm_clear', {tileIdx:idx})
        .then(function(r){
          var xp = (r && r.xpGained) || 0;
          toast('清除枯萎 +' + xp + ' XP ♻️');
          showXpFloat(cx, cy, xp);
          refresh();
        })
        .catch(function(e){ toast(''+e); });
    } else if (tile.hasPest) {
      T.invoke('farm_clear', {tileIdx:idx})
        .then(function(r){
          var xp = (r && r.xpGained) || 0;
          toast('除虫成功！+' + xp + ' XP 🐛');
          showXpFloat(cx, cy, xp, '🐛');
          refresh();
        })
        .catch(function(e){ toast(''+e); });
    } else if (tile.hasWeed) {
      T.invoke('farm_clear', {tileIdx:idx})
        .then(function(r){
          var xp = (r && r.xpGained) || 0;
          toast('除草成功！+' + xp + ' XP 🌿');
          showXpFloat(cx, cy, xp, '🌿');
          refresh();
        })
        .catch(function(e){ toast(''+e); });
    } else if (tile.cropId) {
      showClearConfirm(idx, cx, cy, tile.cropNameCn, tile.cropId);
    } else {
      toast('空地无需清理');
    }
    return;
  }

  // Non-clear tools on withered tile
  if (tile.isWithered) { toast('枯萎了！用铲子清除后再种 🪴'); return; }

  // Open skin shop on empty tile with harvest tool
  if (!tile.cropId && activeTool === 'harvest') {
    pendingSkinTile = idx; openShop('skin'); return;
  }
  if (!tile.cropId) { toast('空地 — 先从顶部选种子'); return; }

  if (activeTool === 'harvest') {
    if (!tile.isRipe) { toast('还没成熟！再等等 ⏳'); return; }
    T.invoke('farm_harvest', {tileIdx:idx})
      .then(function(r){
        var units = r.units || 0;
        var xp = r.xpGained || 0;
        if (r.isGolden) showGoldenFlash(cx, cy - 20);
        showHarvestPopup(tile.cropId, tile.cropNameCn, units, xp, r.isGolden);
        showXpFloat(cx, cy, xp);
        harvestEffect(cx, cy, units);
        refresh();
      })
      .catch(function(e){ toast(''+e); });
  } else if (activeTool === 'water') {
    if (tile.isRipe) { toast('已成熟，先收割！'); return; }
    waterEffect(cx, cy);
    T.invoke('farm_water', {tileIdx:idx})
      .then(function(r){
        var xp = (r && r.xpGained) || 0;
        toast('浇水成功 +' + xp + ' XP 💧');
        showXpFloat(cx, cy, xp, '💧');
        refresh();
      })
      .catch(function(e){ toast(''+e); });
  } else if (activeTool === 'fertilize') {
    if (tile.isRipe) { toast('已成熟不需施肥'); return; }
    if (!tile.canFertilize) { toast('此阶段已施过肥'); return; }
    fertEffect(cx, cy);
    T.invoke('farm_fertilize', {tileIdx:idx})
      .then(function(cost){ toast('施肥加速！消耗 '+cost+' 金币 ☀ 🌱'); refresh(); })
      .catch(function(e){ toast(''+e); });
  }
}
