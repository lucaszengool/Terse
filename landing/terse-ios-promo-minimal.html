<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terse — Save Tokens. Save Money.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-page: #CFDB72;        /* soft sage-lime — less neon, more pastel */
    --bg-phone: #D6E07E;       /* phone interior: a hair lighter & warmer */
    --ink: #111210;            /* near-black */
    --ink-soft: #5a5d4e;       /* muted dark olive grey for secondary text */
    --ink-faint: #767867;      /* very soft for tertiary */
    --accent: #2f6b1c;         /* deeper green for icons */
    --line: #1a1c18;           /* phone outline */
  }

  html, body { height: 100%; }

  body {
    background: var(--bg-page);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 64px 24px 80px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    color: var(--ink);
    position: relative;
    overflow-x: hidden;
  }

  /* Subtle paper grain overlay — gives it that printed/illustrated feel */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
      radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 3px 3px, 5px 5px;
    background-position: 0 0, 1px 2px;
    pointer-events: none;
    z-index: 1;
    opacity: 0.55;
  }

  /* Soft vignette to add atmosphere (like the fish-can reference) */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(60,80,20,0.10) 100%);
    pointer-events: none;
    z-index: 1;
  }

  .page {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 2;
  }

  /* ── Headline ── */
  .headline {
    text-align: center;
    margin-bottom: 8px;
  }

  /* tiny accent label above heading */
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }
  .eyebrow .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }

  .headline h1 {
    font-size: 44px;
    font-weight: 800;
    line-height: 1.0;
    color: var(--ink);
    letter-spacing: -2.2px;
  }

  .headline h1 em {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    letter-spacing: -1.5px;
  }

  .headline .tagline {
    margin-top: 18px;
    font-size: 14.5px;
    font-weight: 400;
    color: var(--ink-soft);
    letter-spacing: 0.1px;
    line-height: 1.5;
  }

  /* ── Phone ── */
  .phone-wrap {
    margin-top: 56px;
    position: relative;
  }

  /* Soft glow/shadow under phone — atmospheric like reference */
  .phone-wrap::before {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -40px;
    transform: translateX(-50%);
    width: 75%;
    height: 40px;
    background: radial-gradient(ellipse, rgba(40,60,10,0.20) 0%, transparent 70%);
    filter: blur(14px);
    z-index: -1;
  }

  .phone {
    width: 320px;
    height: 716px;
    background: var(--bg-phone);
    border: 1.2px solid var(--line);
    border-radius: 46px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.4) inset,
      0 30px 60px -20px rgba(40,60,10,0.18);
    flex-shrink: 0;
  }

  /* Dynamic Island */
  .di {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 28px;
    background: var(--line);
    border-radius: 16px;
    z-index: 10;
  }

  /* Status bar */
  .sb {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 22px 0;
    z-index: 5;
  }

  .sb-time {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.2px;
  }

  .sb-right {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .signal {
    display: flex;
    align-items: flex-end;
    gap: 1.5px;
    height: 9px;
  }
  .signal b {
    width: 2.5px;
    background: var(--ink);
    border-radius: 1px;
    display: block;
  }
  .signal b:nth-child(1) { height: 3px; }
  .signal b:nth-child(2) { height: 5px; }
  .signal b:nth-child(3) { height: 7px; opacity: 0.3; }
  .signal b:nth-child(4) { height: 9px; opacity: 0.3; }

  .wifi-svg { width: 13px; height: 10px; }

  .batt {
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    font-size: 9px;
    font-weight: 600;
    padding: 1px 4px 1px 3px;
    border-radius: 3px;
    letter-spacing: -0.2px;
    display: flex;
    align-items: center;
    line-height: 1;
    opacity: 0.85;
  }

  /* ── Content ── */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 240px 30px 0;
  }

  /* tiny decorative glyph above wordmark */
  .glyph {
    width: 28px;
    height: 28px;
    margin-bottom: 18px;
    opacity: 0.9;
  }
  .glyph svg { display: block; }

  .app-name {
    font-family: 'Fraunces', 'Inter', serif;
    font-size: 56px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: -2.5px;
    line-height: 0.95;
    text-align: center;
  }

  .app-sub {
    margin-top: 10px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
  }

  /* Hairline divider */
  .divider {
    margin: 32px auto 0;
    width: 28px;
    height: 1px;
    background: var(--ink);
    opacity: 0.3;
  }

  /* Features */
  .features {
    margin-top: 28px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 0 12px;
  }

  .feat {
    display: flex;
    align-items: center;
    gap: 13px;
  }

  .feat-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .feat svg { display: block; }

  .feat-text {
    font-size: 13px;
    font-weight: 400;
    color: var(--ink);
    letter-spacing: -0.1px;
    opacity: 0.9;
  }

  /* CTA */
  .cta-btn {
    margin-top: 36px;
    width: 100%;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 100px;
    padding: 14px 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .cta-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
  }

  .cta-btn svg {
    fill: #fff;
    width: 15px;
    height: 15px;
    display: block;
  }

  .cta-label {
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.2px;
  }

  .cta-note {
    margin-top: 14px;
    font-size: 10.5px;
    font-weight: 400;
    color: var(--ink-faint);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-align: center;
  }

  /* Home indicator */
  .home-bar {
    position: absolute;
    bottom: 7px;
    left: 50%;
    transform: translateX(-50%);
    width: 104px;
    height: 4px;
    background: var(--line);
    border-radius: 3px;
    opacity: 0.75;
  }

  /* Footer mark below the phone */
  .footnote {
    margin-top: 56px;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align: center;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .footnote::before, .footnote::after {
    content: '';
    width: 24px;
    height: 1px;
    background: var(--ink-faint);
    opacity: 0.5;
  }
</style>
</head>
<body>
<div class="page">

  <div class="headline">
    <div class="eyebrow"><span class="dot"></span> A Smarter Keyboard</div>
    <h1>Save Tokens.<br><em>Save Money.</em></h1>
    <p class="tagline">A quietly intelligent keyboard,<br>made for the AI era.</p>
  </div>

  <!-- Phone -->
  <div class="phone-wrap">
    <div class="phone">

      <div class="di"></div>

      <div class="sb">
        <span class="sb-time">21:06</span>
        <div class="sb-right">
          <div class="signal"><b></b><b></b><b></b><b></b></div>
          <svg class="wifi-svg" viewBox="0 0 24 17" fill="currentColor" xmlns="http://www.w3.org/2000/svg" style="color: var(--ink)">
            <path d="M12 3.8C8.3 3.8 5 5.3 2.6 7.7L0 5.1C3.1 2 7.3 0 12 0s8.9 2 12 5.1l-2.6 2.6C19 5.3 15.7 3.8 12 3.8zm0 5.4c-2.4 0-4.5.9-6.1 2.4L3.6 9.3C5.7 7.2 8.7 6 12 6s6.3 1.2 8.4 3.3l-2.3 2.3C16.5 10.1 14.4 9.2 12 9.2zm0 5.3c-1.2 0-2.3.5-3.1 1.3L12 19.5l3.1-3.1c-.8-.9-1.9-1.4-3.1-1.4z"/>
          </svg>
          <div class="batt">98</div>
        </div>
      </div>

      <div class="content">

        <!-- Decorative glyph: minimal scissors-like / cut symbol -->
        <div class="glyph">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="color: var(--ink)">
            <circle cx="16" cy="6" r="3"/>
            <path d="M16 9 V20"/>
            <path d="M16 20 L10 28"/>
            <path d="M16 20 L22 28"/>
            <circle cx="10" cy="28" r="2"/>
            <circle cx="22" cy="28" r="2"/>
          </svg>
        </div>

        <div class="app-name">Terse</div>
        <div class="app-sub">Prompt Optimizer</div>

        <div class="divider"></div>

        <div class="features">
          <div class="feat">
            <div class="feat-icon">
              <svg width="13" height="16" viewBox="0 0 14 22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" style="color: var(--accent)">
                <path d="M8 1L1.5 12H6.5L5.5 21L13 10H7.5L8 1Z"/>
              </svg>
            </div>
            <span class="feat-text">Reduce tokens up to 70%</span>
          </div>

          <div class="feat">
            <div class="feat-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" style="color: var(--accent)">
                <circle cx="12" cy="12" r="9.5"/>
                <ellipse cx="12" cy="12" rx="4" ry="9.5"/>
                <path d="M2.5 12h19"/>
              </svg>
            </div>
            <span class="feat-text">Works with any language</span>
          </div>

          <div class="feat">
            <div class="feat-icon">
              <svg width="14" height="16" viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent)">
                <path d="M12 2v15"/>
                <path d="M7 7l5-5 5 5"/>
                <path d="M4 14v10a2 2 0 002 2h12a2 2 0 002-2V14"/>
              </svg>
            </div>
            <span class="feat-text">Share from any app</span>
          </div>
        </div>

        <button class="cta-btn">
          <svg viewBox="0 0 24 24">
            <path d="M12 12c2.65 0 4.8-2.15 4.8-4.8S14.65 2.4 12 2.4 7.2 4.55 7.2 7.2 9.35 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
          <span class="cta-label">Sign in to get started</span>
        </button>

        <div class="cta-note">Free · 500 / week</div>
      </div>

      <div class="home-bar"></div>
    </div>
  </div>

  <div class="footnote">Made with care</div>

</div>
</body>
</html>
