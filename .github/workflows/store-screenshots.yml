name: Store screenshots (Windows)

# Microsoft Store policy 10.1.1.3 (cert report 09-18): listing screenshots must
# be direct captures of the product running on Windows. This takes the exact
# Terse.msix built by "Build Windows Store package (MSIX)", unpacks it on a fresh
# Windows runner, runs it, and photographs the desktop. Nothing is composited.
#
# Staging, and nothing else:
#  - the runner's own console is minimized and its desktop icons hidden;
#  - the wallpaper is switched on the way a user switches it on (wallpaper.json);
#  - the info stream starts with no auto-added sources, so the runner's console
#    title doesn't become the wallpaper's headline;
#  - the Pro scenes run with a local test license (tier "pro") — the same local
#    file a paying user's machine holds. The wallpaper page checks entitlement
#    where it draws, so Pro styles only render because this says Pro. Those
#    shots are captioned as Pro in the listing.
#
# Runs on its own so retaking photos never costs a rebuild of a verified package.
on:
  push:
    branches: [store/submission-2]
    paths: ['.github/workflows/store-screenshots.yml']

permissions:
  actions: read
  contents: read

env:
  # The build run whose Terse.msix goes to the Store (1.3.4.0, 147fd98c).
  MSIX_RUN_ID: '35336138438'

jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Fetch the submitted MSIX
        uses: actions/download-artifact@v4
        with:
          name: Terse-MSIX
          run-id: ${{ env.MSIX_RUN_ID }}
          github-token: ${{ github.token }}
          path: msix

      - name: Unpack it (an MSIX is a zip)
        run: |
          Copy-Item msix\Terse.msix msix\Terse.zip
          Expand-Archive msix\Terse.zip -DestinationPath app -Force
          Select-String -Path app\AppxManifest.xml -Pattern 'Version="[^"]+"' | Select-Object -First 1 | ForEach-Object { $_.Matches[0].Value }

      - name: Capture
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop }
          catch { Write-Host "::warning::Set-DisplayResolution failed: $_" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
          }
          "@

          $out = "$env:RUNNER_TEMP\shots"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $home2 = "$env:USERPROFILE\.terse"
          New-Item -ItemType Directory -Force -Path $home2 | Out-Null
          $app = (Resolve-Path app).Path

          function Snap([string]$name) {
            [W]::SetCursorPos(1919, 1079) | Out-Null
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$out\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Write-Host "$name.png  $($b.Width)x$($b.Height)"
          }
          function Keys([string]$k) { [System.Windows.Forms.SendKeys]::SendWait($k) }

          # Press a button by its accessible name, wherever its window landed.
          function Press([string]$rx) {
            $A = [System.Windows.Automation.AutomationElement]
            $procs = @(Get-Process Terse -ErrorAction SilentlyContinue | ForEach-Object Id)
            $cond = New-Object System.Windows.Automation.PropertyCondition($A::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)
            foreach ($w in $A::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)) {
              if ($procs -notcontains $w.Current.ProcessId) { continue }
              foreach ($b in $w.FindAll([System.Windows.Automation.TreeScope]::Descendants, $cond)) {
                if ($b.Current.Name -match $rx -and -not $b.Current.IsOffscreen) {
                  Write-Host "press: '$($b.Current.Name)' in '$($w.Current.Name)'"
                  try { $b.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); return $true } catch { Write-Host "  invoke failed: $_" }
                }
              }
            }
            return $false
          }
          function Onboard {
            foreach ($i in 1..6) {
              if (-not (Press '^(Continue|Done|Get started|Got it|Skip|Start|Let.s go)')) { break }
              Start-Sleep -Seconds 4
            }
          }

          function Wallpaper([string]$engine, [string]$style, [bool]$view3d) {
            @{
              enabled = $true; engine = $engine; style = $style
              view3d = @{ on = $view3d; az = 0.55; el = 0.28; dist = 1.0; dim = $false }
              theme = 'neon'; quality = 56; angle = 55; intensity = 1.0
            } | ConvertTo-Json -Depth 4 | Set-Content "$home2\wallpaper.json" -Encoding UTF8
          }
          function License([bool]$pro) {
            if ($pro) {
              @{ tier = 'pro'; status = 'active'; clerkUserId = $null; expiresAt = $null; trialEnd = $null
                 limits = @{ optimizations_per_week = -1; max_sessions = 3; max_devices = 2 } } |
                ConvertTo-Json -Depth 4 | Set-Content "$home2\license.json" -Encoding UTF8
            } else { Remove-Item "$home2\license.json" -ErrorAction SilentlyContinue }
          }
          $script:p = $null
          function Launch([int]$settle) {
            $script:p = Start-Process -FilePath "$app\Terse.exe" -WorkingDirectory $app -PassThru
            Start-Sleep -Seconds $settle
          }
          function Quit {
            if ($script:p) { Stop-Process -Id $script:p.Id -Force -ErrorAction SilentlyContinue }
            Get-Process terse-uia, Terse -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 4
          }

          # ── Clear the stage ────────────────────────────────────────────────
          @{ baselined = $true; auto_add = $false; sources = @{}; baselined_kinds = @() } |
            ConvertTo-Json -Depth 4 | Set-Content "$home2\feeds.json" -Encoding UTF8
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name HideIcons -Value 1
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue   # restarts on its own with icons hidden
          Start-Sleep -Seconds 8
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep -Seconds 3

          # ── Free: exactly what a free user sees ────────────────────────────
          License $false
          Wallpaper 'mineradio' 'cinematic' $false
          Launch 45
          Snap "00-first-run"
          Onboard
          Start-Sleep -Seconds 6
          Snap "10-free-wallpaper"
          Keys "^+t"; Start-Sleep -Seconds 10
          Onboard
          Snap "11-free-main-window"
          Keys "^+t"; Start-Sleep -Seconds 4
          Keys "^+d"; Start-Sleep -Seconds 12
          Snap "12-free-doctor"
          Keys "^+d"; Start-Sleep -Seconds 4
          Quit

          # ── Pro wallpaper styles (local test license) ───────────────────────
          License $true
          $n = 20
          foreach ($s in @(@('vortex',$false), @('aurora',$false), @('starfall',$false), @('bloom',$true))) {
            Wallpaper 'cinematic' $s[0] $s[1]
            Launch 40
            Onboard
            foreach ($i in 1..2) { Start-Sleep -Seconds 5; Snap ("{0}-pro-{1}-{2}" -f $n, $s[0], $i) }
            Quit
            $n++
          }

          Get-ChildItem $home2 -Filter *.log -ErrorAction SilentlyContinue | Copy-Item -Destination $out

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Terse-Store-Screenshots-v3
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn
          retention-days: 30
