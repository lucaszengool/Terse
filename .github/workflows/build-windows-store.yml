name: Build Windows Store package (MSIX)

# Produces the .msix the Microsoft Store submission takes. Manual only: it needs
# the Partner Center identity secrets, and a run without them is just a failed
# job on every push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Four-part version, last part 0 (Store reserves it), e.g. 1.3.3.0'
        required: true
        default: '1.3.3.0'

jobs:
  msix:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Every renderer import must exist in the checkout
        run: node src/renderer/renderer-deps.test.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-app/src-tauri

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build terse-uia.exe
        run: |
          dotnet publish windows-app\helpers\terse-uia\terse-uia.csproj `
            -c Release -r win-x64 --self-contained true `
            /p:PublishSingleFile=true -o windows-app\helpers\ -v normal

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the app (no installer — MSIX carries its own payload)
        run: |
          cd windows-app\src-tauri
          # --features msstore: no system input hooks in the Store binary (town_keys).
          cargo tauri build --target x86_64-pc-windows-msvc --no-bundle --features msstore

      # MSIX is a layout directory sealed by MakeAppx: the exe, the resources
      # Tauri would have installed, the tile assets, and the manifest.
      - name: Stage the MSIX layout
        run: |
          $layout = "$env:RUNNER_TEMP\msix"
          New-Item -ItemType Directory -Force -Path $layout | Out-Null
          $rel = "windows-app\src-tauri\target\x86_64-pc-windows-msvc\release"
          Copy-Item "$rel\Terse.exe" $layout
          Copy-Item -Recurse "windows-app\store\Assets" $layout
          # Same resource map tauri.conf.json declares, flattened next to the exe.
          New-Item -ItemType Directory -Force -Path "$layout\hooks","$layout\ml" | Out-Null
          Copy-Item "ml\model\complexity-vocab.json"          "$layout\ml\complexity-vocab.json"
          Copy-Item "src\helpers\terse-compress.js"           $layout
          Copy-Item "windows-app\helpers\terse-rewrite.ps1"   $layout
          Copy-Item "windows-app\helpers\terse-optimize-tools.ps1" $layout
          Copy-Item "windows-app\helpers\terse-uia.exe"       $layout
          Copy-Item "windows-app\helpers\hooks\*"             "$layout\hooks\"
          Get-ChildItem -Recurse $layout | Select-Object FullName

      - name: Fill in the Partner Center identity
        env:
          IDENTITY_NAME: ${{ secrets.MSSTORE_IDENTITY_NAME }}
          IDENTITY_PUBLISHER: ${{ secrets.MSSTORE_IDENTITY_PUBLISHER }}
          PUBLISHER_DISPLAY: ${{ secrets.MSSTORE_PUBLISHER_DISPLAY }}
        run: |
          foreach ($v in 'IDENTITY_NAME','IDENTITY_PUBLISHER','PUBLISHER_DISPLAY') {
            if (-not (Get-Item "env:$v").Value) {
              throw "Missing secret $v. Reserve the app name in Partner Center, then copy the values from Product Identity."
            }
          }
          $version = '${{ github.event.inputs.version }}'
          if ($version -notmatch '^\d+\.\d+\.\d+\.0$') {
            throw "Version must be four parts ending in 0 (the Store reserves the fourth). Got: $version"
          }
          $m = Get-Content windows-app\store\AppxManifest.xml -Raw
          $m = $m.Replace('__IDENTITY_NAME__',      $env:IDENTITY_NAME)
          $m = $m.Replace('__IDENTITY_PUBLISHER__', $env:IDENTITY_PUBLISHER)
          $m = $m.Replace('__PUBLISHER_DISPLAY__',  $env:PUBLISHER_DISPLAY)
          $m = $m.Replace('__VERSION__',            $version)
          Set-Content "$env:RUNNER_TEMP\msix\AppxManifest.xml" $m -Encoding UTF8

      - name: Pack the MSIX
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
                 Where-Object { $_.Name -match '^10\.' } |
                 Sort-Object Name -Descending | Select-Object -First 1
          $makeappx = Join-Path $sdk.FullName "x64\makeappx.exe"
          if (-not (Test-Path $makeappx)) { throw "makeappx.exe not found under $($sdk.FullName)" }
          & $makeappx pack /d "$env:RUNNER_TEMP\msix" /p "$env:RUNNER_TEMP\Terse.msix" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed with $LASTEXITCODE" }

      # The .msixupload is what to submit: the same .msix plus an .appxsym (a zip of Terse.pdb). With it Partner
      # Center symbolicates the hang and crash reports it collects — the 1.4.0/1.4.1 hangs arrived as
      # "Terse.exe!Unknown" because the package carried no symbols.
      - name: Pack the .msixupload (MSIX + symbols)
        run: |
          $version = '${{ github.event.inputs.version }}'
          $base = "Terse_${version}_x64"
          $pdb = "windows-app\src-tauri\target\x86_64-pc-windows-msvc\release\Terse.pdb"
          if (-not (Test-Path $pdb)) { throw "no Terse.pdb — [profile.release] debug must stay on" }
          $work = "$env:RUNNER_TEMP\upload"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item "$env:RUNNER_TEMP\Terse.msix" "$work\$base.msix"
          Compress-Archive -Path $pdb -DestinationPath "$work\$base.zip" -Force
          Move-Item "$work\$base.zip" "$work\$base.appxsym" -Force
          Compress-Archive -Path "$work\$base.msix", "$work\$base.appxsym" -DestinationPath "$work\$base.zip" -Force
          Move-Item "$work\$base.zip" "$env:RUNNER_TEMP\$base.msixupload" -Force
          Get-Item "$env:RUNNER_TEMP\$base.msixupload" | ForEach-Object { Write-Host "$($_.Name) $($_.Length) bytes" }

      # Deliberately UNSIGNED. Store submissions are signed by Microsoft after
      # upload; signing here with our own cert would only make it installable
      # for sideloading, and would need the .pfx as a secret.
      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: Terse-MSIX
          path: |
            ${{ runner.temp }}/Terse.msix
            ${{ runner.temp }}/*.msixupload
          if-no-files-found: error
          retention-days: 30
