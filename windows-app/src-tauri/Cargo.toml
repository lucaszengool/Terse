[package]
name = "terse"
version = "1.3.3"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "8"
dirs = "6"
chrono = "0.4"
# Knowledge graph (graph_extract.rs / graph_store.rs) — identical to macOS.
sha2 = "0.10"
ignore = "0.4"
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"

[target.'cfg(target_os = "windows")'.dependencies]
# Acrylic/Mica blur behind the island + dashboards (Windows equivalent of the
# macOS NSVisualEffectView vibrancy the shared frontend expects).
window-vibrancy = "0.6"
# 评论投屏 reads Windows' Action Center database, which is SQLite. "bundled"
# compiles SQLite from source rather than trusting the host to have it — the CI
# runner already builds C for tree-sitter, so the toolchain is there either way.
rusqlite = { version = "0.32", features = ["bundled"] }
# The gesture tracker's webview must answer its own camera permission request:
# wry only answers clipboard-read, and an unanswered request shows WebView2's
# prompt inside a 1-pixel window nobody can see. Pinned to the SAME 0.38 as wry
# so the ICoreWebView2 types Tauri hands back unify with ours.
webview2-com = "0.38"

# The room agent channel: end-to-end encryption for private rooms (aes-gcm +
# base64 for the "e1:" envelope the room window's WebCrypto also speaks) and
# secret-scanning before anything leaves this machine (regex). Same versions as
# the macOS build — the two sides encrypt and decrypt each other's messages.
aes-gcm = "0.10"
base64 = "0.22"
# app_icon encodes the extracted .exe icon as PNG (already in the tree via tauri).
png = "0.17"
# 粒子模式 encodes each captured frame as JPEG (already in the tree via tauri).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# webview2-com 0.38 is built against windows-core 0.61, NOT the 0.58 this crate
# uses elsewhere — so ICoreWebView2Settings implements 0.61's Interface trait and
# `windows::core::Interface` cannot see its `cast`. polish_webview needs the
# matching trait to reach the newer settings interfaces.
windows-core = "0.61"
regex = "1"
# room_link fills its AES nonces straight from the OS CSPRNG.
getrandom = "0.2"

windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Accessibility",
    # ShellExecuteW("runas") — per-operation UAC elevation for Doctor fixes that
    # hit access-denied, instead of manifesting the whole app as admin.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_Threading",
    # town_keys: GetModuleHandleW for the low-level hooks.
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    # agent_monitor reads a process's command line and working directory from the
    # kernel (NtQueryInformationProcess + the PEB) instead of launching PowerShell
    # for each question on a 5 s timer.
    "Wdk_System_Threading",
    "Win32_System_Kernel",
    # desktop_icon_rects reads Explorer's icon ListView, which lives in another
    # process: the RECT it fills has to be allocated inside explorer.exe and read
    # back out. VirtualAllocEx/VirtualFreeEx come from Memory,
    # Read/WriteProcessMemory from Diagnostics_Debug.
    "Win32_System_Memory",
    # 粒子模式 pastes into another app: the clipboard and SendInput.
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # 信息流「正在播放」reads the system media transport controls (WinRT), the
    # same source as the volume flyout's media tile.
    "Media_Control",
    "Foundation",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "terse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Microsoft Store build: compiles out every system input hook (Code Town's
# town_keys). The Store submission states Terse installs no keyboard hook.
msstore = []
