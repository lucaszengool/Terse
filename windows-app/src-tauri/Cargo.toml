[package]
name = "terse"
version = "1.3.3"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "8"
dirs = "6"
chrono = "0.4"
# Knowledge graph (graph_extract.rs / graph_store.rs) — identical to macOS.
sha2 = "0.10"
ignore = "0.4"
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"

[target.'cfg(target_os = "windows")'.dependencies]
# Acrylic/Mica blur behind the island + dashboards (Windows equivalent of the
# macOS NSVisualEffectView vibrancy the shared frontend expects).
window-vibrancy = "0.6"
# 评论投屏 reads Windows' Action Center database, which is SQLite. "bundled"
# compiles SQLite from source rather than trusting the host to have it — the CI
# runner already builds C for tree-sitter, so the toolchain is there either way.
rusqlite = { version = "0.32", features = ["bundled"] }

windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Accessibility",
    # ShellExecuteW("runas") — per-operation UAC elevation for Doctor fixes that
    # hit access-denied, instead of manifesting the whole app as admin.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    # desktop_icon_rects reads Explorer's icon ListView, which lives in another
    # process: the RECT it fills has to be allocated inside explorer.exe and read
    # back out. VirtualAllocEx/VirtualFreeEx come from Memory,
    # Read/WriteProcessMemory from Diagnostics_Debug.
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "terse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
