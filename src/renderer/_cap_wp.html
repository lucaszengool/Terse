<!doctype html>
<html lang="en"><head>
  <meta name="color-scheme" content="dark"><meta charset="UTF-8">
<title>capture wallpaper</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/jsm/" } }
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060a}
  #stage{position:fixed;inset:0;display:block;width:100vw;height:100vh}
</style></head>
<body>
<canvas id="stage"></canvas>
<script type="module">
import TokenWallpaper3D from './token-wallpaper-3d.js';
const c = document.getElementById('stage');
// theme/quality/angle/intensity chosen to match 音域回响 (warm-gold hot caps + cool body, dense grid)
const wp = new TokenWallpaper3D(c, { theme: (new URLSearchParams(location.search).get('theme')||'gold'), quality: 80, angle: 44, intensity: 1.15 });
window.wp = wp;
try { wp.setActivity && wp.setActivity(0.82); } catch(e){}
// liveliness: periodic token-burst pulses → ripples + occasional meteors (like music-reactive 音域回响)
setInterval(() => { try { wp.pulse(0.3 + Math.random() * 1.15); } catch(e){} }, 400);
window.__ready = true;

// stream the canvas to Node in chunks (avoids giant base64 blobs)
window.__capStream = (secs) => new Promise((resolve, reject) => {
  try {
    const stream = c.captureStream(60);
    const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 24000000 });
    rec.ondataavailable = async (e) => {
      if (!e.data || !e.data.size) return;
      const buf = new Uint8Array(await e.data.arrayBuffer());
      let bin = ''; for (let i = 0; i < buf.length; i++) bin += String.fromCharCode(buf[i]);
      await window.onChunk(btoa(bin));
    };
    rec.onstop = () => resolve(true);
    rec.onerror = (ev) => reject(String(ev.error||ev));
    rec.start(500);                 // emit a chunk every 0.5s
    setTimeout(() => rec.stop(), secs * 1000);
  } catch (e) { reject(e.message); }
});
</script></body></html>
