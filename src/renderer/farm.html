/* ═══════════════ BATCH ACTIONS (QQ Farm style) ═══════════════════════════ */
function harvestAll() {
  if (!state || !T) return;
  var ripeTiles = (state.tiles || []).filter(function(t){ return t && t.isRipe; });
  if (!ripeTiles.length) { toast('没有成熟的作物 🌾'); return; }
  // Flash all ripe plants before harvesting
  ripeTiles.forEach(function(t){
    var el = document.querySelector('.farm-tile[data-idx="'+t.index+'"] .tile-plant');
    if (el) { el.classList.add('harvest-flash'); setTimeout(function(){ el.classList.remove('harvest-flash'); },400); }
  });
  Promise.all(ripeTiles.map(function(t){ return T.invoke('farm_harvest',{tileIdx:t.index}); }))
    .then(function(results){
      var units = results.reduce(function(s,r){ return s+(r.units||0); },0);
      var xp    = results.reduce(function(s,r){ return s+(r.xpGained||0); },0);
      var gold  = results.filter(function(r){ return r.isGolden; }).length;
      toast('🎉 一键收获！共 +'+units+' 个 +'+xp+' XP'+(gold?' 🌟×'+gold:''));
      if (xp) { var c=document.getElementById('quick-actions'); if(c){ var r=c.getBoundingClientRect(); showXpFloat(r.left+60,r.top,xp); } }
      refresh();
    })
    .catch(function(e){ toast(''+e); refresh(); });
}

function waterAllDry() {
  if (!state || !T) return;
  var dryTiles = (state.tiles || []).filter(function(t){ return t && t.isDry && !t.isRipe && !t.isWithered; });
  if (!dryTiles.length) { toast('没有缺水的作物 💧'); return; }
  Promise.all(dryTiles.map(function(t){ return T.invoke('farm_water',{tileIdx:t.index}); }))
    .then(function(results){
      var xp = results.reduce(function(s,r){ return s+((r&&r.xpGained)||0); },0);
      toast('💧 一键浇水！+'+xp+' XP — '+dryTiles.length+' 块地');
      refresh();
    })
    .catch(function(e){ toast(''+e); refresh(); });
}

function clearAllPests() {
  if (!state || !T) return;
  var pestTiles = (state.tiles || []).filter(function(t){ return t && (t.hasPest||t.hasWeed) && !t.isWithered; });
  var poolPestTiles = (state.poolTiles || []).filter(function(t){ return t && t.hasPest && !t.isWithered; });
  if (!pestTiles.length && !poolPestTiles.length) { toast('没有虫害或杂草 ✅'); return; }
  var ops = pestTiles.map(function(t){ return T.invoke('farm_clear',{tileIdx:t.index}); });
  var poolOps = poolPestTiles.map(function(t){ return T.invoke('farm_pool_clear',{poolIdx:t.index}); });
  Promise.all(ops.concat(poolOps))
    .then(function(results){
      var xp = results.reduce(function(s,r){ return s+((r&&r.xpGained)||0); },0);
      toast('🐛 已除虫除草！+'+xp+' XP');
      refresh();
    })
    .catch(function(e){ toast(''+e); refresh(); });
}

function updateQuickActions(s) {
  var ripe = (s.tiles||[]).filter(function(t){ return t&&t.isRipe; }).length;
  var dry  = (s.tiles||[]).filter(function(t){ return t&&t.isDry&&!t.isRipe&&!t.isWithered; }).length;
  var pest = (s.tiles||[]).filter(function(t){ return t&&(t.hasPest||t.hasWeed)&&!t.isWithered; }).length;
  var qa = document.getElementById('quick-actions');
  var bh = document.getElementById('btn-harvest-all');
  var bw = document.getElementById('btn-water-all');
  var bp = document.getElementById('btn-pest-all');
  bh.style.display = ripe > 1 ? '' : 'none';
  bw.style.display = dry  > 1 ? '' : 'none';
  bp.style.display = pest > 0 ? '' : 'none';
  if (bh.textContent.indexOf('(') < 0 || true) bh.textContent = '🌾 一键收获('+(ripe)+')';
  if (bw.textContent.indexOf('(') < 0 || true) bw.textContent = '💧 一键浇水('+(dry)+')';
  if (bp.textContent.indexOf('(') < 0 || true) bp.textContent = '🐛 一键除虫('+(pest)+')';
  qa.style.display = (ripe > 1 || dry > 1 || pest > 0) ? 'flex' : 'none';
}

function showLevelUpConfetti(lv) {

  banner.className = 'levelup-banner';

var FARM_STATE_CACHE_KEY = 'terse_farm_state_v1';

function applyState(s, fromCache) {
  state = s; _lastRefresh = Date.now()/1000;
  document.getElementById('coin-val').textContent = s.coinBalance;
  document.getElementById('harvest-val').textContent = s.harvestCoins || 0;
  var fertBtn = document.querySelector('[data-tool="fertilize"]');
  if (fertBtn) fertBtn.classList.toggle('fert-broke', (s.coinBalance || 0) < 50);
  updatePestBadge(s);
  var lv = s.playerLevel || 1;
  if (!fromCache && _prevLevel > 0 && lv > _prevLevel) showLevelUpModal(lv);
  _prevLevel = lv;
  document.getElementById('level-lbl').textContent = 'Lv.' + lv;
  var xpNext = s.playerXpToNext;
  document.getElementById('level-xp-lbl').textContent =
    xpNext != null ? xpNext + ' XP→升级' : 'MAX';
  var barEl = document.getElementById('level-bar');
  barEl.style.transition = fromCache ? 'none' : 'width .5s ease-out';
  barEl.style.width = Math.round((s.playerXpProgress || 0) * 100) + '%';
  document.getElementById('farm-lv').textContent = 'Lv.' + lv;
  if (!fromCache) {
    var ripeCount = (s.tiles||[]).filter(function(t){ return t&&t.isRipe; }).length;
    if (_prevRipeCount >= 0 && ripeCount > _prevRipeCount) showRipeNotification(ripeCount);
    _prevRipeCount = ripeCount;
    checkAlerts(s);
  }
  updateQuickActions(s);
  renderPackets(s);
  renderGrid(s);
  renderDecos(s);

  if (document.getElementById('shop-overlay').classList.contains('open')) renderShop(s);
  if (document.getElementById('sell-overlay').classList.contains('open')) renderSell(s);
  if (document.getElementById('seed-overlay').classList.contains('open')) {
    document.getElementById('seed-bal-num').textContent = s.coinBalance;
    renderSeedPanel(s);
  }
  if (!fromCache) {
    try { localStorage.setItem(FARM_STATE_CACHE_KEY, JSON.stringify(s)); } catch(e){}
  }
}

function refresh() {
  if (!T) return;
  T.invoke('get_farm_state').then(function(s) {
    applyState(s, false);
  }).catch(function(e){ console.warn('[farm]',e); });
}

/* ═══ GRID ALIGNMENT — positions 3 tile zones over background checkerboard ════
   Background image: 2732 × 1534 px (farm-bg.jpg)
   Layout in image-pixel coords (measured from the actual painting):
     - Upper grass:  x=440 y=290  w=8×210=1680  h=2×200=400   (rows above pool)
     - Pool:         x=440 y=790  w=1680        h=335         (1 wide row, not plantable)
     - Lower grass:  x=440 y=1155 w=1680        h=2×180=360
   Tune the constants below if alignment is still off. ═══════════════════════ */
var BG_W = 2732, BG_H = 1534;
var GRID_COLS = 8;
var GRID_X    = 440;   /* left edge of grass columns */
var TILE_W    = 210;   /* tile width (matches both upper and lower) */

/* Upper grass zone */
var UPPER_Y = 290, UPPER_TILE_H = 200, UPPER_ROWS = 2;
/* Pool zone — 8 wide pool tiles in 1 row (for future fishing) */
var POOL_Y  = 790, POOL_H = 335;
/* Lower grass zone */
var LOWER_Y = 1155, LOWER_TILE_H = 180, LOWER_ROWS = 2;

var UPPER_TILES = GRID_COLS * UPPER_ROWS;       /* 16 */
var LOWER_TILES = GRID_COLS * LOWER_ROWS;       /* 16 */
var GRASS_TILES = UPPER_TILES + LOWER_TILES;    /* 32 plantable slots */

function alignGrid() {
  var app = document.getElementById('app');
  var aw = app.clientWidth || window.innerWidth;
  var ah = app.clientHeight || window.innerHeight;
  var sc = Math.max(aw / BG_W, ah / BG_H);
  var iw = BG_W * sc, ih = BG_H * sc;
  var ox = (aw - iw) / 2, oy = (ah - ih) / 2;

  var gx = ox + GRID_X * sc;
  var tw = TILE_W * sc;

  function place(id, y, h, rows) {
    var el = document.getElementById(id);
    if (!el) return;
    el.style.left = gx + 'px';
    el.style.top  = (oy + y * sc) + 'px';
    el.style.width  = (tw * GRID_COLS) + 'px';
    el.style.height = (h * sc) + 'px';
    el.style.gridTemplateColumns = 'repeat(' + GRID_COLS + ',' + tw + 'px)';
    if (rows) el.style.gridTemplateRows = 'repeat(' + rows + ',' + (h / rows * sc) + 'px)';
    else      el.style.gridTemplateRows = (h * sc) + 'px';
  }
  place('tile-grid-upper', UPPER_Y, UPPER_TILE_H * UPPER_ROWS, UPPER_ROWS);
  place('tile-grid-pool',  POOL_Y,  POOL_H,                    1);
  place('tile-grid-lower', LOWER_Y, LOWER_TILE_H * LOWER_ROWS, LOWER_ROWS);
}

function makeCursorSvg(color, shape) {
  var svgs = {
    cross: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><line x1="12" y1="2" x2="12" y2="22" stroke="'+color+'" stroke-width="2.5"/><line x1="2" y1="12" x2="22" y2="12" stroke="'+color+'" stroke-width="2.5"/><circle cx="12" cy="12" r="3" fill="'+color+'"/></svg>',
    drop:  '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><path d="M12 3 Q18 10 18 16 A6 6 0 0 1 6 16 Q6 10 12 3Z" fill="'+color+'"/></svg>',
    plus:  '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="10" fill="none" stroke="'+color+'" stroke-width="2"/><line x1="12" y1="6" x2="12" y2="18" stroke="'+color+'" stroke-width="2.5"/><line x1="6" y1="12" x2="18" y2="12" stroke="'+color+'" stroke-width="2.5"/></svg>',
    x:     '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><line x1="4" y1="4" x2="20" y2="20" stroke="'+color+'" stroke-width="2.5"/><line x1="20" y1="4" x2="4" y2="20" stroke="'+color+'" stroke-width="2.5"/></svg>',
  };
  return 'url("data:image/svg+xml;base64,'+btoa(svgs[shape])+'") 12 12, auto';
}

var _isMini = false;

function initMinimize() {
  var minBtn = document.getElementById('farm-min-btn');
  var miniIcon = document.getElementById('farm-mini-icon');
  var miniBtn = document.getElementById('farm-mini-btn');
  if (!minBtn || !miniIcon || !miniBtn) return;

  minBtn.addEventListener('click', function() {
    _isMini = true;
    // Shrink window to 110x110 and show the floating icon overlay
    if (window.__TAURI__) {
      window.__TAURI__.core.invoke('farm_set_mini', {mini: true}).catch(function(){
        // fallback: just show overlay
      });
    }
    // Show icon overlay on top; hide main UI
    document.getElementById('app').style.opacity = '0';
    document.getElementById('app').style.pointerEvents = 'none';
    miniIcon.style.display = 'block';
    // Position mini icon in center of current window
    miniBtn.style.top = '50%';
    miniBtn.style.left = '50%';
  });

  // Make mini icon draggable
  var ox = 0, oy = 0, sx = 0, sy = 0;
  miniBtn.addEventListener('mousedown', function(e) {
    e.preventDefault();
    sx = e.clientX; sy = e.clientY;
    var r = miniBtn.getBoundingClientRect();
    ox = r.left + r.width/2;
    oy = r.top + r.height/2;
    function onMove(e) {
      var dx = e.clientX - sx, dy = e.clientY - sy;
      miniBtn.style.left = (ox + dx) + 'px';
      miniBtn.style.top  = (oy + dy) + 'px';
      miniBtn.style.transform = 'translate(-50%,-50%)';
    }
    function onUp(e) {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) < 5 && Math.abs(dy) < 5) {
        // It was a click — restore
        _isMini = false;
        miniIcon.style.display = 'none';
        document.getElementById('app').style.opacity = '';
        document.getElementById('app').style.pointerEvents = '';
        if (window.__TAURI__) {
          window.__TAURI__.core.invoke('farm_set_mini', {mini: false}).catch(function(){});
        }
      }
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

/* ── Drag-to-plant: from seed packet to tile ──────────────────────────── */
var dragCrop = null;
function makePktDraggable(div, cropId, locked) {
  if (locked) return;
  div.setAttribute('draggable','true');
  div.addEventListener('dragstart', function(e) {
    dragCrop = cropId;
    e.dataTransfer.effectAllowed = 'copy';
    e.dataTransfer.setData('text/plain', cropId);
    div.style.opacity = '0.55';
  });
  div.addEventListener('dragend', function() {
    dragCrop = null;
    div.style.opacity = '';
  });
}
function makeTileDropTarget(tileEl, tileIdx, isEmpty) {
  tileEl.addEventListener('dragover', function(e) {
    if (!dragCrop || !isEmpty) return;
    // Block aquatic crops on grass
    var cropDef = state && state.crops && state.crops.find(function(c){ return c.id === dragCrop; });
    if (cropDef && cropDef.isAquatic) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    tileEl.classList.add('drag-over');
  });
  tileEl.addEventListener('dragleave', function() {
    tileEl.classList.remove('drag-over');
  });
  tileEl.addEventListener('drop', function(e) {
    e.preventDefault();
    tileEl.classList.remove('drag-over');
    var crop = e.dataTransfer.getData('text/plain') || dragCrop;
    if (!crop || !isEmpty) return;
    var cropDef = state && state.crops && state.crops.find(function(c){ return c.id === crop; });
    if (cropDef && cropDef.isAquatic) { toast('水生作物只能种在水池里 💧'); return; }
    selCrop = crop;
    doPlant(tileIdx);
  });
}

/* ═══════════════ POOL TILE ACTIONS ═══════════════════════════════════════ */
function doPoolPlant(poolIdx) {
  if (!selCrop || !T) return;
  // Check if aquatic
  var crop = state && state.crops && state.crops.find(function(c){ return c.id === selCrop; });
  if (crop && !crop.isAquatic) { toast('此作物只能种在草地上 🌿'); return; }
  T.invoke('farm_pool_plant', {poolIdx: poolIdx, cropId: selCrop})
    .then(function(r){
      var xp = (r && r.xpGained) || 0;
      toast('水中种植 '+((crop && crop.nameCn) || selCrop)+' +'+xp+' XP 💧');
      selCrop = null;
      refresh();
    })
    .catch(function(e){ toast(''+e); });
}

function onPoolTile(e) {
  if (!state || !T) return;
  var idx = parseInt(this.dataset.poolIdx);
  var pt = state.poolTiles && state.poolTiles[idx];
  if (!pt) return;

  var rect = this.getBoundingClientRect();
  var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;

  if (selCrop) {
    var crop = state.crops && state.crops.find(function(c){ return c.id === selCrop; });
    if (crop && !crop.isAquatic) { toast('此作物只能种在草地上 🌿'); return; }
    doPoolPlant(idx); return;
  }

  if (activeTool === 'clear') {
    if (pt.isRipe) { toast('先收割！再清除'); return; }
    T.invoke('farm_pool_clear', {poolIdx: idx})
      .then(function(r){ var xp=(r&&r.xpGained)||0; toast('清除 +'+xp+' XP'); showXpFloat(cx,cy,xp); refresh(); })
      .catch(function(e){ toast(''+e); });
    return;
  }
  if (!pt.cropId) { toast('空水格 — 先从顶部拖拽水生作物种植'); return; }
  if (pt.isWithered) { toast('枯萎了！用铲子清除后再种 🪴'); return; }

  if (activeTool === 'harvest') {
    if (!pt.isRipe) { toast('还没成熟！再等等 ⏳'); return; }
    T.invoke('farm_pool_harvest', {poolIdx: idx})
      .then(function(r){
        var units = r.units || 0;
        var xp = r.xpGained || 0;
        if (r.isGolden) showGoldenFlash(cx, cy - 20);
        showHarvestPopup(pt.cropId, pt.cropNameCn, units, xp, r.isGolden);
        showXpFloat(cx, cy, xp);
        harvestEffect(cx, cy, units);
        refresh();
      })
      .catch(function(e){ toast(''+e); });
  } else if (activeTool === 'water') {
    if (pt.isRipe) { toast('已成熟，先收割！'); return; }
    waterEffect(cx, cy);
    T.invoke('farm_pool_water', {poolIdx: idx})
      .then(function(r){ var xp=(r&&r.xpGained)||0; toast('浇水 +'+xp+' XP 💧'); showXpFloat(cx,cy,xp,'💧'); refresh(); })
      .catch(function(e){ toast(''+e); });
  } else if (activeTool === 'fertilize') {
    if (pt.isRipe) { toast('已成熟不需施肥'); return; }
    if (!pt.canFertilize) { toast('此阶段已施过肥'); return; }
    fertEffect(cx, cy);
    T.invoke('farm_pool_fertilize', {poolIdx: idx})
      .then(function(cost){ toast('施肥加速！消耗 '+cost+' 金币 ☀ 🌱'); refresh(); })
      .catch(function(e){ toast(''+e); });
  }
}

/* ── Pool drag-drop (only aquatic crops accepted) ──────────────────────── */
function makePoolDropTarget(tileEl, poolIdx, isEmpty) {
  tileEl.addEventListener('dragover', function(e) {
    if (!dragCrop) return;
    var crop = state && state.crops && state.crops.find(function(c){ return c.id === dragCrop; });
    if (!crop || !crop.isAquatic) return;
    if (!isEmpty) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    tileEl.classList.add('drag-over');
  });
  tileEl.addEventListener('dragleave', function(){ tileEl.classList.remove('drag-over'); });
  tileEl.addEventListener('drop', function(e) {
    e.preventDefault();
    tileEl.classList.remove('drag-over');
    var crop = e.dataTransfer.getData('text/plain') || dragCrop;
    if (!crop || !isEmpty) return;
    var cropDef = state && state.crops && state.crops.find(function(c){ return c.id === crop; });
    if (!cropDef || !cropDef.isAquatic) { toast('此作物只能种在草地上'); return; }
    selCrop = crop;
    doPoolPlant(poolIdx);
  });
}

function updatePestBadge(s) {
  var badge = document.getElementById('pest-badge');

  var count = 0;
  (s.tiles || []).forEach(function(t){ if (t && (t.hasPest || t.hasWeed)) count++; });
  (s.poolTiles || []).forEach(function(t){ if (t && t.hasPest) count++; });

    badge.classList.add('visible');
    document.getElementById('pest-badge-icon').textContent = count > 3 ? '🐛' : '🐛';
    document.getElementById('pest-badge-count').textContent = count;
  } else {
    badge.classList.remove('visible');
  }
}

/* ═══════════════ POOL FISH ANIMATION (rAF-driven) ═════════════════════════ */
var POOL_FISH_DEFS = [
  {body:'#FF8C28',bot:'#C04808',fin:'#E06010',belly:'#FFD090',dk:'#6A2408'},
  {body:'#FFB820',bot:'#E07010',fin:'#FF6010',belly:'#FFE8A0',dk:'#804808'},
  {body:'#FF4060',bot:'#C01030',fin:'#FF9090',belly:'#FFB8B8',dk:'#701828'},
  {body:'#2090E0',bot:'#1050A0',fin:'#60B8FF',belly:'#A0D8FF',dk:'#102050'},
  {body:'#40B040',bot:'#186018',fin:'#88D050',belly:'#C0E890',dk:'#183808'},
  {body:'#9050C0',bot:'#502880',fin:'#C080F0',belly:'#D8B0FF',dk:'#301850'},
  {body:'#FF70C0',bot:'#D02880',fin:'#FFB0D8',belly:'#FFE0F0',dk:'#801840'},
  {body:'#D0A020',bot:'#906808',fin:'#F0C840',belly:'#FFF0A0',dk:'#604808'},
];
var _poolFishState = [];
var _poolFishRaf = null;
var _poolFishLastTs = 0;

function makePoolFishSvg(d, w, h, uid) {
  var cx=w*.36, cy=h*.5, rx=w*.28, ry=h*.42, tx=w*.75;
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">'
    +'<defs><linearGradient id="pfg'+uid+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0" stop-color="'+d.body+'"/><stop offset="1" stop-color="'+d.bot+'"/>'
    +'</linearGradient></defs>'
    // tail
    +'<path class="fish-tail" d="M'+tx+' '+cy+' L'+w+' '+(cy-h*.36)+' L'+(w-h*.12)+' '+cy+' L'+w+' '+(cy+h*.36)+' Z" fill="'+d.fin+'" stroke="'+d.dk+'" stroke-width="1.2" stroke-linejoin="round"/>'
    // body
    +'<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="url(#pfg'+uid+')" stroke="'+d.dk+'" stroke-width="1.4"/>'
    // dorsal fin
    +'<path class="fish-dfin" d="M'+(cx-rx*.2)+' '+(cy-ry)+' Q'+cx+' '+(cy-ry-h*.38)+' '+(cx+rx*.35)+' '+(cy-ry*.72)+' L'+(cx+rx*.1)+' '+(cy-ry)+' Z" fill="'+d.fin+'" stroke="'+d.dk+'" stroke-width="1" opacity=".9"/>'
    // pectoral fin
    +'<path d="M'+(cx-rx*.15)+' '+cy+' Q'+(cx-rx*.62)+' '+(cy+ry*.9)+' '+(cx-rx*.05)+' '+(cy+ry*.5)+' Z" fill="'+d.fin+'" stroke="'+d.dk+'" stroke-width="1" opacity=".78"/>'
    // belly highlight
    +'<ellipse cx="'+(cx-rx*.15)+'" cy="'+(cy+ry*.28)+'" rx="'+(rx*.55)+'" ry="'+(ry*.32)+'" fill="'+d.belly+'" opacity=".22"/>'
    // scale arcs
    +'<path d="M'+(cx+rx*.05)+' '+(cy-ry*.4)+' Q'+(cx+rx*.5)+' '+cy+' '+(cx+rx*.05)+' '+(cy+ry*.4)+'" stroke="'+d.dk+'" fill="none" stroke-width=".9" opacity=".28"/>'
    +'<path d="M'+(cx-rx*.1)+' '+(cy-ry*.4)+' Q'+(cx+rx*.35)+' '+cy+' '+(cx-rx*.1)+' '+(cy+ry*.4)+'" stroke="'+d.dk+'" fill="none" stroke-width=".9" opacity=".28"/>'
    // eye
    +'<circle cx="'+(cx-rx*.7)+'" cy="'+(cy-ry*.18)+'" r="'+(h*.13)+'" fill="white" stroke="'+d.dk+'" stroke-width="1"/>'
    +'<circle cx="'+(cx-rx*.74)+'" cy="'+(cy-ry*.2)+'" r="'+(h*.07)+'" fill="'+d.dk+'"/>'
    +'<circle cx="'+(cx-rx*.78)+'" cy="'+(cy-ry*.28)+'" r="'+(h*.03)+'" fill="white"/>'
    // mouth
    +'<path d="M'+(cx-rx*.95)+' '+(cy+ry*.08)+' Q'+(cx-rx*.84)+' '+(cy+ry*.34)+' '+(cx-rx*.66)+' '+(cy+ry*.2)+'" stroke="'+d.dk+'" fill="none" stroke-width="1.3" stroke-linecap="round"/>'
    +'</svg>';
}

function spawnPoolFish() {
  var layer = document.getElementById('pool-fish-layer');
  var pool  = document.getElementById('tile-grid-pool');
  if (!layer || !pool) return;
  var poolW = pool.offsetWidth  || 400;
  var poolH = pool.offsetHeight || 80;
  if (poolW < 20 || poolH < 20) { setTimeout(spawnPoolFish, 200); return; }

  var def  = POOL_FISH_DEFS[Math.floor(Math.random() * POOL_FISH_DEFS.length)];
  var rtl  = Math.random() > 0.5;
  var sz   = 28 + Math.random() * 22;
  var fishH= Math.round(sz * 0.45);
  var spd  = 28 + Math.random() * 30;
  var uid  = (Date.now() + Math.random()).toString(36);

  var el = document.createElement('div');
  el.className = 'swim-fish';
  el.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;will-change:transform,opacity;';
  el.innerHTML = makePoolFishSvg(def, sz, fishH, uid);
  layer.appendChild(el);

  // Spawn inside visible area so fish appear immediately (not from off-screen edge)
  var startX = rtl ? poolW * (0.5 + Math.random() * 0.4) : poolW * (0.1 + Math.random() * 0.4);
  _poolFishState.push({
    el:el, rtl:rtl, sz:sz,
    x: startX,
    y: poolH * 0.08 + Math.random() * poolH * 0.65,
    vx: rtl ? -spd : spd,
    t:  Math.random() * Math.PI * 2,
    yAmp:  4 + Math.random() * 7,
    yFreq: 0.6 + Math.random() * 0.8,
    opT:   Math.random() * Math.PI * 2,
    opFreq:0.25 + Math.random() * 0.3,
    opMid: 0.72 + Math.random() * 0.18,
    poolW: poolW, poolH: poolH,
  });
}

function updatePoolFish(ts) {
  var dt = _poolFishLastTs ? Math.min((ts - _poolFishLastTs) / 1000, 0.05) : 0.016;
  _poolFishLastTs = ts;

  var alive = [];
  _poolFishState.forEach(function(f) {
    f.t    += dt * f.yFreq * 2.8;
    f.opT  += dt * f.opFreq * 2.4;
    f.x    += f.vx * dt;

    var yOff = Math.sin(f.t) * f.yAmp;
    // Breathing opacity: fish fade in/out gently (若隐若现)
    var op = f.opMid + Math.sin(f.opT) * 0.15;
    op = Math.max(0.55, Math.min(0.95, op));
    // Only fade at the very edge (last 6% of pool width) when fish exit
    var prog = f.rtl ? (f.poolW - f.x) / f.poolW : f.x / f.poolW;
    if (prog > 0.94) op *= Math.max(0, (1 - prog) / 0.06);
    if (prog < 0.06) op *= Math.max(0, prog / 0.06);

    f.el.style.opacity = op.toFixed(3);
    f.el.style.transform = 'translate('+f.x.toFixed(1)+'px,'+(f.y+yOff).toFixed(1)+'px)'+(f.rtl?'':' scaleX(-1)');

    var gone = f.rtl ? f.x < -f.sz*2 : f.x > f.poolW + f.sz*2;
    if (gone) { try{f.el.remove();}catch(e){} } else { alive.push(f); }
  });
  _poolFishState = alive;
  _poolFishRaf = requestAnimationFrame(updatePoolFish);
}

function initPoolFish() {
  if (!_poolFishRaf) _poolFishRaf = requestAnimationFrame(updatePoolFish);
  // Spawn fish as soon as layout settles (alignGrid runs at end of init)

var decoPos = {};

function saveDecoPos() {
  try { localStorage.setItem('farmDecoPos', JSON.stringify(decoPos)); } catch(e) {}
}
function makeDecoDraggable(el, id) {
  el.style.cursor = 'move';
  el.style.pointerEvents = 'auto';
  var ox = 0, oy = 0, startX = 0, startY = 0;
  el.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    var r = el.getBoundingClientRect();
    var pr = el.parentElement.getBoundingClientRect();
    ox = (r.left - pr.left); oy = (r.top - pr.top);
    startX = e.clientX; startY = e.clientY;
    function onMove(ev) {
      var dx = ev.clientX - startX, dy = ev.clientY - startY;
      var nx = ox + dx, ny = oy + dy;
      el.style.left = nx + 'px'; el.style.top = ny + 'px';
    }
    function onUp(ev) {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      var r2 = el.getBoundingClientRect();
      var pr2 = el.parentElement.getBoundingClientRect();
      decoPos[id] = { l: ((r2.left - pr2.left) / pr2.width * 100) + '%',
                      t: ((r2.top  - pr2.top)  / pr2.height * 100) + '%' };
      saveDecoPos();
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

/* ═══════════════ FISHING MINIGAME ══════════════════════════════════════════ */
var _fishingActive = false;
var _fishingHeld   = false;
var _fishState     = null;
var _fishingRaf    = null;

var RARE_WEIGHTS = [60, 25, 12, 3]; // common, uncommon, rare, legendary

function pickFish() {
  var roll = Math.random() * 100;
  var rarity = 0;
  var cum = 0;
  for (var r = 0; r < RARE_WEIGHTS.length; r++) {
    cum += RARE_WEIGHTS[r];
    if (roll < cum) { rarity = r; break; }
    rarity = r;
  }
  var pool = FISH_TYPES.filter(function(f){ return f.rare === rarity; });
  return pool[Math.floor(Math.random() * pool.length)];
}

function showFishingPrompt() {
  if (_fishingActive) return;
  document.getElementById('fish-prompt-overlay').classList.add('open');
}

function openFishing() {
  if (_fishingActive) return;
  var fish = pickFish();
  var overlay = document.getElementById('fishing-overlay');
  var result  = document.getElementById('fishing-result');
  var bar     = document.getElementById('fishing-bar-wrap');
  result.style.display = 'none';
  document.getElementById('fishing-hold-btn').style.display = '';
  document.getElementById('fishing-cancel-btn').style.display = '';
  document.getElementById('fishing-title').textContent = '🎣 钓鱼中...';
  document.getElementById('fishing-progress-bar').style.width = '0%';
  overlay.classList.add('open');
  _fishingActive = true;
  var BAR_H    = 180;
  var ZONE_H   = 48;
  var FISH_H   = 18;
  var zoneY    = BAR_H / 2 - ZONE_H / 2; // catch zone Y (from top)
  var zoneVel  = 0;
  var fishY    = Math.random() * (BAR_H - FISH_H); // fish Y (from top)
  var fishTargY = fishY;
  var fishVel  = 0;
  var progress = 50; // 0–100
  var timeLeft = 30;
  var lastT    = null;
  var targetChangeT = 0;
  var GRAVITY  = 280;
  var LIFT     = -420;
  var ZONE_MAX = BAR_H - ZONE_H;
  var catchZoneEl = document.getElementById('fishing-catch-zone');
  var fishZoneEl  = document.getElementById('fishing-fish-zone');
  var progressEl  = document.getElementById('fishing-progress-bar');
  var timerEl     = document.getElementById('fishing-timer');
  _fishState = fish;

  function loop(ts) {
    if (!_fishingActive) return;
    if (!lastT) lastT = ts;
    var dt = Math.min((ts - lastT) / 1000, 0.05);
    lastT = ts;
    timeLeft -= dt;
    if (timeLeft <= 0) { endFishing(false); return; }
    timerEl.textContent = Math.ceil(timeLeft) + 's';
    // Fish movement
    targetChangeT -= dt;
    if (targetChangeT <= 0) {
      fishTargY = Math.random() * (BAR_H - FISH_H);
      targetChangeT = 0.4 + Math.random() * 1.2;
    }
    var fishSpd = fish.sp * 100;
    fishVel += (fishTargY - fishY) * fishSpd * dt;
    fishVel *= (1 - 6 * dt);
    fishY = Math.max(0, Math.min(BAR_H - FISH_H, fishY + fishVel * dt));
    // Zone movement
    if (_fishingHeld) { zoneVel += LIFT * dt; }
    else              { zoneVel += GRAVITY * dt; }
    zoneVel *= (1 - 4 * dt);
    zoneY = Math.max(0, Math.min(ZONE_MAX, zoneY + zoneVel * dt));
    // Check overlap
    var fishMid = fishY + FISH_H / 2;
    var inZone = fishMid >= zoneY && fishMid <= zoneY + ZONE_H;
    progress += (inZone ? 22 : -14) * dt * (inZone ? 1 : 1.2);
    progress = Math.max(0, Math.min(100, progress));
    // Update DOM
    catchZoneEl.style.top = zoneY + 'px';
    fishZoneEl.style.top  = fishY + 'px';
    progressEl.style.width = progress + '%';
    if (inZone) catchZoneEl.style.background = 'linear-gradient(180deg,rgba(80,255,80,.9),rgba(40,200,40,.9))';
    else        catchZoneEl.style.background = 'linear-gradient(180deg,rgba(60,220,60,.8),rgba(20,160,20,.8))';
    if (progress >= 100) { endFishing(true); return; }
    if (progress <= 0)   { endFishing(false); return; }
    _fishingRaf = requestAnimationFrame(loop);
  }
  _fishingRaf = requestAnimationFrame(loop);
}

function endFishing(caught) {
  _fishingActive = false;
  if (_fishingRaf) { cancelAnimationFrame(_fishingRaf); _fishingRaf = null; }
  var fish = _fishState;
  if (!caught) {
    document.getElementById('fishing-title').textContent = '🐟 鱼跑了！';
    document.getElementById('fishing-result-svg').innerHTML = '<div style="font-size:40px;opacity:.5">💨</div>';
    document.getElementById('fishing-result-fish').textContent = '这次没钓到...';
    document.getElementById('fishing-result-coins').textContent = '';
  } else {
    document.getElementById('fishing-title').textContent = '🎉 钓到了！';
    var rareLbl = ['普通','稀有','珍稀','传说'][fish.rare];
    document.getElementById('fishing-result-svg').innerHTML = makeFishResultSvg(fish);
    document.getElementById('fishing-result-fish').innerHTML =
      '<span id="fish-rarity-'+fish.rare+'">['+rareLbl+'] '+fish.cn+'</span>';
    document.getElementById('fishing-result-coins').textContent = '+' + fish.rw + ' 金币 ☀';
    // Award coins via Rust
    if (T) T.invoke('farm_add_fishing_coins', {amount: fish.rw}).then(refresh).catch(function(){});
  }
  document.getElementById('fishing-hold-btn').style.display = 'none';
  document.getElementById('fishing-cancel-btn').style.display = 'none';
  document.getElementById('fishing-result').style.display = 'flex';
  document.getElementById('fishing-result').style.flexDirection = 'column';
}

function closeFishing() {
  _fishingActive = false;
  if (_fishingRaf) { cancelAnimationFrame(_fishingRaf); _fishingRaf = null; }
  document.getElementById('fishing-overlay').classList.remove('open');
}

var DAILY_TASK_DEFS = [
  {id:'harvest5',  name:'收获作物 5 次',   goal:5,  icon:'🌾', reward:200},
  {id:'water3',    name:'浇水 3 次',        goal:3,  icon:'💧', reward:100},
  {id:'fertilize2',name:'施肥 2 次',        goal:2,  icon:'🌱', reward:80},
  {id:'plant5',    name:'种植 5 颗种子',    goal:5,  icon:'🌰', reward:150},
  {id:'pest3',     name:'消灭 3 只害虫',    goal:3,  icon:'🐛', reward:120},
  {id:'fish1',     name:'钓到 1 条鱼',      goal:1,  icon:'🎣', reward:300},
];
var _dailyTasks = null;
var DAILY_STORAGE_KEY = 'terse_daily_tasks_v1';

function getTodayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

function initDailyTasks() {
  var today = getTodayStr();
  try {
    var stored = JSON.parse(localStorage.getItem(DAILY_STORAGE_KEY) || 'null');
    if (stored && stored.date === today) { _dailyTasks = stored; return; }
  } catch(e) {}
  // Generate 3 random tasks
  var shuffled = DAILY_TASK_DEFS.slice().sort(function(){ return Math.random()-.5; });
  var chosen = shuffled.slice(0, 3);
  _dailyTasks = { date: today, tasks: chosen.map(function(t){ return t.id; }), progress: {}, claimed: {} };
  saveDailyTasks();
}

function saveDailyTasks() {
  try { localStorage.setItem(DAILY_STORAGE_KEY, JSON.stringify(_dailyTasks)); } catch(e) {}
}

function incrementDailyTask(taskId) {
  if (!_dailyTasks) return;
  if (_dailyTasks.tasks.indexOf(taskId) === -1) return;
  var def = DAILY_TASK_DEFS.find(function(d){ return d.id === taskId; });
  if (!def) return;
  var cur = _dailyTasks.progress[taskId] || 0;
  if (cur >= def.goal) return;
  _dailyTasks.progress[taskId] = cur + 1;
  saveDailyTasks();
  renderDailyTasks();
}

function renderDailyTasks() {
  if (!_dailyTasks) return;
  var list = document.getElementById('dtp-list');
  if (!list) return;
  var dateEl = document.getElementById('dtp-date');
  if (dateEl) dateEl.textContent = _dailyTasks.date;
  list.innerHTML = '';
  _dailyTasks.tasks.forEach(function(taskId) {
    var def = DAILY_TASK_DEFS.find(function(d){ return d.id === taskId; });
    if (!def) return;
    var prog = _dailyTasks.progress[taskId] || 0;
    var claimed = _dailyTasks.claimed[taskId];
    var done = prog >= def.goal;
    var item = document.createElement('div');
    item.className = 'dtp-task' + (done ? ' done' : '') + (done && !claimed ? ' claimable' : '') + (claimed ? ' claimed' : '');
    item.innerHTML =
      '<div class="dtp-task-check">'+(done?'✓':'')+'</div>'
      +'<div class="dtp-task-info">'
        +'<div class="dtp-task-name">'+def.icon+' '+def.name+'</div>'
        +'<div class="dtp-prog">'+Math.min(prog, def.goal)+'/'+def.goal+(claimed?' ✓已领取':'')+'</div>'
      +'</div>'
      +'<div class="dtp-task-reward">+'+def.reward+'☀</div>';
    if (done && !claimed) {
      var btn = document.createElement('button');
      btn.className = 'dtp-claim';
      btn.textContent = '🎁 领取';
      (function(tid, reward) {
        btn.addEventListener('click', function() {
          _dailyTasks.claimed[tid] = true;
          saveDailyTasks();
          // Award coins via Rust if available
          if (T) T.invoke('farm_add_fishing_coins', {amount: reward}).then(function(){ refresh(); }).catch(function(){});
          toast('🎁 领取奖励！+'+reward+' ☀', 2200);
          renderDailyTasks();
        });
      })(taskId, def.reward);
      item.appendChild(btn);
    }
    list.appendChild(item);
  });
}

function initDailyTasksUI() {
  var toggle = document.getElementById('dtp-toggle');
  var panel  = document.getElementById('daily-tasks-panel');
  if (!toggle || !panel) return;
  toggle.addEventListener('click', function() {
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) {
      // Position panel to the left of the toolbar
      var tr = toggle.getBoundingClientRect();
      panel.style.top  = Math.max(10, tr.top - 20) + 'px';
      panel.style.right = (window.innerWidth - tr.left + 8) + 'px';
      panel.style.transform = 'none';
    }
  });
  initDailyTasks();
  renderDailyTasks();
}

/* ═══════════════ #3 CROP GROWTH PROGRESS RING ═══════════════════════════════
   Added inside buildGrassTile — helper called from there                    */
function buildProgressRing(progress, isRipe, isDry) {
  var radius = 22, stroke = 3, size = 52;
  var circ = 2 * Math.PI * radius;
  var pct = isRipe ? 1 : Math.max(0, Math.min(1, progress || 0));
  var dash = pct * circ;
  var color = isRipe ? '#FFD020' : (pct >= 0.85 ? '#FF8020' : pct >= 0.5 ? '#FFD020' : '#40D040');
  var cx2 = size / 2, cy2 = size / 2;
  var svg = '<svg class="tile-ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    + '<circle cx="'+cx2+'" cy="'+cy2+'" r="'+radius+'" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="'+stroke+'"/>'
    + '<circle cx="'+cx2+'" cy="'+cy2+'" r="'+radius+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'"'
    + ' stroke-dasharray="'+dash.toFixed(1)+' '+circ.toFixed(1)+'"'
    + ' stroke-dashoffset="0" stroke-linecap="round"'
    + ' transform="rotate(-90 '+cx2+' '+cy2+')"'
    + ' opacity="' + (pct < 0.05 ? '0' : '0.85') + '"'
    + '/>'
    + '</svg>';
  var wrap = document.createElement('div');
  wrap.innerHTML = svg;
  return wrap.firstChild;
}

/* ═══════════════ #6 POOL WATER RIPPLE ════════════════════════════════════════ */
var _poolRippleTimer = null;
function spawnFishRipple() {
  var fishEls = document.querySelectorAll('.swim-fish');
  if (!fishEls.length) return;
  // Pick a random visible fish
  var fish = fishEls[Math.floor(Math.random() * fishEls.length)];
  var pool = document.getElementById('tile-grid-pool');
  if (!fish || !pool) return;
  var fishRect = fish.getBoundingClientRect();
  var poolRect = pool.getBoundingClientRect();
  if (fishRect.width === 0) return;
  var fishX = fishRect.left + fishRect.width / 2 - poolRect.left;
  // Place ripple on water surface (top 30% of pool)
  var fishY = poolRect.height * (0.15 + Math.random() * 0.15);
  var sz = 20 + Math.random() * 20;
  var ripple = document.createElement('div');
  ripple.className = 'pool-ripple';
  ripple.style.cssText = 'left:'+fishX+'px;top:'+fishY+'px;width:'+sz+'px;height:'+(sz*.45)+'px;';
  pool.appendChild(ripple);
  setTimeout(function(){ try{ripple.remove();}catch(e){} }, 850);
}

function schedulePoolRipples() {
  function next() {
    spawnFishRipple();
    var delay = 1500 + Math.random() * 1500;
    _poolRippleTimer = setTimeout(next, delay);
  }
  _poolRippleTimer = setTimeout(next, 2000);
}

/* ═══════════════ #7 SEED PACKET HOVER TOOLTIP ════════════════════════════════ */
function showSeedTip(cropDef, targetEl) {
  var tip = document.getElementById('seed-hover-tip');
  if (!tip || !cropDef) return;
  var yield1 = cropDef.minYield || cropDef.yieldMin || 2;
  var yield2 = cropDef.maxYield || cropDef.yieldMax || 5;
  var growMins = cropDef.growMins || cropDef.growMinutes || Math.round((cropDef.growSecs || 1800) / 60);
  var xpRew   = cropDef.xpPerHarvest || cropDef.harvestXp || 8;
  tip.innerHTML =
    '<div class="sht-name">'+(SVGS.ripe&&SVGS.ripe[cropDef.id] ? '<span style="font-size:22px;line-height:1">🌿</span> ' : '')
    +(cropDef.nameCn||cropDef.id)+'</div>'
    +'<div class="sht-row"><span>🕐 生长</span><span class="sht-val">'+(growMins >= 60 ? (growMins/60).toFixed(1)+'小时' : growMins+'分钟')+'</span></div>'
    +'<div class="sht-row"><span>🌾 产量</span><span class="sht-val">'+yield1+'-'+yield2+'</span></div>'
    +'<div class="sht-row"><span>✨ 经验</span><span class="sht-val">+'+xpRew+' XP</span></div>'
    +'<div class="sht-row"><span>☀ 种费</span><span class="sht-val">'+(cropDef.seedCost||0)+'</span></div>';
  var r = targetEl.getBoundingClientRect();
  tip.style.left = (r.right + 6) + 'px';
  tip.style.top  = (r.top + r.height/2 - 50) + 'px';
  tip.classList.add('visible');
}

function hideSeedTip() {
  var tip = document.getElementById('seed-hover-tip');
  if (tip) tip.classList.remove('visible');
}

/* ═══════════════ #8 SHOP CLOSE ANIMATION ═════════════════════════════════════ */
function closeShopAnimated() {
  var panel = document.getElementById('shop-panel');
  var overlay = document.getElementById('shop-overlay');
  if (!panel || !overlay) {
    overlay.classList.remove('open');
    pendingSkinTile = null;
    return;
  }
  panel.classList.add('closing');
  setTimeout(function() {
    panel.classList.remove('closing');
    overlay.classList.remove('open');
    pendingSkinTile = null;
  }, 190);
}

/* ═══════════════ #9 HARVEST FIREWORKS / CONFETTI BURST ══════════════════════ */
function spawnHarvestFireworks(cx, cy) {
  var colors = ['#FF4444','#FF8800','#FFDD00','#44FF44','#44AAFF','#AA44FF','#FF44AA','#FFFFFF'];
  for (var i = 0; i < 8; i++) {
    (function(idx) {
      var el = document.createElement('div');
      el.className = 'harvest-confetti';
      var sz = 6 + Math.random() * 4;
      var ang = (idx / 8) * Math.PI * 2 + Math.random() * 0.5;
      var dist = 40 + Math.random() * 50;
      var dx = Math.cos(ang) * dist;
      var dy = Math.sin(ang) * dist;
      el.style.width = sz + 'px';
      el.style.height = sz + 'px';
      el.style.background = colors[idx % colors.length];
      el.style.left = cx + 'px';
      el.style.top  = cy + 'px';
      el.style.setProperty('--hcdx', dx + 'px');
      el.style.setProperty('--hcdy', dy + 'px');
      el.style.setProperty('--hcrot', (Math.random()*360-180) + 'deg');
      document.body.appendChild(el);
      setTimeout(function(){ el.remove(); }, 750);
    })(i);
  }
}

/* ═══════════════ #10 SELL MODAL COIN ANIMATION ═══════════════════════════════ */
function sellCoinShower(fromEl, onDone) {
  var hudEl = document.getElementById('harvest-hud');
  if (!hudEl || !fromEl) { onDone(); return; }
  var fromR = fromEl.getBoundingClientRect();
  var hudR  = hudEl.getBoundingClientRect();
  var startX = fromR.left + fromR.width / 2;
  var startY = fromR.top  + fromR.height / 2;
  var endX = hudR.left + hudR.width / 2;
  var endY = hudR.top  + hudR.height / 2;
  var count = 6 + Math.floor(Math.random() * 5);
  var done = 0;
  for (var k = 0; k < count; k++) {
    (function(ki) {
      setTimeout(function() {
        var el = document.createElement('div');
        el.className = 'sell-coin-anim';
        el.textContent = '🌾';
        el.style.left = startX + 'px';
        el.style.top  = startY + 'px';
        var cx2 = (endX - startX) + (Math.random()-0.5)*60;
        var cy2 = (endY - startY) + (Math.random()-0.5)*40;
        el.style.setProperty('--scdx', cx2 + 'px');
        el.style.setProperty('--scdy', cy2 + 'px');
        document.body.appendChild(el);
        setTimeout(function(){
          el.remove();
          done++;
          if (done >= count) onDone();
        }, 650);
      }, ki * 55);
    })(k);
  }
}

/* ═══════════════ initNewFeatures — called from the bottom of init() ══════════ */
function initNewFeatures() {
  initDailyTasksUI();
  schedulePoolRipples();

  // #4 Tool button press animation
  document.querySelectorAll('.tool-btn').forEach(function(btn) {
    btn.addEventListener('mousedown', function() {
      btn.classList.add('pressing');
      setTimeout(function(){ btn.classList.remove('pressing'); }, 160);
    });
  });

  // #7 Seed packet hover tooltips — delegate from packet-rail
  document.getElementById('packet-rail').addEventListener('mouseover', function(e) {
    var pkt = e.target.closest('.seed-pkt');
    if (!pkt || pkt.classList.contains('pkt-locked')) return;
    var idx = Array.from(document.getElementById('packet-rail').children).indexOf(pkt);
    if (!state || !state.crops) return;
    var crop = state.crops[idx];
    if (crop) showSeedTip(crop, pkt);
  });
  document.getElementById('packet-rail').addEventListener('mouseleave', hideSeedTip);

  // #8 Replace closeShop with animated version globally
  closeShop = closeShopAnimated;
}

/* ═══════════════ PATCH ACTIONS — intercept for daily tasks + new effects ═════ */
var _origOnTile = onTile;
onTile = function(e) {
  if (!state || !T) return;
  var idx = parseInt(this.dataset.idx);
  var tile = state.tiles[idx];
  if (!tile) { _origOnTile.call(this, e); return; }
  var rect = this.getBoundingClientRect();
  var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;

  if (activeTool === 'harvest' && tile.isRipe && !selCrop) {
    T.invoke('farm_harvest', {tileIdx:idx})
      .then(function(r){
        var units = r.units || 0;
        var xp = r.xpGained || 0;
        if (r.isGolden) showGoldenFlash(cx, cy - 20);
        showHarvestPopup(tile.cropId, tile.cropNameCn, units, xp, r.isGolden);
        showXpFloat(cx, cy, xp);
        harvestEffect(cx, cy, units);
        // #2 Enhanced floats
        showHarvestFloats(cx, cy, units, xp, 0);
        // #5 Combo
        fireCombo();
        // #9 Fireworks on golden or first ripe
        if (r.isGolden) spawnHarvestFireworks(cx, cy);
        // #1 Daily task
        incrementDailyTask('harvest5');
        refresh();
      })
      .catch(function(er){ toast(''+er); });
    return;
  }
  if (activeTool === 'water' && tile.cropId && !tile.isRipe && !selCrop) {
    waterEffect(cx, cy);
    T.invoke('farm_water', {tileIdx:idx})
      .then(function(r){
        var xp = (r && r.xpGained) || 0;
        toast('浇水成功 +' + xp + ' XP 💧');
        showXpFloat(cx, cy, xp, '💧');
        incrementDailyTask('water3');
        refresh();
      })
      .catch(function(er){ toast(''+er); });
    return;
  }
  if (activeTool === 'fertilize' && tile.cropId && tile.canFertilize && !tile.isRipe && !selCrop) {
    fertEffect(cx, cy);
    T.invoke('farm_fertilize', {tileIdx:idx})
      .then(function(cost){ toast('施肥加速！消耗 '+cost+' 金币 ☀ 🌱'); incrementDailyTask('fertilize2'); refresh(); })
      .catch(function(er){ toast(''+er); });
    return;
  }
  if (activeTool === 'clear' && tile.hasPest && !selCrop) {
    T.invoke('farm_clear', {tileIdx:idx})
      .then(function(r){
        var xp = (r && r.xpGained) || 0;
        toast('除虫成功！+' + xp + ' XP 🐛');
        showXpFloat(cx, cy, xp, '🐛');
        incrementDailyTask('pest3');
        refresh();
      })
      .catch(function(er){ toast(''+er); });
    return;
  }
  _origOnTile.call(this, e);
};

// Intercept doPlant to track planting
var _origDoPlant = doPlant;
doPlant = function(idx) {
  _origDoPlant(idx);
  // We delay so the original resolves first; increment optimistically
  incrementDailyTask('plant5');
};

// Intercept fishing result to track fish catch
var _origEndFishing = endFishing;
endFishing = function(caught) {
  _origEndFishing(caught);
  if (caught) incrementDailyTask('fish1');
};

// Intercept harvestAll to count combo + daily tasks
var _origHarvestAll = harvestAll;
harvestAll = function() {
  if (!state || !T) return;
  var ripeTiles = (state.tiles || []).filter(function(t){ return t && t.isRipe; });
  if (!ripeTiles.length) { toast('没有成熟的作物 🌾'); return; }
  ripeTiles.forEach(function(t){
    var el = document.querySelector('.farm-tile[data-idx="'+t.index+'"] .tile-plant');
    if (el) { el.classList.add('harvest-flash'); setTimeout(function(){ el.classList.remove('harvest-flash'); },400); }
  });
  Promise.all(ripeTiles.map(function(t){ return T.invoke('farm_harvest',{tileIdx:t.index}); }))
    .then(function(results){
      var units = results.reduce(function(s,r){ return s+(r.units||0); },0);
      var xp    = results.reduce(function(s,r){ return s+(r.xpGained||0); },0);
      var gold  = results.filter(function(r){ return r.isGolden; }).length;
      toast('🎉 一键收获！共 +'+units+' 个 +'+xp+' XP'+(gold?' 🌟×'+gold:''));
      if (xp) { var c=document.getElementById('quick-actions'); if(c){ var r2=c.getBoundingClientRect(); showXpFloat(r2.left+60,r2.top,xp); } }
      // Daily task + combo
      results.forEach(function(){ incrementDailyTask('harvest5'); fireCombo(); });
      // Fireworks for golden
      if (gold) {
        var qa = document.getElementById('quick-actions');
        if (qa) { var qr = qa.getBoundingClientRect(); spawnHarvestFireworks(qr.left+60, qr.top); }
      }
      refresh();
    })
    .catch(function(er){ toast(''+er); refresh(); });
};

// Intercept pool harvest too
var _origOnPoolTile = onPoolTile;
onPoolTile = function(e) {
  if (!state || !T) return;
  var idx = parseInt(this.dataset.poolIdx);
  var pt = state.poolTiles && state.poolTiles[idx];
  if (!pt) return;
  var rect = this.getBoundingClientRect();
  var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;

  if (activeTool === 'harvest' && pt.isRipe && !selCrop && pt.cropId) {
    T.invoke('farm_pool_harvest', {poolIdx: idx})
      .then(function(r){
        var units = r.units || 0;
        var xp = r.xpGained || 0;
        if (r.isGolden) showGoldenFlash(cx, cy - 20);
        showHarvestPopup(pt.cropId, pt.cropNameCn, units, xp, r.isGolden);
        showXpFloat(cx, cy, xp);
        harvestEffect(cx, cy, units);
        showHarvestFloats(cx, cy, units, xp, 0);
        fireCombo();
        if (r.isGolden) spawnHarvestFireworks(cx, cy);
        incrementDailyTask('harvest5');
        refresh();
      })
      .catch(function(er){ toast(''+er); });
    return;
  }
  _origOnPoolTile.call(this, e);
};

// Intercept sell-all to do coin shower
// We must wait until renderSell wires up buttons, so we patch after renderSell
var _origRenderSell = renderSell;
renderSell = function(s) {
  _origRenderSell(s);
  // Re-wire sell-all buttons for coin shower
  document.querySelectorAll('.sell-all').forEach(function(btn) {
    var origClick = btn.onclick;
    btn.addEventListener('click', function() {
      // Find the harvest-hud element
      var hudEl = document.getElementById('harvest-hud');
      var btnEl = btn;
      sellCoinShower(btnEl, function() {
        // coin shower done — modal closes via refresh() which is called by sell handler
      });
    }, true); // capture phase so we see it first
  });
};

/* ═══════════════ PATCH buildGrassTile — add progress ring (#3) ═══════════════ */
var _origBuildGrassTile = buildGrassTile;
buildGrassTile = function(s, i, isUnlocked) {
  var el = _origBuildGrassTile(s, i, isUnlocked);
  if (!isUnlocked) return el;
  var tile = s.tiles[i] || {};
  if (tile.cropId && !tile.isWithered) {
    var ring = buildProgressRing(tile.progress, tile.isRipe, tile.isDry);
    if (ring) el.appendChild(ring);
  }
  return el;
};

</script>
