<!DOCTYPE html>
<html>
<head>
  <meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.min.js"></script>
<style>body{margin:0;background:#000} canvas{display:block}</style>
</head>
<body>
<div id="info" style="position:fixed;top:10px;left:10px;color:white;font:16px sans-serif;z-index:10;background:rgba(0,0,0,.7);padding:8px"></div>
<script>
const info = document.getElementById('info');
try {
  info.textContent = 'THREE version: ' + THREE.REVISION;

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000022, 1);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 5;

  const cube = new THREE.Mesh(
    new THREE.BoxGeometry(2,2,2),
    new THREE.MeshBasicMaterial({color:0x00ff44, wireframe:true})
  );
  scene.add(cube);

  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(1,16,16),
    new THREE.MeshBasicMaterial({color:0xff4400, transparent:true, opacity:.8})
  ));

  let frame = 0;
  function animate(){
    requestAnimationFrame(animate);
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.01;
    frame++;
    info.textContent = 'THREE r'+THREE.REVISION+' | frame:'+frame+' | WebGL OK';
    renderer.render(scene, camera);
  }
  animate();
} catch(e) {
  info.textContent = 'ERROR: '+e;
  info.style.background = 'red';
}
</script>
</body>
</html>
