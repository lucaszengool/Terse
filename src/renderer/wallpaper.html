<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="color-scheme" content="dark">
  <meta charset="UTF-8">
  <title>Terse Live Wallpaper</title>
  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/jsm/" } }
  </script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;width:100%;overflow:hidden;background:#05060a}
    /* 置顶模式:页面自己不能有底色。窗口已经是 non-opaque + clearColor,
       只要这里还留着 #05060a,置顶后就是一块盖住整个屏幕的黑板。 */
    html.overlay, html.overlay body, html.overlay #stage { background: transparent !important; }
    #stage{position:fixed;inset:0;display:block;width:100vw;height:100vh}
    /* ── 消息投屏 ─────────────────────────────────────────────────────────── */
    #msgLayer{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:6;
      display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none;
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC',system-ui,sans-serif;
      max-width:min(78vw,980px)}
    #msgLayer.hidden{display:none}
    #msgBig{text-align:center;transition:opacity .5s,transform .5s}
    #msgBig.swap{opacity:0;transform:translateY(9px)}
    .mb-meta{display:flex;align-items:center;justify-content:center;gap:8px;
      font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
      color:var(--accent,#e146eb);text-shadow:0 0 18px color-mix(in srgb,var(--accent,#e146eb) 55%,transparent)}
    .mb-dot{opacity:.5}
    .mb-room:empty,.mb-dot.off{display:none}
    .mb-sender{margin-top:7px;font-size:34px;font-weight:800;color:#fff;letter-spacing:.01em;
      text-shadow:0 3px 26px rgba(0,0,0,.66)}
    .mb-body{margin-top:10px;font-size:20px;font-weight:600;line-height:1.5;
      color:rgba(255,255,255,.9);text-shadow:0 2px 18px rgba(0,0,0,.6);
      overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

    /* 悬停后展开的那一层:全文 + 直接回复 */
    #msgPanel{width:min(70vw,720px);padding:16px 18px 14px;border-radius:18px;
      opacity:0;transform:translateY(-8px) scale(.985);pointer-events:none;
      transition:opacity .22s ease,transform .22s cubic-bezier(.2,.9,.25,1);
      background:rgba(10,12,20,.88);border:1px solid rgba(255,255,255,.14);
      -webkit-backdrop-filter:blur(26px) saturate(1.25);backdrop-filter:blur(26px) saturate(1.25);
      box-shadow:0 26px 70px rgba(0,0,0,.62)}
    #msgLayer.open #msgPanel{opacity:1;transform:none;pointer-events:auto}
    .mp-head{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;
      letter-spacing:.09em;text-transform:uppercase;color:var(--accent,#e146eb)}
    .mp-head .mp-time{margin-left:auto;color:rgba(255,255,255,.42);letter-spacing:.04em}
    .mp-sender{margin-top:9px;font-size:15px;font-weight:800;color:#fff}
    .mp-body{margin-top:6px;font-size:14px;line-height:1.6;color:rgba(255,255,255,.88);
      max-height:34vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
    .mp-reply{display:flex;gap:8px;margin-top:13px}
    .mp-reply input{flex:1;padding:9px 12px;border-radius:10px;font-size:13px;color:#fff;
      background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);outline:none}
    .mp-reply input:focus{border-color:var(--accent,#e146eb)}
    .mp-reply button{padding:9px 18px;border-radius:10px;border:0;cursor:pointer;
      font-size:13px;font-weight:800;color:#0b0c12;background:var(--accent,#e146eb)}
    .mp-reply button:disabled{opacity:.45;cursor:default}
    .mp-note{margin-top:8px;font-size:10.5px;line-height:1.5;color:rgba(255,255,255,.45);min-height:14px}

    #panel{position:fixed;left:30px;bottom:30px;padding:15px 20px;border-radius:18px;
      background:rgba(10,12,20,.30);backdrop-filter:blur(18px) saturate(1.2);
      -webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid rgba(255,255,255,.11);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 12px 44px rgba(0,0,0,.45);
      color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI Variable Text','Segoe UI','Microsoft YaHei UI',system-ui,sans-serif,'Apple Color Emoji','Segoe UI Emoji','Segoe UI Symbol';
      pointer-events:none;user-select:none;min-width:230px;transition:opacity .4s}
    #panel.off{opacity:0}
    #panel .brand{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800;
      letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.5)}
    #panel .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent,#e146eb);
      box-shadow:0 0 9px var(--accent,#e146eb)}
    #panel .big{font-size:38px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
      margin-top:7px;line-height:1;text-shadow:0 0 22px var(--accent,#e146eb)}
    #panel .sub{font-size:11px;color:rgba(255,255,255,.68);margin-top:6px;font-variant-numeric:tabular-nums}
    #panel .rate{color:var(--accent,#e146eb);font-weight:800}
    /* richer HUD sections — same glass aesthetic */
    #panel .divide{height:1px;margin:12px -2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent)}
    #panel .krow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
    #panel .klab{font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.5)}
    #panel .kval{font-size:15px;font-weight:850;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
    #panel .kval .pct{font-size:11px;font-weight:800;color:var(--accent,#e146eb);margin-left:5px}
    #panel .kval.saved{color:#6ee7a0}
    #panel .agents{margin-top:9px;display:flex;flex-direction:column;gap:7px}
    #panel .ag{display:flex;align-items:center;gap:8px;font-size:11px}
    #panel .ag .ic{width:16px;text-align:center;flex-shrink:0;font-size:12px}
    #panel .ag .nm{flex:1;min-width:0;font-weight:700;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #panel .ag .rt{color:var(--accent,#e146eb);font-weight:800;font-variant-numeric:tabular-nums;flex-shrink:0}
    #panel .ag .dotlive{width:6px;height:6px;border-radius:50%;background:#6ee7a0;flex-shrink:0;
      box-shadow:0 0 7px #6ee7a0;animation:blink 1.8s ease-in-out infinite}
    #panel .empty{font-size:10.5px;color:rgba(255,255,255,.4);margin-top:8px;font-style:italic}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- ── 消息投屏 ───────────────────────────────────────────────────────────
       壁纸窗口是点击穿透的(桌面层和置顶层都是),所以这一块不能靠 DOM 的
       mouseenter 来展开 —— 指针根本不会进到这个窗口里来。做法是把这块的屏幕
       矩形报给 Rust,由那边轮询真实光标位置,进出时才临时打开这个窗口的鼠标
       事件并广播 wallpaper-hover。和岛屿那套 dash cursor poll 是同一个思路。 -->
  <div id="msgLayer" class="hidden">
    <div id="msgBig">
      <div class="mb-meta"><span class="mb-app"></span><span class="mb-dot">·</span><span class="mb-room"></span></div>
      <div class="mb-sender"></div>
      <div class="mb-body"></div>
    </div>
    <div id="msgPanel">
      <div class="mp-head"><span class="mp-app"></span><span class="mp-room"></span><span class="mp-time"></span></div>
      <div class="mp-sender"></div>
      <div class="mp-body"></div>
      <div class="mp-reply">
        <input id="mpInput" type="text" placeholder="回复…" autocomplete="off" spellcheck="false">
        <button id="mpSend">发送</button>
      </div>
      <div class="mp-note"></div>
    </div>
  </div>

  <div id="panel">
    <div class="brand"><span class="dot"></span>Terse · Live</div>
    <div class="big" id="pTokens">0</div>
    <div class="sub"><span class="rate" id="pRate">0</span> tok/min · <span id="pTheme">neon</span></div>

    <div class="divide"></div>
    <div class="krow">
      <span class="klab" data-i18n="wpp_saved">Saved by Terse</span>
      <span class="kval saved"><span id="pSaved">0</span><span class="pct" id="pPct">0%</span></span>
    </div>

    <div class="divide"></div>
    <div class="krow">
      <span class="klab">Agents · <span id="pAgentCount">0</span> active</span>
    </div>
    <div class="agents" id="pAgents"></div>
    <div class="empty" id="pAgentsEmpty">No agents connected</div>
  </div>

  <!-- The room has no UI here on purpose.

       The wallpaper is pinned at kCGDesktopWindowLevel — below the layer Finder
       draws desktop icons on, and that layer covers the whole screen. So a click
       aimed at anything painted here is taken by Finder before this window sees
       it, whatever it does with ignoresMouseEvents: a chat box drawn on the
       wallpaper can be looked at and never typed in. The roster, the history and
       the composer therefore live in room.html, an ordinary window that can take
       clicks, keyboard focus and an IME.

       What stays here is what the wallpaper is actually good at: saying, in text
       you can read from across the desk, who is talking and what their agents are
       doing. -->

  <script src="tauri-bridge.js"></script>
  <script src="roomqueue.js"></script>
  <script src="rooms.js"></script>
  <!-- Deliberately a CLASSIC script, and deliberately before the module.
       Nothing inside the module can report the module failing to load. On a
       machine where the WebGL/three import throws, the module below never runs
       at all: no boot(), no overlay class, no diagnostics - just the static HUD
       and `html{background:#05060a}`. Lift THAT to the top of the z-order and
       the user gets an opaque, click-through black sheet over their whole screen
       with no way to dismiss it.
       CI proved this is not hypothetical: twenty wallpaper frames sampled over
       time were byte-identical to each other and to the previous run's, on three
       different commits - the page was frozen the whole time, and every earlier
       diagnosis was made from a picture of a dead page. -->
  <script>
  (function wallpaperDeadMansSwitch(){
    var T = window.terse;
    var note = function (line) {
      try { if (T && T.diagNote) T.diagNote('wallpaper', line).catch(function(){}); } catch (e) {}
    };
    note('page script loaded  tauri=' + !!window.__TAURI__ + '  bridge=' + !!T);
    // CAPTURE phase, deliberately. A module that fails to FETCH or PARSE fires
    // its error event at the <script> element, and element error events do not
    // bubble - so a plain window listener never sees them. That is why the last
    // run reported "DID NOT BOOT" with no error beside it: the hook could only
    // ever have caught runtime errors from a module that was already running.
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t !== window && t.tagName) {
        note('page RESOURCE FAILED <' + t.tagName.toLowerCase() + '> ' +
             (t.src || t.href || '(inline)'));
        return;
      }
      note('page ERROR ' + (e && (e.message || e.type)) + ' @ ' +
           ((e && e.filename) || '?') + ':' + ((e && e.lineno) || '?'));
    }, true);
    // Ask the questions directly instead of inferring them from a screenshot:
    // can the page actually reach the module and the three.js bundle its
    // importmap points at? A 404 here is the whole story; a 200 rules it out.
    ['./vendor/three.module.min.js', './mineradio-wallpaper.js', './token-wallpaper-3d.js']
      .forEach(function (u) {
        try {
          fetch(u, { method: 'GET' })
            .then(function (r) { note('page fetch ' + u + ' -> ' + r.status); })
            .catch(function (err) { note('page fetch ' + u + ' -> THREW ' + (err && err.message || err)); });
        } catch (err) { note('page fetch ' + u + ' -> sync throw ' + err); }
      });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      note('page REJECTED ' + ((r && (r.message || r)) || '?'));
    });
    // If the module never signals that it came up, stop being a sheet: drop the
    // background AND ask Rust to put the window back on the desktop layer. Both,
    // because either alone still leaves a way to cover the screen - and going
    // transparent is safe at the desktop level too, where it simply shows the
    // real desktop picture.
    setTimeout(function () {
      if (window.__terseWallpaperBooted) return;
      note('page DID NOT BOOT within 8s - dropping to the desktop layer');
      try { document.documentElement.classList.add('overlay'); } catch (e) {}
      try { if (T && T.relevelWallpaperWindow) T.relevelWallpaperWindow(false); } catch (e) {}
    }, 8000);
  })();
  </script>
  <script type="module">
    // Earliest possible proof of life, before any import can throw. The switch
    // above is armed until this is set.
    window.__terseWallpaperBooted = 'module-start';
    // Loaded dynamically, on purpose. As STATIC imports these two could kill the
    // whole page: if either fails to instantiate, the inline module never
    // executes a single statement — no boot, no overlay class, no diagnostics,
    // just a page painting #05060a that the native half then lifts over the
    // whole screen.
    //
    // That is not hypothetical. CI reported exactly that, and only after the
    // error hook was moved to the capture phase did it become visible:
    //
    //   page fetch ./mineradio-wallpaper.js   -> 200
    //   page fetch ./vendor/three.module.min.js -> 200
    //   page RESOURCE FAILED <script> (inline)
    //
    // All three files fetch fine, so this is instantiation, not a 404 — and a
    // static import gives no way to catch it or even name it. A dynamic import
    // hands back a real error, and a failed engine becomes a wallpaper that does
    // not draw rather than a sheet over the user's screen.
    let TokenWallpaper3D = null, MineradioWallpaper = null;
    async function loadEngines(){
      const one = async (path) => {
        try { return (await import(path)).default; }
        catch (e) {
          reportOverlayState('page import ' + path + ' FAILED: ' + (e && (e.message || e.name) || e));
          return null;
        }
      };
      MineradioWallpaper = await one('./mineradio-wallpaper.js');
      TokenWallpaper3D   = await one('./token-wallpaper-3d.js');
      reportOverlayState('page engines loaded mineradio=' + !!MineradioWallpaper +
                         ' topography=' + !!TokenWallpaper3D);
    }
    const T = window.terse;
    // 两个引擎 API 完全一致,所以下面的轮询/统计代码一行都不用分叉。
    //   mineradio  = 用户自己的真桌面壁纸 + Mineradio 粒子(默认)
    //   topography = 音域回响光柱地形(原引擎)
    // 'cinematic' is the Pro tier of the mineradio engine, not a separate
    // renderer — it was missing from this map, so picking Pro silently fell
    // back to the free engine and the desktop looked identical.
    // Resolved at call time, not at parse time — the classes do not exist until
    // loadEngines() has run.
    const engineOf = c => (c && c.engine === 'topography')
      ? (TokenWallpaper3D || MineradioWallpaper)
      : MineradioWallpaper;
    const canvas = document.getElementById('stage');
    const panel = document.getElementById('panel');
    const ACCENTS = { indigo:'#8b6bff', ocean:'#3aa0ff', ice:'#7fe9ff', emerald:'#40e0a0',
      gold:'#ffcf5a', amber:'#ff9f43', blood:'#ff5a5a', coral:'#ff7a9c', neon:'#e146eb', mono:'#e8e8f0' };

    /** 取译文,取不到就用调用处的英文 —— 壁纸的字大多是 JS 拼出来的,
        按英文原文匹配的那套机制够不着,所以这里走 key。 */
    const WT = (key, fallback) => {
      const v = (window.i18n && window.i18n.t && key) ? window.i18n.t(key) : null;
      return (v && v !== key) ? v : fallback;
    };

    let wp = null, lastTokens = null, cfg = { engine:'mineradio', style:'cinematic', theme:'neon', quality:44, angle:42, intensity:1.0, showPanel:true };
    /** null = not checked yet (treat as entitled), true/false = a definite answer.
     *  Only an explicit false downgrades the field — see mountEngine. */
    let proOK = null;
    /** Same entitlement rule the control panel uses, so the two can never
     *  disagree about what "Pro" means: an active or trialing subscription on a
     *  tier that is neither empty nor 'expired'. */
    async function refreshEntitlement(){
      try {
        const lic = await (T.getLicense ? T.getLicense() : null);
        if (!lic) return;                       // no command → leave as-is
        const tier = ((lic.tier) || '').toLowerCase();
        const st = ((lic.status) || '').toLowerCase();
        proOK = (st === 'active' || st === 'trialing') && tier !== '' && tier !== 'expired';
      } catch (e) { /* offline → leave proOK alone, fail open */ }
    }
    const rateBuf = [];

    function applyAccent(theme){
      document.documentElement.style.setProperty('--accent', ACCENTS[theme] || ACCENTS.neon);
      document.getElementById('pTheme').textContent = theme;
    }
    function fmt(n){ n=+n||0; if(n>=1e6)return (n/1e6).toFixed(2)+'M'; if(n>=1e3)return (n/1e3).toFixed(1)+'K'; return String(n|0); }

    /** 换引擎:整台拆掉重建(两者的 WebGL 上下文/几何完全不同,没法热切) */
    function mountEngine(){
      if (wp) { try { wp.dispose(); } catch(e){} wp = null; }
      // mineradio 会把用户的真壁纸铺到 body 上;切回音域回响要清掉,否则底图还留着。
      // 置顶时不能写这个纯色 —— 那正是"整块黑板盖住屏幕"的来源;置空即可。
      document.body.style.background = overlayOK() ? '' : '#05060a';
      const E = engineOf(cfg);
      // Nothing loaded — the page stays up and stays transparent instead of
      // throwing here, which is what used to end boot() before it could decide
      // the background.
      if (!E) { reportOverlayState('page mountEngine SKIPPED — no engine class loaded'); return; }
      // pro MUST be forwarded here: without it the engine builds its free
      // field no matter what the user picked in the control panel.
      //
      // But `cfg.engine === 'cinematic'` alone is not entitlement. The control
      // panel checks the licence at the moment you click, and never again — so a
      // subscription that lapses leaves 'cinematic' sitting in wallpaper.json
      // and the Pro field keeps rendering forever, as does hand-editing that
      // file. entitled() re-checks here, where the pixels actually get drawn.
      //
      // Deliberately fails OPEN: a thrown call (offline, backend hiccup) keeps
      // whatever the user already had. The wallpaper is persistent, unlike the
      // settings panel that can fail closed for a moment without anyone losing
      // anything — downgrading a paying user's desktop over a dropped request
      // would be the worse error.
      wp = new E(canvas, { theme: cfg.theme, quality: cfg.quality, angle: cfg.angle,
                           intensity: cfg.intensity,
                           // 粒子风格。引擎自己会把非 Pro 一律钉回默认风格,所以这里
                           // 照传即可 —— 掉出 Pro 的用户会同时失去 Pro 的字和 Pro 的风格。
                           style: cfg.style,
                           // 用户自己调的那份差量,和 style 一起走同一条 Pro 闸门。
                           custom: cfg.customStyle || null,
                           // 保存下来的 3D 机位。引擎对非 Pro 一律把 on 与掉,
                           // 所以和 style 一样照传即可。
                           view3d: cfg.view3d || null,
                           // 3D 按**许可**卖,不按引擎:付了钱但把引擎留在默认
                           // mineradio 的人,照样该能把桌面上的壁纸转起来。
                           proView: proOK !== false,
                           pro: cfg.engine === 'cinematic' && proOK !== false });
      window.wp = wp;   // dev aid: drive from console / preview harness
      wp.start();
    }

    /** 只有粒子引擎能透明:mineradio/cinematic 是 alpha:true + clearColor 全 0,
     *  而 topography 走 bloom+grade 的 composer,最后一道全屏 pass 天生不透明 ——
     *  把它抬到屏保层就是一整块盖住屏幕的地形。Rust 侧有同样一条否决(overlay_allowed),
     *  这里这条只是让画面和窗口层级保持一致。 */
    /** 画面这一半的判断。
     *
     *  ⚠ 这里**故意不查 Pro**。真正决定窗口层级的是 Rust 的 overlay_allowed(),
     *  许可也在那边查;这里再查一次只会让两边算出不同答案,而这两个答案不对称:
     *
     *    · 透明 + 桌面层  → 无害(下面就是同一张桌面图,看起来一模一样)
     *    · 不透明 + 置顶  → 整个屏幕被壁纸糊死
     *
     *  免费用户遇到的就是后者:Rust 把窗口抬上去了(它当时不查 Pro),页面却因为
     *  查了 Pro 而继续画不透明底色。所以这一半只能比 Rust 更宽松,不能更严格。
     *  真正的答案由 Rust 用 wallpaper-overlay 事件推过来,见 boot()。 */
    function overlayOK(c){
      const k = c || cfg;
      return k.overlay === true &&
             (k.engine === 'mineradio' || k.engine === 'cinematic');
    }

    /** 置顶模式的页面这一半:窗口层级由 Rust 改,这里只负责"别画背景"。 */
    function applyOverlay(on){
      document.documentElement.classList.toggle('overlay', !!on);
      if (wp && wp.setOverlay) wp.setOverlay(!!on);
    }

    /** 把这一半**实际画成什么样**如实写进日志,而不是留给下一个人看截图猜。
     *
     *  置顶壁纸连着四轮诊断错误,每一轮都是"看一张全黑的图,推一个说得通的原因"。
     *  但一张全黑的图恰恰分不清两件事:页面还在画自己的底色,还是页面已经透明、
     *  黑的是合成器。前者 computed background 是 rgb(5,6,10),后者是 rgba(…, 0) ——
     *  一行就能定案。Windows 才有 diag_note,别处 invoke 直接 reject,catch 掉即可。 */
    function reportOverlayState(why){
      try {
        if (!(window.terse && window.terse.diagNote)) return;
        const cs = getComputedStyle(document.documentElement);
        const bs = getComputedStyle(document.body);
        window.terse.diagNote('wallpaper',
          'page ' + why +
          ' cfg.overlay=' + JSON.stringify(cfg.overlay) +
          ' engine=' + JSON.stringify(cfg.engine) +
          ' overlayOK=' + overlayOK() +
          ' class=' + document.documentElement.classList.contains('overlay') +
          ' htmlBg=' + cs.backgroundColor +
          ' bodyBg=' + bs.backgroundColor +
          ' bodyImg=' + (bs.backgroundImage || 'none').slice(0, 40) +
          ' engineSetOverlay=' + !!(wp && wp.setOverlay)).catch(() => {});
      } catch (e) {}
    }

    function applyConfig(c){
      const prevEngine = cfg.engine;
      cfg = Object.assign(cfg, c || {});
      if (cfg.engine !== prevEngine) { mountEngine(); applyAccent(cfg.theme);
        // A fresh engine knows nothing about the mode, and this branch RETURNS —
        // so without re-applying here, switching engines while overlaying paints
        // the desktop-picture bed back over every window on screen.
        applyOverlay(overlayOK());
        panel.classList.toggle('off', cfg.showPanel === false); return; }
      if (!wp) return;
      // 换风格不重建引擎 —— setStyle 只改每帧读的参数,正在显示的那条字会用旧手法
      // 散完再换。音域回响引擎没有这个方法,判空即可。
      // 第二个参数一定要传:省略表示"别动自定义",而这里正是自定义可能变了的地方。
      if (wp.setStyle) wp.setStyle(cfg.style, cfg.customStyle || null);
      applyOverlay(overlayOK());
      wp.setTheme(cfg.theme); wp.setQuality(cfg.quality|0); wp.setAngle(cfg.angle|0);
      wp.setIntensity(+cfg.intensity || 1);
      // 3D 自由视角。控制面板里一拖,桌面上这幅画就跟着转 —— 那是这个功能最直接的
      // 演示方式。正在桌面上拖的时候不接受外来的机位,否则自己的手会被覆盖掉。
      if (wp.setView3D && !(wp.isOrbiting && wp.isOrbiting())) wp.setView3D(cfg.view3d || { on:false });
      apply3dMode();
      applyAccent(cfg.theme);
      panel.classList.toggle('off', cfg.showPanel === false);
      if (cfg.showPanel === false) { wp.setAgents([]); wp.setStageItems([]); wp.setAgentLog && wp.setAgentLog(null); } // clear in-scene overlays
    }
    /* ── 3D 自由视角:在**自己的桌面上**拖 ──────────────────────────────────
       桌面层的窗口收得到光标位置,收不到点击 —— Finder 画图标的那个窗口铺满屏幕、
       压在我们上面,而且框选是它在做。所以开着 3D 的时候,Rust 把这层抬到图标层之上
       并变透明(wallpaper_set_3d_mode)。

       抬上去之后,"这一下归谁"完全由**光标位置**决定,每次光标动都重算一次:

         · 指针压在某个桌面图标上 → 立刻还回穿透,那一下点击、双击、拖动都归 Finder,
           文件照选照开,和没装这个东西一样;
         · 指针在空壁纸上         → 我们接管,按下去就是转视角、滚轮就是推拉。

       图标矩形来自 AX(desktopIconRects)。**拿不到就一律不接管** —— 少一个功能,
       好过让人点不动自己的文件。app 的窗口不用管:我们远在普通窗口之下,它们的点击
       根本不会落到这里。 */
    let icon3d = [], icon3dT = 0, mode3d = false, icon3dOk = false, win3d = [];

    function view3dActive(){
      // 壁纸本身关着的时候不算:那种情况下这一层是隐藏的,抬它、给它配一颗按钮
      // 都是在给一个看不见的东西做界面。
      if (cfg.enabled === false) return false;
      // 问引擎,不问配置文件:引擎那份是过了 sanitizeView 的,授权已经与在里面。
      // 直接读 cfg.view3d.on 的话,一份掉出 Pro(或手改过)的配置就能把这层窗口
      // 抬起来 —— 抬窗口是 Pro 的能力,判断只该有一处。
      return !!(wp && wp.attachOrbit && wp.getView3D && wp.getView3D().on);
    }

    async function refreshIcons(){
      if (!T || !T.desktopIconRects) { icon3dOk = false; icon3d = []; return; }
      try {
        const r = await T.desktopIconRects();
        icon3dOk = !!(r && r.ok);
        icon3d = (r && r.rects) || [];
      } catch (e) { icon3dOk = false; icon3d = []; }
      // 别人的窗口也要躲开。桌面层用不着这一条(我们远在普通窗口之下,那些点击根本
      // 落不到这里),但**置顶模式**下这层在所有窗口之上 —— 那时不躲,指针一进到
      // Chrome 上我们就把人家的点击吞了。
      try {
        const w = await T.listOpenWindows();
        win3d = (w && w.windows) || [];
      } catch (e) { win3d = []; }
    }

    /** 屏幕坐标(左上原点)落在某个图标上? 留一圈余量:图标的可点区域比它的框大一点,
     *  而且宁可判成"是图标"(把鼠标还回去),也不要判错成"是空壁纸"(吞掉一次点击)。 */
    function overIcon(x, y){
      const PAD = 10;
      for (const r of icon3d) {
        if (x >= r.x - PAD && x <= r.x + r.w + PAD && y >= r.y - PAD && y <= r.y + r.h + PAD) return true;
      }
      return false;
    }

    /** 指针底下有别人的窗口? */
    function overWindow(x, y){
      for (const r of win3d) {
        if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return true;
      }
      return false;
    }

    /** 这一下该归我们吗 —— 空壁纸才算。 */
    function bareSpot(x, y){ return !overIcon(x, y) && !overWindow(x, y); }

    /* ── 悬停视差 ─────────────────────────────────────────────────────────
       真正的"按住拖"要满足一长串条件:窗口抬到图标层之上、能读到图标矩形(辅助功能
       授权)、系统把那一下交给我们。任何一环缺了,桌面上就**一点反应都没有** ——
       而"没反应"和"没装这个功能"在用户眼里是一模一样的。

       这一层不一样:它只用光标位置(那是壁纸窗口在桌面层**本来就收得到**的东西),
       不吃任何点击、不需要任何授权。鼠标一动,画面就跟着轻轻转 —— 3D 是活的,
       这件事第一秒就成立;能不能按住拖,是它之上的加分项。

       幅度刻意小:这是壁纸,不是游戏。它绕着用户自己存的那个机位轻轻晃,而不是
       把机位改掉 —— 所以永远不写盘。 */
    const HOVER_AZ = 0.30, HOVER_EL = 0.18;

    function hoverParallax(x, y){
      if (!wp || !wp.setView3D || !view3dActive()) return;
      if (orbitOn) return;                 // 人正按着拖,别跟他抢
      const base = cfg.view3d || {};
      const sw = window.screen.width || 1, sh = window.screen.height || 1;
      const nx = Math.max(-1, Math.min(1, (x / sw) * 2 - 1));
      const ny = Math.max(-1, Math.min(1, (y / sh) * 2 - 1));
      wp.setView3D({ on: true,
                     az: (+base.az || 0) + nx * HOVER_AZ,
                     el: (+base.el || 0) - ny * HOVER_EL,
                     dist: +base.dist || 1 });
    }

    async function apply3dMode(){
      const want = view3dActive();
      if (want === mode3d) return;
      mode3d = want;
      if (!T || !T.wallpaperSet3dMode) return;
      try { await T.wallpaperSet3dMode(want); } catch (e) { mode3d = false; return; }
      if (want) { await refreshIcons(); clearInterval(icon3dT); icon3dT = setInterval(refreshIcons, 4000); }
      else { clearInterval(icon3dT); icon3dT = 0; icon3d = []; }
    }

    function pulseForDelta(d){
      if (d <= 0) return;
      const s = Math.min(1.8, 0.12 + Math.log10(1 + d) * 0.42);
      if (!wp) return;
      wp.pulse(s);
      if (cfg.showPanel !== false) wp.floatToken(d, 'consume'); // rising "+N" over the columns
    }
    async function poll(){
      try {
        const total = await T.getTokenPulse();
        if (lastTokens === null) lastTokens = total;
        const d = Math.max(0, total - lastTokens);
        lastTokens = total;
        if (d > 0){
          pulseForDelta(d);
          const now = Date.now(); rateBuf.push({ t: now, d });
          while (rateBuf.length && now - rateBuf[0].t > 60000) rateBuf.shift();
        }
        document.getElementById('pTokens').textContent = fmt(total);
        document.getElementById('pRate').textContent = fmt(rateBuf.reduce((a,b)=>a+b.d,0));
      } catch(e){}
    }

    // Slower poll for the richer HUD: tokens Terse optimized + live agent activity, feeding BOTH the
    // corner panel and the in-scene overlays (rising savings, hovering agent tags, centre stage).
    const AGENT_ICON = { claude:'✳️', 'claude-code':'✳️', cursor:'▹', codex:'◆', copilot:'⧉', windsurf:'≈', gemini:'✦', hermes:'⬡', 'deepseek-harness':'🐋', deepseek:'🐋' };
    const shortLog = t => (t||'').replace(/\s+/g,' ').trim().slice(0,46);
    // "Saveable" = the concrete waste Terse could trim from an agent's REAL traffic (agent traffic
    // never credits tokens_saved, so today's saved is ~0 — this is the honest, non-zero number).
    function saveableOf(a){
      return (+a.rereadWaste||0)
        + ((a.toolCachePotential && +a.toolCachePotential.tokensWasted)||0)
        + ((a.toolResultStats && +a.toolResultStats.compressibleTokens)||0)
        + ((a.optimizationStats && +a.optimizationStats.potentialSavings)||0);
    }
    // Map one recent agent message → a log line (matches the Dynamic Island's step vocabulary).
    function fmtTok(n){ n=+n||0; return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n); }
    function msgToLine(m){
      const name = (m.toolName||m.tool_name||'').toString();
      if (m.type==='tool_use')    return { kind:'tool',   ico:'⚙', label: name||'tool',                    tok:+m.tokens||0 };
      if (m.type==='tool_result') return { kind:'result', ico:'←', label: (name? name+' → result':'result'), tok:+m.tokens||0 };
      if (m.role==='assistant')   return { kind:'asst',   ico:'◆', label: shortLog(m.text)||'responding',   tok:+m.tokens||0 };
      return                             { kind:'user',   ico:'→', label: shortLog(m.text)||'prompt',        tok:+m.tokens||0 };
    }
    let lastSaved = null;
    async function pollMeta(){
      const show = cfg.showPanel !== false;
      let saved = 0, pct = 0, active = [], sessions = [];
      // Tokens saved by Terse (today) — captured here, but the DISPLAYED value falls back to agent
      // "saveable" below (see savedShown) since agent traffic doesn't credit tokens_saved.
      try {
        const s = await T.getStats('day'); // 'day' = today; 'today' falls through to all-time
        const sum = (s && (s.summary || s)) || {};
        saved = +sum.tokensSaved || 0;
        pct = +sum.percentSaved || (sum.tokensIn ? Math.round(saved / sum.tokensIn * 100) : 0);
      } catch(e){}
      // Live agents
      try {
        const list = (await T.getAgentSessions()) || [];
        sessions = list;   // needed after this try block (log groups)
        active = list.filter(a => a && a.connected !== false);
        document.getElementById('pAgentCount').textContent = active.length;
        const wrap = document.getElementById('pAgents');
        const empty = document.getElementById('pAgentsEmpty');
        empty.style.display = active.length ? 'none' : '';
        wrap.innerHTML = active.slice(0, 4).map(a => {
          const ic = a.agentIcon || AGENT_ICON[(a.agentType||'').toLowerCase()] || '🤖';
          const nm = a.agentName || a.agentType || 'Agent';
          const rt = (+a.burnRate || 0) > 0 ? fmt(a.burnRate) + '/min' : fmt(a.totalTokens || 0);
          return `<div class="ag"><span class="dotlive"></span><span class="ic">${ic}</span>`+
                 `<span class="nm">${nm}</span><span class="rt">${rt}</span></div>`;
        }).join('');
      } catch(e){}

      // Saved fallback: show today's real saved OR the aggregate agent "saveable" (whichever is
      // larger) so the number is meaningful instead of a perpetual 0.
      const saveableAgg = active.reduce((s,a) => s + saveableOf(a), 0);
      const totalAgentTok = active.reduce((s,a) => s + (+a.totalTokens || 0), 0);
      const savedShown = Math.max(saved, saveableAgg);
      const pctShown = saved > 0 ? pct : (totalAgentTok > 0 ? Math.round(saveableAgg / totalAgentTok * 100) : 0);
      document.getElementById('pSaved').textContent = fmt(savedShown);
      document.getElementById('pPct').textContent = pctShown + '%';
      if (lastSaved !== null && show && wp) { const ds = savedShown - lastSaved; if (ds > 0) wp.floatToken(ds, 'saved'); }
      lastSaved = savedShown;

      if (!wp) return;
      // Drive the field's 律动 from REAL agent activity (aggregate burn rate) — always, even when the
      // stats panel is hidden. No agents / all idle → calm field; agents burning tokens → it dances.
      const totalBurn = active.reduce((s,a) => s + (+a.burnRate || 0), 0);
      const activity = Math.min(1, (active.length ? 0.08 : 0) + totalBurn / 4500);
      wp.setActivity(activity);

      // Feed the in-scene overlays (or clear them when the panel is hidden).
      if (!show) { wp.setAgents([]); wp.setStageItems([]); wp.setAgentLog(null); return; }
      // Hovering agent tags over the columns.
      wp.setAgents(active.slice(0, 5).map(a => ({
        key: a.agentType || a.agentName,
        name: a.agentName || a.agentType || 'Agent',
        icon: a.agentIcon || AGENT_ICON[(a.agentType||'').toLowerCase()] || '🤖',
        rate: (+a.burnRate || 0) > 0 ? a.burnRate : null,
      })));
      // Centre "now playing" stage — rotates consumed → saveable → each active agent.
      const stage = [
        { k:'Today · consumed', v: fmt(lastTokens || 0), u:'tokens' },
        { k: WT('wpp_saveable', 'Terse saveable'), v: fmt(savedShown), u: pctShown + '%', saved:true },
      ];
      active.slice(0, 3).forEach(a => stage.push({
        ic: a.agentIcon || AGENT_ICON[(a.agentType||'').toLowerCase()] || '🤖',
        k: (a.agentName || a.agentType || 'Agent'),
        v: fmt((+a.burnRate||0) > 0 ? a.burnRate : (a.totalTokens||0)),
        u: (+a.burnRate||0) > 0 ? 'tok/min' : 'tokens',
      }));
      wp.setStageItems(stage);

      // Live agent log — EACH active agent gets its own headed group of recent steps (detailed
      // tool/result/text lines), busiest first, up to 3 agents.
      // Source the log from ALL sessions, not just `active`. The island shows a
      // last-known line whether or not a session is currently flagged
      // connected; the wallpaper filtered on `connected !== false` first, so a
      // session the island was happily displaying produced NOTHING here — the
      // centre stayed empty even while the island scrolled its log.
      const logGroups = (sessions || [])
        .filter(a => a && (a.recentMessages||[]).length)
        .sort((a,b) => (+b.burnRate||0) - (+a.burnRate||0))
        .slice(0, 3)
        .map(a => ({
          name: a.agentName || a.agentType || 'Agent',
          icon: a.agentIcon || AGENT_ICON[(a.agentType||'').toLowerCase()] || '🤖',
          project: a.project ? String(a.project).split('/').filter(Boolean).pop() : '',
          lines: (a.recentMessages||[]).map(msgToLine),
        }));
      // Fall back to facts we KNOW exist. recentMessages can be empty even for a
      // busy session (the monitor only fills it once it has parsed transcript
      // lines), and an empty centre reads as a broken feature. Everything here
      // is still real session data — nothing is invented.
      if (!logGroups.length && sessions.length) {
        const s0 = sessions.slice().sort((a,b) => (+b.totalTokens||0) - (+a.totalTokens||0))[0];
        if (s0) {
          const bits = [];
          if (s0.turns) bits.push(s0.turns + ' turns');
          if (s0.totalTokens) bits.push(fmtTok(s0.totalTokens) + ' in');
          if (s0.model) bits.push(String(s0.model));
          logGroups.push({
            name: s0.agentName || s0.agentType || 'Agent',
            icon: s0.agentIcon || '🤖',
            lines: [{ label: (s0.agentName || 'Agent') + ' · ' + (bits.join(' · ') || 'connected') }],
          });
        }
      }
      // In a room, OUR OWN line is drawn by the room layer instead — with our
      // name on it, exactly like everyone else's. Solo, nothing here changes:
      // the hook does not exist and this is a single undefined check.
      //
      // The name matters more than it sounds. Without it the field showed four
      // people's lines with three names on them, and the unnamed ones — yours —
      // were indistinguishable from the wallpaper's own chatter.
      var l0 = logGroups.length ? (logGroups[0].lines || [])[0] : null;
      var txt = typeof l0 === 'string' ? l0 : (l0 && (l0.label || l0.text)) || '';
      var mine = window.__terseRoomOwnLine && window.__terseRoomOwnLine(logGroups, txt);
      if (!mine) wp.setAgentLog(logGroups);
      // Tee the same line into the room. Throttled and mute-checked by the hook.
      if (window.__terseRoomPublish && txt) window.__terseRoomPublish(txt);
    }

    /** Await something, but never forever, and say so when it did not answer.
     *
     *  Every await in boot() used to be unbounded, and boot() is what decides
     *  whether this window paints a background. So ONE call that never settles —
     *  an invoke with no reply, an entitlement check waiting on a network that
     *  is not there — froze the page before it could apply the overlay class,
     *  and the window sat over the whole screen as an opaque sheet.
     *
     *  That is exactly what CI kept photographing. Locally the same page boots
     *  fine, because with no `window.terse` the first call throws instantly
     *  instead of hanging — which is why "works on my machine" held for so long
     *  while every Windows run was frozen. */
    const LATE = Symbol('timed out');
    /** Set the moment any bounded call fails to answer. "We could not find out"
     *  is NOT the same as "overlay is off", and only one of those two is safe to
     *  paint a background for. */
    let bootUnsure = false;
    function settle(p, ms, tag){
      return Promise.race([
        Promise.resolve(p).catch(e => {
          bootUnsure = true;
          reportOverlayState('boot ' + tag + ' THREW ' + (e && e.message || e));
          return LATE;
        }),
        new Promise(r => setTimeout(() => {
          bootUnsure = true;
          reportOverlayState('boot ' + tag + ' DID NOT ANSWER in ' + ms + 'ms — carrying on without it');
          r(LATE);
        }, ms)),
      ]);
    }

    /* ══════════════ 消息投屏 ══════════════
       数据来自通知中心(见 messages.rs):一条通知就是 app + 谁 + 哪个群 + 正文。
       这里只负责显示:大字是预览,鼠标移上去才展开全文和回复框。

       两个必须知道的约束:
        · 壁纸窗口点击穿透,DOM 的 mouseenter 永远不会触发 —— 所以进出由 Rust
          轮询真实光标位置来判定,这里只听 wallpaper-hover 事件。
        · 正文会显示在桌面上,谁看见你的屏幕就看见它,置顶时尤其如此。
          cfg.msgPreview=false 时只显示"谁发的",不显示任何正文。 */
    let msgs = [], msgIdx = 0, msgHot = false, curMsg = null;

    function fmtTime(ts){
      const d = new Date((ts||0) * 1000), n = new Date();
      const p2 = (x) => String(x).padStart(2,'0');
      const hm = p2(d.getHours()) + ':' + p2(d.getMinutes());
      return (d.toDateString() === n.toDateString()) ? hm : (d.getMonth()+1) + '/' + d.getDate() + ' ' + hm;
    }

    function renderMsg(m){
      if (!m) return;
      curMsg = m;
      const L = document.getElementById('msgLayer');
      const big = document.getElementById('msgBig');
      if (!L || !big) return;
      const q = (sel) => L.querySelector(sel);
      big.classList.add('swap');            // 先淡出再换字,避免硬跳
      setTimeout(() => {
        q('.mb-app').textContent  = m.app_name || '';
        q('.mb-room').textContent = m.group || '';
        q('.mb-dot').classList.toggle('off', !m.group);
        q('.mb-sender').textContent = m.sender || '';
        q('.mb-body').textContent = (cfg.msgPreview === false) ? '' : ('\u300c' + (m.body || '') + '\u300d');
        q('.mp-app').textContent  = m.app_name || '';
        q('.mp-room').textContent = m.group ? ('\u00b7 ' + m.group) : '';
        q('.mp-time').textContent = fmtTime(m.ts);
        q('.mp-sender').textContent = m.sender || '';
        q('.mp-body').textContent = m.body || '';
        q('.mp-note').textContent = '';
        const inp = document.getElementById('mpInput');
        if (inp) inp.value = '';
        big.classList.remove('swap');
        reportHotRect();
      }, 260);
    }

    /** 把大字那块的屏幕矩形报给 Rust —— 它据此判断光标有没有压上来。 */
    function reportHotRect(){
      try {
        const el = document.getElementById('msgBig');
        if (!el || !T || !T.wallpaperSetHotRect) return;
        const r = el.getBoundingClientRect();
        T.wallpaperSetHotRect(Math.round(r.left), Math.round(r.top),
                              Math.round(r.width), Math.round(r.height));
      } catch (e) {}
    }

    function nextMsg(){
      if (msgHot || !msgs.length) return;   // 展开时不要换 —— 人正在读
      msgIdx = (msgIdx + 1) % msgs.length;
      renderMsg(msgs[msgIdx]);
    }

    async function pullMessages(){
      try {
        if (!T || !T.messagesForWallpaper) return;
        // 走 for_wallpaper 而不是 recent:被用户关掉的 app 在 Rust 那边就滤掉了,
        // 免得两处各滤一遍、还滤得不一样。
        const list = await T.messagesForWallpaper(20);
        if (!Array.isArray(list) || !list.length) return;
        const fresh = list[0] && (!msgs[0] || list[0].id !== msgs[0].id);
        msgs = list;
        document.getElementById('msgLayer')?.classList.remove('hidden');
        if (fresh) { msgIdx = 0; renderMsg(msgs[0]); }   // 新消息立刻插队
        else if (!curMsg) renderMsg(msgs[0]);
      } catch (e) {}
    }

    function initMessages(){
      if (cfg.messages === false) return;
      pullMessages();
      setInterval(pullMessages, 8000);
      setInterval(nextMsg, 9000);
      try {
        if (window.__TAURI__ && window.__TAURI__.event) {
          window.__TAURI__.event.listen('wallpaper-hover', (ev) => {
            msgHot = ev.payload === true;
            document.getElementById('msgLayer')?.classList.toggle('open', msgHot);
          });
        }
      } catch (e) {}

      const send = document.getElementById('mpSend');
      const inp  = document.getElementById('mpInput');
      const note = () => document.querySelector('#msgPanel .mp-note');
      // 两步:先打开会话交给人看,确认了再发(微信不给读界面,机器无法自证收件人)
      let armed = false;
      const resetSend = () => { armed = false; if (send) send.textContent = '\u6253\u5f00\u4f1a\u8bdd'; };
      resetSend();

        const text = (inp && inp.value || '').trim();

        try {
          if (!armed) {
            const r = await T.messagesOpenChat(curMsg.app_id, curMsg.group || curMsg.sender);
            if (r && r.ok) {
              armed = true;
              send.textContent = '\u786e\u8ba4\u53d1\u9001';

          } else {

            if (n) n.textContent = (r && r.ok) ? '\u5df2\u53d1\u9001' : ('\u5931\u8d25\uff1a' + ((r && r.error) || ''));

      // the Pro field. Re-checked every 5 min: this window lives for days, and a
      // subscription can start or end while it runs.
      //
      // Bounded, because this one talks to the licence backend: on a machine
      // that cannot reach it, an unbounded await here is a frozen wallpaper.
      // proOK stays null on a timeout, and null means "not checked yet", which
      // is already the entitled-until-proven-otherwise case.
      await settle(refreshEntitlement(), 4000, 'refreshEntitlement');

      // nothing applied the mode, so the desktop-picture bed was painted — at
      // screen-saver level that is a copy of your wallpaper laid over every
      // window. applyConfig covers the later paths; boot has to cover the first.
      //
      // BEFORE mountEngine, not after. The engine is the part that can fail —
      // it needs a WebGL context, and on a machine without one `new E(...)`

      // background first means a dead engine leaves a transparent window rather
      // than an opaque sheet, which is the difference between "the wallpaper did
      // not come up" and "the screen is covered and cannot be dismissed".

        // twenty identical frames and no explanation.
        try { if (T && T.diagNote) T.diagNote('wallpaper',

      }

      // which is what overlayOK() just read, may be the one thing that never

      // transparent, and back on the desktop layer. Transparent is safe at
      // either level — down there it simply shows the real desktop picture.

       only look at. The renderer already knows each glyph's centre and box
       (the shader needs them to form the letters), so hit-testing is free and
       the wallpaper becomes the fastest launcher on the machine: the thing you

         缺了它,桌面上就一次也不接管。这条路没有任何前置条件:用户明确按了按钮,

        applyOverlay(on || overlayOK());
        if (on) {
          if (!wp.attachOrbit(canvas, onOrbitChange, { wheelAlways: true })) {
            console.log('[wp3d] attachOrbit REFUSED (no licence in the engine)');
            adjustOn = false; return;
          }
          console.log('[wp3d] orbit attached to the canvas');
          orbitOn = true;                 // 复用同一套:armed、续期、写盘
          orbitMoved = false;

        // tags for colour, so no new taxonomy is needed.

       The connection itself is shared — one EventSource per machine, owned by
       whichever window claims it, rebroadcast to the rest (see cowork-relay.js).
       This window never opens its own stream; it only listens. */
    (function peers() {
      var TE = window.__TAURI__ && window.__TAURI__.event;
      if (!TE || !TE.listen) return;
      var roster = new Map();
      var sessionOwner = new Map();   // session_id → display name

      // Whether we are in a session at all is the app's decision, not the
      // wallpaper's — it arrives as an event. Absent that, nothing below fires.
      TE.listen('cowork-session', function (ev) {
        var p = (ev && ev.payload) || {};
        var members = Array.isArray(p.members) ? p.members : [];
        roster = new Map(members.map(function (m) { return [String(m.id), m]; }));
        if (wp && wp.setPeers) wp.setPeers(members);
      });

      TE.listen('cowork-peer', function (ev) {
        if (!wp || !wp.peerLog || !roster.size) return;   // solo → ignore entirely
        var m = (ev && ev.payload) || {};
        // Never echo our own activity back into the field: it is already there
        // through the local path, and a duplicate in a peer colour would read
        // as a second person doing your work.
        if (m.self) return;
        // Use the server's REAL event shape, not an invented one. cowork.js has
        // always emitted { type:'log', entry:{ session_id, role, kind, text } }
        // and { type:'session', session:{ agent_name, device, ... } }; my first
        // pass listened for a { text, peerId, name } shape that nothing sends,
        // so no peer glyph could ever have appeared.
        if (m.type === 'log' && m.entry && m.entry.text) {
          var e2 = m.entry;
          var who = sessionOwner.get(e2.session_id) || '';
          wp.peerLog(e2.session_id, who, e2.text);
        } else if (m.type === 'session' && m.session) {
          // Remember which person each session belongs to, so a log line can be
          // attributed without the server repeating the name on every entry.
          var ss = m.session;
          sessionOwner.set(ss.id, ss.agent_name || ss.device || '');
        } else if (m.type === 'stat' && typeof m.activity === 'number') {
          // Peer load nudges the field without printing a glyph — presence you
          // feel rather than read.
          wp.pulse(Math.min(0.6, 0.15 + m.activity * 0.45));
        }
      });
    })();

    /* ── Room: many people, one field ──────────────────────────────────────
       The room's WINDOW is room.html. What happens here is the other half: the
       big text says who is talking and what everyone's agents are doing, which
       is the part you read from across the desk and the part a window cannot do.

       Two rules decide what the field says, and they are the room's manners:

         · A person speaking outranks any machine. A chat message is shown next,
           immediately — not on the next tick — because waiting three seconds
           behind a build log is how a room starts to feel dead. Several people
           talking at once are shown in the order they spoke, and faster, so a
           burst reads as a conversation instead of a slideshow.
         · Agent logs only ever fill the silence. They play round-robin, one line
           per person per turn, and only when nobody has said anything.

       Watched, not read once: rooms are joined in the MAIN window, and this one
       is already running by then. */
    (function roomLayer() {
      var R = window.TerseRooms, Q = window.TerseRoomQueue;
      if (!R || !Q) return;

      var roster = new Map();                 // memberId → member
      var queue = new Q.RoomQueue();
      var me = null;
      var stopStream = null, timer = 0;

      var QUIET_MS = 2600;    // agent-log cadence: a room is not a race
      var TALK_MS = 1300;     // while people are talking, keep up with them

      function nameOf(id) {
        var m = roster.get(String(id));
        return (m && (m.name || m.user_email)) || 'someone';
      }

      /* Everyone, including us. The engine only draws people it has been told
         about, so leaving ourselves out meant our own messages never appeared —
         and in a room of one, nothing did. */
      function drawRoster(members) {
        roster = new Map(members.map(function (m) { return [String(m.member_id), m]; }));
        if (wp && wp.setPeers) {
          wp.setPeers(members.map(function (m) {
            return { id: m.member_id, name: m.name || m.user_email || '' };
          }));
        }
      }

      /* One item onto the field. Everything carries a NAME: a line of big text
         with no author is just noise arriving, and in a shared field the author
         is most of the meaning. */
      function pump() {
        var next = queue.take();
        if (next && wp) {
          var who = nameOf(next.memberId);
          var self = String(next.memberId) === String(me);
          // The CENTRE, not the statistics band. peerLog scatters a line into
          // the small band around the edge, which is right for a stray build log
          // and wrong for the room: what someone said is the headline, and so is
          // an agent line once you are sharing a field with other people.
          if (wp.roomLine) {
            // Speech is marked before it reaches the particles, so a person is
            // never mistaken for their agent's output — and gets more room,
            // because it is the thing worth reading.
            wp.roomLine(next.memberId, who,
                        next.kind === 'message' ? '💬 ' + next.item : next.item,
                        { max: next.kind === 'message' ? 24 : 18, self: self });
          } else if (wp.peerLog) {
            wp.peerLog(next.memberId, who, next.item);   // older engine
          }
        }
        schedule();
      }
      function schedule() {
        clearTimeout(timer);
        timer = setTimeout(pump, queue.pendingMessages() ? TALK_MS : QUIET_MS);
      }
      /** Someone spoke: say it NOW, and re-time everything after it. */
      function speakNow() {
        clearTimeout(timer);
        pump();
      }

      function startRoom() {
        me = (R.state() || {}).memberId || null;
        schedule();
        stopStream = R.connect({
          onSnapshot: function (s) {
            me = s.you || me;
            drawRoster(s.members || []);
            // The backlog is history, not news: the window shows it, the field
            // does not replay an hour of other people's conversation.
          },
          onRoster: function (members) {
            var seen = new Set(members.map(function (m) { return String(m.member_id); }));
            roster.forEach(function (_v, id) { if (!seen.has(id)) queue.drop(id); });
            drawRoster(members);
          },
          onLog: function (e) {
            if (String(e.member_id) === me) return;   // our own lines already play locally
            queue.pushLog(e.member_id, e.text);
          },
          onMessage: function (m) {
            queue.pushMessage(m.member_id, m.body || '[image]');
            speakNow();
          },
          onClosed: function () { stopRoom(); },
        });
      }

      function stopRoom() {
        if (stopStream) { try { stopStream(); } catch (e) {} stopStream = null; }
        clearTimeout(timer); timer = 0;
        roster = new Map();
        queue = new Q.RoomQueue();
        me = null;
        if (wp && wp.setPeers) wp.setPeers([]);
      }

      R.watch(function (st) {
        stopRoom();
        if (st && st.id && st.key) startRoom();
      });
      window.addEventListener('beforeunload', stopRoom);

      /* Publish OUR agent's lines to the room. A tee, not a second source — the
         wallpaper already receives them for the local field — and throttled,
         because the room is a place to be seen working, not a log shipper.
         Muting is checked HERE, at the moment of sending: "hide my agent log"
         has to mean nobody else receives it, not that it is hidden after the
         fact. */
      /* Our own agent line, while we are in a room.
         Returns true when it has taken responsibility for the line, so the
         wallpaper's solo path stays untouched when we are in no room.

         Two things happen here that could not happen anywhere else:
           · the line is drawn through the SAME path as everyone else's, so it
             carries our name and our colour and is legible as ours;
           · "hide my agent log" hides it HERE too. A switch that stopped the
             broadcast but left the line burning across your own wallpaper is
             not what hiding your log means to the person who pressed it. */
      window.__terseRoomOwnLine = function (groups, text) {
        if (!R.inRoom()) return false;
        // The pulse is the wallpaper's heartbeat and belongs to the machine, not
        // to the room — it keeps beating whether or not the line is shown.
        try {
          var first = (groups && groups[0] && groups[0].lines || [])[0];
          if (first && +first.tok > 0 && wp && wp.pulse) {
            wp.pulse(Math.min(1.2, 0.15 + Math.log10(1 + first.tok) * 0.3));
          }
        } catch (e) {}
        if (R.logMuted()) {
          // Hidden means hidden: the headline rotation replays the last few
          // lines, so the ones already in it have to go as well or a muted log
          // keeps coming back round.
          if (wp && wp.clearHeadline) wp.clearHeadline();
          return true;
        }
        var t = String(text || '').trim();
        if (t && wp && me) {
          if (wp.roomLine) wp.roomLine(me, nameOf(me), t, { max: 18, self: true });
          else if (wp.peerLog) wp.peerLog(me, nameOf(me), t);
        }
        return true;
      };

      var lastPub = 0, lastText = '';
      window.__terseRoomPublish = function (text) {
        if (!R.inRoom() || R.logMuted()) return;
        var t = String(text || '').trim();
        if (!t || t === lastText) return;
        var now = Date.now();
        if (now - lastPub < 3000) return;
        lastPub = now; lastText = t;
        R.publishLog(t.slice(0, 300), 'log');
      };
    })();
  </script>
  <!-- 语言机制:data-i18n 的键在这里被解析。放最后,让它在页面自己的脚本之后跑。 -->
  <script src="i18n.js"></script>
</body>
