<!doctype html>
<html lang="zh">
<head>
  <meta name="robots" content="noindex, nofollow">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Terse · 把省下的 Token 变成金币与花</title>
<style>
/* =====================================================================
   Frame-faithful HTML recreation of the Koco habit-tracker promo video.
   720x960 source · 29.1s · iPhone 15 Pro (silver titanium) floating &
   tilting in 3D on a light-grey product backdrop, glass screen with
   live specular sheen.  Scenes cross-fade on a real-time timeline while
   the device keeps rotating.  Icons use native Apple 3D emoji (exactly
   what the original app renders).  Pure CSS/JS, no assets.
   ===================================================================== */
:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --green:#0bbf76; --greenD:#0a9e63; --lime:#9bff4d;
  --grad:linear-gradient(135deg,#9bff4d 0%,#12e08c 46%,#06d6e6 100%);
  --gradD:linear-gradient(135deg,#0fae6e,#0bbf76 50%,#08a9c0);
  /* device build dims (design px; whole rig is scaled to fit) */
  --w:372px; --h:800px; --r:60px; --rim:6px; --bezel:5px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html,body{height:100%;background:#0b0b0d;font-family:var(--sans);overflow:hidden}
emoji,.e{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-style:normal}

/* ---------------- stage / product backdrop ---------------- */
#stage{position:fixed;inset:0;display:grid;place-items:center;perspective:920px;perspective-origin:50% 42%;
  background:
    radial-gradient(64% 46% at 50% 34%,rgba(34,231,170,.34),transparent 62%),
    radial-gradient(58% 42% at 50% 84%,rgba(8,200,235,.26),transparent 62%),
    linear-gradient(158deg,#0a2c24 0%,#08202e 52%,#0c1736 100%)}
#fit{position:relative;transform-origin:center center}
.contact-shadow{position:absolute;left:50%;bottom:3%;width:calc(var(--w)*1.05);height:60px;transform:translateX(-50%);
  border-radius:50%;z-index:-1;filter:blur(28px);
  background:radial-gradient(ellipse at center,rgba(26,240,180,.4),rgba(8,200,235,.2) 42%,transparent 72%);
  animation:shadow 6s ease-in-out infinite}
@keyframes shadow{0%,100%{transform:translateX(-50%) scale(1);opacity:.92;filter:blur(16px)}
  50%{transform:translateX(-50%) scale(1.13);opacity:.6;filter:blur(24px)}}

/* ---------------- float + 3D tilt ---------------- */
#float{animation:float 6s ease-in-out infinite;will-change:transform}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
/* #phone transform is driven per-scene by JS (rAF) to match the real video's
   angle for each scene.  NO filter/overflow here — those flatten 3D, and we
   need the pop-out star layer to keep real translateZ depth. */
#phone{transform-style:preserve-3d;will-change:transform;transform:rotateX(6deg) rotateY(14deg) rotateZ(-1deg)}
/* un-clipped 3D layer (sibling of the screen) so stars can leap OUT of the glass */
#popLayer{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none;z-index:40}
.pop{position:absolute;left:var(--ox,50%);top:var(--oy,44%);transform-style:preserve-3d;will-change:transform;
  animation:popOut var(--d,1.5s) cubic-bezier(.16,1,.3,1) var(--dl,0s) forwards}
.pop::after{content:"";position:absolute;left:50%;top:118%;width:30px;height:9px;border-radius:50%;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(20,22,28,.3),transparent);filter:blur(2px);opacity:0;animation:popShadow var(--d,1.5s) ease-out var(--dl,0s) forwards}
/* shockwave ring + flash that burst behind the element as it pops out */
.pop::before{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  border:3px solid rgba(255,214,90,.95);box-shadow:0 0 12px rgba(255,214,90,.7);transform:scale(.2);opacity:.95;
  animation:popRing 640ms cubic-bezier(.16,1,.3,1) var(--dl,0s) both}
@keyframes popRing{0%{transform:scale(.2);opacity:.95;border-width:6px}100%{transform:scale(4.2);opacity:0;border-width:.5px}}
/* juicy squash-and-stretch burst out, then gravity arc + tumble */
@keyframes popOut{
  0%{transform:translate(-50%,4px) translateZ(0) scale3d(.3,.3,1) rotate(0);opacity:0}
  10%{opacity:1;transform:translate(-50%,-14px) translateZ(110px) scale3d(1.35,.72,1) rotate(8deg)}   /* squash WIDE as it slams out */
  20%{transform:translate(calc(-50% + var(--dx,0px)),-40px) translateZ(165px) scale3d(.74,1.28,1) rotate(34deg)} /* recoil TALL */
  32%{transform:translate(calc(-50% + var(--dxm,0px)),-52px) translateZ(135px) scale3d(1.12,.92,1) rotate(120deg)}
  44%{transform:translate(calc(-50% + var(--dxm,0px)),-44px) translateZ(120px) scale(1) rotate(200deg)}
  100%{transform:translate(calc(-50% + var(--dx2,0px)),var(--fall,250px)) translateZ(10px) scale(.8) rotate(var(--spin,460deg));opacity:.92}}
@keyframes popShadow{0%,46%{opacity:0;transform:translateX(-50%) scale(.3)}100%{opacity:.5;transform:translateX(-50%) scale(1)}}

/* ---------------- titanium frame ---------------- */
.frame{position:relative;width:var(--w);height:var(--h);border-radius:var(--r);padding:var(--rim);transform-style:preserve-3d;
  background:
   repeating-linear-gradient(90deg,rgba(255,255,255,0) 0px,rgba(255,255,255,.05) 1px,rgba(0,0,0,.045) 2px,rgba(255,255,255,0) 3px),
   linear-gradient(100deg,#d6d8da 0%,#f5f6f7 12%,#c5c7ca 30%,#e9eaec 50%,#c0c2c5 70%,#f1f2f4 88%,#cdcfd2 100%);
  box-shadow:
   inset 0 2px 1px rgba(255,255,255,.85),
   inset 2px 0 1px rgba(255,255,255,.45),
   inset 0 -3px 2px rgba(0,0,0,.34),
   inset -2px 0 2px rgba(0,0,0,.22),
   inset 0 0 0 1px rgba(0,0,0,.16),
   0 30px 46px rgba(20,22,28,.22),
   0 9px 16px rgba(20,22,28,.16)}
.frame::before{content:"";position:absolute;inset:0;border-radius:var(--r);padding:var(--rim);pointer-events:none;
  background:conic-gradient(from 212deg at 50% 50%,#fff 0deg,#b8bbbf 40deg,#f6f7f8 90deg,#a7aaae 150deg,#fff 200deg,#babdc1 250deg,#f3f4f6 300deg,#fff 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
/* side buttons */
.btn{position:absolute;border-radius:3px;background:linear-gradient(180deg,#e7e8ea,#b4b6b9,#e7e8ea);box-shadow:inset 0 0 1px rgba(0,0,0,.45)}
.btn.act{left:-3px;top:128px;width:3px;height:30px}
.btn.vup{left:-3px;top:172px;width:3px;height:58px}
.btn.vdn{left:-3px;top:240px;width:3px;height:58px}
.btn.pwr{right:-3px;top:182px;width:3px;height:88px}

/* ---------------- screen / glass ---------------- */
.screen{position:relative;width:100%;height:100%;border-radius:calc(var(--r) - var(--rim) + 1px);background:#000;
  padding:var(--bezel);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 0 16px rgba(0,0,0,.9)}
.content{position:relative;width:100%;height:100%;border-radius:calc(var(--r) - var(--rim) - var(--bezel) + 2px);
  overflow:hidden;background:#0a1f1c}
/* dynamic island */
.island{position:absolute;top:13px;left:50%;transform:translateX(-50%) translateZ(2px);width:104px;height:31px;background:#000;
  border-radius:17px;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:0 11px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.12),0 1px 3px rgba(0,0,0,.6)}
.island .rec{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7b7b,#ff3b30 60%,#c1271d);
  box-shadow:0 0 6px 1px rgba(255,59,48,.8);animation:rec 1.7s ease-in-out infinite}
.island .lens{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#22323f,#05080c 70%);
  box-shadow:inset 0 0 2px rgba(120,160,200,.5)}
@keyframes rec{0%,100%{opacity:1}50%{opacity:.4}}
/* static gloss + bevel */
.glass-gloss{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:55;mix-blend-mode:screen;
  background:
   linear-gradient(115deg,transparent 0,transparent 39%,rgba(255,255,255,.05) 45%,rgba(255,255,255,.22) 50%,rgba(255,255,255,.05) 55%,transparent 61%,transparent 100%),
   linear-gradient(135deg,rgba(255,255,255,.18) 0,rgba(255,255,255,.04) 24%,transparent 44%);
  box-shadow:inset -8px -6px 0 -10px rgba(255,255,255,.85),inset 0 -7px 0 -8px rgba(255,255,255,.6),inset 6px 6px 12px -8px rgba(255,255,255,.45)}
/* moving specular sweep */
.glass-sweep{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:56;overflow:hidden;mix-blend-mode:screen}
.glass-sweep::before{content:"";position:absolute;top:-40%;left:-60%;width:58%;height:180%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.05) 30%,rgba(255,255,255,.34) 50%,rgba(255,255,255,.05) 70%,transparent);
  filter:blur(7px);transform:rotate(17deg) translateX(0);animation:sweep 8.5s ease-in-out infinite}
@keyframes sweep{0%{transform:rotate(17deg) translateX(0);opacity:0}12%{opacity:.85}
  52%{transform:rotate(17deg) translateX(360%);opacity:.85}62%{opacity:0}100%{transform:rotate(17deg) translateX(360%);opacity:0}}

/* ---------------- scene system ---------------- */
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;z-index:1;overflow:hidden;
  background:radial-gradient(80% 50% at 50% 12%,#10b07a33,transparent 60%),linear-gradient(168deg,#0c2c25 0%,#0a2336 100%)}
.scene.on{opacity:1;visibility:visible;z-index:2}
.scene.fade{transition:opacity .32s ease}
.scene.zin.on{animation:zin .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes zin{from{transform:scale(1.08);opacity:0;filter:blur(5px)}to{transform:scale(1);opacity:1;filter:blur(0)}}

/* ---------------- iOS status bar ---------------- */
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:18px 26px 0;color:#0c0c0c;font-weight:600;font-size:15px}
.statusbar .t{letter-spacing:.2px}
.statusbar .l{display:flex;align-items:center;gap:6px}
.statusbar .rgt{display:flex;align-items:center;gap:6px}
.statusbar svg{display:block}
.sb-dark{color:#0c0c0c}.sb-white{color:#fff}
.statusbar .tmark{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:5px;font-size:11px;font-weight:900;line-height:1;border:1.6px solid currentColor;opacity:.9}
/* "+N" coin-gain popup that floats up on collect */
.gain{position:absolute;z-index:46;display:flex;align-items:center;gap:5px;transform:translateX(-50%);pointer-events:none;
  font-size:23px;font-weight:900;color:var(--green);text-shadow:0 2px 10px rgba(255,255,255,.85);
  animation:gainUp 1.5s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes gainUp{0%{opacity:0;transform:translateX(-50%) translateY(12px) scale(.5)}
  16%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.15)}
  30%{transform:translateX(-50%) translateY(-4px) scale(1)}
  100%{opacity:0;transform:translateX(-50%) translateY(-74px) scale(1)}}

/* ---------------- shared bits ---------------- */
.squig{display:block;height:7px;width:30px;margin-top:2px}
.squig path{fill:none;stroke:var(--green);stroke-width:2.4;stroke-linecap:round}
.bokeh{position:absolute;inset:0;overflow:hidden;pointer-events:none;
  -webkit-mask:linear-gradient(#000 0,#000 34%,transparent 72%);mask:linear-gradient(#000 0,#000 34%,transparent 72%)}
.bokeh i{position:absolute;top:var(--y);left:var(--x);width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle at 35% 35%,var(--col),transparent 70%);filter:blur(var(--b));opacity:var(--o);
  animation:bkf var(--d) ease-in-out var(--dl) infinite alternate}
@keyframes bkf{from{transform:translate(0,0) scale(1)}to{transform:translate(var(--dx),var(--dy)) scale(1.16)}}

/* holographic star (rounded, foil sheen) */
/* ===== Terse coins ===== */
/* holographic "rare" coin (rainbow, round) */
.holo{--sz:30px;position:relative;width:var(--sz);height:var(--sz);display:inline-block;flex:none;isolation:isolate;border-radius:50%;
  filter:drop-shadow(0 3px 6px rgba(150,110,255,.35));
  background:
    radial-gradient(circle at 36% 28%,rgba(255,255,255,.85),transparent 42%),
    repeating-linear-gradient(125deg,rgba(255,0,180,.14) 0,rgba(0,230,255,.14) 3px,rgba(120,255,140,.14) 6px,rgba(180,120,255,.14) 9px),
    conic-gradient(from 0deg,#ff61d2,#6ff0ff,#8cff9e,#b78cff,#ffd36f,#ff61d2);
  background-size:200% 200%,200% 200%,180% 180%;background-blend-mode:screen,color-dodge,normal;
  box-shadow:inset 0 0 0 calc(var(--sz)*.07) rgba(255,255,255,.5),inset 0 -3px 6px rgba(120,60,160,.35),0 2px 6px rgba(120,80,200,.3);
  animation:holoSweep 3.4s ease-in-out infinite}
@keyframes holoSweep{0%,100%{background-position:0% 50%,0% 0%,50% 50%}50%{background-position:100% 50%,100% 0%,50% 50%}}
/* signature gold Terse coin (with T) */
.coin{--cs:30px;width:var(--cs);height:var(--cs);border-radius:50%;position:relative;display:inline-grid;place-items:center;flex:none;
  background:radial-gradient(circle at 36% 26%,#fff6c8 0%,#ffe072 32%,#f7b52e 64%,#d98a16 100%);
  border:calc(var(--cs)*.05) solid #ffe98a;
  box-shadow:inset 0 calc(var(--cs)*.06) calc(var(--cs)*.1) rgba(255,255,255,.85),inset 0 calc(var(--cs)*-.1) calc(var(--cs)*.14) rgba(150,90,0,.45),0 calc(var(--cs)*.1) calc(var(--cs)*.22) rgba(200,130,15,.4)}
.coin::before{content:"";position:absolute;inset:15%;border-radius:50%;box-shadow:inset 0 0 0 calc(var(--cs)*.035) rgba(160,95,0,.28)}
.coin>b{position:relative;font-weight:900;font-size:calc(var(--cs)*.52);line-height:1;color:#b3760c;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.coin .sheen{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none}
.coin .sheen::after{content:"";position:absolute;top:-30%;left:-60%;width:46%;height:160%;transform:rotate(20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);animation:coinSheen 3.2s ease-in-out infinite}
@keyframes coinSheen{0%{transform:rotate(20deg) translateX(0);opacity:0}18%{opacity:.95}55%{transform:rotate(20deg) translateX(420%);opacity:.95}100%{transform:rotate(20deg) translateX(420%);opacity:0}}
.coin.dim{background:radial-gradient(circle at 36% 26%,#eef1f4,#b9bfc6 38%,#868d95 72%,#5a6068);border-color:#d3d7dc}
.coin.dim>b{color:#5c626a;text-shadow:none}

/* glowing orb (jelly emoji badge) */
.orb{--glow:255,196,60;--c1:#fff0b0;--c2:#ffb12e;position:relative;width:62px;height:62px;display:grid;place-items:center;
  font-size:30px;line-height:1;border-radius:50%;isolation:isolate;
  background:radial-gradient(120% 120% at 30% 22%,var(--c1) 0%,var(--c2) 55%,rgba(0,0,0,.18) 130%);
  box-shadow:inset 0 -6px 12px rgba(0,0,0,.18),inset 0 4px 8px rgba(255,255,255,.55),
    0 6px 16px rgba(var(--glow),.45),0 0 26px rgba(var(--glow),.5),0 0 56px rgba(var(--glow),.32);
  animation:orbB 3s ease-in-out infinite}
.orb::before{content:"";position:absolute;top:9%;left:18%;width:55%;height:38%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.95),transparent);filter:blur(1px);z-index:2}
.orb .e{position:relative;z-index:3;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
@keyframes orbB{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.04)}}

/* comet */
.comet{position:absolute;display:flex;align-items:center;transform-origin:left center;filter:drop-shadow(0 0 9px rgba(255,190,70,.55))}
.comet .tail{width:200px;height:13px;border-radius:999px;
  background:linear-gradient(90deg,rgba(255,120,30,0) 0%,rgba(255,150,45,.4) 16%,rgba(255,215,75,.88) 52%,rgba(150,255,120,1) 90%,#d6ffc0 100%);
  clip-path:polygon(0 50%,58% 9%,100% 0,100% 100%,58% 91%);filter:blur(1px);animation:cometP 1.2s ease-in-out infinite}
.comet .head{width:17px;height:17px;margin-left:-7px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#fff,#d6ffbf 35%,#9bff7a 70%);
  box-shadow:0 0 8px #b6ff8e,0 0 18px #8cff66,0 0 34px rgba(140,255,102,.7)}
@keyframes cometP{0%,100%{opacity:.85}50%{opacity:1}}

/* iOS bottom sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;z-index:30;
  box-shadow:0 -8px 40px rgba(0,0,0,.16);padding:10px 20px 26px}
.scene.on .sheet{animation:sheetUp .55s cubic-bezier(.22,1,.36,1) both}
@keyframes sheetUp{0%{transform:translateY(100%)}70%{transform:translateY(-1.5%)}100%{transform:translateY(0)}}
.sheet .handle{width:40px;height:5px;border-radius:9px;background:#d8d8dc;margin:2px auto 14px}
.sheet .shead{display:flex;align-items:center;gap:16px;font-size:17px;font-weight:700;color:#1a1a1a;margin-bottom:6px}
.sheet .shead .sub{color:#b6b6bb;font-weight:600;font-size:15px}
.sheet .shead .x{margin-left:auto;color:#bcbcc2;font-size:22px;font-weight:400}

/* =================== habit grid scene =================== */
.h-top{position:absolute;top:54px;left:0;right:0;z-index:20;padding:6px 18px 0}
.tabs{display:flex;align-items:flex-start;gap:13px;font-size:15px;font-weight:600;color:rgba(255,255,255,.55);white-space:nowrap}
.tabs>span,.tabs .act{white-space:nowrap}
.tabs .act{color:#fff;font-weight:800;display:flex;flex-direction:column;align-items:center}
.tabs .sp{flex:1}
.tab-ic{display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.6);flex:none}
.tab-ic .b{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:12px}
.summary{margin:18px 0 0;display:flex;align-items:center;gap:12px;background:var(--grad);
  border-radius:20px;padding:16px 18px;box-shadow:0 10px 26px rgba(11,191,118,.4)}
.summary .num{font-size:40px;font-weight:900;letter-spacing:-1px;line-height:.9;color:#fff;text-shadow:0 2px 10px rgba(0,60,40,.3)}
.summary .meta{font-size:12px;color:rgba(255,255,255,.85);font-weight:700;line-height:1.25}
.summary .modes{margin-left:auto;display:flex;gap:6px}
.mc{font-size:12px;font-weight:800;color:rgba(255,255,255,.85);background:rgba(255,255,255,.22);border-radius:11px;padding:7px 11px}
.mc.on{color:#06623f;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.18)}
/* live compression bar — Terse's core function, animated */
.livebar{margin:12px 2px 0;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700}
.livebar .ld{color:#1a1a1a;white-space:nowrap}
.livebar .lt{flex:1;height:9px;border-radius:6px;background:rgba(120,120,128,.16);overflow:hidden}
.livebar .lt i{display:block;height:100%;width:58%;border-radius:6px;background:var(--grad);background-size:200% 100%;box-shadow:0 0 10px rgba(22,196,127,.6)}
.scene.on .livebar .lt i{animation:liveFill 1.1s cubic-bezier(.2,.9,.3,1) both,liveFlow 2.4s linear .9s infinite}
@keyframes liveFill{from{width:0}to{width:58%}}
@keyframes liveFlow{to{background-position:200% 0}}
.livebar .lp{color:var(--green);font-weight:900;white-space:nowrap}
.gridwrap{position:absolute;left:0;right:0;top:214px;bottom:0;overflow:hidden}
.gridpad{padding:6px 16px 80px;will-change:transform}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.card{position:relative;border-radius:22px;height:120px;padding:15px 14px;overflow:hidden;
  box-shadow:0 6px 18px rgba(20,20,30,.05);display:flex;flex-direction:column}
.card.w{background:#fff}
.card.d{background:#15171d;border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1.5px 0 rgba(255,214,120,.32),0 8px 22px rgba(0,0,0,.3)}
.card.d::after{content:"T";position:absolute;top:8px;right:11px;font-size:15px;font-weight:900;line-height:1;
  color:rgba(255,214,120,.16)}
.card .nm{font-size:13px;font-weight:700;line-height:1.15;letter-spacing:-.2px;max-width:76%}
.card.w .nm{color:#20242b}.card.d .nm{color:#f1f2f4}
.card .ct{font-size:24px;font-weight:800;margin-top:4px;line-height:1}
.card.w .ct{color:#181b20}.card.d .ct{color:#fff}
.card .ct.o,.card .ct.gr{color:var(--green)}
.card .emo{position:absolute;right:10px;bottom:12px;font-size:33px;line-height:1;filter:drop-shadow(0 3px 5px rgba(0,0,0,.14))}
.card.d .emo{filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.card .badge{position:absolute;right:7px;bottom:10px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:800;color:#fff;z-index:3;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.card .badge.plus,.card .badge.done{background:var(--green)}

         ${coin(38,false,true)}${holo(42)}${coin(40,false,true)}${holo(44)}<span style="opacity:.5">${coin(34,true,false)}</span>
       </div>
       <div class="line"><div class="fill"></div>
         <span class="pt on" style="left:12%">✓</span><span class="pt on" style="left:34%">✓</span>
         <span class="pt" style="left:56%"></span><span class="pt" style="left:78%"></span><span class="pt" style="left:98%"></span></div>
       <div class="labs"><span class="on">6天</span><span class="on">9天</span><span>12天</span><span>15天</span><span>18天</span></div>
     </div>
     <div class="unlock">再省 <b>3</b> 天 可解锁 <span class="g">流光金币</span></div>
     <div class="fstats">
       <div class="s"><div class="n"><span class="gr cnt" data-to="9">0</span><small> 天</small></div><div class="u">连续节省</div></div>
       <div class="s"><div class="n"><span class="cnt" data-to="15">0</span><small> 枚</small></div><div class="u">收集金币</div></div>
       <div class="s"><div class="n"><span class="cnt" data-to="38">0</span><small> %</small></div><div class="u">平均节省率</div></div>
     </div>
     <div class="foot">每一个省下的 token，都是更省的未来 💚 · terse.app</div>
     <span class="peek" style="bottom:0;left:30px">${coin(40,false,true)}</span><span class="peek2" style="bottom:6px;left:92px">${holo(32)}</span></div>`,
   dur:2.40, a:[11,13,-2], b:[14,16,-3], fade:true,
   tick:(n,p)=>{const e=1-Math.pow(1-Math.min(1,p/0.5),3);
     n.querySelectorAll('.cnt').forEach(s=>s.textContent=Math.round(+s.dataset.to*e));} },
];

/* build scene nodes */
SC.forEach(s=>{
  const n = s.node || E('<section>'+s.html+'</section>');
  n.classList.add('scene'); if(s.fade) n.classList.add('fade');
  n.querySelectorAll('.card').forEach((c,i)=>c.style.setProperty('--i',i%9));
  stageEl.appendChild(n); s.node=n;
});

/* ===================== real-time motion engine ===================== */
const prog=document.getElementById('prog'), hint=document.getElementById('hint'),
      phone=document.getElementById('phone');
const TOTAL=SC.reduce((a,s)=>a+s.dur,0);
const starts=(()=>{let a=0,o=[];SC.forEach(s=>{o.push(a);a+=s.dur;});return o;})();
const lerp=(a,b,t)=>a+(b-a)*t;
/* Phone motion model (measured from the video): each scene HOLDS its entry angle
   for `hold` seconds, then rotates FAST to the settled angle over `settle` seconds
   (easeOutExpo), then STAYS FIXED. rprog = 0..1 given seconds elapsed in scene. */
const rprog=(s,el)=>{const hd=s.hold||0, sd=s.settle||0.5;
  if(el<=hd) return 0; if(el>=hd+sd) return 1;
  const x=(el-hd)/sd; return 1-Math.pow(2,-10*x);};
let cur=-1,t0=performance.now(),running=true;

/* coins leaping OUT of the screen onto the ground (fires when a savings-jar shows) */
function popBurst(n=5,scatter=false){
  const layer=document.getElementById('popLayer'); if(!layer) return;
  for(let k=0;k<n;k++){
    const s=document.createElement('span'); s.className='pop';
    s.innerHTML = Math.random()<0.22 ? holo(scatter?28:34) : coin(scatter?28:34,false,true);
    if(scatter){ s.style.setProperty('--ox',(22+Math.random()*56).toFixed(0)+'%');
      s.style.setProperty('--oy',(38+Math.random()*34).toFixed(0)+'%'); }
    const dx=Math.random()*120-60, dx2=dx+(Math.random()*120-60);
    s.style.setProperty('--dx',dx.toFixed(0)+'px');
    s.style.setProperty('--dxm',((dx+dx2)/2).toFixed(0)+'px');
    s.style.setProperty('--dx2',dx2.toFixed(0)+'px');
    s.style.setProperty('--fall',(230+Math.random()*140).toFixed(0)+'px');
    s.style.setProperty('--spin',((Math.random()<.5?-1:1)*(360+(Math.random()*360|0)))+'deg');
    s.style.setProperty('--d',(1.3+Math.random()*0.7).toFixed(2)+'s');
    s.style.setProperty('--dl',(Math.random()*0.32).toFixed(2)+'s');
    layer.appendChild(s);
    s.addEventListener('animationend',()=>s.remove());
  }
}
function activate(i){               /* hard cut */
  if(cur>=0) SC[cur].node.classList.remove('on');
  const s=SC[i]; delete s.node.dataset.pi; void s.node.offsetWidth;
  s.node.classList.add('on'); cur=i;
  if(s.node.querySelector('.globe')){ popBurst(5); gainPop(5,'50%','42%'); }       /* jar → coins burst from the heap */
  else if(s.node.querySelector('.cards')){ popBurst(4,true); gainPop(4,'50%','30%'); } /* grid → coins pop from the cards */
}
function gainPop(n,ox='50%',oy='38%'){
  const layer=document.getElementById('popLayer'); if(!layer) return;
  const g=document.createElement('div'); g.className='gain';
  g.style.left=ox; g.style.top=oy;
  g.innerHTML=`+${n} ${coin(20,false,false)}`;
  layer.appendChild(g);
  g.addEventListener('animationend',()=>g.remove());
}
function applyAngle(s,p){
  let pre='';
  if(s.sc||s.tr){                                   /* zoom + pan (e.g. intro corner reveal) */
    const sc=s.sc?lerp(s.sc[0],s.sc[1],p):1;
    const tx=s.tr?lerp(s.tr[0][0],s.tr[1][0],p):0;
    const ty=s.tr?lerp(s.tr[0][1],s.tr[1][1],p):0;
    pre=`translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) scale(${sc.toFixed(3)}) `;
  }
  phone.style.transform=pre+`rotateX(${lerp(s.a[0],s.b[0],p).toFixed(2)}deg) `
    +`rotateY(${lerp(s.a[1],s.b[1],p).toFixed(2)}deg) `
    +`rotateZ(${lerp(s.a[2],s.b[2],p).toFixed(2)}deg)`;
}
function loop(now){ if(!running) return;
  let t=(now-t0)/1000;
  if(t>=TOTAL){ t0=now; t=0; cur=-1; }            /* seamless loop — always animating */
  let i=SC.length-1; for(let k=0;k<SC.length;k++){ if(t<starts[k]+SC[k].dur){i=k;break;} }
  if(i!==cur) activate(i);
  const s=SC[i], el=t-starts[i], p=Math.min(1,el/s.dur);
  applyAngle(s,rprog(s,el)); if(s.tick) s.tick(s.node,p);
  prog.style.width=(t/TOTAL*100)+'%';
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
hint.addEventListener('click',()=>{hint.style.display='none';cur=-1;t0=performance.now();running=true;requestAnimationFrame(loop);});

/* verification hooks */
window.__total=TOTAL; window.__starts=starts;
window.__go=i=>{running=false;hint.style.display='none';
  if(cur>=0)SC[cur].node.classList.remove('on');
  cur=-1; activate(i); const s=SC[i]; applyAngle(s,1); if(s.tick)s.tick(s.node,0.6);
  prog.style.width=((starts[i]+s.dur*0.5)/TOTAL*100)+'%';};
window.__dbg=(rx,ry,rz,s)=>{running=false;hint.style.display='none';
  if(cur!==0){if(cur>=0)SC[cur].node.classList.remove('on');cur=-1;activate(0);}
  phone.style.transform=`scale(${s}) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;};
window.__still=t=>{running=false;hint.style.display='none';
  let i=SC.length-1;for(let k=0;k<SC.length;k++){if(t<starts[k]+SC[k].dur){i=k;break;}}
  if(cur>=0)SC[cur].node.classList.remove('on');cur=-1;activate(i);
  const s=SC[i],el=t-starts[i],p=Math.min(1,el/s.dur);applyAngle(s,rprog(s,el));if(s.tick)s.tick(s.node,p);
  prog.style.width=(t/TOTAL*100)+'%';
  /* deterministically pose every CSS animation to time t (for frame-accurate capture) */
  void document.body.offsetWidth;
  try{document.getAnimations().forEach(a=>{a.pause();
    a.currentTime=Math.max(0,(t-starts[i]))*1000;});}catch(e){}};
</script>
</body>
</html>
