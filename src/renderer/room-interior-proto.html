<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>room interior prototype</title>
<script type="importmap">
{ "imports": { "three": "/app-assets/vendor/three.module.min.js", "three/addons/": "/app-assets/vendor/jsm/" } }
</script>
<style>
  html, body { margin: 0; padding: 0; background: #030407; overflow: hidden; height: 100%; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 16px; top: 16px; color: #f2f5f4; z-index: 5;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
    background: rgba(3,4,7,.55); padding: 11px 15px; border-radius: 12px; pointer-events: none;
    border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(8px);
  }
  #roomName { color: #6ee7b7; font-weight: 600; font-size: 15px; }
  #roomStats { opacity: .72; }
  #hint { margin-top: 6px; opacity: .5; font-size: 11px; }
  #card { position: fixed; left: 16px; bottom: 16px; width: min(360px, calc(100vw - 32px)); max-height: 46vh; overflow: auto; z-index: 5;
    background: rgba(6,8,12,.9); color: #e8eeec; border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 12px 14px;
    font: 12px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; }
  #card b { font-size: 15px; } #card .role { margin: 2px 0 6px; } #card .dim { opacity: .6; }
  #card .it { display: flex; gap: 6px; margin: 2px 0; } #card .it code { color: #c9f03d; }
</style>
</head>
<body>
<div id="hud">
  <div id="roomName"></div>
  <div id="roomStats"></div>
  <div id="hint">drag to look &middot; WASD to walk &middot; click furniture</div>
</div>
<div id="card" hidden></div>
<script type="module">
/* 原型页只是一层壳:房子是 room-scene.js 盖的,和引擎里"点一座楼走进去"是同一份
   代码。这里自己开一个 renderer、喂一份样例目录(深扫的形状,带符号),好让截图
   脚本一次看遍三种格局 × 昼夜。?deep=0 看"没有深扫数据"时只摆家具的样子。 */
import * as THREE from 'three';
import { createRoom } from './room-scene.js';
import { createWalk } from './room-travel.js';

const S = (name, kind, line, exp) => [name, kind, line, exp ? 1 : 0];
const F = (n, sub, b, l, sym, imp = 0, out = 0) => ({ n, p: 'src/' + (sub ? sub + '/' : '') + n, sub, b, l, lang: '', sym, imp, out });
const DETAIL = {
  truncated: false,
  kids: [['components', 61, 96000], ['hooks', 18, 21000], ['utils', 24, 30000], ['__tests__', 12, 18000], ['styles', 9, 12000]],
  files: [
    F('App.tsx', '', 9400, 310, [S('App', 'component', 12, 1), S('AppProps', 'type', 4, 1), S('useBoot', 'hook', 40), S('routes', 'const', 60, 1)], 3, 9),
    F('index.ts', '', 1200, 40, [S('mount', 'fn', 3, 1), S('VERSION', 'const', 1, 1)], 1, 2),
    F('router.ts', '', 2800, 96, [S('/login', 'route', 8), S('/rooms/:id', 'route', 14), S('/plaza', 'route', 22), S('guard', 'fn', 40, 1)], 2, 4),
    F('types.ts', '', 2400, 88, [S('Room', 'type', 3, 1), S('Member', 'type', 12, 1), S('Capsule', 'type', 20, 1), S('Dir', 'type', 34, 1), S('Leaf', 'type', 40, 1)], 14, 0),
    F('README.md', '', 5200, 140, [S('Getting started', 'heading', 1), S('Architecture', 'heading', 20), S('Rooms', 'heading', 48), S('Deploy', 'heading', 90)]),
    F('schema.sql', '', 1900, 70, [S('rooms', 'table', 1), S('members', 'table', 14), S('projects', 'table', 30)]),
    F('package.json', '', 1100, 44, []),
    F('logo.svg', '', 3400, 0, []),
    F('Button.tsx', 'components', 3100, 120, [S('Button', 'component', 10, 1), S('ButtonProps', 'type', 3, 1), S('variants', 'const', 6)], 11, 1),
    F('Modal.tsx', 'components', 4200, 160, [S('Modal', 'component', 14, 1), S('useTrap', 'hook', 60), S('ModalProps', 'type', 4, 1)], 6, 2),
    F('Sidebar.tsx', 'components', 5600, 210, [S('Sidebar', 'component', 20, 1), S('Item', 'component', 90), S('group', 'fn', 150)], 2, 4),
    F('Card.tsx', 'components', 2100, 70, [S('Card', 'component', 5, 1)], 4, 0),
    F('Table.tsx', 'components', 3800, 150, [S('Table', 'component', 8, 1), S('sortBy', 'fn', 80), S('Column', 'type', 3, 1)], 3, 1),
    F('useAuth.ts', 'hooks', 1800, 64, [S('useAuth', 'hook', 5, 1), S('refresh', 'fn', 40)], 9, 1),
    F('useRoom.ts', 'hooks', 2200, 80, [S('useRoom', 'hook', 7, 1), S('RoomState', 'type', 2, 1)], 5, 2),
    F('useSync.ts', 'hooks', 1400, 50, [S('useSync', 'hook', 3, 1)], 2, 1),
    F('api.ts', 'utils', 3300, 130, [S('get', 'fn', 5, 1), S('post', 'fn', 20, 1), S('del', 'fn', 34, 1), S('ApiError', 'class', 50, 1), S('retry', 'fn', 80), S('BASE', 'const', 1, 1)], 12, 1),
    F('format.ts', 'utils', 900, 36, [S('bytes', 'fn', 2, 1), S('since', 'fn', 12, 1), S('pad', 'fn', 24)], 8, 0),
    F('debounce.ts', 'utils', 400, 18, [S('debounce', 'fn', 1, 1)], 4, 0),
    F('colors.ts', 'utils', 700, 30, [S('LANG_COLOR', 'const', 1, 1), S('langRgb', 'fn', 20, 1)], 7, 0),
    F('Button.test.tsx', '__tests__', 2600, 90, [S('renders label', 'test', 5), S('fires onClick', 'test', 14), S('disabled state', 'test', 24), S('keyboard', 'test', 36)], 0, 1),
    F('api.test.ts', '__tests__', 3100, 110, [S('get retries', 'test', 6), S('post body', 'test', 20), S('401 refresh', 'test', 34), S('timeout', 'test', 50), S('abort', 'test', 64)], 0, 1),
    F('theme.css', 'styles', 2600, 120, []),
    F('reset.css', 'styles', 800, 40, []),
  ],
};
// 谁 import 谁(下标对着 files):App 用路由、组件、hook;组件用 utils;测试测组件和 api
{
  const ix = (n) => DETAIL.files.findIndex((f) => f.n === n);
  const E = [['App.tsx', 'router.ts'], ['App.tsx', 'Sidebar.tsx'], ['App.tsx', 'useAuth.ts'], ['App.tsx', 'types.ts'], ['index.ts', 'App.tsx'],
    ['router.ts', 'useAuth.ts'], ['Sidebar.tsx', 'Button.tsx'], ['Sidebar.tsx', 'Card.tsx'], ['Modal.tsx', 'Button.tsx'], ['Table.tsx', 'format.ts'],
    ['Button.tsx', 'colors.ts'], ['useAuth.ts', 'api.ts'], ['useRoom.ts', 'api.ts'], ['useSync.ts', 'debounce.ts'], ['api.ts', 'types.ts'],
    ['Button.test.tsx', 'Button.tsx'], ['api.test.ts', 'api.ts'], ['useRoom.ts', 'types.ts']];
  DETAIL.edges = E.map(([a, b]) => [ix(a), ix(b)]).filter(([a, b]) => a >= 0 && b >= 0);
}
const DIR = { name: 'src', files: 214, bytes: 268000, lang: 'ts',
  kids: DETAIL.kids,
  leaves: DETAIL.files.map((f) => [f.n, f.b, f.sub]) };
const q = new URLSearchParams(location.search);
if (q.get('deep') !== '0') DIR.detail = DETAIL;

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const nameEl = document.getElementById('roomName'), statEl = document.getElementById('roomStats'), card = document.getElementById('card');
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
/* 隔壁的楼、随机传送门:原型页没有真项目,拿同一份样例换个名字、换个语言当隔壁;
   随机传送门随便挑一个风格。?travel=0 关掉。?hour= / ?weather= / ?season= 定住外面的天。 */
const NEAR = [['api', 12, 'go'], ['server', 20, 'rust'], ['scripts', 6, 'python'], ['lib', 30, 'ts'], ['docs', 8, 'js']];
const STYLES = ['tang', 'edo', 'giza', 'hellas', 'maya', 'persia', 'norse', 'modern'];
const LOG = window.__walkLog = [];
const travel = q.get('travel') === '0' ? null : {
  links: (name) => NEAR.filter((n) => n[0] !== name).slice(0, 3).map(([n, f, l]) => ({ name: n, files: f, lang: l })),
  load: (name) => { LOG.push('load:' + name + '@' + Math.round(performance.now())); return new Promise((r) => setTimeout(() => { LOG.push('loaded:' + name); r(Object.assign({}, DIR, { name, lang: (NEAR.find((n) => n[0] === name) || [])[2] || 'ts' })); }, 250)); },
  random: () => new Promise((r) => setTimeout(() => {
    const st = STYLES[Math.floor(Math.random() * STYLES.length)];
    r({ title: 'demo-' + st, style: st, lang: 'rust', dir: Object.assign({}, DIR, { name: 'core' }) });
  }, 300)),
  arrived: (i) => { LOG.push('arrived:' + i.kind + ':' + (i.name || (i.target && i.target.title))); console.log('arrived', i.kind, i.name || (i.target && i.target.title)); },
};
const num = (k) => (q.get(k) != null ? +q.get(k) : undefined);
// ?name=api&arrive=src:直接看"从 src 那座门框走过来,刚到 api"的样子(无头截图等不完换场的那几百毫秒)
if (q.get('name')) DIR.name = q.get('name');
const room = (travel ? createWalk : createRoom)(renderer, DIR, {
  travel, arrive: q.get('arrive') || undefined, hour: num('hour'), weather: q.get('weather') || undefined, season: q.get('season') || undefined,
  style: q.get('style') || 'modern', layout: q.get('layout') || undefined, time: q.get('time') || 'auto',
  onHere: (h) => { nameEl.textContent = h.path; statEl.textContent = h.files + ' files'; },
  onPick: (p, d) => {
    card.hidden = false;
    card.innerHTML = `<b>${d.icon} ${esc(d.title)}</b><div class="dim">${esc(d.path)}</div>`
      + `<div class="role">${esc(d.role)} — ${esc(d.furn)}</div><div class="dim">${esc(d.stats)}</div>`
      + (d.items.length ? `<div style="margin-top:6px">${esc(d.defines)}:</div>` + d.items.map((i) => `<div class="it">${i.icon} <code>${esc(i.name)}</code> <span class="dim">${esc(i.kind)}${i.line ? ' · L' + i.line : ''}${i.exported ? ' · export' : ''}</span></div>`).join('') : '')
      + (d.uses.length ? `<div style="margin-top:6px">🟢 ${esc(d.usesWord)}: ${d.uses.map(esc).join(', ')}</div>` : '')
      + (d.usedBy.length ? `<div>🟠 ${esc(d.usedByWord)}: ${d.usedBy.map(esc).join(', ')}</div>` : '')
      + (d.note ? `<div class="dim" style="margin-top:6px">${esc(d.note)}</div>` : '');
  },
});

let last = performance.now();
function frame(now) {
  room.update((now - last) / 1000); last = now;
  room.render();
  requestAnimationFrame(frame);
}
// ?manual=1:用定时器一帧一帧走(无头的 --dump-dom 不出帧,requestAnimationFrame 不会来)
if (q.get('manual')) setInterval(() => { room.update(1 / 60); room.render(); }, 16);
else requestAnimationFrame(frame);

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); room.resize(innerWidth, innerHeight); });

window.__room = room;
/* 截图用:?face=link0 / portal 站到那座门框 / 传送门前 4 米看着它;?look=x,z,yaw,pitch 摆到任意位置;
   ?go=link0 / portal 两秒后穿过去(看换场之后的那间屋子) */
if (q.get('look')) { const [x, z, y, p] = q.get('look').split(',').map(Number); room.at(x, z, y, p); }
const face = q.get('face');
if (face) {
  const f = face === 'portal' ? room.portal() : (room.frames || [])[+face.replace('link', '')];
  if (f) {
    const nx = f.nx != null ? f.nx : 0, nz = f.nz != null ? f.nz : 1;
    room.at(f.x + nx * 4, f.z + nz * 4, Math.atan2(nx, nz), face === 'portal' ? 0.02 : 0.08);
  }
}
// ?dbg=1:门框、传送门、人在哪 —— 写进页面(无头 --dump-dom 读得到)
if (q.get('dbg')) {
  const pre = document.createElement('pre'); pre.id = 'dbg';
  const dump = () => { try { pre.textContent = 'DBG ' + JSON.stringify({ frames: (room.frames || []).map((f) => ({ x: +f.x.toFixed(2), z: +f.z.toFixed(2), nx: f.nx, nz: f.nz, name: f.link.name })),
    portal: room.portal && !!room.portal(), where: room.where(), links: room.links ? room.links().map((l) => l.name) : null,
    traveling: room.traveling ? room.traveling() : null, log: window.__walkLog, now: Math.round(performance.now()), env: room.env && { w: room.env().weather, s: room.env().season, h: room.env().hour, night: room.env().night } }); } catch (e) { pre.textContent = 'DBG ERR ' + e.message; } };
  document.body.appendChild(pre); dump(); setInterval(dump, 500);
}
// ?still=1:一上来就是成形的样子(无头截图里帧很少,聚拢那 2.4 秒走不完)
if (q.get('still')) room.renderNow();
const goq = q.get('go');
if (goq && room.goLink) setTimeout(() => { LOG.push('go@' + Math.round(performance.now())); goq === 'portal' ? room.goPortal() : room.goLink(+goq.replace('link', '')); }, 2000);
</script>
</body>
</html>
