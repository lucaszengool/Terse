<!DOCTYPE html>
<!--
  gf-chat.html — 和 AI 女友聊天的独立窗口(用户 10-19:"把聊天窗放到另一个窗口,专门用来打字对话,
  不要放在女友 section 里,然后也可以点击开始语音对话")。

  · 打字:回车发送。实时数字人开着 + 本地大脑 → 引擎边想边说(第一句想好她就开口);别的 agent 回完整句后交给引擎念。
  · 按住 🎙:边说边把字填进输入框,松手整句发出。
  · 「开始语音对话」:免按住 —— 你说完停 1.2 秒算一句;她说话时不听(没有回声消除),说完再开麦。
  · 只用她自己的声音:实时数字人没开 / 没配好时只显示文字,不会用 macOS 的系统声音念(用户 10-19)。
  语音识别结果(girlfriend-heard)是广播给所有窗口的,所以聊天逻辑只在这个窗口里,主窗口不再收它。
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>和她聊天</title>
<style>
  :root {
    --bg: rgba(18, 19, 26, 0.92); --line: rgba(255, 255, 255, 0.09); --fg: #eef0f6; --dim: rgba(238, 240, 246, 0.55);
    --me: rgba(120, 150, 255, 0.24); --her: rgba(255, 255, 255, 0.07); --accent: #c77dff; --warn: #ffb45c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
    display: flex; flex-direction: column; -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); overflow: hidden; }
  header { padding: 30px 16px 10px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
  header * { -webkit-app-region: no-drag; }
  .who { display: flex; align-items: center; gap: 10px; }
  .orb { width: 11px; height: 11px; border-radius: 50%; background: #8a8f9c; box-shadow: 0 0 10px currentColor; flex: none; color: #8a8f9c; }
  .orb.ready { background: #7be0a6; color: #7be0a6; }
  .orb.busy { background: var(--accent); color: var(--accent); animation: breathe .7s ease-in-out infinite alternate; }
  @keyframes breathe { from { transform: scale(.8); opacity: .6; } to { transform: scale(1.15); opacity: 1; } }
  .name { font-weight: 650; font-size: 15px; }
  .sub { color: var(--dim); font-size: 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  button { font: inherit; color: inherit; background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 12px; cursor: pointer; white-space: nowrap; }
  button:hover { background: rgba(255,255,255,.14); }
  button.on { background: var(--accent); border-color: transparent; color: #160b1f; font-weight: 600; }
  .chips .cost { opacity: .62; font-size: 11px; font-weight: 400; }
  button:disabled { opacity: .4; cursor: default; }
  #voice { width: 100%; margin-top: 10px; padding: 9px; font-size: 13px; }
  #voice.on { background: rgba(255, 90, 120, .22); border-color: rgba(255, 90, 120, .5); }
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 86%; padding: 7px 11px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .msg.me { align-self: flex-end; background: var(--me); }
  .msg.her { align-self: flex-start; background: var(--her); color: rgba(255,255,255,.9); }
  .msg.wait { color: var(--dim); }
  #note { display: none; margin: 0 14px 8px; padding: 7px 10px; border-radius: 8px; background: rgba(255,180,92,.1); color: var(--warn); font-size: 12px; }
  footer { display: flex; gap: 8px; padding: 10px 12px 14px; border-top: 1px solid var(--line); align-items: center; }
  #text { flex: 1; min-width: 0; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
    color: var(--fg); font: inherit; outline: none; }
  #text:focus { border-color: rgba(199,125,255,.55); }
  #mic { padding: 8px 11px; }
  #mic.on { background: rgba(255, 90, 120, .3); }
  #send { padding: 8px 14px; background: var(--accent); border-color: transparent; color: #160b1f; font-weight: 600; }
</style>
</head>
<body>
  <header>
    <div class="who"><span class="orb" id="orb"></span>
      <div><div class="name" id="name">Mia</div><div class="sub" id="status">…</div></div></div>
    <div class="chips" id="chips"></div>
    <button id="voice" data-i18n="gfc_voice_start">🎙 开始语音对话</button>
  </header>
  <div id="log"></div>
  <div id="note"></div>
  <footer>
    <input id="text" type="text" autocomplete="off" spellcheck="false" placeholder="跟她说点什么……" data-i18n-ph="gf_chat_ph">
    <button id="mic" title="按住说话">🎙</button>
    <button id="send" data-i18n="gf_chat_send">发送</button>
  </footer>
  <script src="i18n.js"></script>
  <script src="tauri-bridge.js"></script>
  <script src="gf-mic.js"></script>
  <script>
  (() => {
    const T = window.terse || {};
    const $ = (s) => document.querySelector(s);
    const TT = (k, d) => { try { const v = window.i18n && window.i18n.t && window.i18n.t(k); return v && v !== k ? v : d; } catch (e) { return d; } };
    const listen = (name, fn) => { try { window.__TAURI__.event.listen(name, fn); } catch (e) {} };
    const log = $('#log'), note = $('#note'), text = $('#text'), send = $('#send'), mic = $('#mic'), voice = $('#voice');
    // 她的大脑:用户只看到快慢 / 占不占 CPU,不看技术名称(10-22);和设置页「大脑」是同一个设置(chatAgent)
    const CLOUD = TT('gfc_cost_cloud', '联网 · 几乎不占 CPU');
    const AGENTS = [
      { id: 'local', label: TT('gf_chat_brain', '本地大脑'), cost: TT('gfc_cost_local', '不联网 · CPU 较高') },
      { id: 'claude', label: 'Claude Code', cost: CLOUD }, { id: 'codex', label: 'Codex', cost: CLOUD },
      { id: 'dsh', label: 'DeepSeek', cost: CLOUD }, { id: 'ollama', label: TT('gf_chat_local', '本地 Ollama'), cost: TT('gfc_cost_ollama', '不联网 · CPU 很高') },
    ];
    let avail = {}, ready = false, busy = false, herTalking = false, convo = false, resumeTimer = null;
    const history = [];

    const read = async () => { try { return (await T.getWallpaperConfig()) || {}; } catch (e) { return {}; } };
    const write = async (patch) => {
      const cfg = await read(); cfg.girlfriend = Object.assign({}, cfg.girlfriend || {}, patch);
      try { await T.setWallpaperConfig(cfg); } catch (e) {}
    };
    const liveOn = (g) => !!(g && g.on && g.live === true && ready);
    // 10-21:她在壁纸上要等引擎全部预热完才出现 —— 这之前发出去的话,声音会从一个还没出现的她嘴里冒出来,所以先拦住
    let warm = false;
    const engineWarm = async () => { try { const h = await (await fetch('http://127.0.0.1:8770/health')).json(); return !!(h && h.ready); } catch (e) { return false; } };
    setInterval(() => { if (!warm) paint(); }, 3000);
    // 和主窗口 app.js 的 gfLiveSettings 同一份:人设(性格 / 语气 / 补充)+ 她的声音(高清回复 = DUIX 脸)
    const settings = (g) => ({
      personality: g.personality || '', tone: g.tone || '', custom: g.customPersona || '',
      // breeze2 = 台湾腔(10-21 默认,和 app.js voiceOf 同一张映射 —— 这里以前停在 melo3,从这个窗口聊天会用错声音)
      voice: (() => { const v = g.liveVoice || 'bz_sweet', melo = /^melo[123]$/.test(v), bz = /^bz_/.test(v);
        return { engine: g.hd !== false && g.hdVoice === 'omnivoice' ? 'omnivoice' : bz || v === 'breeze2' ? 'breeze2' : v === 'mandarin' ? 'matcha' : melo ? 'melo' : 'qwenclone',
                 style: bz ? v.slice(3) : v === 'mandarin' ? 'mandarin' : v === 'breeze2' ? 'world' : undefined,
                 clone_voice: melo ? 'wenrou' : v, sweet: melo ? +v.slice(4) : 3, speed: +g.liveSpeed || 1, hd: g.hd !== false }; })(),
    });
    const showNote = (m) => { note.style.display = m ? 'block' : 'none'; note.textContent = m || ''; };
    const bubble = (who, t, cls) => {
      const d = document.createElement('div'); d.className = 'msg ' + who + (cls ? ' ' + cls : ''); d.textContent = t;
      log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
    };
    const explain = (e) => {
      const m = String(e && e.message || e || '');
      if (/not set up/i.test(m)) return TT('gfc_need_setup', '她的实时声音还没配置好:到 Terse 的「AI 女友」页点「一键配置」。');
      if (/OAuth|authenticat|log ?in|401/i.test(m)) return TT('gf_chat_err_login', 'Claude 的命令行登录过期了:在终端里运行 claude,登录一次再回来。');
      if (/Insufficient Balance|QUOTA/i.test(m)) return TT('gf_chat_err_quota', 'DeepSeek 余额不足:去 DeepSeek 后台充值,或者换一个 agent。');
      if (/not installed/i.test(m)) return TT('gf_chat_err_missing', '这台电脑上没找到这个 agent。');
      return m.slice(0, 240);
    };

    async function paint() {
      const g = (await read()).girlfriend || {};
      $('#name').textContent = g.herName || g.characterName || 'Mia';
      try { const st = await T.gfLiveStatus(); ready = !!(st && st.ready); } catch (e) {}
      if (liveOn(g)) warm = await engineWarm();
      const orb = $('#orb'); orb.className = 'orb' + (busy || herTalking ? ' busy' : liveOn(g) ? ' ready' : '');
      $('#status').textContent = herTalking ? TT('gf_speaking', '正在说……') : busy ? TT('gfc_thinking', '她在想……')
        : !g.on ? TT('gfc_off', '壁纸里的她关着 —— 文字照样能聊')
        : liveOn(g) ? (warm ? TT('gfc_ready', '在线 · 用她自己的声音回答') : TT('gfc_warming', '她在热身,马上就来(第一次要几分钟)…'))
        : TT('gfc_text_only', '实时数字人没开:只回文字');
      voice.style.display = liveOn(g) ? '' : 'none';
      const cur = g.chatAgent && avail[g.chatAgent] !== false ? g.chatAgent : (AGENTS.find(a => avail[a.id]) || AGENTS[0]).id;
      const chips = $('#chips'); chips.innerHTML = '';
      for (const a of AGENTS) {
        const b = document.createElement('button'); b.textContent = a.label; if (a.id === cur) b.className = 'on';
        if (a.cost) { const c = document.createElement('span'); c.className = 'cost'; c.textContent = ' · ' + a.cost; b.appendChild(c); b.title = a.label + ' · ' + a.cost; }
        if (avail[a.id] === false) { b.disabled = true; b.title = TT('gf_chat_missing', '这台电脑上没装'); }
        b.addEventListener('click', async () => { await write({ chatAgent: a.id }); paint(); connectBrain(a.id); });
        chips.appendChild(b);
      }
    }

    /* 一键连接(10-22):实时模式下点一个 agent = 引擎试着让它回一个字;Claude Code 没登录 → 引擎打开浏览器的授权页,
       这里每 3 秒再问一次,你在浏览器里点「授权」它就连上了(用户:"make claude auto login and user just click") */
    let connecting = 0;
    async function connectBrain(id) {
      const g = (await read()).girlfriend || {};
      if (!liveOn(g) || id === 'ollama') return;
      const my = ++connecting, label = (AGENTS.find(a => a.id === id) || {}).label || id, t0 = Date.now();
      if (id !== 'local') showNote(TT('gfc_brain_connecting', '正在连接') + ' ' + label + '…');
      while (my === connecting && Date.now() - t0 < 180000) {
        let r;
        try { r = await (await fetch('http://127.0.0.1:8770/brain', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id }) })).json(); }
        catch (e) { if (id !== 'local') showNote(explain(e)); return; }
        if (my !== connecting) return;
        if (r.ok) { if (id !== 'local') { showNote('✓ ' + TT('gfc_brain_ok', '已连接') + ' ' + label); setTimeout(() => { if (my === connecting) showNote(''); }, 4000); } return; }
        if (r.login) { showNote(r.hint); await new Promise(res => setTimeout(res, 3000)); continue; }
        showNote(r.hint || r.error); return;
      }
    }

    async function doSend() {
      const t = (text.value || '').trim();
      if (!t || busy) return;
      const g = (await read()).girlfriend || {};
      const agent = g.chatAgent && avail[g.chatAgent] !== false ? g.chatAgent : (AGENTS.find(a => avail[a.id]) || AGENTS[0]).id;
      if (liveOn(g) && !(await engineWarm())) { showNote(TT('gfc_warming', '她在热身,马上就来(第一次要几分钟)…')); return; }   // 话留在输入框里
      busy = true; send.disabled = true; showNote(''); text.value = ''; paint();
      bubble('me', t);
      const wait = bubble('her', '…', 'wait');
      try {
        let r;
        const name = g.herName || g.characterName || 'Mia';
        // 实时:本地大脑和 Claude Code / Codex / DeepSeek 都走引擎(10-22,用户:"当作 brain 的回复,但是 voice,DUIX 完全不变"):
        // 引擎边想边说 —— agent 写出第一句她就开口,同一套声音 + DUIX;这里拿全文显示
        if (liveOn(g) && agent !== 'ollama') {
          r = await T.gfLiveChat(t, history.slice(-16), name, Object.assign(settings(g), { brain: agent }));
        } else {
          r = await T.gfChat(agent, t, history.slice(-16), name, g.chatModel || null);
          if (liveOn(g)) { try { await T.gfLiveSay(r.text); } catch (e) {} }       // 没开实时就只显示文字(不用系统声音)
        }
        wait.textContent = r.text; wait.classList.remove('wait');
        history.push({ role: 'user', text: t }, { role: 'her', text: r.text });
        try { localStorage.setItem('gfc-history', JSON.stringify(history.slice(-40))); } catch (e) {}
      } catch (e) { wait.remove(); showNote(explain(e)); }
      finally { busy = false; send.disabled = false; text.focus(); paint(); }
    }
    send.addEventListener('click', doSend);
    text.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) doSend(); });

    // 按住 🎙:边说边填,松手发出
    const lang = () => ((document.documentElement.lang || navigator.language || '').toLowerCase().startsWith('zh') ? 'zh-CN' : null);
    const micErr = (err) => {
      const m = String(err && err.message || err);
      return /denied:mic/.test(m) ? TT('gf_chat_err_mic', '没有麦克风权限:系统设置 → 隐私与安全性 → 麦克风,勾上 Terse。')
           : /denied:speech/.test(m) ? TT('gf_chat_err_speech', '没有语音识别权限:系统设置 → 隐私与安全性 → 语音识别,勾上 Terse。')
           : m.slice(0, 200);
    };
    let micOn = false;
    mic.addEventListener('pointerdown', async (e) => {
      if (busy || micOn || convo) return; e.preventDefault();
      micOn = true; mic.classList.add('on'); showNote('');
      try { await T.gfListen('start', lang()); } catch (err) { micOn = false; mic.classList.remove('on'); showNote(micErr(err)); }
    });
    const micUp = async () => { if (!micOn) return; micOn = false; mic.classList.remove('on'); try { await T.gfListen('stop'); } catch (e) {} };
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => mic.addEventListener(ev, micUp));

    // 开始语音对话:免按住,说完停 1.2 秒算一句;她说话时不听,说完 0.9 秒再开麦
    const listenOnce = async () => {
      if (!convo || herTalking || busy) return;
      try { await T.gfListen('start', lang(), 1200); } catch (e) { stopConvo(); showNote(micErr(e)); }
    };
    function stopConvo() {
      convo = false; clearTimeout(resumeTimer);
      try { T.gfListen('stop'); } catch (e) {}
      voice.classList.remove('on'); voice.textContent = TT('gfc_voice_start', '🎙 开始语音对话');
    }
    /* 10-22(用户:app 里的语音输入也要照 beiyege 那个 repo,说话就能打断她):实时模式下 = 那个 repo 的录音逻辑(gf-mic.js:
       −35 dB 噪声门,停 1.8 秒算一句,整句给引擎 /stt(Paraformer),她说话时麦克风给 /vad(Silero),真人一开口就打断),
       麦克风来自 terse-listen 的 duplex:她的声音也由它来播,macOS 的回声消除拿她的声音当参考 —— 不戴耳机也不会被自己打断。
       实时没开 = 原来的 Apple 语音识别对话。 */
    let duplexH = null, duplexUn = null, nodT = 0;
    const b64buf = (b64) => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };
    async function startDuplex() {
      const subs = new Set();
      duplexUn = await window.__TAURI__.event.listen('gf-mic', (ev) => { const b = ev && ev.payload && ev.payload.pcm; if (b) { const buf = b64buf(b); for (const fn of subs) fn(buf); } });
      /* Windows 没有 terse-listen:Rust 答 "webview-mic" —— 麦克风由这一页自己开(getUserMedia,回声消除开着),
         她的声音照常在壁纸里播。macOS 永远不会收到这个答复。 */
      let helper = true;
      try { await T.gfListen('duplex'); }
      catch (e) { if (String(e && e.message || e).includes('webview-mic')) helper = false; else throw e; }
      duplexH = await GfMic.listen({
        base: 'http://127.0.0.1:8770',
        ...(helper ? { source: { subscribe: (fn) => { subs.add(fn); return () => subs.delete(fn); } } } : {}),
        isBusy: () => herTalking,
        interrupt: () => { T.gfLiveInterrupt().catch(() => {}); },
        send: async (t) => { if (busy) return; text.value = t; await doSend(); },
        onPhase: (ph) => { if (ph === 'transcribing') showNote(TT('gfc_hearing', '在听你说的……')); else showNote(''); },
        onSpeaking: (on) => {                            // 她点头:你开口了(持续 0.4 秒的声音,不是一下咔哒)
          clearTimeout(nodT);
          const emit = (st) => { try { window.__TAURI__.event.emit('girlfriend-heard', { status: st }); } catch (e) {} };
          if (on) nodT = setTimeout(() => emit('listening'), 400); else emit('stopped');
        },
      });
    }
    async function stopDuplex() {
      clearTimeout(nodT);
      if (duplexH) { try { duplexH.stop(); } catch (e) {} duplexH = null; }
      if (duplexUn) { try { duplexUn(); } catch (e) {} duplexUn = null; }
      try { await T.gfListen('duplex_stop'); } catch (e) {}
    }
    voice.addEventListener('click', async () => {
      if (convo) { stopConvo(); return; }
      if (duplexH) { await stopDuplex(); voice.classList.remove('on'); voice.textContent = TT('gfc_voice_start', '🎙 开始语音对话'); return; }
      const g = (await read()).girlfriend || {};
      voice.classList.add('on'); voice.textContent = TT('gfc_voice_stop', '■ 结束语音对话'); showNote('');
      if (liveOn(g)) {
        try { await startDuplex(); }
        catch (e) { await stopDuplex(); voice.classList.remove('on'); voice.textContent = TT('gfc_voice_start', '🎙 开始语音对话'); showNote(micErr(e)); }
        return;
      }
      convo = true;
      if (herTalking) { try { await T.gfLiveInterrupt(); } catch (e) {} herTalking = false; }      // 她在说:打断她,轮到你
      listenOnce();
    });

    listen('girlfriend-heard', (ev) => {
      const p = (ev && ev.payload) || {};
      if (typeof p.partial === 'string') text.value = p.partial;
      else if (typeof p.final === 'string') { text.value = p.final; if (p.final.trim()) doSend(); }
      else if (p.status === 'no-mic') showNote(TT('gf_chat_err_nomic', '没找到麦克风。'));
      else if (p.status === 'unavailable' || p.status === 'error') showNote(String(p.msg || p.status));
      if (convo && p.status === 'stopped' && !busy) setTimeout(() => { if (!herTalking && !busy) listenOnce(); }, 400);
    });
    listen('girlfriend-speaking', (ev) => {
      herTalking = !!(ev && ev.payload && ev.payload.on); clearTimeout(resumeTimer);
      if (!herTalking && convo) resumeTimer = setTimeout(listenOnce, 900);
      paint();
    });
    listen('wallpaper-config', () => paint());
    listen('gf-live-setup', () => paint());

    try { for (const h of JSON.parse(localStorage.getItem('gfc-history') || '[]')) { history.push(h); bubble(h.role === 'user' ? 'me' : 'her', h.text); } } catch (e) {}
    try { window.i18n && window.i18n.applyKeys && window.i18n.applyKeys(document); } catch (e) {}
    paint();
    (async () => { try { for (const a of await T.gfAgents()) avail[a.id] = !!a.installed; } catch (e) {} paint(); })();
    window.addEventListener('focus', () => text.focus());
    text.focus();
  })();
  </script>
</body>
</html>
