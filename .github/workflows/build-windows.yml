name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      # Before anything expensive. A renderer file that was never committed is
      # invisible on the author's machine and fatal in a checkout - one of them
      # cost this branch several rounds of native z-order debugging, because a
      # failed import kills the whole page and a dead page still renders a
      # convincing screenshot.
      - name: Every renderer import must exist in the checkout
        run: node src/renderer/renderer-deps.test.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-app/src-tauri

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build terse-uia.exe
        run: |
          dotnet publish windows-app\helpers\terse-uia\terse-uia.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            -o windows-app\helpers\ `
            -v normal 2>&1

      - name: Verify terse-uia.exe
        run: |
          $size = (Get-Item "windows-app/helpers/terse-uia.exe").Length
          Write-Host "terse-uia.exe size: $size bytes"
          if ($size -lt 100000) { throw "terse-uia.exe too small — build may have failed" }

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install Node.js (for frontend assets)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Convert icon to .ico
        run: |
          $dst = "windows-app/src-tauri/icons/icon.ico"
          if (-not (Test-Path $dst)) {
            magick "windows-app/src-tauri/icons/icon.png" `
              -define icon:auto-resize=256,128,64,48,32,16 `
              $dst
            Write-Host "icon.ico created via ImageMagick"
          } else {
            Write-Host "icon.ico already exists"
          }

      - name: Build Tauri Windows installer
        run: |
          cd windows-app\src-tauri
          cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Find and list installer
        run: |
          $bundles = Get-ChildItem -Recurse "windows-app\src-tauri\target" -Include "*.exe","*.msi" |
            Where-Object { $_.FullName -match "bundle" }
          if ($bundles) {
            $bundles | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          } else {
            Write-Host "No bundle files found — listing target dir:"
            Get-ChildItem -Recurse "windows-app\src-tauri\target\x86_64-pc-windows-msvc\release" -Depth 3 | Select-Object FullName
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terse-Windows-Installer
          path: |
            windows-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            windows-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30

      # The crate's unit tests have never been run by CI. That was survivable
      # while they only covered pure helpers; it is not now that alert DELIVERY
      # depends on a queue - the toast window is built on first alert, so the
      # record has to survive the gap between "window exists" and "toast.js is
      # listening". Nothing in the smoke test can see that: no alert fires during
      # a run, so the toast path is never exercised end to end, before or after
      # the change.
      #
      # --lib on purpose: unit tests only, no integration targets. Placed after
      # the upload so a failure is loud without costing the installer, and NOT
      # continue-on-error, because a test that cannot fail the build is theatre.
      - name: Run the crate's unit tests
        run: |
          cd windows-app\src-tauri
          cargo test --target x86_64-pc-windows-msvc --lib

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.3
          name: Terse v1.3.3
          draft: false
          prerelease: false
          files: |
            windows-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            windows-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Smoke test on a real Windows desktop ────────────────────────────────
      # windows-latest is an actual Windows machine with an interactive session,
      # so the app can be installed, launched and photographed here. Everything
      # in this build was written on a Mac and verified only by cross-compiling;
      # these steps are the first thing in the pipeline that proves it RUNS.
      #
      # continue-on-error throughout: the release is already published above, and
      # a flaky screenshot must never fail a build that shipped fine.
      # The single most useful number for reading the screenshots below.
      # WebView2 144.0.3719.67 through .82 shipped a regression that paints a
      # ghost title bar under the web content on transparent windows
      # (MicrosoftEdge/WebView2Feedback#5492, tauri#14764). It is fixed in
      # 144.0.3719.93+. Without this line, every ghost bar in a screenshot is
      # ambiguous between "our bug" and "the runner's runtime".
      - name: Log the WebView2 Runtime version
        continue-on-error: true
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $v = $null
          foreach ($k in $keys) {
            $p = Get-ItemProperty -Path $k -ErrorAction SilentlyContinue
            if ($p.pv) { $v = $p.pv; break }
          }
          if (-not $v) { $v = "(not found in registry)" }
          Write-Host "WebView2 Runtime: $v"
          $bad = $false
          if ($v -match '^(\d+)\.(\d+)\.(\d+)\.(\d+)$') {
            $maj = [int]$Matches[1]; $bld = [int]$Matches[3]; $rev = [int]$Matches[4]
            # Regressed range: 144.0.3719.<93 and all of 145.x.
            if ($maj -eq 145) { $bad = $true }
            if ($maj -eq 144 -and $bld -eq 3719 -and $rev -lt 93) { $bad = $true }
          }
          if ($bad) {
            Write-Warning "This runtime is inside the WebView2 ghost-titlebar regression window - any ghost bar in the screenshots below is upstream, not ours."
          } else {
            Write-Host "Outside the known regression window - a ghost bar here would be ours."
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          "WebView2 Runtime: $v`nregressed range: $bad" | Set-Content artifacts/webview2-version.txt

      - name: Install the built app silently
        continue-on-error: true
        run: |
          $exe = Get-ChildItem -Recurse "windows-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter *.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "no installer produced" }
          Write-Host "installing $($exe.FullName)"
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          $installed = Get-ChildItem -Recurse "C:\Program Files\Terse" -Filter "Terse.exe" -ErrorAction SilentlyContinue |
                       Select-Object -First 1
          if (-not $installed) { throw "Terse.exe not found after install" }
          Write-Host "INSTALLED_AT=$($installed.FullName)"
          "TERSE_EXE=$($installed.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The runner boots with no desktop picture and the wallpaper feature off,
      # so a plain launch never touches any of the wallpaper code. Setting both
      # up BEFORE launch means `setup()`'s restore path runs for real:
      # show_wallpaper_window -> pin_wallpaper_window (the WorkerW re-parent) and
      # get_desktop_picture (the PowerShell downscale). Those are the two pieces
      # that have never been observed running anywhere.
      # Real agent traffic, without a real agent.
      #
      # "CI cannot produce agent traffic" was wrong - agent_monitor does not talk
      # to Claude Code, it reads the JSONL transcripts Claude Code leaves in
      # ~/.claude/projects/<encoded-cwd>/<session>.jsonl. So a transcript in that
      # shape IS the traffic, and discovery -> parse -> display becomes testable
      # here instead of only on someone's desktop.
      #
      # The schema below is taken from a real transcript, not invented: `type`,
      # `cwd`, `message.role`, `message.usage.{input,output,cache_creation,
      # cache_read}_tokens`, tool_use / tool_result content blocks and
      # `toolUseResult` - exactly the fields parse_claude_code_line reads.
      - name: Plant a Claude Code transcript so the agent parser has real input
        continue-on-error: true
        run: |
          $enc  = "C--Users-runneradmin-Desktop-terse-ci"
          $dir  = Join-Path $env:USERPROFILE ".claude\projects\$enc"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $sid  = [guid]::NewGuid().ToString()
          $cwd  = "C:\Users\runneradmin\Desktop\terse-ci"
          $file = Join-Path $dir "$sid.jsonl"
          $lines = New-Object System.Collections.ArrayList
          function Add-Line($o) { [void]$lines.Add((ConvertTo-Json $o -Depth 12 -Compress)) }
          $t0 = [DateTime]::UtcNow.AddMinutes(-6)
          for ($i = 0; $i -lt 8; $i++) {
            $ts = $t0.AddSeconds($i * 40).ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            Add-Line @{ type='user'; cwd=$cwd; sessionId=$sid; timestamp=$ts; uuid=[guid]::NewGuid().ToString();
                        message=@{ role='user'; content="Refactor the token counter, pass $i" } }
            # assistant turn: a tool call, then text, with real usage numbers
            $ts2 = $t0.AddSeconds($i * 40 + 8).ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            Add-Line @{ type='assistant'; cwd=$cwd; sessionId=$sid; timestamp=$ts2; uuid=[guid]::NewGuid().ToString();
                        message=@{ role='assistant'; model='claude-opus-5'; type='message';
                          content=@( @{ type='tool_use'; id="toolu_$i"; name='Read'; input=@{ file_path="$cwd\src\counter.ts" } } );
                          usage=@{ input_tokens=(120 + $i * 30); output_tokens=(340 + $i * 55);
                                   cache_creation_input_tokens=(2200 + $i * 400);
                                   cache_read_input_tokens=(15000 + $i * 2600) } } }
            $ts3 = $t0.AddSeconds($i * 40 + 14).ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            Add-Line @{ type='user'; cwd=$cwd; sessionId=$sid; timestamp=$ts3; uuid=[guid]::NewGuid().ToString();
                        toolUseResult=@{ type='text'; file=@{ filePath="$cwd\src\counter.ts" } };
                        message=@{ role='user'; content=@( @{ type='tool_result'; tool_use_id="toolu_$i";
                          content=("export function count(s: string) { return s.length } " * 40) } ) } }
            $ts4 = $t0.AddSeconds($i * 40 + 22).ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            Add-Line @{ type='assistant'; cwd=$cwd; sessionId=$sid; timestamp=$ts4; uuid=[guid]::NewGuid().ToString();
                        message=@{ role='assistant'; model='claude-opus-5'; type='message';
                          content=@( @{ type='text'; text="Done - pass $i trimmed the counter." } );
                          usage=@{ input_tokens=(95 + $i * 12); output_tokens=(210 + $i * 40);
                                   cache_creation_input_tokens=0;
                                   cache_read_input_tokens=(18000 + $i * 3100) } } }
          }
          Set-Content -Path $file -Value $lines -Encoding utf8
          # mtime must be fresh: find_all_active_jsonl_globally ignores anything
          # older than 30 minutes, so a stale fixture would look like no traffic.
          (Get-Item $file).LastWriteTime = Get-Date
          $expIn  = 0; $expOut = 0
          for ($i = 0; $i -lt 8; $i++) { $expIn += (120 + $i*30) + (95 + $i*12); $expOut += (340 + $i*55) + (210 + $i*40) }
          Write-Host "planted $file  ($($lines.Count) lines)"
          Write-Host "EXPECT input_tokens=$expIn output_tokens=$expOut turns=8"
          "EXPECT_IN=$expIn`nEXPECT_OUT=$expOut" | Set-Content artifacts-expect.txt

      # Codex too. Different agent, different store, different parser:
      # ~/.codex/sessions/YYYY/MM/DD/rollout-*.jsonl, read by parse_codex_line
      # rather than parse_claude_code_line. Testing only Claude Code would leave
      # exactly half the reported bug uncovered - the desktop showed BOTH agents
      # online with zeroes, and they share no parsing code at all.
      #
      # Shape taken from parse_codex_line's own dispatch (Desktop rollout
      # format): session_meta carries the model; event_msg dispatches on
      # payload.type for task_started / user_message / task_complete;
      # response_item carries role'd content plus function_call and
      # function_call_output. Note Codex rollouts have NO usage fields at all -
      # the parser estimates tokens from content length and flushes per turn on
      # task_complete, so the fixture needs real prose volume, not token counts.
      - name: Plant a Codex rollout so the other parser has real input
        continue-on-error: true
        run: |
          $now  = Get-Date
          $dir  = Join-Path $env:USERPROFILE (".codex\sessions\{0:yyyy}\{0:MM}\{0:dd}" -f $now)
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $sid  = [guid]::NewGuid().ToString()
          $file = Join-Path $dir ("rollout-{0:yyyy-MM-ddTHH-mm-ss}-$sid.jsonl" -f $now)
          $lines = New-Object System.Collections.ArrayList
          function Add-L($o) { [void]$lines.Add((ConvertTo-Json $o -Depth 12 -Compress)) }
          $t0 = $now.AddMinutes(-5).ToUniversalTime()
          $ts = { param($s) $t0.AddSeconds($s).ToString("yyyy-MM-ddTHH:mm:ss.fffZ") }
          Add-L @{ type='session_meta'; timestamp=(& $ts 0);
                   payload=@{ model='gpt-5-codex'; model_provider='openai'; id=$sid } }
          $prose = "Scanning the workspace for the token accounting path and the places it double counts cached reads. "
          for ($i = 0; $i -lt 6; $i++) {
            $b = $i * 45
            Add-L @{ type='event_msg'; timestamp=(& $ts $b);
                     payload=@{ type='task_started'; model_context_window=272000 } }
            Add-L @{ type='event_msg'; timestamp=(& $ts ($b+1));
                     payload=@{ type='user_message'; message="Audit the cache accounting, round $i" } }
            Add-L @{ type='response_item'; timestamp=(& $ts ($b+2));
                     payload=@{ type='message'; role='user';
                       content=@( @{ type='input_text'; text=("Audit the cache accounting, round $i. " + ($prose * 3)) } ) } }
            Add-L @{ type='response_item'; timestamp=(& $ts ($b+8));
                     payload=@{ type='function_call'; name='shell'; call_id="call_$i";
                       arguments=(ConvertTo-Json @{ command=@('bash','-lc','rg -n "cache_read" src/') } -Compress) } }
            Add-L @{ type='response_item'; timestamp=(& $ts ($b+12));
                     payload=@{ type='function_call_output'; call_id="call_$i";
                       output=("src/stats.rs:41: cache_read_input_tokens`n" * 30) } }
            Add-L @{ type='response_item'; timestamp=(& $ts ($b+20));
                     payload=@{ type='message'; role='assistant';
                       content=@( @{ type='output_text'; text=("Round $i - the cached reads are counted twice. " + ($prose * 6)) } ) } }
            Add-L @{ type='event_msg'; timestamp=(& $ts ($b+24)); payload=@{ type='task_complete' } }
          }
          Set-Content -Path $file -Value $lines -Encoding utf8
          # Deliberately STALE - 45 minutes old, past find_codex_session's 30
          # minute freshness window. That reproduces the actual reported bug:
          # Terse starts while Codex is open but idle, accept_agent finds nothing
          # fresh, and session_file stays None. A later step touches this file to
          # simulate the user starting work, which is what the late-attach retry
          # has to notice. Planting it fresh only ever tested the happy path,
          # which already worked.
          (Get-Item $file).LastWriteTime = (Get-Date).AddMinutes(-45)
          Write-Host "planted $file  ($($lines.Count) lines, 6 turns) - mtime backdated 45 min"
          "CODEX_ROLLOUT=$file" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Reproduce the Pro user's broken Codex, so the repair is testable.
      #
      # Their ~/.codex/config.toml kept openai_base_url = "http://127.0.0.1:7860
      # /v1" after Terse quit, and Codex then 502'd against a dead port until
      # they deleted the line by hand. Planting that exact line before launch
      # means startup either heals it or does not.
      #
      # auth.json has no OPENAI_API_KEY - a ChatGPT-account session, the case
      # that also 401s with "Missing scopes: api.responses.write". So the proxy
      # must NOT put the line back either. Both halves are checked after launch.
      #
      # The surrounding TOML is real settings that must survive untouched: the
      # cleanup is only allowed to remove our own line.
      - name: Plant the reported broken Codex config
        continue-on-error: true
        run: |
          $dir = Join-Path $env:USERPROFILE ".codex"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          @(
            'openai_base_url = "http://127.0.0.1:7860/v1"'
            'model = "gpt-5-codex"'
            'model_provider = "openai"'
            'approval_policy = "on-request"'
            ''
            '[mcp_servers.example]'
            'command = "npx"'
          ) | Set-Content (Join-Path $dir "config.toml") -Encoding ascii
          '{ "tokens": { "access_token": "ci-fake-oauth", "refresh_token": "ci-fake" } }' |
            Set-Content (Join-Path $dir "auth.json") -Encoding ascii
          Write-Host "planted broken config.toml (stale proxy URL) + ChatGPT-style auth.json"

      # Detection is by PROCESS NAME, not by transcript.
      # agent_defs() lists process_names: ["claude"] and ["codex"], so a planted
      # transcript alone is invisible - accept_agent never fires, nothing is
      # parsed, and no log line is written. That is exactly what the first
      # fixture run showed: "planted ... 32 lines" and then silence.
      #
      # cmd.exe copied under each name gives the scanner a real process with a
      # real PID to find. It sleeps and does nothing else. The CWD lookup will
      # fail on it, which is fine and worth exercising: find_claude_project_dir
      # is meant to fall back to scanning all project dirs for the most recent
      # session, and that fallback is what the planted transcript tests.
      # Plant a rival relay, the one that broke a user's Claude Code sync.
      #
      # Their settings.json was owned by a relay on 127.0.0.1:15721 mapping Claude
      # model names onto gpt-5.6-*. Terse overwrote it, the relay wrote it back,
      # and sync died in the crossfire. The fix chains instead of evicting, and
      # this is the state it has to survive.
      - name: Plant a rival Claude Code proxy
        continue-on-error: true
        run: |
          $dir = Join-Path $env:USERPROFILE ".claude"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $f = Join-Path $dir "settings.json"
          $cur = @{}
          if (Test-Path $f) { try { $cur = Get-Content $f -Raw | ConvertFrom-Json -AsHashtable } catch {} }
          if (-not $cur.env) { $cur.env = @{} }
          $cur.env.ANTHROPIC_BASE_URL = 'http://127.0.0.1:15721'
          $cur.env.ANTHROPIC_AUTH_TOKEN = 'PROXY_MANAGED'
          ConvertTo-Json $cur -Depth 8 | Set-Content $f -Encoding ascii
          Write-Host "planted rival relay: ANTHROPIC_BASE_URL=http://127.0.0.1:15721"

      - name: Give the agent scanner processes to find
        continue-on-error: true
        run: |
          foreach ($n in @('claude','codex')) {
            $exe = Join-Path $env:TEMP "$n.exe"
            Copy-Item "$env:WINDIR\System32\cmd.exe" $exe -Force
            Start-Process -FilePath $exe -ArgumentList '/c','timeout /t 900 /nobreak' -WindowStyle Hidden
          }
          Start-Sleep -Seconds 2
          Get-Process -Name claude,codex -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "running: $($_.ProcessName) pid=$($_.Id)" }

      # Run the smoke test as a PRO user.
      #
      # The Pro field (four glyph slots, the PRO_TINT six-colour palette, the
      # 1.2s agent-log cadence) is gated two ways: wallpaper.json must say
      # engine=cinematic, AND get_license must report an entitled subscription -
      # the renderer now re-checks, so setting the engine alone is no longer
      # enough. A default runner is neither, so every burst so far has been
      # photographing the FREE field and the Pro palette has never been observed.
      #
      # license.json is the local cache the License struct loads from, so writing
      # an active tier here simulates a subscribed user on this machine. It grants
      # nothing server-side; it is the same file a real subscriber would have.
      - name: Sign the runner in as Pro
        continue-on-error: true
        run: |
          $dir = Join-Path $env:USERPROFILE ".terse"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $lic = @{
            tier = 'pro'; status = 'active'
            limits = @{ optimizations_per_week = -1; max_sessions = -1; max_devices = -1 }
            clerkUserId = 'ci_smoke_user'
            expiresAt = (Get-Date).AddDays(30).ToString('yyyy-MM-ddTHH:mm:sszzz')
            trialEnd = $null
            weekly_usage = 0.0
            usage_week = [int](Get-Date -UFormat %V)
          }
          ConvertTo-Json $lic -Depth 6 | Set-Content (Join-Path $dir "license.json") -Encoding ascii
          Write-Host "license.json written: tier=pro status=active"

      # What does Terse cost with the wallpaper OFF - which is the default, and
      # so what almost every user actually runs?
      #
      # A user reported "a pile" of Terse processes in Task Manager. Some of that
      # is WebView2 being WebView2: one renderer per window, plus a shared
      # browser, GPU and crashpad. But the wallpaper window was built for
      # EVERYONE at startup even though `enabled` defaults to false - so its
      # renderer sat resident, and wallpaper.html booted, for a feature that was
      # switched off. The field was gated; the window was not.
      #
      # Every other step here runs with the wallpaper deliberately ON, so none of
      # them can see this. That is exactly why it survived: the suite only ever
      # measured the configuration the bug does not appear in.
      - name: Count what Terse costs with the wallpaper OFF
        continue-on-error: true
        run: |
          # Start from a known state. The installer may already have launched the
          # app, and single-instance would hand our Start-Process straight back to
          # that older instance - which read its config before we touched it, so
          # the census would describe the wrong configuration entirely.
          Get-Process -Name Terse -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          $dir = Join-Path $env:USERPROFILE ".terse"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Remove-Item (Join-Path $dir "wallpaper.json") -ErrorAction SilentlyContinue
          Write-Host "wallpaper.json removed - the app will use its own defaults (enabled=false)"
          Start-Process -FilePath "$env:TERSE_EXE"
          Start-Sleep -Seconds 45

          $t  = @(Get-Process -Name Terse -ErrorAction SilentlyContinue)
          $wv = @(Get-Process -Name msedgewebview2 -ErrorAction SilentlyContinue)
          $mb = ((($t + $wv) | Measure-Object WorkingSet64 -Sum).Sum / 1MB)
          Write-Host ("wallpaper OFF: Terse:{0} proc  WebView2:{1} proc  {2:N0} MB" -f $t.Count, $wv.Count, $mb)

          # The assertion that matters is not a process count - that number moves
          # with WebView2's own internals and would be a flaky thing to pin. It is
          # whether the window exists at all.
          # EnumChildWindows as well as EnumWindows. The first version used only
          # the top-level sweep and enumerated NOTHING, while the step further
          # down - which recurses - reliably finds these windows. Same reason the
          # window dump in the artifact can photograph 'Terse Wallpaper'.
          Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;using System.Text;public class WQ{public delegate bool Cb(IntPtr h,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumWindows(Cb c,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumChildWindows(IntPtr p,Cb c,IntPtr l);[DllImport("user32.dll",CharSet=CharSet.Unicode)]public static extern int GetWindowTextW(IntPtr h,StringBuilder s,int n);}'
          $script:titles = @()
          $script:cb = [WQ+Cb]{ param($h,$l)
            $sb = New-Object System.Text.StringBuilder 256
            [void][WQ]::GetWindowTextW($h, $sb, 256)
            $t2 = $sb.ToString()
            if ($t2 -like 'Terse*') { $script:titles += $t2 }
            [void][WQ]::EnumChildWindows($h, $script:cb, [IntPtr]::Zero)
            return $true }
          [void][WQ]::EnumWindows($script:cb, [IntPtr]::Zero)
          Write-Host "--- Terse windows with the wallpaper off ---"
          $script:titles | Sort-Object -Unique | ForEach-Object { Write-Host "  $_" }

          # The count is the real evidence, and it is recorded for the ON step to
          # compare against. A title check on its own is worthless here: the first
          # version of this step printed an EMPTY window list and still said OK -
          # it would have passed just as happily if the app had never started.
          # Absence only means something next to a presence measured the same way.
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          "$($wv.Count)" | Set-Content artifacts/webview-count-off.txt
          if ($script:titles.Count -eq 0) {
            Write-Warning "INCONCLUSIVE: no Terse windows enumerated at all - cannot tell 'the wallpaper window is absent' from 'nothing is running'"
          } elseif ($script:titles -contains 'Terse Wallpaper') {
            Write-Warning "RESIDENT WALLPAPER: the window was built even though the wallpaper is off - that is a WebView2 renderer nobody asked for"
          } else {
            Write-Host "WALLPAPER NOT RESIDENT OK: no wallpaper window among $($script:titles.Count) Terse windows while the feature is off"
          }

          # Leave nothing running: the next step turns the wallpaper on and
          # launches again, and single-instance would hand it back to this one.
          Get-Process -Name Terse -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3

      - name: Give the runner a desktop picture and turn the wallpaper on
        continue-on-error: true
        run: |
          # Also a direct check of the stock paths the Rust fallback relies on.
          foreach ($c in @("$env:WINDIR\Web\Wallpaper\Windows\img0.jpg",
                           "$env:WINDIR\Web\Wallpaper\Theme1\img1.jpg",
                           "$env:WINDIR\Web\Screen\img100.jpg")) {
            Write-Host "stock candidate $c exists=$(Test-Path $c)"
          }
          $img = Get-ChildItem -Recurse "$env:WINDIR\Web\Wallpaper" -Include *.jpg -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($img) {
            # One line on purpose: a PowerShell here-string must close at column
            # 0, which is illegal inside an indented YAML block scalar.
            Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public class Wp { [DllImport("user32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern bool SystemParametersInfo(uint a, uint b, string c, uint d); }'
            # SPI_SETDESKWALLPAPER, SPIF_UPDATEINIFILE|SPIF_SENDCHANGE
            $null = [Wp]::SystemParametersInfo(20, 0, $img.FullName, 3)
            Write-Host "desktop picture set to $($img.FullName)"
          } else {
            Write-Host "no stock wallpaper on this runner - fallback will be exercised"
          }
          $transcoded = Join-Path $env:APPDATA "Microsoft\Windows\Themes\TranscodedWallpaper"
          Write-Host "TranscodedWallpaper exists=$(Test-Path $transcoded)"
          $dir = Join-Path $env:USERPROFILE ".terse"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          # engine=cinematic, not mineradio: that is the Pro field, and with the
          # Pro licence written above the renderer's entitlement check now
          # passes, so the burst below finally photographs four coloured glyph
          # slots instead of the free one-slot field.
          '{"enabled":true,"engine":"cinematic","theme":"neon","quality":56,"angle":55,"intensity":1.0}' |
            Set-Content -Path (Join-Path $dir "wallpaper.json") -Encoding ascii
          Write-Host "wallpaper.json written with enabled=true"

      - name: Launch and prove it stays alive
        continue-on-error: true
        run: |
          Start-Process -FilePath "$env:TERSE_EXE"
          # WebView2 first-run + the setup() window builds need a moment.
          Start-Sleep -Seconds 40
          $p = Get-Process -Name "Terse" -ErrorAction SilentlyContinue
          if (-not $p) { throw "Terse exited within 40s of launch — it crashed on startup" }
          Write-Host "alive: $($p.Count) process(es), pid $($p[0].Id)"
          # A window title is the cheapest proof the webview actually rendered
          # rather than the process merely existing.
          $titles = $p | ForEach-Object { $_.MainWindowTitle } | Where-Object { $_ }
          Write-Host "window titles: $($titles -join ' | ')"

      # Did startup actually repair the config, and did the proxy leave it alone?
      #
      # Three assertions, all failable:
      #   1. our 127.0.0.1 line is gone  — the reported bug is fixed
      #   2. the user's other settings survive — we removed only our own line
      #   3. it is still gone after the proxy has been up ~40s — the ChatGPT-auth
      #      check held and the proxy did not re-inject it
      - name: Verify the Codex config was repaired and left alone
        continue-on-error: true
        run: |
          $cfg = Join-Path $env:USERPROFILE ".codex\config.toml"
          if (-not (Test-Path $cfg)) { Write-Warning "CODEX-CONFIG: file vanished entirely"; exit 0 }
          # POLL, do not snapshot. The previous run checked 1s after the launch
          # step returned and found the file untouched - but the app's setup() was
          # still running (its first diagnostic landed 25s later), so the cleanup
          # simply had not been reached yet. A fixed sleep read a race as a
          # failure. Wait for the line to go, up to 90s, and report how long it
          # took; only a genuine timeout is a failure.
          $t = Get-Content $cfg -Raw
          $waited = 0
          while (($t -match 'openai_base_url\s*=\s*"[^"]*127\.0\.0\.1') -and $waited -lt 90) {
            Start-Sleep -Seconds 3; $waited += 3
            $t = Get-Content $cfg -Raw
          }
          Write-Host "waited ${waited}s for startup cleanup"
          Write-Host "--- config.toml after launch ---"; Write-Host $t
          $stale = $t -match 'openai_base_url\s*=\s*"[^"]*127\.0\.0\.1'
          $keptModel = $t -match 'model_provider\s*=\s*"openai"'
          $keptMcp = $t -match '\[mcp_servers\.example\]'
          if ($stale)      { Write-Warning "CODEX-CONFIG FAIL: the stale 127.0.0.1 line is STILL there" }
          else             { Write-Host    "CODEX-CONFIG OK: stale proxy line removed" }
          if (-not $keptModel -or -not $keptMcp) {
            Write-Warning "CODEX-CONFIG FAIL: cleanup destroyed the user's own settings (model_provider=$keptModel mcp=$keptMcp)"
          } else {
            Write-Host "CODEX-CONFIG OK: the user's other settings survived intact"
          }
          if (Test-Path "$cfg.terse-backup") { Write-Host "CODEX-CONFIG: backup present" }

      # The user starts working in Codex, 40 seconds after Terse launched.
      #
      # By now accept_agent has already run and found nothing fresh, so
      # session_file is None - the exact state that used to be permanent.
      # Touching the rollout is what a live Codex session looks like to the
      # watcher. The poll loop runs every 5s, so 20s is four chances to notice.
      #
      # Pass = "codex late-attach:" in agent-monitor.log. Its absence means the
      # retry never fired and the fix does not work, however green the build is.
      - name: Simulate Codex starting work after launch
        continue-on-error: true
        run: |
          if (-not $env:CODEX_ROLLOUT) { Write-Host "no rollout path recorded"; exit 0 }
          if (-not (Test-Path $env:CODEX_ROLLOUT)) { Write-Host "rollout missing"; exit 0 }
          # Let the app scan with the file STALE first, several times over.
          #
          # The previous run touched it ~1s after the launch step returned, and
          # the app's first agent scan happened to land AFTER the touch - so
          # accept_agent found a fresh file on its first try and the retry path
          # was never entered. The test reported failure for the fix while
          # actually failing to reproduce the bug.
          #
          # The scan loop polls every 5s, so 45s is roughly nine passes that must
          # all see it stale before the touch. Only then is a later attach
          # provably a RETRY rather than a first success.
          Write-Host "holding 45s so the app scans repeatedly while the rollout is stale"
          Start-Sleep -Seconds 45
          $log0 = Join-Path $env:USERPROFILE ".terse\agent-monitor.log"
          if (Test-Path $log0) {
            Write-Host "--- agent-monitor.log BEFORE the touch ---"
            Get-Content $log0 | Select-Object -Last 12 | ForEach-Object { Write-Host "  $_" }
          }
          (Get-Item $env:CODEX_ROLLOUT).LastWriteTime = Get-Date
          Write-Host "touched $env:CODEX_ROLLOUT - it is now fresh"
          Start-Sleep -Seconds 20
          $log = Join-Path $env:USERPROFILE ".terse\agent-monitor.log"
          if (Test-Path $log) {
            $hit = Select-String -Path $log -Pattern 'codex late-attach' -SimpleMatch
            if ($hit) { Write-Host "LATE-ATTACH OK: $($hit.Line)" }
            else { Write-Warning "LATE-ATTACH DID NOT FIRE - the retry is not working" }
          } else { Write-Host "no agent-monitor.log yet" }

      # What does Terse actually cost at rest?
      #
      # The lazy-window change claims 7 resident WebView2 renderers drop to 3.
      # That is countable here - one msedgewebview2.exe process per webview plus
      # a shared browser process - so it does not need a human with Task Manager.
      # Working set and CPU time come along because "still stuttering" is about
      # both, and a process count alone could fall while memory stayed flat.
      #
      # Measured twice, 20s apart: the first is startup cost, the second says
      # whether anything keeps climbing once idle. Numbers only - the runner has
      # no GPU and a 2-core CPU, so treat them as a floor for comparison between
      # builds, not as what a real desktop sees.
      - name: Measure resident cost at idle
        continue-on-error: true
        run: |
          function Snap($label) {
            $t  = @(Get-Process -Name Terse -ErrorAction SilentlyContinue)
            $wv = @(Get-Process -Name msedgewebview2 -ErrorAction SilentlyContinue)
            $tw = ($t  | Measure-Object WorkingSet64 -Sum).Sum
            $ww = ($wv | Measure-Object WorkingSet64 -Sum).Sum
            $cpu = ($t + $wv | Measure-Object CPU -Sum).Sum
            "{0,-8} Terse:{1} proc {2:N0} MB | WebView2:{3} proc {4:N0} MB | total {5:N0} MB | cpu {6:N1}s" -f `
              $label, $t.Count, ($tw/1MB), $wv.Count, ($ww/1MB), (($tw+$ww)/1MB), $cpu
          }
          $a = Snap "startup"; Write-Host $a
          Start-Sleep -Seconds 20
          $b = Snap "idle+20s"; Write-Host $b
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          "$a`n$b" | Set-Content artifacts/resident-cost.txt

          # The wallpaper is ON here and OFF in the earlier census, so the two
          # counts bracket what the wallpaper window actually costs. A differential
          # cannot pass by accident the way an absence check can: if the app failed
          # to start, this side collapses to zero and the comparison fails loudly
          # instead of reporting a tidy OK.
          $offFile = "artifacts/webview-count-off.txt"
          if (Test-Path $offFile) {
            $off = [int](Get-Content $offFile -Raw).Trim()
            $on  = @(Get-Process -Name msedgewebview2 -ErrorAction SilentlyContinue).Count
            Write-Host "WebView2 renderers - wallpaper off: $off, on: $on"
            if ($on -le 0 -or $off -le 0) {
              Write-Warning "INCONCLUSIVE: one side measured no WebView2 processes at all"
            } elseif ($off -lt $on) {
              Write-Host "LAZY WALLPAPER OK: turning it off costs $($on - $off) fewer renderer process(es)"
            } else {
              Write-Warning "LAZY WALLPAPER FAIL: off ($off) is not below on ($on) - the window is resident either way"
            }
          } else {
            Write-Warning "no webview-count-off.txt - the wallpaper-off census did not run"
          }
          # WHICH process is burning it.
          #
          # The first run of this step showed CPU climbing 78s in 20s of wall
          # clock - about 390%, four cores saturated, with the app idle. A total
          # says that is happening; it cannot say whether it is the wallpaper
          # software-rendering a particle field on a GPU-less runner or something
          # that would hurt on real hardware too. Per-process deltas can.
          # Which WINDOW does the hot process belong to?
          #
          # Last run pinned 485% on a single msedgewebview2 pid with the other
          # nine at 0%. Everything about it fit the wallpaper - the only window
          # still drawing, multi-threaded like software rasterisation, the largest
          # heap - but "fits" is not "is", and there was no data joining a pid to
          # a window. GetWindowThreadProcessId is that join.
          Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;using System.Text;public class M{public delegate bool Cb(IntPtr h,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumWindows(Cb c,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumChildWindows(IntPtr p,Cb c,IntPtr l);[DllImport("user32.dll",CharSet=CharSet.Unicode)]public static extern int GetWindowTextW(IntPtr h,StringBuilder s,int n);[DllImport("user32.dll")]public static extern int GetWindowThreadProcessId(IntPtr h,out uint p);}'
          $script:owner = @{}
          $script:map = [M+Cb]{ param($h,$l)
            $sb = New-Object System.Text.StringBuilder 256
            [void][M]::GetWindowTextW($h, $sb, 256)
            $t = $sb.ToString()
            if ($t -like 'Terse*') {
              $procId = 0; [void][M]::GetWindowThreadProcessId($h, [ref]$procId)
              if (-not $script:owner.ContainsKey($procId)) { $script:owner[$procId] = $t }
            }
            [void][M]::EnumChildWindows($h, $script:map, [IntPtr]::Zero)
            return $true }
          [void][M]::EnumWindows($script:map, [IntPtr]::Zero)
          Write-Host "--- window -> owning pid ---"
          $script:owner.GetEnumerator() | ForEach-Object { "  pid {0,-6} {1}" -f $_.Key, $_.Value }

          $before = @{}
          foreach ($p in Get-Process -Name msedgewebview2, Terse -ErrorAction SilentlyContinue) {
            $before[$p.Id] = $p.CPU
          }
          Start-Sleep -Seconds 15
          Write-Host "--- per-process CPU over 15s (highest first) ---"
          Get-Process -Name msedgewebview2, Terse -ErrorAction SilentlyContinue |
            ForEach-Object {
              $d = $_.CPU - $(if ($before.ContainsKey($_.Id)) { $before[$_.Id] } else { 0 })
              $win = if ($script:owner.ContainsKey([uint32]$_.Id)) { $script:owner[[uint32]$_.Id] } else { '(no window - shared/GPU/utility)' }
              [pscustomobject]@{ Pid = $_.Id; Name = $_.ProcessName; DeltaCpu = [math]::Round($d,1)
                                 Pct = [math]::Round($d / 15 * 100); MB = [math]::Round($_.WorkingSet64/1MB); Win = $win }
            } | Sort-Object DeltaCpu -Descending |
            ForEach-Object { "  pid {0,-6} {1,6}s {2,5}% {3,6} MB  {4}" -f $_.Pid, $_.DeltaCpu, $_.Pct, $_.MB, $_.Win }

      # Did Terse chain in front of the relay, or evict it?
      #
      # Pass = our port in settings.json AND the relay's address remembered as the
      # upstream. Either alone is a failure: taking the setting without recording
      # the upstream is exactly the eviction that broke the user.
      - name: Verify Claude Code was chained, not evicted
        continue-on-error: true
        run: |
          $f = Join-Path $env:USERPROFILE ".claude\settings.json"
          $up = Join-Path $env:USERPROFILE ".terse\anthropic-upstream.json"
          $waited = 0
          while ($waited -lt 60) {
            $v = $null
            try { $v = (Get-Content $f -Raw | ConvertFrom-Json).env.ANTHROPIC_BASE_URL } catch {}
            if ($v -like '*:7860*') { break }
            Start-Sleep -Seconds 3; $waited += 3
          }
          $now = $null
          try { $now = (Get-Content $f -Raw | ConvertFrom-Json).env.ANTHROPIC_BASE_URL } catch {}
          Write-Host "after ${waited}s  ANTHROPIC_BASE_URL = $now"
          $chained = $false
          if (Test-Path $up) {
            $u = (Get-Content $up -Raw | ConvertFrom-Json).url
            Write-Host "remembered upstream = $u"
            $chained = ($u -eq 'http://127.0.0.1:15721')
          } else { Write-Host "no anthropic-upstream.json" }
          if ($now -like '*:7860*' -and $chained) {
            Write-Host "CHAIN OK: Terse took the port and remembered the relay as upstream"
          } elseif ($now -like '*:7860*') {
            Write-Warning "CHAIN FAIL: Terse took the setting but did NOT record the relay - this is the eviction bug"
          } else {
            Write-Warning "CHAIN FAIL: Terse never configured Claude Code (base url = $now)"
          }

      - name: Screenshot the desktop
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bmp.Save("artifacts/terse-windows.png")
          Write-Host "screenshot $($b.Width)x$($b.Height) saved"

      # One screenshot of the desktop only ever shows the window on top. Tauri
      # builds several windows at startup (main, island, popup, pet, wallpaper),
      # so enumerate every visible window owned by the Terse process, front each
      # in turn and photograph it. These are REAL app windows with live backend
      # data behind them.
      # Report the runtime truth instead of inferring it from screenshots: is DWM
      # composition even on (this runner is Windows Server with classic theming,
      # where a grey caption gradient can be a CI artefact rather than a real
      # bug), and does each Terse window still carry WS_CAPTION after setup
      # stripped it? WS_CAPTION = 0x00C00000.
      - name: Report DWM state and window styles
        continue-on-error: true
        run: |
          Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;using System.Text;public class D{public delegate bool Cb(IntPtr h,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumWindows(Cb c,IntPtr l);[DllImport("user32.dll")]public static extern bool IsWindowVisible(IntPtr h);[DllImport("user32.dll")]public static extern int GetWindowThreadProcessId(IntPtr h,out int p);[DllImport("user32.dll",CharSet=CharSet.Unicode)]public static extern int GetWindowTextW(IntPtr h,StringBuilder s,int n);[DllImport("user32.dll",EntryPoint="GetWindowLongPtrW")]public static extern IntPtr GetWindowLongPtr(IntPtr h,int i);[DllImport("dwmapi.dll")]public static extern int DwmIsCompositionEnabled(out bool e);}'
          $comp = $false
          try { [void][D]::DwmIsCompositionEnabled([ref]$comp) } catch {}
          Write-Host "DWM composition enabled: $comp"
          $dpids = (Get-Process -Name "Terse" -ErrorAction SilentlyContinue | ForEach-Object { $_.Id })
          $dcb = [D+Cb]{ param($h,$l)
            if ([D]::IsWindowVisible($h)) {
              $wpid = 0; [void][D]::GetWindowThreadProcessId($h, [ref]$wpid)
              if ($dpids -contains $wpid) {
                $sb = New-Object System.Text.StringBuilder 512
                [void][D]::GetWindowTextW($h, $sb, 512)
                $st = [int64][D]::GetWindowLongPtr($h, -16)   # GWL_STYLE
                $ex = [int64][D]::GetWindowLongPtr($h, -20)   # GWL_EXSTYLE
                $cap = ($st -band 0x00C00000) -ne 0
                Write-Host ("  '{0}' style=0x{1:X8} ex=0x{2:X8} WS_CAPTION={3}" -f $sb.ToString(), $st, $ex, $cap)
              }
            }
            return $true }
          [void][D]::EnumWindows($dcb, [IntPtr]::Zero)

      # DRIVE the app: open a lazy window for real and look at what appears.
      #
      # Two bugs shipped because nothing here ever opened one. Windows built off
      # the main thread came up as about:blank with the calling command hung, and
      # navigate_main did nothing at all off-thread - both reported by a user, not
      # caught here, because every check so far only looked at windows that
      # already existed at launch.
      #
      # Ctrl+Shift+D is the Doctor toggle and runs the same ensure_window ->
      # build_lazy_window path as the room, the pet, the farm and the palette. If
      # that path is broken the window is either missing or blank, and both are
      # visible from outside the process.
      - name: Open a lazy window with a keystroke and check it rendered
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;using System.Text;public class K{public delegate bool Cb(IntPtr h,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumWindows(Cb c,IntPtr l);[DllImport("user32.dll",CharSet=CharSet.Unicode)]public static extern int GetWindowTextW(IntPtr h,StringBuilder s,int n);[DllImport("user32.dll")]public static extern bool GetWindowRect(IntPtr h,out R r);[DllImport("user32.dll")]public static extern bool PrintWindow(IntPtr h,IntPtr dc,uint f);[DllImport("user32.dll")]public static extern bool IsWindowVisible(IntPtr h);[DllImport("user32.dll")]public static extern bool SetForegroundWindow(IntPtr h);public struct R{public int L,T,Rr,B;}}'
          function Find-TerseWindow($title) {
            $script:hit = [IntPtr]::Zero
            $cb = [K+Cb]{ param($h,$l)
              if ([K]::IsWindowVisible($h)) {
                $sb = New-Object System.Text.StringBuilder 256
                [void][K]::GetWindowTextW($h, $sb, 256)
                if ($sb.ToString() -eq $title) { $script:hit = $h; return $false }
              }
              return $true }
            [void][K]::EnumWindows($cb, [IntPtr]::Zero)
            return $script:hit
          }
          # Front the main window so the global shortcut reaches the app.
          # ONE keystroke. Ctrl+Shift+D is a TOGGLE.
          #
          # The retry loop sent it up to four times, stopping when the app wrote
          # a receipt. If the first press landed but the receipt lagged, the
          # second press closed the window that the first had just opened - which
          # matches exactly what the last run showed: the build logged, no window
          # visible. Two runs of identical code disagreed, and a toggle pressed a
          # variable number of times is reason enough for that.
          #
          # Pressing once cannot produce that. If the press is lost, the window
          # never appears and the log stays empty, which reports as INCONCLUSIVE
          # and is honest.
          $lg = Join-Path $env:USERPROFILE ".terse\lazy-window.log"
          $main = Find-TerseWindow 'Terse'
          if ($main -ne [IntPtr]::Zero) { [void][K]::SetForegroundWindow($main); Start-Sleep -Milliseconds 900 }
          Write-Host "sending Ctrl+Shift+D once"
          [System.Windows.Forms.SendKeys]::SendWait('^+d')

          # Wait on the WINDOW, not on a receipt. The window is the thing being
          # tested; the receipt only ever said the app had started trying.
          $doc = [IntPtr]::Zero
          for ($w = 0; $w -lt 45 -and $doc -eq [IntPtr]::Zero; $w++) {
            Start-Sleep -Seconds 1
            $doc = Find-TerseWindow 'Terse Doctor'
          }
          Write-Host ("waited {0}s for the window" -f $w)

          if ($doc -eq [IntPtr]::Zero) {
            # Which of the two failures is this? The app now records the lazy
            # path to ~/.terse/lazy-window.log, so "the keystroke never arrived"
            # and "the build ran and produced nothing" stop looking identical -
            # they did on the first run of this test, and I could not tell them
            # apart from outside.
            $lg = Join-Path $env:USERPROFILE ".terse\lazy-window.log"
            if (Test-Path $lg) {
              Write-Host "--- lazy-window.log ---"
              Get-Content $lg -Tail 10 | ForEach-Object { Write-Host "  $_" }
              Write-Warning "LAZY-WINDOW FAIL: the build path RAN but no window appeared"
            } else {
              Write-Warning "LAZY-WINDOW INCONCLUSIVE: no lazy-window.log — the keystroke never reached the app, so nothing was tested"
            }
            exit 0
          }
          $r = New-Object K+R
          [void][K]::GetWindowRect($doc, [ref]$r)
          $w = $r.Rr - $r.L; $h2 = $r.B - $r.T
          Write-Host "Doctor window ${w}x${h2}"
          if ($w -le 0 -or $h2 -le 0) { Write-Warning "LAZY-WINDOW FAIL: zero-sized"; exit 0 }
          $bmp = New-Object System.Drawing.Bitmap $w, $h2
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $dc = $g.GetHdc(); [void][K]::PrintWindow($doc, $dc, 2); $g.ReleaseHdc($dc)
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bmp.Save("artifacts/lazy-doctor.png")
          # about:blank is a flat white sheet. Real content is not: sample a grid
          # and count distinct colours. A blank page yields 1.
          $colors = @{}
          for ($x = 10; $x -lt $w - 10; $x += 37) {
            for ($y = 10; $y -lt $h2 - 10; $y += 29) {
              $c = $bmp.GetPixel($x, $y).ToArgb()
              $colors[$c] = 1
            }
          }
          $n = $colors.Count
          Write-Host "distinct sampled colours: $n"
          if ($n -le 2) {
            Write-Warning "LAZY-WINDOW FAIL: the window is blank ($n colour(s)) - this is the about:blank bug"
          } else {
            Write-Host "LAZY-WINDOW OK: window opened on demand and rendered real content"
          }
          $g.Dispose(); $bmp.Dispose()

      # Click "Wallpaper" and look at the window. That is the whole report.
      #
      # A user said clicking it did nothing. I checked the command existed, the
      # bridge exposed it, the page's calls all resolved - and it was still
      # broken, because navigate_main ran off the main thread and swallowed the
      # failure. None of that reading would have caught it; opening the app and
      # clicking would have, in seconds.
      #
      # UI Automation reaches into the WebView2 DOM, so the button is found by
      # its accessible name rather than by guessing coordinates. Screenshot
      # before and after: if the pane does not change, the click did nothing.
      - name: Click Wallpaper and see whether the page changes
        continue-on-error: true
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Drawing, System.Windows.Forms
          Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;using System.Text;public class C{public delegate bool Cb(IntPtr h,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumWindows(Cb c,IntPtr l);[DllImport("user32.dll",CharSet=CharSet.Unicode)]public static extern int GetWindowTextW(IntPtr h,StringBuilder s,int n);[DllImport("user32.dll")]public static extern bool GetWindowRect(IntPtr h,out R r);[DllImport("user32.dll")]public static extern bool PrintWindow(IntPtr h,IntPtr dc,uint f);[DllImport("user32.dll")]public static extern bool IsWindowVisible(IntPtr h);[DllImport("user32.dll")]public static extern bool SetForegroundWindow(IntPtr h);public struct R{public int L,T,Rr,B;}}'
          $script:main = [IntPtr]::Zero
          $cb = [C+Cb]{ param($h,$l)
            if ([C]::IsWindowVisible($h)) {
              $sb = New-Object System.Text.StringBuilder 256
              [void][C]::GetWindowTextW($h, $sb, 256)
              if ($sb.ToString() -eq 'Terse') { $script:main = $h; return $false }
            }
            return $true }
          [void][C]::EnumWindows($cb, [IntPtr]::Zero)
          if ($script:main -eq [IntPtr]::Zero) { Write-Warning "CLICK INCONCLUSIVE: no main window"; exit 0 }
          [void][C]::SetForegroundWindow($script:main); Start-Sleep -Milliseconds 700

          function Shot($tag) {
            $r = New-Object C+R; [void][C]::GetWindowRect($script:main, [ref]$r)
            $w = $r.Rr - $r.L; $h = $r.B - $r.T
            if ($w -le 0 -or $h -le 0) { return $null }
            $b = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($b); $dc = $g.GetHdc()
            [void][C]::PrintWindow($script:main, $dc, 2); $g.ReleaseHdc($dc); $g.Dispose()
            New-Item -ItemType Directory -Force -Path artifacts | Out-Null
            $b.Save("artifacts/click-$tag.png")
            return $b
          }
          $before = Shot 'before'
          if (-not $before) { Write-Warning "CLICK INCONCLUSIVE: main window has no size"; exit 0 }

          $root = [System.Windows.Automation.AutomationElement]::FromHandle($script:main)
          $cond = New-Object System.Windows.Automation.PropertyCondition(
                    [System.Windows.Automation.AutomationElement]::NameProperty, 'Wallpaper')
          # Retry: Chromium builds its UIA tree lazily, only once a client asks,
          # so the first query after attaching routinely finds nothing. One shot
          # reported "no element named Wallpaper" and proved nothing.
          $el = $null
          for ($t = 0; $t -lt 10 -and -not $el; $t++) {
            $el = $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $cond)
            if (-not $el) { Start-Sleep -Seconds 2 }
          }
          if (-not $el) {
            # Say what IS there, rather than only what is not. If the tree is
            # empty the webview never exposed itself; if it is full of other
            # names, the item is simply called something else.
            $all = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                     [System.Windows.Automation.Condition]::TrueCondition)
            Write-Host "UIA descendants: $($all.Count)"
            $shown = 0
            foreach ($e in $all) {
              if ($shown -ge 40) { break }
              $nm = $e.Current.Name
              if ($nm) { Write-Host "  '$nm'"; $shown++ }
            }
            Write-Warning "CLICK INCONCLUSIVE: no element named 'Wallpaper' after 20s"
            exit 0
          }
          Write-Host "found the Wallpaper item; invoking"
          try {
            $el.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          } catch {
            # Not every DOM node exposes Invoke; fall back to a real click on it.
            $p = $el.Current.BoundingRectangle
            [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(
              [int]($p.X + $p.Width/2), [int]($p.Y + $p.Height/2))
            Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;public class M{[DllImport("user32.dll")]public static extern void mouse_event(uint f,uint x,uint y,uint d,IntPtr e);}'
            [M]::mouse_event(0x0002,0,0,0,[IntPtr]::Zero); [M]::mouse_event(0x0004,0,0,0,[IntPtr]::Zero)
          }
          Start-Sleep -Seconds 5
          $after = Shot 'after'
          if (-not $after) { Write-Warning "CLICK INCONCLUSIVE: window vanished"; exit 0 }

          # Same size, so compare directly. A page change moves a lot of pixels;
          # a dead click moves almost none.
          $diff = 0; $n = 0
          for ($x = 4; $x -lt $before.Width - 4; $x += 11) {
            for ($y = 4; $y -lt $before.Height - 4; $y += 13) {
              $n++
              if ($before.GetPixel($x,$y).ToArgb() -ne $after.GetPixel($x,$y).ToArgb()) { $diff++ }
            }
          }
          $pct = if ($n) { [math]::Round($diff * 100 / $n) } else { 0 }
          Write-Host "pixels changed: $pct% ($diff of $n)"
          if ($pct -ge 8) { Write-Host "CLICK OK: the pane changed — Wallpaper responded" }
          else { Write-Warning "CLICK FAIL: the pane did not change — clicking Wallpaper did nothing" }
          $before.Dispose(); $after.Dispose()

      - name: Screenshot every window the app actually opened
        continue-on-error: true
        run: |
          Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;using System.Text;public class W{public delegate bool Cb(IntPtr h,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumWindows(Cb c,IntPtr l);[DllImport("user32.dll")]public static extern bool IsWindowVisible(IntPtr h);[DllImport("user32.dll")]public static extern int GetWindowThreadProcessId(IntPtr h,out int p);[DllImport("user32.dll",CharSet=CharSet.Unicode)]public static extern int GetWindowTextW(IntPtr h,StringBuilder s,int n);[DllImport("user32.dll")]public static extern bool SetForegroundWindow(IntPtr h);[DllImport("user32.dll")]public static extern bool ShowWindow(IntPtr h,int c);}'
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $pids = (Get-Process -Name "Terse" -ErrorAction SilentlyContinue | ForEach-Object { $_.Id })
          if (-not $pids) { Write-Host "no Terse process"; exit 0 }
          $found = New-Object System.Collections.ArrayList
          $cb = [W+Cb]{ param($h,$l)
            if ([W]::IsWindowVisible($h)) {
              $wpid = 0; [void][W]::GetWindowThreadProcessId($h, [ref]$wpid)
              if ($pids -contains $wpid) {
                $sb = New-Object System.Text.StringBuilder 512
                [void][W]::GetWindowTextW($h, $sb, 512)
                [void]$found.Add(@{ h = $h; t = $sb.ToString() })
              }
            }
            return $true }
          [void][W]::EnumWindows($cb, [IntPtr]::Zero)
          Write-Host "found $($found.Count) visible Terse window(s)"
          $i = 0
          foreach ($w in $found) {
            $i++
            [void][W]::ShowWindow($w.h, 9)   # SW_RESTORE
            [void][W]::SetForegroundWindow($w.h)
            Start-Sleep -Milliseconds 1500
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
            $safe = ($w.t -replace '[^\w\-]', '_'); if (-not $safe) { $safe = "untitled" }
            $bmp.Save("artifacts/window-$i-$safe.png")
            Write-Host "  [$i] '$($w.t)' -> window-$i-$safe.png"
            $g.Dispose(); $bmp.Dispose()
          }

      # Tauri EMBEDS the frontend in the binary, so there are no .html files on
      # disk to open. The checkout has the same sources that were embedded, so
      # render each one in Edge — the very engine WebView2 uses. This proves
      # layout, fonts, scrollbars and the new color-scheme on every page,
      # including pages the app never opens on its own. It does NOT prove
      # backend wiring: window.__TAURI__ is absent, so data-driven regions stay
      # empty. Those are covered by the real-window shots above.
      # The headless page-render step was deleted here.
      #
      # It screenshotted every .html with headless Edge as a diagnostic. Over
      # this session it produced three findings and all three were false - a
      # runaway render loop in room.html, then in every page, then in the
      # wallpaper - each one an artefact of the step breaking, and one of them
      # written up and handed on as a lead. It then hung three builds for an
      # hour apiece; timeout-minutes: 6 did not stop the last one, because the
      # runner could not reap the Edge children.
      #
      # Nothing downstream needed it: the real windows are photographed out of
      # the running app several steps below, which is where they are actually
      # composited. A diagnostic that only ever lied and now fails the build is
      # worse than no diagnostic.

      - name: Where did the wallpaper window land
        continue-on-error: true
        run: |
          # CharSet.Unicode is NOT optional. C# DllImport defaults to CharSet.Ansi,
          # so "Progman" was marshalled as ANSI into the WIDE entry point and never
          # matched - FindWindowExW returned 0 and the dump concluded the runner had
          # no Progman and no WorkerW at all. The giveaway was in its own output:
          # class='T' title='T' is "Terse" in UTF-16 read as ANSI and cut at the
          # first null byte. The Rust side uses w!() literals and was never affected.
          Add-Type -TypeDefinition @'
          using System;using System.Runtime.InteropServices;using System.Text;
          public class W {
            public delegate bool Cb(IntPtr h, IntPtr l);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindowExW(IntPtr p,IntPtr c,string cls,string t);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr h,Cb cb,IntPtr l);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassNameW(IntPtr h,StringBuilder s,int m);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowTextW(IntPtr h,StringBuilder s,int m);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h,out R r);
            [DllImport("user32.dll")] public static extern IntPtr GetWindowLongPtrW(IntPtr h,int i);
            [DllImport("user32.dll")] public static extern int GetWindowThreadProcessId(IntPtr h,out uint p);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [StructLayout(LayoutKind.Sequential)] public struct R { public int L,T,Rt,B; }
          }
          '@
          $tpids = @(Get-Process -Name "Terse" -ErrorAction SilentlyContinue | ForEach-Object { $_.Id })
          Write-Host "Terse pids: $($tpids -join ',')"
          function Dump([IntPtr]$host_, [string]$hostName) {
            $cb = [W+Cb]{
              param($h,$l)
              $p = 0; [void][W]::GetWindowThreadProcessId($h, [ref]$p)
              $cls = New-Object System.Text.StringBuilder 256
              [void][W]::GetClassNameW($h, $cls, 256)
              $mine = $tpids -contains $p
              if ($mine -or $cls.ToString() -eq 'SHELLDLL_DefView') {
                $t = New-Object System.Text.StringBuilder 256
                [void][W]::GetWindowTextW($h, $t, 256)
                $r = New-Object W+R
                [void][W]::GetWindowRect($h, [ref]$r)
                $st = [int64][W]::GetWindowLongPtrW($h, -16)
                $ex = [int64][W]::GetWindowLongPtrW($h, -20)
                $child = ($st -band 0x40000000) -ne 0
                $popup = ($st -band 0x80000000) -ne 0
                $tag = if ($mine) { 'TERSE' } else { 'shell' }
                Write-Host ("  [$tag] under ${hostName}: class='$($cls.ToString())' title='$($t.ToString())' " +
                            ("style=0x{0:X8} ex=0x{1:X8} WS_CHILD={2} WS_POPUP={3} visible={4} rect={5},{6} {7}x{8}" -f
                             $st,$ex,$child,$popup,[W]::IsWindowVisible($h),$r.L,$r.T,($r.Rt-$r.L),($r.B-$r.T)))
              }
              return $true
            }
            [void][W]::EnumChildWindows($host_, $cb, [IntPtr]::Zero)
          }
          $progman = [W]::FindWindowExW([IntPtr]::Zero,[IntPtr]::Zero,"Progman",$null)
          Write-Host "Progman = $progman"
          Dump $progman "Progman"
          $ww = [W]::FindWindowExW([IntPtr]::Zero,[IntPtr]::Zero,"WorkerW",$null)
          $n = 0
          while ($ww -ne [IntPtr]::Zero) {
            $n++
            $hasDef = [W]::FindWindowExW($ww,[IntPtr]::Zero,"SHELLDLL_DefView",$null) -ne [IntPtr]::Zero
            Write-Host "WorkerW #$n = $ww  hasDefView=$hasDef"
            Dump $ww "WorkerW#$n"
            $ww = [W]::FindWindowExW([IntPtr]::Zero,$ww,"WorkerW",$null)
          }
          Write-Host "total top-level WorkerW: $n"

      - name: Prove the wallpaper engine got its base image
        continue-on-error: true
        run: |
          $bg = Join-Path $env:USERPROFILE ".terse\wallpaper-bg.jpg"
          if (Test-Path $bg) {
            $f = Get-Item $bg
            Add-Type -AssemblyName System.Drawing
            $i = [System.Drawing.Image]::FromFile($f.FullName)
            Write-Host "WALLPAPER_BG OK: $($f.Length) bytes, $($i.Width)x$($i.Height)"
            $i.Dispose()
          } else {
            Write-Host "WALLPAPER_BG MISSING - source lookup or downscale failed"
          }
          # The wallpaper window is a WorkerW child with WS_EX_TOOLWINDOW, so it
          # never appears in the process window list. Minimising everything is
          # the only way to photograph it: what is left on screen IS the
          # wallpaper, which is also how we can tell the WorkerW re-parent and
          # the reposition after it actually worked.
          # MinimizeAll only touches windows that appear on the taskbar, and
          # every Terse window sets skip_taskbar(true) — so it left the Doctor
          # window sitting over the desktop and the "wallpaper" screenshot was
          # really a screenshot of the app. Hide each top-level Terse window
          # explicitly instead. The wallpaper window itself is a Progman/WorkerW
          # child, so EnumWindows never returns it and it stays visible.
          Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;public class H{public delegate bool Cb(IntPtr h,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumWindows(Cb c,IntPtr l);[DllImport("user32.dll")]public static extern bool IsWindowVisible(IntPtr h);[DllImport("user32.dll")]public static extern int GetWindowThreadProcessId(IntPtr h,out int p);[DllImport("user32.dll")]public static extern bool ShowWindow(IntPtr h,int c);[DllImport("user32.dll",CharSet=CharSet.Unicode)]public static extern int GetClassNameW(IntPtr h,System.Text.StringBuilder s,int n);}'
          # Do NOT hide the Terse windows — they are the point of the shot. Only
          # the runner's own console is in the way, so minimise everything that
          # is not Terse and not the shell. The result shows the live wallpaper
          # AND the app sitting on it, which is what the desktop actually looks
          # like.
          $tpids = (Get-Process -Name "Terse" -ErrorAction SilentlyContinue | ForEach-Object { $_.Id })
          $keep = @('Progman','WorkerW','Shell_TrayWnd','Windows.UI.Core.CoreWindow')
          $mini = 0
          $mcb = [H+Cb]{ param($h,$l)
            if ([H]::IsWindowVisible($h)) {
              $cls = New-Object System.Text.StringBuilder 256
              [void][H]::GetClassNameW($h, $cls, 256)
              $wpid = 0; [void][H]::GetWindowThreadProcessId($h, [ref]$wpid)
              if (($keep -notcontains $cls.ToString()) -and ($tpids -notcontains $wpid)) {
                [void][H]::ShowWindow($h, 6); $script:mini++   # SW_MINIMIZE
              }
            }
            return $true }
          [void][H]::EnumWindows($mcb, [IntPtr]::Zero)
          Write-Host "minimised $mini other window(s)"
          Start-Sleep -Seconds 6
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b2 = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp2 = New-Object System.Drawing.Bitmap $b2.Width, $b2.Height
          $g2 = [System.Drawing.Graphics]::FromImage($bmp2)
          $g2.CopyFromScreen($b2.X, $b2.Y, 0, 0, $bmp2.Size)
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bmp2.Save("artifacts/terse-windows-desktop.png")
          Write-Host "desktop screenshot saved"

      # Capture the wallpaper window ITSELF, not the desktop it sits on. It is a
      # Progman/WorkerW child, so it is always underneath every app window and a
      # desktop screenshot can only ever show whatever slice is not covered.
      # PrintWindow with PW_RENDERFULLCONTENT renders a window's own content even
      # when it is fully obscured, which is the only way to photograph the
      # particle field on a machine that also has the app open.
      - name: Photograph the live wallpaper itself
        continue-on-error: true
        run: |
          Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;using System.Text;public class P{public delegate bool Cb(IntPtr h,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumWindows(Cb c,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumChildWindows(IntPtr p,Cb c,IntPtr l);[DllImport("user32.dll",CharSet=CharSet.Unicode)]public static extern int GetWindowTextW(IntPtr h,StringBuilder s,int n);[DllImport("user32.dll")]public static extern bool GetWindowRect(IntPtr h,out R r);[DllImport("user32.dll")]public static extern bool PrintWindow(IntPtr h,IntPtr dc,uint f);public struct R{public int L,T,Rr,B;}}'
          Add-Type -AssemblyName System.Drawing
          # $script: on BOTH the variable and the recursive reference.
          #
          # As a plain $scan the delegate could not resolve itself at call time,
          # so the EnumChildWindows recursion silently did nothing and only
          # top-level windows were ever searched. That went unnoticed while the
          # wallpaper was still a top-level window; now that pinning makes it
          # WS_CHILD under WorkerW - EnumWindows does not report child windows at
          # all - the same capture reported WALLPAPER WINDOW NOT FOUND while the
          # style dump three steps earlier had it right there, visible and
          # correctly parented.
          $script:target = [IntPtr]::Zero
          $script:scan = [P+Cb]{ param($h,$l)
            $sb = New-Object System.Text.StringBuilder 256
            [void][P]::GetWindowTextW($h, $sb, 256)
            if ($sb.ToString() -eq 'Terse Wallpaper') { $script:target = $h; return $false }
            [void][P]::EnumChildWindows($h, $script:scan, [IntPtr]::Zero)
            return $true }
          [void][P]::EnumWindows($script:scan, [IntPtr]::Zero)
          $target = $script:target
          if ($target -eq [IntPtr]::Zero) {
            Write-Host 'not found among top-level windows - walking the shell hosts'
            Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;public class F{[DllImport("user32.dll",CharSet=CharSet.Unicode)]public static extern IntPtr FindWindowExW(IntPtr p,IntPtr c,string cls,string t);}'
            $hosts = @([F]::FindWindowExW([IntPtr]::Zero,[IntPtr]::Zero,"Progman",$null))
            $w = [F]::FindWindowExW([IntPtr]::Zero,[IntPtr]::Zero,"WorkerW",$null)
            while ($w -ne [IntPtr]::Zero) { $hosts += $w; $w = [F]::FindWindowExW([IntPtr]::Zero,$w,"WorkerW",$null) }
            foreach ($hh in $hosts) {
              if ($script:target -ne [IntPtr]::Zero) { break }
              [void][P]::EnumChildWindows($hh, $script:scan, [IntPtr]::Zero)
            }
            $target = $script:target
          }
          if ($target -eq [IntPtr]::Zero) { Write-Host 'WALLPAPER WINDOW NOT FOUND'; exit 0 }
          Write-Host "wallpaper hwnd found: $target"
          $r = New-Object P+R
          [void][P]::GetWindowRect($target, [ref]$r)
          $w = $r.Rr - $r.L; $h2 = $r.B - $r.T
          Write-Host "wallpaper window found: ${w}x${h2} at $($r.L),$($r.T)"
          if ($w -le 0 -or $h2 -le 0) { Write-Host 'zero-sized - not drawing'; exit 0 }
          $bmp = New-Object System.Drawing.Bitmap $w, $h2
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $hdc = $g.GetHdc()
          $ok = [P]::PrintWindow($target, $hdc, 2)   # PW_RENDERFULLCONTENT
          $g.ReleaseHdc($hdc)
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bmp.Save("artifacts/wallpaper-window.png")
          Write-Host "PrintWindow ok=$ok -> artifacts/wallpaper-window.png"
          $g.Dispose(); $bmp.Dispose()

          # ── Burst, to catch the particle glyphs ────────────────────────────
          # The stat text (the numbers and agent lines that particles gather
          # into) is on a 12s rotation with a 2.22s envelope - G_IN 420 +
          # G_HOLD 1100 + G_OUT 700 in mineradio-wallpaper.js. So ONE frame has
          # roughly an 18% chance of landing on a glyph, and a frame without one
          # proves nothing at all. 20 frames at 1.2s spacing covers two full
          # rotations, so at least one glyph must appear if the pipeline works.
          Write-Host "burst: 20 frames over 24s to catch the glyph rotation"
          for ($i = 1; $i -le 20; $i++) {
            Start-Sleep -Milliseconds 1200
            try {
              $b = New-Object System.Drawing.Bitmap $w, $h2
              $gg = [System.Drawing.Graphics]::FromImage($b)
              $dc = $gg.GetHdc()
              [void][P]::PrintWindow($target, $dc, 2)
              $gg.ReleaseHdc($dc)
              $b.Save(("artifacts/wallpaper-frame-{0:D2}.png" -f $i))
              $gg.Dispose(); $b.Dispose()
            } catch { Write-Host "frame $i failed: $_" }
          }
          Write-Host "burst done"

          # Is anything actually MOVING? The burst existed to catch a glyph, but
          # nothing ever checked that the frames differ - so twenty pictures of a
          # dead page looked exactly like twenty pictures of a working one, and
          # four rounds of diagnosis were made from them. All twenty frames were
          # byte-identical to each other AND to the previous run's, across three
          # different commits. A live particle field cannot do that.
          $hashes = Get-ChildItem "artifacts/wallpaper-frame-*.png" |
            ForEach-Object { (Get-FileHash $_.FullName -Algorithm MD5).Hash }
          $distinct = ($hashes | Sort-Object -Unique).Count
          Write-Host "frame liveness: $distinct distinct frames out of $($hashes.Count)"
          if ($distinct -le 1) {
            Write-Warning "WALLPAPER FROZEN: every frame is identical - the page is not rendering. Any conclusion drawn from these pictures is worthless; read wallpaper.log instead."
          } else {
            Write-Host "WALLPAPER LIVE: the field is animating"
          }

      # The ghost titlebar is intermittent - two runs of IDENTICAL app code
      # disagreed about whether the island had one. So a single frame is a coin
      # flip here too, exactly as it was for the wallpaper glyphs. Burst the
      # island and Doctor, and crop the top-left corner where the ghost paints,
      # so the sequence shows whether the flush erases it and WHEN.
      - name: Burst the island and Doctor corners
        continue-on-error: true
        run: |
          Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;using System.Text;public class Q{public delegate bool Cb(IntPtr h,IntPtr l);[DllImport("user32.dll")]public static extern bool EnumWindows(Cb c,IntPtr l);[DllImport("user32.dll",CharSet=CharSet.Unicode)]public static extern int GetWindowTextW(IntPtr h,StringBuilder s,int n);[DllImport("user32.dll")]public static extern bool GetWindowRect(IntPtr h,out R r);[DllImport("user32.dll")]public static extern bool PrintWindow(IntPtr h,IntPtr dc,uint f);[DllImport("user32.dll")]public static extern bool IsWindowVisible(IntPtr h);public struct R{public int L,T,Rr,B;}}'
          Add-Type -AssemblyName System.Drawing
          $wins = @{}
          $scan = [Q+Cb]{ param($h,$l)
            if ([Q]::IsWindowVisible($h)) {
              $sb = New-Object System.Text.StringBuilder 256
              [void][Q]::GetWindowTextW($h, $sb, 256)
              $t = $sb.ToString()
              if ($t -eq 'Terse Island' -or $t -eq 'Terse Doctor' -or $t -eq 'Terse') {
                if (-not $wins.ContainsKey($t)) { $wins[$t] = $h }
              }
            }
            return $true }
          [void][Q]::EnumWindows($scan, [IntPtr]::Zero)
          Write-Host "windows to burst: $($wins.Keys -join ', ')"
          if ($wins.Count -eq 0) { Write-Host 'NONE FOUND'; exit 0 }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          foreach ($name in $wins.Keys) {
            $hw = $wins[$name]
            $safe = $name -replace '[^A-Za-z0-9]','_'
            for ($i = 1; $i -le 8; $i++) {
              try {
                $r = New-Object Q+R
                [void][Q]::GetWindowRect($hw, [ref]$r)
                $w = $r.Rr - $r.L; $h2 = $r.B - $r.T
                if ($w -le 0 -or $h2 -le 0) { break }
                $b = New-Object System.Drawing.Bitmap $w, $h2
                $gg = [System.Drawing.Graphics]::FromImage($b)
                $dc = $gg.GetHdc()
                [void][Q]::PrintWindow($hw, $dc, 2)
                $gg.ReleaseHdc($dc)
                # Crop the top-left corner, blown up 4x - that is the only place
                # the ghost caption paints, and full-window shots make it easy to
                # miss against dark content (it was called "cleared" on the
                # Doctor window once on exactly that basis).
                $cw = [Math]::Min(420, $w); $ch = [Math]::Min(46, $h2)
                $crop = New-Object System.Drawing.Bitmap ($cw*4), ($ch*4)
                $cg = [System.Drawing.Graphics]::FromImage($crop)
                $cg.InterpolationMode = 'NearestNeighbor'
                $cg.DrawImage($b, (New-Object System.Drawing.Rectangle 0,0,($cw*4),($ch*4)), (New-Object System.Drawing.Rectangle 0,0,$cw,$ch), 'Pixel')
                $crop.Save(("artifacts/ghost-{0}-{1:D2}.png" -f $safe, $i))
                $cg.Dispose(); $crop.Dispose(); $gg.Dispose(); $b.Dispose()
              } catch { Write-Host "$name frame $i failed: $_" }
              Start-Sleep -Milliseconds 900
            }
          }
          Write-Host "ghost burst done"

      - name: Collect the app's own logs
        continue-on-error: true
        run: |
          $log = Join-Path $env:USERPROFILE ".terse"
          if (Test-Path $log) {
            New-Item -ItemType Directory -Force -Path artifacts | Out-Null
            Copy-Item -Recurse -Force $log artifacts/dot-terse
            Get-ChildItem -Recurse artifacts/dot-terse | Select-Object FullName, Length
          } else { Write-Host "no ~/.terse yet" }

      # LAST, because it restarts the app.
      #
      # This lived inside the measure step and killed Terse mid-smoke-test: step
      # 30 then hung for an hour against an app that had been restarted with a
      # different config, the job was cancelled, and the logs were never even
      # written - the verdict it existed to produce was lost with them. Nothing
      # runs after this now, so a restart costs nobody anything.
      # Prove the Pro overlay with a picture, not with flags.
      #
      # Everything about this feature is claims until someone opens a window and
      # looks: the point is that particles stay visible ON TOP of it. So put a
      # maximised window on screen and photograph the desktop. If the wallpaper's
      # HUD and glyphs are in that shot, they are above the window; if the shot is
      # just the other window, they are not.
      #
      # Runs LAST because it restarts the app with a different config and leaves
      # the wallpaper covering the screen - nothing after it would be photograph-
      # able.
      - name: Prove the always-on-top wallpaper with a screenshot
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          Get-Process -Name Terse -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 4
          $wj = Join-Path $env:USERPROFILE ".terse\wallpaper.json"
          '{"enabled":true,"overlay":true,"engine":"cinematic","theme":"neon","quality":56,"angle":55,"intensity":1.0}' |
            Set-Content $wj -Encoding ascii
          Write-Host "wallpaper.json: overlay=true"
          Start-Process -FilePath "$env:TERSE_EXE"
          Start-Sleep -Seconds 50

          # Something opaque and full-screen to sit under the overlay.
          $np = Start-Process notepad -PassThru
          Start-Sleep -Seconds 3
          Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;public class W2{[DllImport("user32.dll")]public static extern bool ShowWindow(IntPtr h,int c);[DllImport("user32.dll")]public static extern bool SetForegroundWindow(IntPtr h);}'
          if ($np.MainWindowHandle -ne [IntPtr]::Zero) {
            [void][W2]::ShowWindow($np.MainWindowHandle, 3)   # SW_MAXIMIZE
            [void][W2]::SetForegroundWindow($np.MainWindowHandle)
          }
          Start-Sleep -Seconds 6
          # If Notepad never opened there is nothing for the overlay to cover and
          # a pass would mean nothing.
          $npAlive = $null -ne (Get-Process -Id $np.Id -ErrorAction SilentlyContinue)
          Write-Host "notepad running: $npAlive  hwnd: $($np.MainWindowHandle)"

          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bmp.Save("artifacts/overlay-over-notepad.png")
          Write-Host "saved artifacts/overlay-over-notepad.png ($($b.Width)x$($b.Height))"
          # What did the page's Pro gate actually see? overlayOK() needs
          # proOK !== false, and proOK is whatever get_license returned.
          $ll = Join-Path $env:USERPROFILE ".terse\license.log"
          if (Test-Path $ll) { Get-Content $ll -Tail 3 | ForEach-Object { Write-Host "  $_" } }
          else { Write-Host "  (no license.log — get_license was never called)" }
          # The two halves of this feature, each reporting itself. A screenshot of
          # a black screen cannot tell "the page painted its background" from "the
          # page went transparent and the compositor painted black"; these lines
          # can - overlay_allowed prints its three inputs, and the page prints its
          # computed background.
          $wl = Join-Path $env:USERPROFILE ".terse\wallpaper.log"
          if (Test-Path $wl) { Get-Content $wl -Tail 12 | ForEach-Object { Write-Host "  $_" } }
          else { Write-Host "  (no wallpaper.log — neither half reported)" }

          # Count NEAR-WHITE pixels across the screen.
          #
          # This criterion has been wrong twice, in opposite directions, and both
          # times it agreed with whatever the build was already doing.
          #
          # The point of the feature is that the overlay is TRANSPARENT. A
          # maximised Notepad under a working overlay is still a white sheet you
          # can read - particles float over it. So "almost no white" does not
          # mean success; it means the overlay is opaque and has covered the
          # screen, which is the exact bug. The previous version printed
          # "OVERLAY OK" at 0% white while the artifact was a solid black sheet.
          #
          # Success needs BOTH halves, because either alone is satisfied by a
          # failure:
          #   · most of the screen near-white  -> you can still see through it
          #   · the HUD corner dark            -> the wallpaper is drawn on top
          # A window merely sitting on top gives the first without the second; a
          # dead page painting its own background gives the second without the
          # first.
          $white = 0; $tot = 0
          for ($x = 8; $x -lt $b.Width - 8; $x += 17) {
            for ($y = 8; $y -lt $b.Height - 8; $y += 19) {
              $tot++
              $p2 = $bmp.GetPixel($x, $y)
              if ($p2.R -gt 235 -and $p2.G -gt 235 -and $p2.B -gt 235) { $white++ }
            }
          }
          $wpct = if ($tot) { [math]::Round($white * 100 / $tot) } else { 0 }
          # The HUD card sits at left:30px bottom:30px, 230px wide - sample well
          # inside it.
          #
          # RELATIVE to the page behind it, not against a fixed threshold. The
          # card is rgba(10,12,20,.30) glass: 30% opaque, so over a white Notepad
          # it reads light grey (~181) and an absolute "is it dark" test calls a
          # working overlay a failure. This step's own comment warned about that
          # exact mistake and the check made it again anyway. What actually
          # identifies the card is that it is meaningfully DARKER than the sheet
          # around it.
          $ref = $bmp.GetPixel([int]($b.Width * 0.75), [int]($b.Height * 0.25))
          $hud = $bmp.GetPixel(80, $b.Height - 90)
          $hudLum = ($hud.R + $hud.G + $hud.B) / 3
          $refLum = ($ref.R + $ref.G + $ref.B) / 3
          $hudDark = ($refLum - $hudLum) -gt 25
          Write-Host "near-white pixels: $wpct% ($white of $tot)"
          Write-Host ("HUD sample at 80,{0}: R={1} G={2} B={3} lum={4:N0} vs page lum={5:N0} (darker by {6:N0}, need 25)" -f ($b.Height - 90), $hud.R, $hud.G, $hud.B, $hudLum, $refLum, ($refLum - $hudLum))
          if ($wpct -ge 55 -and $hudDark) {
            Write-Host "OVERLAY OK: Notepad is still readable underneath and the wallpaper is drawn over it"
          } elseif ($wpct -lt 55 -and $hudDark) {
            Write-Warning "OVERLAY FAIL: the overlay is OPAQUE - it has covered the screen instead of floating over it"
          } else {
            Write-Warning "OVERLAY FAIL: the wallpaper is not on top at all (white $wpct%, HUD not found)"
          }
          $g.Dispose(); $bmp.Dispose()
          try { $np | Stop-Process -Force } catch {}

      # A SECOND collection, because the first one runs before the overlay step
      # restarts the app - so every log written during the overlay test was
      # missing from the artifact, and the only evidence left was the picture.
      # That is the whole reason this feature was diagnosed wrong four times.
      - name: Collect the app's logs again, after the overlay test
        continue-on-error: true
        run: |
          $log = Join-Path $env:USERPROFILE ".terse"
          if (Test-Path $log) {
            New-Item -ItemType Directory -Force -Path artifacts | Out-Null
            Copy-Item -Recurse -Force $log artifacts/dot-terse-after-overlay
            Get-ChildItem -Recurse artifacts/dot-terse-after-overlay | Select-Object FullName, Length
          } else { Write-Host "no ~/.terse" }

      - name: A/B the wallpaper against idle CPU
        continue-on-error: true
        run: |
          # A/B against the wallpaper, because the pid->window join cannot work.
          #
          # WebView2 renderers do not own their windows - the host Terse.exe does -
          # so GetWindowThreadProcessId reports every renderer as "(no window)"
          # and can never name the hot one. Restarting without the wallpaper can:
          # if the 380%+ renderer disappears, it was the wallpaper; if it is still
          # there, it is something that would burn on any machine and the GPU-less
          # runner was a red herring.
          Write-Host ""
          Write-Host "=== A/B: same build, wallpaper OFF ==="
          Get-Process -Name Terse -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 4
          $wj = Join-Path $env:USERPROFILE ".terse\wallpaper.json"
          '{"enabled":false,"engine":"cinematic","theme":"neon","quality":56,"angle":55,"intensity":1.0}' |
            Set-Content $wj -Encoding ascii
          Start-Process -FilePath "$env:TERSE_EXE"
          Start-Sleep -Seconds 45
          $b2 = @{}
          foreach ($p in Get-Process -Name msedgewebview2, Terse -ErrorAction SilentlyContinue) { $b2[$p.Id] = $p.CPU }
          Start-Sleep -Seconds 15
          $rows = Get-Process -Name msedgewebview2, Terse -ErrorAction SilentlyContinue |
            ForEach-Object {
              $d = $_.CPU - $(if ($b2.ContainsKey($_.Id)) { $b2[$_.Id] } else { 0 })
              [pscustomobject]@{ Pid=$_.Id; D=[math]::Round($d,1); P=[math]::Round($d/15*100); MB=[math]::Round($_.WorkingSet64/1MB) }
            } | Sort-Object D -Descending
          $rows | Select-Object -First 6 | ForEach-Object { "  pid {0,-6} {1,6}s {2,5}% {3,6} MB" -f $_.Pid, $_.D, $_.P, $_.MB }
          $peak = ($rows | Select-Object -First 1).P
          $tot  = ($rows | Measure-Object MB -Sum).Sum
          Write-Host ("WALLPAPER-OFF peak {0}%  total {1:N0} MB  procs {2}" -f $peak, $tot, $rows.Count)
          if ($peak -lt 80) {
            Write-Host "VERDICT: the hot renderer was the WALLPAPER (software rasterisation, no GPU on this runner)"
          } else {
            Write-Warning "VERDICT: still hot without the wallpaper - this is NOT the wallpaper and would burn on real hardware too"
          }


      - name: Upload the evidence
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-test
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 14
