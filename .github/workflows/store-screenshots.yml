name: Store screenshots (Windows)

# Microsoft Store policy 10.1.1.3 (cert reports 09-18 AND 09-21): listing
# screenshots must be direct captures of the product running on Windows.
# The 09-21 failure is why v6 exists: v5's frames were direct captures, but they
# minimized every window to leave the wallpaper as the subject, so what a
# reviewer saw was a Windows desktop. Every v6 frame shows the app's own UI.
#
# This takes the exact Terse.msix built by "Build Windows Store package (MSIX)",
# unpacks it on a fresh Windows runner, runs it, and photographs the screen.
# Nothing is composited.
#
# Staging, and nothing else:
#  - the runner's own console is minimized and its desktop icons hidden;
#  - the wallpaper is switched on the way a user switches it on (wallpaper.json);
#  - the info stream starts with no auto-added sources, so the runner's console
#    title doesn't become the wallpaper's headline;
#  - the Pro scenes run with a local test license (tier "pro") — the same local
#    file a paying user's machine holds. The wallpaper page checks entitlement
#    where it draws, so Pro styles only render because this says Pro. Those
#    shots are captioned as Pro in the listing.
#
# Runs on its own so retaking photos never costs a rebuild of a verified package.
on:
  push:
    branches: [store/submission-2]
    paths: ['.github/workflows/store-screenshots.yml']
  workflow_dispatch:
    inputs:
      msix_run_id:
        description: 'Build run whose Terse.msix to photograph (defaults to MSIX_RUN_ID)'
        required: false

permissions:
  actions: read
  contents: read

env:
  # The build run whose Terse.msix goes to the Store — screenshots must come from
  # the package that is actually submitted. This is 1.3.5.0 (Pals out of the Store
  # build, the main-thread window deadlock fixed).
  MSIX_RUN_ID: '35689313101'

jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Fetch the submitted MSIX
        uses: actions/download-artifact@v4
        with:
          name: Terse-MSIX
          run-id: ${{ inputs.msix_run_id || env.MSIX_RUN_ID }}
          github-token: ${{ github.token }}
          path: msix

      - name: Unpack it (an MSIX is a zip)
        run: |
          Copy-Item msix\Terse.msix msix\Terse.zip
          Expand-Archive msix\Terse.zip -DestinationPath app -Force
          Select-String -Path app\AppxManifest.xml -Pattern 'Version="[^"]+"' | Select-Object -First 1 | ForEach-Object { $_.Matches[0].Value }

      - name: Capture
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop }
          catch { Write-Host "::warning::Set-DisplayResolution failed: $_" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)]
            public static extern bool SystemParametersInfoW(uint a, uint b, string c, uint d);
          }
          "@

          $out = "$env:RUNNER_TEMP\shots"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $home2 = "$env:USERPROFILE\.terse"
          New-Item -ItemType Directory -Force -Path $home2 | Out-Null
          $app = (Resolve-Path app).Path

          # Where the app's own window was when the shutter went. The frames are
          # full-screen, and the listing wants the product filling them, so the
          # crop happens afterwards from these numbers — guessing the window out
          # of the pixels does not work when the UI is glass over a wallpaper.
          function MainRect {
            $A = [System.Windows.Automation.AutomationElement]
            $procs = @(Get-Process Terse -ErrorAction SilentlyContinue | ForEach-Object Id)
            foreach ($w in $A::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)) {
              if ($procs -notcontains $w.Current.ProcessId) { continue }
              if ($w.Current.Name -match 'Island|Pill|Wallpaper') { continue }
              $r = $w.Current.BoundingRectangle
              if ($r.Width -gt 200 -and $r.Height -gt 150) { return $r }
            }
            return $null
          }

          function Snap([string]$name) {
            [W]::SetCursorPos(1919, 1079) | Out-Null
            $mr = MainRect
            if ($mr) { "$name,$([int]$mr.X),$([int]$mr.Y),$([int]$mr.Width),$([int]$mr.Height)" | Add-Content "$out\rects.csv" -Encoding UTF8 }
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$out\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Write-Host "$name.png  $($b.Width)x$($b.Height)"
          }
          function Keys([string]$k) { [System.Windows.Forms.SendKeys]::SendWait($k) }

          # Press a button by its accessible name, wherever its window landed.
          function Press([string]$rx) {
            $A = [System.Windows.Automation.AutomationElement]
            $procs = @(Get-Process Terse -ErrorAction SilentlyContinue | ForEach-Object Id)
            $cond = New-Object System.Windows.Automation.PropertyCondition($A::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)
            foreach ($w in $A::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)) {
              if ($procs -notcontains $w.Current.ProcessId) { continue }
              foreach ($b in $w.FindAll([System.Windows.Automation.TreeScope]::Descendants, $cond)) {
                if ($b.Current.Name -match $rx -and -not $b.Current.IsOffscreen) {
                  Write-Host "press: '$($b.Current.Name)' in '$($w.Current.Name)'"
                  try { $b.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); return $true } catch { Write-Host "  invoke failed: $_" }
                }
              }
            }
            return $false
          }
          # Poll: right after launch the WebView's accessibility tree isn't
          # there yet. "Start free trial" is deliberately NOT in the pattern.
          # Walk the onboarding to the end. "Run Scan" is in the pattern because
          # the first screen scans before it offers Continue, and v6 sat on that
          # screen for the whole run pressing nothing. "Start free trial" is
          # deliberately NOT in the pattern.
          function Onboard([int]$waitSec = 150) {
            $deadline = (Get-Date).AddSeconds($waitSec); $pressed = 0
            while ((Get-Date) -lt $deadline -and $pressed -lt 12) {
              if (Press '^(Run Scan|PREVIEW ISSUES|Continue|Done|Got it|Skip|Finish|Watch these agents|Let.s go|Clean up now|.. Clean up now|Start using Terse)') {
                $pressed++; Start-Sleep -Seconds 8
              } else { Start-Sleep -Seconds 4 }
            }
            # The last card's button. Until it is pressed the whole flow sits on
            # top of the app: v8 photographed "You're all set." over the
            # dashboard, and every sidebar press after it missed.
            foreach ($i in 1..4) {
              if (Press 'Start using Terse') { Start-Sleep -Seconds 6 } else { break }
            }
            # The 7-step guided tour starts the moment the shell appears and
            # parks a card over the middle of the window — v9 caught it in every
            # frame. Skip dismisses it for good (it only ever runs once).
            foreach ($i in 1..3) {
              if (Press '^Skip$') { Start-Sleep -Seconds 4 } else { break }
            }
            Write-Host "onboard: pressed $pressed"
            Dump 'after-onboard'
          }
          # Windows' own dialogs must not be in the frame. The runner pops
          # "System Properties — Windows created a temporary paging file" a
          # minute or two in, and v6 photographed it sitting on top of the app.
          function CloseStrays {
            $A = [System.Windows.Automation.AutomationElement]
            $procs = @(Get-Process Terse -ErrorAction SilentlyContinue | ForEach-Object Id)
            foreach ($w in $A::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)) {
              if ($procs -contains $w.Current.ProcessId) { continue }
              $n = $w.Current.Name
              if ($n -notmatch 'System Properties|Error|Warning|paging file|\.exe') { continue }
              try {
                $w.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern).Close()
                Write-Host "closed stray: '$n'"
              } catch { Write-Host "  stray '$n': $_" }
            }
          }

          # Bring the main window forward and put it where the shot wants it.
          # Cert 09-21 failed the listing again under 10.1.1.3: v5 minimized every
          # window and photographed the wallpaper, so the frames read as a Windows
          # desktop rather than as the product. Every v6 frame has the app's own
          # window in it.
          function Front([int]$x = 120, [int]$y = 90) {
            $A = [System.Windows.Automation.AutomationElement]
            $procs = @(Get-Process Terse -ErrorAction SilentlyContinue | ForEach-Object Id)
            foreach ($w in $A::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)) {
              if ($procs -notcontains $w.Current.ProcessId) { continue }
              $n = $w.Current.Name
              if ($n -match 'Island|Pill|Wallpaper') { continue }
              try {
                $wp = $w.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern)
                $wp.SetWindowVisualState([System.Windows.Automation.WindowVisualState]::Normal)
                $tp = $w.GetCurrentPattern([System.Windows.Automation.TransformPattern]::Pattern)
                # NOT resized. Growing the window to 1560x920 left the webview
                # painting at its old size with a white band beside it, in every
                # frame of that run. The window keeps the size a user gets, and
                # the crop takes a little of the dark desktop with it.
                if ($tp.Current.CanMove) {
                  # Keep it wholly on screen: v6 moved a 1400px-wide window to
                  # x=980 and half of the app hung off the right edge.
                  $r0 = $w.Current.BoundingRectangle
                  $x = [Math]::Max(0, [Math]::Min($x, 1920 - [int]$r0.Width - 16))
                  $y = [Math]::Max(0, [Math]::Min($y, 1030 - [int]$r0.Height - 16))
                  $tp.Move($x, $y)
                }
                $w.SetFocus()
                $r = $w.Current.BoundingRectangle
                Write-Host "front: '$n' at $([int]$r.X),$([int]$r.Y) $([int]$r.Width)x$([int]$r.Height)"
                return $true
              } catch { Write-Host "  front skip '$n': $_" }
            }
            Write-Host "front: no main window found"
            return $false
          }

          # Every button the app is showing right now, by accessible name. Two
          # capture rounds were spent guessing at these; the log ends that.
          function Dump([string]$tag) {
            $A = [System.Windows.Automation.AutomationElement]
            $procs = @(Get-Process Terse -ErrorAction SilentlyContinue | ForEach-Object Id)
            $cond = New-Object System.Windows.Automation.PropertyCondition($A::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)
            $lines = @("== $tag ==")
            foreach ($w in $A::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)) {
              if ($procs -notcontains $w.Current.ProcessId) { continue }
              $lines += "  window '$($w.Current.Name)'"
              foreach ($b in $w.FindAll([System.Windows.Automation.TreeScope]::Descendants, $cond)) {
                if ($b.Current.IsOffscreen) { continue }
                $lines += "    button '$($b.Current.Name)'"
              }
            }
            $lines | Add-Content "$out\ui-names.log" -Encoding UTF8
          }

          # Open a page from the sidebar, let it settle, photograph it.
          function Page([string]$file, [string]$rx, [int]$settle = 8) {
            # Some pages (Wallpaper, Code Town) take over the whole window and
            # leave only "Back" — v9 shot the wallpaper page and then had no
            # sidebar to press for the four pages after it.
            foreach ($i in 1..2) {
              if (Press '^Back$') { Start-Sleep -Seconds 3 } else { break }
            }
            if (-not (Press $rx)) { Write-Host "::warning::no button matched '$rx'"; Dump "miss-$file"; return }
            Start-Sleep -Seconds $settle
            Press '^Skip$' | Out-Null
            CloseStrays
            Front | Out-Null
            Start-Sleep -Seconds 2
            Snap $file
            Dump $file
          }

          function WallpaperOff {
            @{ enabled = $false } | ConvertTo-Json | Set-Content "$home2\wallpaper.json" -Encoding UTF8
          }
          function Wallpaper([string]$engine, [string]$style, [bool]$view3d) {
            @{
              enabled = $true; engine = $engine; style = $style
              view3d = @{ on = $view3d; az = 0.55; el = 0.28; dist = 1.0; dim = $false }
              theme = 'neon'; quality = 56; angle = 55; intensity = 1.0
            } | ConvertTo-Json -Depth 4 | Set-Content "$home2\wallpaper.json" -Encoding UTF8
          }
          # A signed-in machine, the way a signed-in machine looks: the app reads
          # ~/.terse/auth.json at boot (license.rs AuthState::load). Without it the
          # app stops at the sign-in gate, which is why v5 could only photograph
          # the wallpaper — v6 proved it, its ui-names.log shows the onboarding
          # screen and nothing else for every page it tried to open. graceStart is
          # the app's own 15-minute "try it first" window, so the paywall stays out
          # of the frame the same way it would for a new user.
          function Auth {
            @{ clerkUserId = 'user_store_capture'; email = 'store-capture@terseai.org'
               firstName = 'Terse'; imageUrl = $null; signedIn = $true
               graceStart = (Get-Date).ToUniversalTime().ToString('o') } |
              ConvertTo-Json -Depth 4 | Set-Content "$home2\auth.json" -Encoding UTF8
          }
          function License([bool]$pro) {
            if ($pro) {
              @{ tier = 'pro'; status = 'active'; clerkUserId = $null; expiresAt = $null; trialEnd = $null
                 limits = @{ optimizations_per_week = -1; max_sessions = 3; max_devices = 2 } } |
                ConvertTo-Json -Depth 4 | Set-Content "$home2\license.json" -Encoding UTF8
            } else { Remove-Item "$home2\license.json" -ErrorAction SilentlyContinue }
          }
          $script:p = $null
          function Launch([int]$settle) {
            # A fresh grace window each launch. It is 15 minutes long and a
            # capture run is longer, so the later frames came back with the
            # paywall panel across them.
            Auth
            $script:p = Start-Process -FilePath "$app\Terse.exe" -WorkingDirectory $app -PassThru
            Start-Sleep -Seconds $settle
          }
          function Quit {
            if ($script:p) { Stop-Process -Id $script:p.Id -Force -ErrorAction SilentlyContinue }
            Get-Process terse-uia, Terse -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 4
          }

          # ── A sample agent session (captioned "sample session" in the listing) ──
          # The runner runs no real agent, so the wallpaper's agent text never
          # forms. This writes a Claude Code-format transcript, keeps appending a
          # step every few seconds (so tok/min is live), and runs a placeholder
          # process named "claude" so the monitor sees a running agent. Terse's
          # real parser and renderer do the rest.
          function DemoSession {
            $proj = "$env:USERPROFILE\.claude\projects\C--Users-runneradmin-web-app"
            New-Item -ItemType Directory -Force -Path $proj | Out-Null
            $f = "$proj\sample-session.jsonl"
            Remove-Item $f -ErrorAction SilentlyContinue
            Copy-Item "$env:WINDIR\System32\timeout.exe" "$env:RUNNER_TEMP\claude.exe" -Force
            $script:claudeProc = Start-Process "$env:RUNNER_TEMP\claude.exe" -ArgumentList '/t','3000','/nobreak' -WindowStyle Hidden -PassThru
            $script:demoJob = Start-Job -ArgumentList $f -ScriptBlock {
              param($f)
              $cwd = 'C:\Users\runneradmin\web-app'
              $steps = @(
                @{ t='text'; v='Add a dark-mode toggle to the settings page' ; role='user' },
                @{ t='tool'; n='Read';  i=@{ file_path='src/pages/Settings.tsx' } },
                @{ t='tool'; n='Grep';  i=@{ pattern='theme'; path='src' } },
                @{ t='text'; v='The theme lives in ThemeContext. I will add a toggle bound to it.' },
                @{ t='tool'; n='Edit';  i=@{ file_path='src/pages/Settings.tsx' } },
                @{ t='tool'; n='Edit';  i=@{ file_path='src/theme/ThemeContext.tsx' } },
                @{ t='tool'; n='Bash';  i=@{ command='npm test -- settings' } },
                @{ t='text'; v='Tests pass. The toggle persists the choice in localStorage.' },
                @{ t='tool'; n='Read';  i=@{ file_path='src/components/Header.tsx' } },
                @{ t='tool'; n='Edit';  i=@{ file_path='src/components/Header.tsx' } },
                @{ t='tool'; n='Bash';  i=@{ command='npm run build' } },
                @{ t='text'; v='Build is green. Dark mode now follows the system setting by default.' }
              )
              $k = 0
              while ($true) {
                $s = $steps[$k % $steps.Count]; $k++
                $ts = (Get-Date).ToUniversalTime().ToString('o')
                if ($s.role -eq 'user') {
                  $o = @{ type='user'; cwd=$cwd; timestamp=$ts; message=@{ role='user'; content=@(@{ type='text'; text=$s.v }) } }
                } else {
                  $block = if ($s.t -eq 'tool') { @{ type='tool_use'; id="toolu_$k"; name=$s.n; input=$s.i } } else { @{ type='text'; text=$s.v } }
                  $o = @{ type='assistant'; cwd=$cwd; timestamp=$ts; message=@{ role='assistant'; model='claude-sonnet-4-5'
                         usage=@{ input_tokens=900 + ($k*37 % 400); cache_read_input_tokens=14000 + $k*120; cache_creation_input_tokens=0; output_tokens=180 + ($k*53 % 300) }
                         content=@($block) } }
                }
                Add-Content -Path $f -Value ($o | ConvertTo-Json -Compress -Depth 8) -Encoding UTF8
                Start-Sleep -Seconds 4
              }
            }
            Start-Sleep -Seconds 12
          }
          function StopDemo {
            if ($script:demoJob) { Stop-Job $script:demoJob -ErrorAction SilentlyContinue; Remove-Job $script:demoJob -Force -ErrorAction SilentlyContinue }
            if ($script:claudeProc) { Stop-Process -Id $script:claudeProc.Id -Force -ErrorAction SilentlyContinue }
          }

          # A plain dark desktop. Terse's Windows theme ("horizon") is clear
          # glass by design, so whatever is behind the window reads through it —
          # and over the stock bright-blue Windows wallpaper the app's own text
          # washed out, which is the opposite of the clean interface the listing
          # is supposed to show. A solid dark desktop is a normal Windows setting
          # and nothing is retouched: the glass simply has something dark behind
          # it. SPI_SETDESKWALLPAPER = 0x0014, update + notify = 0x03.
          function DarkDesktop {
            Set-ItemProperty 'HKCU:\Control Panel\Colors' -Name Background -Value '16 18 28'
            Set-ItemProperty 'HKCU:\Control Panel\Desktop' -Name Wallpaper -Value ''
            [W]::SystemParametersInfoW(0x0014, 0, '', 0x03) | Out-Null
          }

          # ── Clear the stage ────────────────────────────────────────────────
          @{ baselined = $true; auto_add = $false; sources = @{}; baselined_kinds = @('notif','system','window','media') } |
            ConvertTo-Json -Depth 4 | Set-Content "$home2\feeds.json" -Encoding UTF8
          DarkDesktop
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -Name HideIcons -Value 1
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue   # restarts on its own with icons hidden
          Start-Sleep -Seconds 8
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep -Seconds 3

          # ── The app's own UI, page by page (the listing's main shots) ──────
          # A sample agent session runs throughout, so the windows hold real
          # numbers instead of zeros.
          DemoSession
          Auth
          License $true
          # The desktop stays plain: the interface is what these frames are
          # about, and the Wallpaper page shows that feature itself.
          WallpaperOff
          Launch 35
          Onboard
          CloseStrays
          Front | Out-Null
          Start-Sleep -Seconds 8
          Snap '10-app-overview'
          # The sidebar is translated at runtime, so each pattern carries the
          # English label and the Chinese one from i18n.js.
          # The four category buttons open a landing page; the page itself is one
          # more press from there. Both are worth a frame.
          Page '11-app-optimize'  'Optimize ›'
          Page '12-app-doctor'    '^Doctor|Agent Health'        14
          Page '13-app-wallpaper' '^Wallpaper'
          Page '14-app-town'      'Code Town'                   12
          Page '15-app-monitor'   'Monitor ›'
          Page '16-app-speedup'   '^Speed Up$'
          Page '17-app-settings'  '^Settings$'
          Quit

          # The live wallpaper gets its listing frame from the Wallpaper page
          # above, not from a photograph of the desktop: those came back as a
          # washed-out glass window over a bright wallpaper, which is what
          # certification rejected twice (10.1.1.3).
          StopDemo

          Get-ChildItem $home2 -Filter *.log -ErrorAction SilentlyContinue | Copy-Item -Destination $out

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Terse-Store-Screenshots-v10
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn
          retention-days: 30
