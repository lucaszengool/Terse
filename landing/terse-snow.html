body{min-height:100vh;background:#b9c3c9;display:flex;flex-direction:column;align-items:center;padding:34px 16px 40px;font-family:'Inter','Noto Serif SC',sans-serif;color:#33424a}
.head{text-align:center;min-height:84px}
.head .eb{display:inline-flex;align-items:center;gap:9px;font-size:10.5px;letter-spacing:4px;text-transform:uppercase;color:#5a6a72}
.head .eb i{width:5px;height:5px;background:#D5392E;transform:rotate(45deg);display:block}
.ttl{margin-top:12px}
.ttl h1{font-family:'Noto Serif SC',serif;font-weight:500;font-size:28px;letter-spacing:5px;color:#26323a}
.ttl p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:#5a6a72;margin-top:6px;letter-spacing:2px}
.stage{position:relative;width:100%;max-width:430px;aspect-ratio:560/720;border-radius:12px;overflow:hidden;box-shadow:0 40px 92px -36px rgba(30,42,54,.62)}
.stage::after{content:'';position:absolute;inset:0;z-index:6;pointer-events:none;box-shadow:inset 0 0 92px rgba(28,40,52,.32),inset 0 0 26px rgba(255,255,255,.12);border-radius:12px}
.kb{position:absolute;inset:0;z-index:0;animation:kb 20s ease-in-out infinite alternate}
@keyframes kb{0%{transform:scale(1.0)}100%{transform:scale(1.07) translate(-1.5%,-1.2%)}}
.pic{position:absolute;inset:0;width:100%;height:100%;display:block}
.fog{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.18;mix-blend-mode:screen;animation:fogdrift 46s linear infinite;-webkit-mask-image:linear-gradient(180deg,#000 0,#000 48%,transparent 78%);mask-image:linear-gradient(180deg,#000 0,#000 48%,transparent 78%)}
@keyframes fogdrift{0%{transform:translateX(-8%)}100%{transform:translateX(8%)}}

.warmpool{position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(34% 28% at 28% 73%,rgba(255,208,168,.30),transparent 70%);animation:wp 7s ease-in-out infinite}
@keyframes wp{0%,100%{opacity:.5}50%{opacity:.9}}
.blanket{position:absolute;left:-4%;right:-4%;bottom:0;height:14%;z-index:2;pointer-events:none;background:linear-gradient(#ffffff00,#ffffffF4 72%);border-radius:50% 50% 0 0/100% 100% 0 0;animation:blanket 10s ease-in-out infinite}
@keyframes blanket{0%,100%{transform:translateY(2px) scaleY(.96)}50%{transform:translateY(0) scaleY(1)}}
.sparkles{position:absolute;inset:0;z-index:3;pointer-events:none}
.spk{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px #fff;opacity:0;animation:spk 3s ease-in-out infinite}
@keyframes spk{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.3)}}
.motes{position:absolute;inset:0;z-index:2;pointer-events:none}
.mote{position:absolute;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle,#EAF2FA,transparent 70%);box-shadow:0 0 11px 3px #cfe0f0;opacity:0;animation-name:mote;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@keyframes mote{0%,100%{opacity:0;transform:translate(0,0) scale(.6)}50%{opacity:.85;transform:translate(15px,-18px) scale(1)}}
.plum{position:absolute;inset:0;z-index:3;pointer-events:none}
.bloss{position:absolute;width:9px;height:9px;margin:-4px;border-radius:50%;background:radial-gradient(circle,#F4A6A6,#D5392E 72%);box-shadow:0 0 8px 2px rgba(213,57,46,.55);animation:blp 3s ease-in-out infinite}
.bloss.big{width:14px;height:14px;margin:-7px;box-shadow:0 0 12px 3px rgba(213,57,46,.7)}
@keyframes blp{0%,100%{transform:scale(.88);filter:brightness(.95)}50%{transform:scale(1.12);filter:brightness(1.2)}}
.ppetal{position:absolute;width:7px;height:6px;background:#E86A6A;border-radius:62% 0 62% 0;opacity:0;animation-name:pfall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes pfall{0%{opacity:0;transform:translate(0,0) rotate(0)}12%{opacity:.9}100%{opacity:0;transform:translate(34px,200px) rotate(380deg)}}
.snowfield{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.slayer{position:absolute;inset:0;animation:gust var(--g) ease-in-out infinite}
.far{--g:24s;filter:blur(1.1px);opacity:.85}.mid{--g:16s}.near{--g:11s}
@keyframes gust{0%,100%{transform:translateX(-12px)}50%{transform:translateX(20px)}}
.flake{position:absolute;top:-5%;width:var(--sz);height:var(--sz);background:#fff;border-radius:50%;opacity:0;animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
.flake.n{box-shadow:0 0 6px 2px rgba(255,255,255,.85)}
@keyframes fall{0%{opacity:0;transform:translate3d(0,-30px,0)}8%{opacity:1}50%{transform:translate3d(var(--sx),360px,0)}100%{opacity:.4;transform:translate3d(calc(var(--sx) * -0.5),745px,0)}}
.gust{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.11) 50%,transparent);opacity:0;animation:gustsweep 9s ease-in-out infinite}

.foot{margin-top:22px;font-size:10.5px;letter-spacing:3px;color:#5a6a72}
