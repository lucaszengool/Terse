name: sleeprooms-desktop-wintest
# Test-only branch: installs the SleepRooms (入睡旅馆) desktop app from the DRAFT release on a real Windows machine,
# runs its self-test, opens the portable build on the live game, uninstalls, and uploads logs + screenshots.
on:
  push:
    branches: [ci/sleeprooms-desktop-wintest]
  workflow_dispatch:
permissions:
  contents: write   # needed to read assets of a draft release
jobs:
  wintest:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Download installer and zip from the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out, out/shots | Out-Null
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $rel = (Invoke-RestMethod -Headers $h -Uri "https://api.github.com/repos/${{ github.repository }}/releases?per_page=50") | Where-Object { $_.tag_name -eq 'sleeprooms-desktop-1.0.0' } | Select-Object -First 1
          if (-not $rel) { throw 'draft release sleeprooms-desktop-1.0.0 not found' }
          "release $($rel.id) draft=$($rel.draft)" | Tee-Object -Append out/summary.txt
          foreach ($a in $rel.assets) {
            if ($a.name -notlike '*win*') { continue }
            $h2 = $h.Clone(); $h2.Accept = 'application/octet-stream'
            Invoke-WebRequest -Headers $h2 -Uri $a.url -OutFile $a.name
            $got = (Get-Item $a.name).Length
            "$($a.name): $got bytes (release says $($a.size))" | Tee-Object -Append out/summary.txt
            if ($got -ne $a.size) { throw "size mismatch for $($a.name)" }
          }
          $wv = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          "WebView2 runtime before install: $($wv.pv)" | Tee-Object -Append out/summary.txt
          [System.Environment]::OSVersion.VersionString | Tee-Object -Append out/summary.txt

      - name: Install silently, self-test, real launch, uninstall
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot([string]$name) { $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height; $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $bmp.Save("out/shots/$name.png"); $g.Dispose(); $bmp.Dispose() }
          function Log([string]$s) { $s | Tee-Object -Append out/summary.txt }

          # 1. silent install (per-machine NSIS)
          $setup = Get-ChildItem 'SleepRooms-Setup-*.exe' | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          Log "installer exit code: $($p.ExitCode)"
          $dir = Join-Path $env:ProgramFiles '入睡旅馆'
          $exe = Join-Path $dir 'SleepRooms.exe'
          Log "installed exe exists: $(Test-Path $exe)"
          if (Test-Path $dir) { Get-ChildItem -Recurse $dir | Measure-Object -Property Length -Sum | ForEach-Object { Log "install dir: $($_.Count) files, $([math]::Round($_.Sum / 1MB, 1)) MB" } }
          $lnk = Get-ChildItem -Recurse "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" -Filter '*.lnk' | Where-Object { $_.FullName -like '*入睡旅馆*' }
          Log "start menu shortcuts: $($lnk.FullName -join '; ')"
          $un = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' | Get-ItemProperty | Where-Object { $_.DisplayName -like '*入睡旅馆*' }
          Log "uninstall entry: $($un.DisplayName) $($un.DisplayVersion) publisher=$($un.Publisher)"

          # 2. self-test of the installed app (light login page on sleeprooms.org, no 3D)
          if (Test-Path $exe) {
            $app = Start-Process -FilePath $exe -ArgumentList '--selftest' -PassThru
            for ($i = 0; $i -lt 30; $i++) { Start-Sleep -Seconds 12; if ($i % 3 -eq 1) { Shot ("selftest-{0:d2}" -f $i) }; if ($app.HasExited) { break } }
            if (-not $app.HasExited) { Log 'self-test still running after 6 min: killing'; Stop-Process -Id $app.Id -Force }
            Log "self-test exit code: $($app.ExitCode)"
          }
          $logs = Join-Path $env:LOCALAPPDATA 'org.sleeprooms.tonight\logs'
          if (Test-Path $logs) { Copy-Item -Recurse $logs out/installed-logs }

          # 3. portable build: real launch on the live game for 90 s, screenshots
          Expand-Archive -Path (Get-ChildItem 'SleepRooms-*-win-x64.zip' | Select-Object -First 1).FullName -DestinationPath portable
          $pexe = Get-ChildItem -Recurse portable -Filter 'SleepRooms.exe' | Select-Object -First 1
          $run = Start-Process -FilePath $pexe.FullName -PassThru
          Start-Sleep -Seconds 15; Shot 'portable-15s'
          Start-Sleep -Seconds 20; Shot 'portable-35s'
          Start-Sleep -Seconds 25; Shot 'portable-60s'
          Start-Sleep -Seconds 30; Shot 'portable-90s'
          Log "portable still running after 90 s: $(-not $run.HasExited)"
          $mem = (Get-Process -Id $run.Id -ErrorAction SilentlyContinue).WorkingSet64
          Log "portable working set: $([math]::Round($mem / 1MB)) MB"
          Get-Process | Where-Object { $_.ProcessName -like 'msedgewebview2*' } | Measure-Object | ForEach-Object { Log "webview2 processes: $($_.Count)" }
          Stop-Process -Id $run.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          if (Test-Path $logs) { Copy-Item -Recurse -Force $logs out/after-portable-logs }

          # 4. silent uninstall (the uninstaller re-launches itself from %TEMP%: wait for it)
          $u = Join-Path $dir 'uninstall.exe'
          if (Test-Path $u) {
            Start-Process -FilePath $u -ArgumentList '/S' -Wait | Out-Null
            for ($i = 0; $i -lt 20 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 3 }
            Log "after uninstall: exe exists=$(Test-Path $exe) dir exists=$(Test-Path $dir)"
            $un2 = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' | Get-ItemProperty | Where-Object { $_.DisplayName -like '*入睡旅馆*' }
            Log "uninstall entry left: $([bool]$un2)"
          } else { Log 'uninstall.exe missing' }
          Get-Content out/summary.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sleeprooms-wintest
          path: out
