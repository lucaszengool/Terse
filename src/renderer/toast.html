<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var s=localStorage.getItem('terse-theme') || 'horizon';document.documentElement.setAttribute('data-theme',s)})();</script>
  <meta charset="UTF-8">
  <title>Terse Alert</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { height: 100%; background: transparent; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased; }
    #stack { display: flex; flex-direction: column; gap: 9px; padding: 12px; align-items: flex-end; }

    .tt { width: 100%; max-width: 356px; background: var(--sf); color: var(--t1);
      border: 1px solid var(--bd); border-left: 3px solid var(--ac); border-radius: 15px;
      padding: 12px 13px 11px; box-shadow: inset 0 1px 0 var(--hl), var(--shadow-lg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      transform: translateX(120%); opacity: 0; transition: transform .42s var(--spring), opacity .3s ease; }
    .tt.in { transform: none; opacity: 1; }
    .tt.out { transform: translateX(120%); opacity: 0; transition: transform .3s var(--ease), opacity .22s ease; }
    /* The card body is the only clickable region — the rest of the window is pass-through. */
    .tt { pointer-events: auto; }
    .tt.sev-high { border-left-color: var(--red); }
    .tt.sev-medium { border-left-color: var(--warn); }
    .tt.sev-low { border-left-color: var(--ac); }

    .tt-top { display: flex; align-items: center; gap: 8px; }
    .tt-ic { width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; display: flex;
      align-items: center; justify-content: center; font-size: 14px; background: var(--bg);
      box-shadow: inset 0 0 0 1px var(--bd); }
    .tt-kind { font-size: 8.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px;
      padding: 2px 7px; border-radius: 9999px; white-space: nowrap;
      color: var(--ac); background: color-mix(in srgb, var(--ac) 14%, transparent); }
    .tt-sp { flex: 1; }
    .tt-x { width: 20px; height: 20px; border: none; border-radius: 6px; cursor: pointer;
      background: transparent; color: var(--t3); font-size: 13px; line-height: 1;
      display: flex; align-items: center; justify-content: center; transition: background .15s, color .15s; }
    .tt-x:hover { background: var(--sfh); color: var(--t1); }
    .tt-title { font-size: 12.5px; font-weight: 800; letter-spacing: -.01em; margin-top: 8px; line-height: 1.35; }
    .tt-body { font-size: 10.5px; color: var(--t2); line-height: 1.5; margin-top: 4px; }
    .tt-acts { display: flex; gap: 7px; margin-top: 10px; }
    .tt-btn { border: none; border-radius: 9px; font-size: 10.5px; font-weight: 800; padding: 7px 13px;
      cursor: pointer; color: var(--btn-t); font-family: inherit;
      background: linear-gradient(180deg, color-mix(in srgb, var(--btn) 88%, #fff 12%), var(--btn));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), var(--shadow-sm);
      transition: transform .15s var(--ease); }
    .tt-btn:hover { transform: translateY(-1px); }
    .tt-btn.ghost { background: transparent; color: var(--t3); border: 1px solid var(--bd); box-shadow: none; }
    .tt-btn.ghost:hover { color: var(--t1); border-color: var(--bdl); }
    .tt-life { height: 2px; border-radius: 2px; margin-top: 10px; background: var(--bd); overflow: hidden; }
    .tt-life > i { display: block; height: 100%; width: 100%; background: var(--ac);
      transform-origin: left center; }
    @keyframes ttDrain { from { transform: scaleX(1) } to { transform: scaleX(0) } }
  </style>
</head>
<body>
  <div id="stack"></div>
  <script src="i18n.js"></script>
  <script src="toast.js"></script>
</body>
</html>
