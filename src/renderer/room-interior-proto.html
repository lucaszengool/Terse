<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>room interior prototype</title>
<script type="importmap">
{ "imports": { "three": "/app-assets/vendor/three.module.min.js", "three/addons/": "/app-assets/vendor/jsm/" } }
</script>
<style>
  html, body { margin: 0; padding: 0; background: #030407; overflow: hidden; height: 100%; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 16px; top: 16px; color: #f2f5f4;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
    background: rgba(3,4,7,.42); padding: 11px 15px; border-radius: 12px; pointer-events: none;
    border: 1px solid rgba(255,255,255,.07); backdrop-filter: blur(8px);
  }
  #roomName { color: #6ee7b7; font-weight: 600; font-size: 15px; letter-spacing: .01em; }
  #roomStats { opacity: .72; }
  #hint { margin-top: 8px; opacity: .45; font-size: 11px; }
</style>
</head>
<body>
<div id="hud">
  <div id="roomName"></div>
  <div id="roomStats"></div>
  <div id="hint">drag to look &middot; WASD to walk &middot; click a file to inspect</div>
</div>
<script type="module">
/* 原型页只是一层壳:房子是 room-scene.js 盖的,和引擎里"点一座楼走进去"是同一份
   代码。这里自己开一个 renderer、喂一份样例目录,好让截图脚本能一次看遍八种风格。 */
import * as THREE from 'three';
import { createRoom } from './room-scene.js';

/* ── sample data: one capsule dir, shaped exactly as `leaves` now ships it ── */
const DIR = {
  name: 'src', files: 214, bytes: 268000, lang: 'ts',
  langs: [['ts', 0.68], ['js', 0.22], ['css', 0.10]],
  kind: 'source', depth: 4, age_days: 1, churn: 63,
  kids: [['components', 61, 96000], ['hooks', 18, 21000], ['utils', 24, 30000], ['styles', 9, 12000]],
  leaves: [
    ['App.tsx', 9400, 'components'], ['Button.tsx', 3100, 'components'], ['Modal.tsx', 4200, 'components'],
    ['Sidebar.tsx', 5600, 'components'], ['Card.tsx', 2100, 'components'], ['Table.tsx', 3800, 'components'],
    ['useAuth.ts', 1800, 'hooks'], ['useRoom.ts', 2200, 'hooks'], ['useSync.ts', 1400, 'hooks'],
    ['format.ts', 900, 'utils'], ['debounce.ts', 400, 'utils'], ['api.ts', 3300, 'utils'], ['colors.ts', 700, 'utils'],
    ['theme.css', 2600, 'styles'], ['reset.css', 800, 'styles'],
    ['index.ts', 1200, ''], ['router.ts', 2800, ''], ['constants.ts', 600, ''],
  ],
};

// ?style= 覆盖,好一次把八种都看一遍。真接进引擎时这个值来自胶囊的 `style`。
const STYLE_ID = new URLSearchParams(location.search).get('style') || 'modern';

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(1.75, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const nameEl = document.getElementById('roomName'), statEl = document.getElementById('roomStats');
const hintEl = document.getElementById('hint');
const room = createRoom(renderer, DIR, {
  style: STYLE_ID,
  onHere: (h) => { nameEl.textContent = h.path; statEl.textContent = h.files + ' files'; },
  onPick: (p) => { hintEl.textContent = p.dir + '/' + p.name + ' — ' + p.bytes.toLocaleString() + ' bytes'; },
});

let last = performance.now();
function frame(now) {
  room.update((now - last) / 1000); last = now;
  room.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); room.resize(innerWidth, innerHeight); });

window.__room = room;
</script>
</body>
</html>
