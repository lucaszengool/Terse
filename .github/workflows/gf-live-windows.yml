name: AI 女友 on Windows (setup + engine)

# The Windows half of AI 女友, end to end, without building the app: the one-click setup (setup.ps1) as a user's click
# runs it, then the engine started the way Terse starts it (girlfriend.rs gf_engine_ensure), her clips registered, a line
# spoken — and the proof is the talking video the engine writes: H.264 + AAC, as long as the line, her mouth moving.
#
# Both mouth models are exercised: the small real-time one (what a PC without a discrete GPU gets) and the big DUIX split
# on ONNX Runtime (DirectML on a real GPU; the CPU here — the runner has no GPU).
on:
  workflow_dispatch:
  push:
    branches: [feat/windows-parity]
    paths:
      - 'src/helpers/gf-live/**'
      - '.github/workflows/gf-live-windows.yml'

jobs:
  gf-live:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    env:
      GF_HOME: ${{ github.workspace }}\gfhome
    steps:
      - uses: actions/checkout@v4

      - name: One-click setup (setup.ps1)
        run: |
          $t0 = Get-Date
          # Windows PowerShell 5.1 — what Terse runs it with on every PC (powershell.exe, not pwsh). Started from this
          # pwsh step it inherits pwsh's PSModulePath; setup.ps1 resets that itself (a user's environment can do the same).
          $p = Start-Process powershell -PassThru -NoNewWindow -RedirectStandardOutput setup.out -RedirectStandardError setup.err `
               -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "$env:GITHUB_WORKSPACE\src\helpers\gf-live\setup.ps1"
          $p.WaitForExit()
          $mins = [math]::Round(((Get-Date) - $t0).TotalMinutes, 1)
          $out = Get-Content setup.out
          $out | Where-Object { $_ -notmatch '^P ' } | ForEach-Object { Write-Host "  $_" }
          $last = $out | Where-Object { $_ -match '^P ' } | Select-Object -Last 1
          Write-Host "  last progress line: $last   ($mins min)"
          if (Test-Path setup.err) { Get-Content setup.err -Tail 20 | ForEach-Object { Write-Host "  stderr: $_" } }
          Get-Content "$env:GF_HOME\hw.json" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  hw.json: $_" }
          if ($out -contains 'OK') { Write-Host "SETUP OK in $mins min" }
          elseif ($out -match '^ERR hd model$') {
            $code = (curl.exe -s -o NUL -I -L -w "%{http_code}" https://github.com/lucaszengool/Terse/releases/download/gf-live-assets-1/duix-win-1.tar)
            if ($code -eq '404') { Write-Warning "SETUP stopped at her face model: duix-win-1.tar is not on the gf-live-assets-1 release yet (everything before it installed)"; exit 1 }
            throw "SETUP FAIL: hd model (asset answers $code)"
          } else { throw "SETUP FAIL: $(($out | Where-Object { $_ -match '^ERR' }) -join '; ')" }

      - name: Her engine starts, registers her clips and speaks
        run: |
          $h = $env:GF_HOME
          $res = "$env:GITHUB_WORKSPACE\src\helpers\gf-live"
          $mia = "$h\presets\char_mia"
          $results = @()
          foreach ($renderer in @('mobile', 'big')) {
            Get-Process -Name python -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
            # exactly the environment girlfriend.rs gives it
            $env:GF_DUIX_MODELS = "$h\models\duix"; $env:GF_LLAMA_PORT = '8090'; $env:PYTHONUTF8 = '1'; $env:PYTHONIOENCODING = 'utf-8'
            $env:PATH = "$h\bin\ffmpeg;" + $env:PATH
            $env:GF_DUIX_RENDERER = $renderer; $env:DUIX_GPU = 'cpu'
            Remove-Item "$h\dh\*.mp4" -ErrorAction SilentlyContinue
            $log = "engine-$renderer.log"
            $eng = Start-Process "$h\venv\Scripts\python.exe" -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError "$log.err" `
                   -ArgumentList '-u', "$res\engine.py", '--port', '8770'
            $up = $false
            for ($i = 0; $i -lt 240; $i++) {
              Start-Sleep -Seconds 1
              try { $hl = Invoke-RestMethod http://127.0.0.1:8770/health -TimeoutSec 2; $up = $true; break } catch {}
              if ($eng.HasExited) { break }
            }
            if (-not $up) {
              Get-Content $log, "$log.err" -Tail 40 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
              $results += "${renderer}: ENGINE DID NOT START"; continue
            }
            Write-Host "[$renderer] engine up: $($hl | ConvertTo-Json -Compress)"
            $t0 = Get-Date
            $av = Invoke-RestMethod http://127.0.0.1:8770/avatar -Method Post -ContentType 'application/json; charset=utf-8' `
                  -Body ([Text.Encoding]::UTF8.GetBytes((@{ video = @("$mia\idle_calm.mp4") } | ConvertTo-Json))) -TimeoutSec 900
            Write-Host ("[$renderer] avatar: {0} frames {1}x{2} @{3} fps, dh={4}, in {5:N0}s" -f $av.n, $av.w, $av.h, $av.fps, $av.dh, ((Get-Date) - $t0).TotalSeconds)
            # her talking avatar warms in the background (/health WARM.dh)
            for ($i = 0; $i -lt 600; $i++) {
              $hl = Invoke-RestMethod http://127.0.0.1:8770/health -TimeoutSec 5
              if ($hl.warm.dh -eq $true -or $hl.warm.dh -eq 'n/a') { break }
              Start-Sleep -Seconds 2
            }
            Write-Host "[$renderer] warm: $($hl.warm | ConvertTo-Json -Compress)"
            $line = '你好呀，我是 Mia，现在我也住在 Windows 上了。'
            $t1 = Get-Date
            $say = Invoke-RestMethod http://127.0.0.1:8770/say -Method Post -ContentType 'application/json; charset=utf-8' `
                   -Body ([Text.Encoding]::UTF8.GetBytes((@{ text = $line } | ConvertTo-Json))) -TimeoutSec 60
            Write-Host "[$renderer] /say: turn $($say.turn), $($say.sentences.Count) sentence(s)"
            # the reply's talking video is ONE fragmented MP4 written while it renders — ffprobe reads a duration for whatever
            # is there so far (measured: 1.07 s of a 2.9 s reply mid-render). Done = the duration stopped growing for ~20 s.
            $mp4 = $null; $dur = 0; $lastDur = -1; $stable = 0
            for ($i = 0; $i -lt 1200; $i++) {
              Start-Sleep -Seconds 5
              $f = Get-ChildItem "$h\dh\turn*.mp4" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
              if (-not $f -or $f.Length -lt 20000) { continue }
              $j = & "$h\bin\ffmpeg\ffprobe.exe" -v error -show_entries 'format=duration:stream=codec_type,codec_name,width,height' -of json $f.FullName | ConvertFrom-Json
              $dur = [double]$j.format.duration
              if ($dur -gt 0 -and $dur -eq $lastDur) { $stable++ } else { $stable = 0 }
              $lastDur = $dur
              if ($stable -ge 4) { $mp4 = $f; break }
            }
            $secs = ((Get-Date) - $t1).TotalSeconds
            Get-Content $log -ErrorAction SilentlyContinue | Select-String -Pattern 'duix-runner|DH encoder|renderer|DUIX|数字人|avatar|error|Error' | Select-Object -Last 25 | ForEach-Object { Write-Host "  log: $($_.Line)" }
            New-Item -ItemType Directory -Force -Path artifacts | Out-Null
            Copy-Item $log, "$log.err" artifacts/ -ErrorAction SilentlyContinue
            if (-not $mp4) { $results += "${renderer}: NO TALKING VIDEO after $([int]$secs)s"; $eng | Stop-Process -Force; continue }
            Copy-Item $mp4.FullName "artifacts/mia-$renderer.mp4"
            $streams = ($j.streams | ForEach-Object { "$($_.codec_type):$($_.codec_name)$(if ($_.width) { " $($_.width)x$($_.height)" })" }) -join ', '
            # her mouth must move: the lower face of frames 0.4 s apart, compared — a frozen picture would mean no lip-sync
            # (her lower-face box from /avatar is in the idle clip's pixels; the talking video is her 1080p avatar in the
            # same framing, so the box is scaled to its width)
            $vw = [double](($j.streams | Where-Object { $_.codec_type -eq 'video' } | Select-Object -First 1).width)
            $sc = if ($av.w -gt 0) { $vw / [double]$av.w } else { 1.0 }
            $box = @($av.boxes[0] | ForEach-Object { [int]([double]$_ * $sc) })
            $tmp = "$env:RUNNER_TEMP\fr-$renderer"; New-Item -ItemType Directory -Force -Path $tmp | Out-Null
            & "$h\bin\ffmpeg\ffmpeg.exe" -v error -i $mp4.FullName -vf "fps=2.5,crop=$($box[2]-$box[0]):$($box[3]-$box[1]):$($box[0]):$($box[1]),scale=64:64,format=gray" -f rawvideo "$tmp\mouth.raw"
            $raw = [IO.File]::ReadAllBytes("$tmp\mouth.raw"); $n = [int]($raw.Length / 4096); $moves = 0
            for ($k = 1; $k -lt $n; $k++) {
              $d = 0; for ($q = 0; $q -lt 4096; $q++) { $d += [math]::Abs([int]$raw[$k * 4096 + $q] - [int]$raw[($k - 1) * 4096 + $q]) }
              if ($d / 4096 -gt 2.0) { $moves++ }
            }
            & "$h\bin\ffmpeg\ffmpeg.exe" -v error -ss 1 -i $mp4.FullName -frames:v 1 "artifacts/mia-$renderer.jpg"
            $ok = ($streams -match 'video:h264') -and ($streams -match 'audio:aac') -and ($dur -ge 2.0) -and ($moves -ge 2)
            $results += ("{0}: {1} — {2:N1}s video ({3}), rendered in {4:N0}s, mouth moved in {5} of {6} steps" -f $renderer, $(if ($ok) { 'OK' } else { 'FAIL' }), $dur, $streams, $secs, $moves, [math]::Max(0, $n - 1))
            $eng | Stop-Process -Force
          }
          Write-Host '── AI 女友 on Windows ──'
          $results | ForEach-Object { Write-Host "  $_" }
          $bad = @($results | Where-Object { $_ -notmatch ': OK' })
          if ($bad.Count -gt 0) { throw "AI 女友 does not talk on Windows: $($bad -join ' | ')" }
          Write-Host 'GIRLFRIEND OK: she is set up, starts, and speaks with a moving mouth — both mouth models'

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gf-live-windows
          path: |
            artifacts
            setup.out
            setup.err
            gfhome/hw.json
            gfhome/tmp/prepare.log
          if-no-files-found: ignore
